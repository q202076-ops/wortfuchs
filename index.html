/* ==========================================================================
   Wortfuchs – Gestaltung
   Token-Plan: Grund = kühles Karten-Papier mit Punktraster, Tinte = tiefes Navy,
   Marke = Fuchs-Orange, Linienfarben je Kapitel (wie ein U-Bahn-Plan),
   Rückmeldung = Grün / Rot / Bernstein. Schrift: Lexend (Stärken 400–600).
   ========================================================================== */
:root {
  --paper: #F2F5FA;
  --paper-dot: #D9E0EC;
  --card: #FFFFFF;
  --card-2: #F6F8FC;
  --ink: #131A2E;
  --ink-2: #48526E;
  --ink-3: #78829C;
  --rule: #DEE4EE;
  --rule-strong: #C6CFDE;
  --fox: #E65C0E;
  --fox-deep: #B04506;
  --fox-soft: #FFE7D6;
  --fur: #F47A2E;
  --good: #1E9A55;
  --good-deep: #13753F;
  --good-soft: #DCF5E6;
  --bad: #DC3B40;
  --bad-deep: #AC252A;
  --bad-soft: #FFE2E2;
  --near: #C77F00;
  --near-deep: #95600A;
  --near-soft: #FFF0CB;
  --sky: #2E78F0;
  --sky-deep: #1C58C0;
  --sky-soft: #E0EBFF;
  --gold: #F2AE00;
  --gold-soft: #FFF3CC;
  --lv0: #D2D9E5;
  --lv1: #F2AE00;
  --lv3: #74C996;
  --lv4: #1E9A55;
  /* Neon-Logo wie das App-Symbol – gleich in hell und dunkel */
  --neon: linear-gradient(100deg, #FFB224, #FF5A1F 55%, #FF2D87);
  --logo-bg: #07080F;
  --logo-glow: 0 4px 14px -4px rgba(255, 90, 31, .55);
  --shade: 0 1px 2px rgba(19, 26, 46, .05), 0 10px 30px -12px rgba(19, 26, 46, .16);
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 12px;
  --f-display: "Lexend", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
  --top-h: 64px;
  --nav-h: 68px;
}

  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0B1020;
    --paper-dot: #19213A;
    --card: #141B31;

    --ink: #EDF1FB;
    --ink-2: #B2BAD2;

    --rule: #252E4A;
    --rule-strong: #34405F;

    --fox-deep: #B24D0B;
    --fox-soft: #3A2414;
    --fur: #F47A2E;
    --good: #2FB36B;
    --good-deep: #1A8049;
    --good-soft: #122E20;
    --bad: #F0565B;
    --bad-deep: #B3292F;
    --bad-soft: #3A1619;
    --near: #E5A21A;
    --near-deep: #A8740B;
    --near-soft: #37290B;
    --sky: #5B97FF;
    --sky-deep: #2F6BD2;
    --sky-soft: #16264A;
    --gold: #F5B82A;
    --gold-soft: #3A2E0E;
    --lv0: #2D3754;
    --lv1: #E6A70F;
    --lv3: #4DAF78;
    --lv4: #2FB36B;
    --shade: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 30px -12px rgba(0, 0, 0, .55);
  }
}

/* ---------- Grundlagen ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 1.1px, transparent 1.4px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 12px; }
b, strong { font-weight: 600; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.12; margin: 0; letter-spacing: -.005em; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 1.25em; height: 1.25em; flex: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; vertical-align: -.22em; }
.ic-fill { fill: currentColor; stroke: none; }
.kicker { font-family: var(--f-body); font-weight: 600; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: 16px; }

/* ---------- Knöpfe ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 54px; padding: 0 24px; border: 0; border-radius: 16px;
  font-family: var(--f-display); font-weight: 600; font-size: 19px; letter-spacing: .01em;
  text-decoration: none; user-select: none; -webkit-user-select: none;
  transition: transform .08s ease, box-shadow .08s ease, background-color .15s ease, color .15s ease;
}
.btn:active:not(:disabled) { transform: translateY(3px); }
.btn-primary { background: var(--fox); color: #fff; box-shadow: 0 5px 0 var(--fox-deep); }
.btn-primary:active:not(:disabled) { box-shadow: 0 2px 0 var(--fox-deep); }
.btn:disabled { background: var(--rule); color: var(--ink-3); box-shadow: 0 5px 0 var(--rule-strong); cursor: default; }
.btn-good { background: var(--good); color: #fff; box-shadow: 0 5px 0 var(--good-deep); }
.btn-good:active { box-shadow: 0 2px 0 var(--good-deep); }
.btn-bad { background: var(--bad); color: #fff; box-shadow: 0 5px 0 var(--bad-deep); }
.btn-bad:active { box-shadow: 0 2px 0 var(--bad-deep); }
.btn-near { background: var(--near); color: #fff; box-shadow: 0 5px 0 var(--near-deep); }
.btn-near:active { box-shadow: 0 2px 0 var(--near-deep); }
.btn-sky { background: var(--sky); color: #fff; box-shadow: 0 5px 0 var(--sky-deep); }
.btn-sky:active { box-shadow: 0 2px 0 var(--sky-deep); }
.btn-ghost { background: var(--card); color: var(--ink); border: 2px solid var(--rule); box-shadow: 0 4px 0 var(--rule); }
.btn-ghost:active { box-shadow: 0 1px 0 var(--rule); }
.btn-quiet { background: transparent; color: var(--ink-2); box-shadow: none; min-height: 48px; padding: 0 14px; font-size: 17px; }
.btn-quiet:hover { color: var(--ink); }
.btn-sm { min-height: 42px; padding: 0 16px; font-size: 16px; border-radius: 13px; }
.btn-block { width: 100%; }
.link { background: none; border: 0; padding: 4px 2px; color: var(--sky); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; flex: none;
  border: 0; border-radius: 14px; background: transparent; color: var(--ink-3);
}
.icon-btn:hover { background: var(--card-2); color: var(--ink); }
.icon-btn .ic { width: 26px; height: 26px; }

/* ---------- Kopfzeile ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 2px solid var(--rule);
}
.top-in { display: flex; align-items: center; gap: 12px; max-width: 1120px; margin: 0 auto; padding: 0 16px; height: var(--top-h); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 6px 4px 0; }
.brand-mark { width: 40px; height: 40px; flex: none; display: block; padding: 4px; border-radius: 11px; background: var(--logo-bg); box-shadow: var(--logo-glow); }
.brand-mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.brand-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.brand-name { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.brand-grad { background: var(--neon); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-tag { margin-top: 3px; white-space: nowrap; font-family: var(--f-body); font-weight: 600; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.tabs { display: none; gap: 4px; margin-left: 12px; }
.tab {
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px;
  border: 2px solid transparent; border-radius: 14px; background: none;
  font-weight: 600; font-size: 15px; color: var(--ink-2); letter-spacing: .02em;
}
.tab:hover { background: var(--card); color: var(--ink); }
.tab[aria-current="page"] { background: var(--card); border-color: var(--rule); color: var(--fox); }
.stats { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.stat {
  display: inline-flex; align-items: center; gap: 5px; height: 40px; padding: 0 10px;
  border: 2px solid var(--rule); border-radius: 14px; background: var(--card);
  font-family: var(--f-display); font-weight: 600; font-size: 17px; color: var(--ink);
}
.stat .ic { width: 22px; height: 22px; }
.stat-streak .ic { color: var(--fox); }
.stat-streak.is-off .ic { color: var(--rule-strong); }
.stat-goal { padding: 0 10px 0 5px; }
.stat-goal svg.ring { width: 28px; height: 28px; }
.stat-level { color: var(--sky); }
.stat small { font-size: 12px; color: var(--ink-3); font-family: var(--f-body); font-weight: 600; }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--card); border-top: 2px solid var(--rule);
}
.bn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 54px; border: 0; background: none; border-radius: 14px;
  font-size: 12px; font-weight: 600; letter-spacing: .03em; color: var(--ink-3);
}
.bn .ic { width: 26px; height: 26px; }
.bn, .tab { position: relative; }
.nav-n {
  position: absolute; top: 2px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px;
  background: var(--gold); color: #3A2A00; font-style: normal; font-size: 12px; font-weight: 600; line-height: 20px; text-align: center;
}
.tab .nav-n { position: static; margin-left: -2px; }
.bn[aria-current="page"] { color: var(--fox); background: var(--fox-soft); }

.main { padding-top: 18px; padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.view { animation: rise .35s ease both; }

@media (min-width: 900px) {
  .tabs { display: flex; }
  .bottom-nav { display: none; }
  .main { padding-bottom: 48px; }
  .wrap { padding-inline: 24px; }
  .top-in { padding: 0 24px; }
}
@media (max-width: 440px) {
  .brand { gap: 8px; }
  .brand-name { font-size: 17px; }
  .brand-tag { margin-top: 2px; font-size: 8px; letter-spacing: .1em; }
  .brand-mark { width: 34px; height: 34px; padding: 3px; border-radius: 9px; }
  .stat { height: 36px; padding: 0 8px; font-size: 16px; gap: 4px; }
  .stat-goal { padding: 0 8px 0 4px; }
  .stat small { display: none; }
}
@media (max-width: 380px) { .brand-name { font-size: 16px; } }
@media (max-width: 370px) { .brand-text { display: none; } }

/* ---------- Karten & Layout ---------- */
.card {
  background: var(--card); border: 2px solid var(--rule); border-radius: var(--r-lg);
  box-shadow: var(--shade); padding: 20px;
}
.card + .card { margin-top: 16px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 2px 12px; }
.section-title h2 { font-size: 22px; }
.home-grid { display: grid; gap: 16px; grid-template-areas: "hero" "line" "modes"; }
.home-grid > .hero { grid-area: hero; margin-top: 0; }
.home-grid > .line-card { grid-area: line; margin-top: 0; }
.home-grid > .modes { grid-area: modes; margin-top: 0; }
@media (min-width: 960px) {
  .home-grid { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); grid-template-areas: "hero line" "modes line"; grid-template-rows: auto 1fr; gap: 24px; align-items: start; }
  .home-grid > .modes { align-self: start; }
}

/* Begrüßung */
.greet { display: flex; align-items: flex-end; gap: 10px; margin: 2px 0 14px; }
.greet .fox { width: 76px; height: 76px; flex: none; }
.bubble {
  position: relative; background: var(--card); border: 2px solid var(--rule); border-radius: 18px;
  padding: 12px 16px; font-weight: 500; color: var(--ink); box-shadow: var(--shade); margin-bottom: 12px;
}
.bubble::before {
  content: ""; position: absolute; left: -9px; bottom: 16px; width: 14px; height: 14px;
  background: var(--card); border-left: 2px solid var(--rule); border-bottom: 2px solid var(--rule);
  transform: rotate(45deg);
}
.bubble b { color: var(--fox); }

/* Aufgaben-Karte */
.hero { position: relative; overflow: hidden; padding: 22px; }
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 190px; height: 190px; border-radius: 50%;
  border: 18px solid var(--hero-c, var(--fox)); opacity: .09; pointer-events: none;
}
.hero-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.hero h1 { font-size: clamp(26px, 6vw, 32px); }
.hero h1 .dash { color: var(--ink-3); font-weight: 400; }
.hero-edit { flex: none; padding: 0; width: 42px; }
.utag {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: 9px;
  background: var(--c); color: #fff; font-weight: 600; font-size: 13px; letter-spacing: .02em;
}
.utag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.learned { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; margin-top: 14px; font-family: var(--f-display); line-height: 1; }
.learned b { font-size: clamp(64px, 18vw, 84px); font-weight: 500; color: var(--good); letter-spacing: -.02em; }
.learned .of { font-size: clamp(28px, 8vw, 36px); font-weight: 500; color: var(--ink-3); }
.learned .plus { align-self: center; padding: 4px 10px; border-radius: 99px; background: var(--good-soft); color: var(--good-deep); font-size: 20px; font-weight: 500; animation: rise .5s .5s ease both; }
.learned small { flex-basis: 100%; margin-top: 6px; font-family: var(--f-body); font-size: 17px; font-weight: 600; color: var(--ink-2); }
.lvbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--lv0); margin-top: 14px; }
.lvbar i { display: block; height: 100%; transition: width .8s ease; }
.lvbar .l1 { background: var(--lv1); }
.lvbar .l3 { background: var(--lv3); }
.lvbar .l4 { background: var(--lv4); }
.lvlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.lvlegend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--dot); vertical-align: -1px; }
.hero-test { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-weight: 500; color: var(--ink-2); }
.hero-test .ic { width: 20px; height: 20px; color: var(--fox); }
.hero-test b { color: var(--ink); }
.hero-test.is-hot, .hero-test.is-hot b, .hero-test.is-hot .ic { color: var(--bad); }
.hero .btn-primary { margin-top: 18px; }
.hero-empty { text-align: center; padding: 34px 22px; }
.hero-empty .fox { width: 110px; height: 110px; margin: 0 auto 8px; display: block; }
.hero-empty h1 { font-size: 30px; margin-bottom: 18px; }

/* Übungsarten */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.mode {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left;
  padding: 16px; min-height: 104px; border-radius: var(--r-md);
  background: var(--card); border: 2px solid var(--rule); box-shadow: 0 5px 0 var(--rule);
  transition: transform .08s ease, box-shadow .08s ease;
}
.mode:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--rule); }
.mode:hover { border-color: var(--rule-strong); }
.mode-ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--mc-soft); color: var(--mc); }
.mode-ic .ic { width: 26px; height: 26px; }
.mode b { font-family: var(--f-display); font-weight: 600; font-size: 19px; line-height: 1.1; }
.mode.is-off { opacity: .55; }
.mode .pill { position: absolute; top: 14px; right: 14px; }
.pill {
  display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 99px;
  background: var(--fox); color: #fff; font-weight: 600; font-size: 13px;
}
.m-review { --mc: var(--sky); --mc-soft: var(--sky-soft); }
.m-blitz { --mc: #B77900; --mc-soft: var(--gold-soft); }
.m-test { --mc: var(--good); --mc-soft: var(--good-soft); }
.m-oops { --mc: var(--bad); --mc-soft: var(--bad-soft); }
.m-sent { --mc: var(--fox); --mc-soft: var(--fox-soft); grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 14px; min-height: 0; }

/* ---------- Die Linie (Stationen) ---------- */
.line-card { padding: 20px 16px 10px; }
.line-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 4px 10px; }
.line-head h2 { font-size: 22px; }
.line { list-style: none; margin: 0; padding: 0; }
.line > li { position: relative; }
.stop { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px 4px; }
.stop::before {
  content: ""; position: absolute; left: 36px; top: 0; bottom: 0; width: 10px; margin-left: -5px;
  background: var(--c); opacity: .9;
}
.stop.is-first::before { top: 50%; }
.stop.is-last::before { bottom: 50%; }
.stop.is-locked::before { background: var(--lv0); opacity: 1; }
.stop-dot {
  position: relative; z-index: 1; display: grid; place-items: center; width: 60px; height: 60px; margin: 0 2px; padding: 0;
  border-radius: 50%; border: 6px solid var(--c); background: var(--card); color: var(--c);
  font-family: var(--f-display); font-weight: 600; font-size: 22px;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, #000 45%);
  transition: transform .1s ease;
}
.stop-dot:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 55%, #000 45%); }
.stop-dot .ic { width: 28px; height: 28px; stroke-width: 3; }
.stop.is-done .stop-dot { background: var(--c); color: #fff; }
.stop.is-gold .stop-dot { background: var(--gold); border-color: var(--gold); color: #fff; box-shadow: 0 4px 0 #A87800; }
.stop.is-locked .stop-dot { border-color: var(--lv0); color: var(--ink-3); box-shadow: 0 4px 0 var(--rule-strong); }
.stop.is-current .stop-dot { animation: pulse 2s ease-in-out infinite; }
.stop-info { min-width: 0; }
.stop-info b { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.stop.is-locked .stop-info { opacity: .6; }
.stop-meter { display: flex; gap: 3px; margin-top: 6px; }
.stop-meter i { width: 16px; height: 6px; border-radius: 3px; background: var(--lv0); }
.stop-meter i.l1 { background: var(--lv1); }
.stop-meter i.l3 { background: var(--lv3); }
.stop-meter i.l4 { background: var(--lv4); }
.stop-go { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.stop-go .fox { width: 46px; height: 46px; animation: bob 2.4s ease-in-out infinite; }
.line-unit { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; padding: 8px 4px; }
.line-unit::before { content: ""; position: absolute; left: 36px; top: 0; bottom: 0; width: 10px; margin-left: -5px; background: var(--c); }
.line-unit.is-first::before { top: 50%; }
.line-unit .knot { position: relative; z-index: 1; width: 26px; height: 26px; margin-left: 19px; border-radius: 8px; background: var(--c); border: 4px solid var(--card); box-shadow: 0 0 0 2px var(--c); }
.line-unit .utag { justify-self: start; }
.line-more { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; padding: 6px 4px; }
.line-more::before { content: ""; position: absolute; left: 36px; top: 0; bottom: 0; width: 0; margin-left: -2px; border-left: 4px dotted var(--c); }
.line-more button { justify-self: start; }
.stop.is-final .stop-dot { border-radius: 18px; border-color: var(--ink); color: var(--ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 60%, transparent); }
.stop.is-final.is-open .stop-dot { background: var(--ink); color: var(--paper); }

/* ---------- Wörter ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 2px 16px; }
.page-head h1 { font-size: 32px; }
.seg { display: inline-flex; padding: 4px; border-radius: 14px; background: var(--card-2); border: 2px solid var(--rule); }
.seg button { border: 0; background: none; height: 38px; padding: 0 14px; border-radius: 10px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--rule-strong); }
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.field {
  width: 100%; height: 52px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--rule);
  background: var(--card); font-size: 17px; font-weight: 500;
}
.field:focus { border-color: var(--sky); }
.search .field { padding-left: 46px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 99px;
  border: 2px solid var(--rule); background: var(--card); font-weight: 600; font-size: 14px; color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip i { font-style: normal; opacity: .7; }
.wgroup { margin-top: 18px; }
.wgroup-h { display: flex; align-items: center; gap: 10px; margin: 0 2px 8px; }
.wgroup-h b { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.wgroup-h .utag { height: 24px; font-size: 12px; }
.wlist { background: var(--card); border: 2px solid var(--rule); border-radius: var(--r-md); overflow: hidden; }
.wrow { border-top: 2px solid var(--rule); }
.wrow:first-child { border-top: 0; }
.wrow-main { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 8px 10px 14px; }
.wrow-txt { min-width: 0; background: none; border: 0; text-align: left; padding: 2px 0; }
.wrow-txt b { display: block; font-size: 17px; font-weight: 600; }
.wrow-txt span { display: block; color: var(--ink-2); font-weight: 500; font-size: 15px; }
.wrow-txt .ipa { font-size: 14px; font-weight: 400; color: var(--ink-3); }
.box-mark { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; background: var(--card-2); border: 1px solid var(--rule-strong); font-size: 11px; font-weight: 600; color: var(--ink-3); vertical-align: 2px; }
.lv { display: inline-flex; gap: 3px; }
.lv i { width: 7px; height: 18px; border-radius: 3px; background: var(--lv0); }
.lv i.on { background: var(--dot); }
.wrow-more { padding: 0 14px 14px; display: grid; gap: 8px; color: var(--ink-2); font-weight: 500; }
.wrow-more .ex { font-style: italic; color: var(--ink); }
.wrow-more .meta { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.say {
  display: inline-grid; place-items: center; width: 42px; height: 42px; flex: none; border-radius: 14px;
  border: 2px solid var(--rule); background: var(--card); color: var(--sky); box-shadow: 0 3px 0 var(--rule);
}
.say:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rule); }
.say .ic { width: 22px; height: 22px; }
.empty { text-align: center; padding: 36px 16px; color: var(--ink-3); font-weight: 500; }
.empty .fox { width: 90px; height: 90px; display: block; margin: 0 auto 8px; }

/* ---------- Erfolge ---------- */
.aw-grid { display: grid; gap: 16px; }
@media (min-width: 820px) { .aw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lvl-card { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.lvl-badge {
  display: grid; place-content: center; text-align: center; width: 96px; height: 96px; border-radius: 30px;
  background: var(--sky); color: #fff; box-shadow: 0 6px 0 var(--sky-deep); transform: rotate(-4deg);
}
.lvl-badge small { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.lvl-badge b { font-family: var(--f-display); font-weight: 600; font-size: 44px; line-height: .95; }
.lvl-card h2 { font-size: 26px; }
.xpbar { height: 16px; border-radius: 99px; background: var(--rule); overflow: hidden; margin: 10px 0 6px; }
.xpbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--sky), #6FA8FF); transition: width 1s ease; }
.big-num { font-family: var(--f-display); font-weight: 600; font-size: 56px; line-height: 1; }
.streak-card { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.streak-flame { width: 88px; height: 88px; display: grid; place-items: center; border-radius: 28px; background: var(--fox-soft); color: var(--fox); }
.streak-flame .ic { width: 58px; height: 58px; }
.streak-card.is-off .streak-flame { background: var(--card-2); color: var(--rule-strong); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; margin-top: 14px; position: relative; }
.week-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.week-bar { width: 100%; max-width: 38px; border-radius: 10px 10px 6px 6px; background: var(--sky-soft); min-height: 6px; position: relative; transition: height .8s ease; }
.week-bar.is-goal { background: var(--good); }
.week-bar.is-today { outline: 3px solid var(--fox); outline-offset: 2px; }
.week-col small { font-weight: 600; font-size: 12px; color: var(--ink-3); letter-spacing: .04em; }
.week-col em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.bdg { text-align: center; padding: 16px 10px 14px; border-radius: var(--r-md); background: var(--card); border: 2px solid var(--rule); }
.medal {
  position: relative; display: grid; place-items: center; width: 70px; height: 70px; margin: 0 auto 10px; border-radius: 50%;
  background: var(--bc); color: #fff; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .18), 0 0 0 5px color-mix(in srgb, var(--bc) 25%, transparent);
}
.medal .ic { width: 34px; height: 34px; stroke-width: 2.4; }
.bdg b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 16px; line-height: 1.15; }
.bdg span { display: block; margin-top: 4px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.bdg.is-locked .medal { background: var(--card-2); color: var(--ink-3); box-shadow: inset 0 0 0 2px var(--rule); }
.bdg.is-locked b { color: var(--ink-3); }
.store-note { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: var(--card-2); color: var(--ink-2); font-weight: 500; font-size: 14px; }
.store-note .ic { color: var(--sky); }

/* ---------- Eltern ---------- */
.gate { max-width: 460px; margin: 20px auto; text-align: center; }
.gate .shield { width: 72px; height: 72px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 22px; background: var(--sky-soft); color: var(--sky); }
.gate .shield .ic { width: 40px; height: 40px; }
.gate h1 { font-size: 28px; }
.gate p { color: var(--ink-2); font-weight: 500; margin: 8px 0 18px; }
.gate-row { display: flex; gap: 10px; }
.gate-row .field { text-align: center; font-size: 22px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { padding: 16px; border-radius: var(--r-md); background: var(--card); border: 2px solid var(--rule); }
.kpi span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.kpi b { display: block; margin-top: 4px; font-family: var(--f-display); font-weight: 600; font-size: 28px; }
.kpi em { font-style: normal; font-size: 13px; color: var(--ink-3); font-weight: 500; }
.chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; align-items: end; height: 160px; margin-top: 14px; }
.chart-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
.chart-col i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: var(--fox); min-height: 3px; opacity: .9; }
.chart-col i.zero { background: var(--rule); }
.chart-col small { font-size: 10px; font-weight: 600; color: var(--ink-3); }
.tbl-wrap { overflow-x: auto; margin-top: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 2px solid var(--rule); }
.tbl td { padding: 10px; border-bottom: 1px solid var(--rule); font-weight: 500; vertical-align: top; }
.tbl td b { font-weight: 600; }
.grade-dot { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: #fff; font-family: var(--f-display); font-weight: 600; }
.settings { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }   /* minmax: lange Stimmnamen dürfen die Spalte nicht verbreitern */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.set-row label, .set-row .lbl { font-weight: 600; }
.set-row small { display: block; color: var(--ink-3); font-weight: 500; }
.set-row > div:first-child { flex: 1 1 200px; min-width: 0; }
.switch { position: relative; width: 58px; height: 34px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--rule-strong); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; left: 4px; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s var(--ease-pop); }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span::after { transform: translateX(24px); }
.switch input:focus-visible + span { outline: 3px solid var(--sky); outline-offset: 2px; }
.select { height: 44px; max-width: 100%; min-width: 0; border-radius: 12px; border: 2px solid var(--rule); background: var(--card); padding: 0 12px; font-weight: 500; text-overflow: ellipsis; }
.danger { border-color: color-mix(in srgb, var(--bad) 35%, var(--rule)); }

/* ---------- Seitenwahl ---------- */
.pk-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
.pk-legend button {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 10px; border-radius: 11px;
  border: 2px solid var(--rule); background: var(--card); font-weight: 600; font-size: 14px; color: var(--ink);
}
.pk-legend button::before { content: ""; width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.pk-legend button:hover { border-color: var(--c); }
.pk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
.pg-btn {
  position: relative; height: 56px; border-radius: 14px; border: 2px solid var(--rule); background: var(--card);
  font-family: var(--f-display); font-weight: 600; font-size: 18px; color: var(--ink); overflow: hidden;
  box-shadow: 0 3px 0 var(--rule); padding: 0 0 6px;
}
.pg-btn .bars { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; display: flex; }
.pg-btn .bars i { flex: 1; background: var(--c); }
.pg-btn.in { background: var(--fox-soft); border-color: var(--fox); box-shadow: 0 3px 0 var(--fox); }
.pg-btn.edge { background: var(--fox); color: #fff; border-color: var(--fox); box-shadow: 0 3px 0 var(--fox-deep); }
.pg-btn.missing { border-style: dashed; color: var(--ink-3); box-shadow: none; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--card-2) 6px 12px); }
.pg-btn.missing.in { border-color: var(--fox); }
.pk-sum {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: var(--ink); color: var(--paper);
}
.pk-sum b { font-family: var(--f-display); font-weight: 600; font-size: 22px; }
.pk-sum span { font-weight: 500; opacity: .8; font-size: 14px; }
.pk-sum b, .pk-sum span { display: block; }
.pk-opts { display: grid; gap: 14px; margin-top: 16px; }
.pk-date { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pk-date .field { width: auto; min-width: 190px; flex: 1 1 190px; }
.pk-hint { font-size: 14px; color: var(--ink-3); font-weight: 500; margin-top: 6px; }
.asg-list { display: grid; gap: 10px; }
.asg { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 2px solid var(--rule); }
.asg.is-cur { border-color: var(--fox); }
.asg-txt { flex: 1; min-width: 0; }
.asg-txt b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.asg-txt span { font-size: 14px; color: var(--ink-3); font-weight: 500; }
.goal-opts { display: grid; gap: 10px; }
.goal-opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 16px; text-align: left;
  border-radius: 16px; border: 2px solid var(--rule); background: var(--card); box-shadow: 0 4px 0 var(--rule); font-weight: 600; font-size: 17px;
}
.goal-opt span { color: var(--ink-3); font-weight: 500; font-size: 15px; }
.goal-opt[aria-pressed="true"] { border-color: var(--sky); background: var(--sky-soft); box-shadow: 0 4px 0 var(--sky); }

/* ---------- Willkommen ---------- */
.onboard {
  position: fixed; inset: 0; z-index: 60; overflow-y: auto; background-color: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 1.1px, transparent 1.4px); background-size: 22px 22px;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
}
.ob { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.ob-steps { display: flex; gap: 6px; margin-bottom: 22px; }
.ob-steps i { flex: 1; height: 8px; border-radius: 99px; background: var(--rule); }
.ob-steps i.on { background: var(--fox); }
.ob-hero { text-align: center; padding-top: 4vh; }
.ob-hero .fox { width: 180px; height: 180px; display: block; margin: 0 auto 10px; animation: bob 2.6s ease-in-out infinite; }
.ob h1 { font-size: clamp(32px, 8vw, 44px); }
.ob-lead { font-size: 18px; color: var(--ink-2); font-weight: 500; margin: 12px auto 0; max-width: 36ch; }
.ob-body { flex: 1; }
.ob-foot { position: sticky; bottom: 0; padding-top: 18px; background: linear-gradient(transparent, var(--paper) 28%); }
.ob-q { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 18px; }
.ob-q .fox { width: 70px; height: 70px; flex: none; }
.ob-q h2 { font-size: 26px; }

/* ---------- Übung ---------- */
.session {
  position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
  background-color: var(--paper);
  padding-top: env(safe-area-inset-top, 0px);
}
.ses-top { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 760px; margin: 0 auto; padding: 12px 16px 6px; }
.ses-bar { position: relative; flex: 1; height: 18px; border-radius: 99px; background: var(--rule); overflow: hidden; }
.ses-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; background: var(--good); transition: width .4s var(--ease-pop); }
.ses-bar i::after { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .35); }
.ses-bar.is-blitz i { background: var(--gold); transition: none; }
.ses-meta { display: flex; align-items: center; gap: 8px; min-width: 44px; justify-content: flex-end; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.combo { display: inline-flex; align-items: center; gap: 3px; color: var(--fox); }
.combo .ic { width: 24px; height: 24px; }
.combo.pop { animation: pop .45s var(--ease-pop); }
.combo.is-hot .ic { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--gold) 80%, transparent)); animation: flame .5s ease-in-out infinite alternate; }
.pips { display: inline-flex; gap: 2px; margin-left: 5px; }
.pips i { width: 6px; height: 14px; border-radius: 3px; background: var(--rule-strong); }
.pips i.on { background: var(--gold); }
.pips.is-full i { box-shadow: 0 0 6px color-mix(in srgb, var(--gold) 80%, transparent); }
.ses-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ses-body { width: 100%; max-width: 680px; margin: 0 auto; padding: 18px 16px 28px; }
.ses-body > * { animation: rise .3s ease both; }
.ex-kicker { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; font-size: 24px; margin-bottom: 18px; }
.ex-kicker .tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--fox-soft); color: var(--fox); font-family: var(--f-body); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.prompt { display: flex; align-items: center; gap: 14px; margin: 8px 0 22px; }
.prompt .fox { width: 84px; height: 84px; flex: none; }
.prompt-box {
  position: relative; flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; border-radius: 20px; background: var(--card); border: 2px solid var(--rule);
}
.prompt-box::before { content: ""; position: absolute; left: -9px; top: 50%; width: 14px; height: 14px; margin-top: -7px; background: var(--card); border-left: 2px solid var(--rule); border-bottom: 2px solid var(--rule); transform: rotate(45deg); }
.prompt-text { font-size: 24px; font-weight: 600; line-height: 1.25; word-break: break-word; }
.prompt-text.en { font-family: var(--f-display); font-weight: 600; font-size: 28px; }
.prompt-sub { display: block; font-size: 14px; color: var(--ink-3); font-weight: 500; margin-top: 4px; font-family: var(--f-body); }
.opts { display: grid; gap: 12px; }
@media (min-width: 620px) { .opts.two { grid-template-columns: 1fr 1fr; } }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 62px; padding: 12px 16px; text-align: left;
  border-radius: 18px; border: 2px solid var(--rule); background: var(--card); box-shadow: 0 4px 0 var(--rule);
  font-size: 18px; font-weight: 500; line-height: 1.25; transition: transform .08s, box-shadow .08s, background-color .15s, border-color .15s;
}
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--rule); }
.opt .num { display: grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 9px; border: 2px solid var(--rule); font-size: 14px; font-weight: 600; color: var(--ink-3); }
.opt.en-opt { font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.opt[aria-pressed="true"] { border-color: var(--sky); background: var(--sky-soft); box-shadow: 0 4px 0 var(--sky); }
.opt[aria-pressed="true"] .num { border-color: var(--sky); color: var(--sky); }
.opt.is-right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.opt.is-right .num { border-color: var(--good); color: var(--good); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); animation: shake .4s; }
.opt:disabled { cursor: default; }
.opt.is-dim { opacity: .55; }

/* Neues Wort */
.intro {
  position: relative; text-align: center; padding: 30px 20px 24px; border-radius: 28px; background: var(--card);
  border: 2px solid var(--rule); box-shadow: 0 6px 0 var(--rule);
}
.intro-en { font-family: var(--f-display); font-weight: 600; font-size: clamp(34px, 9vw, 52px); line-height: 1.08; word-break: break-word; }
.ipa { font-family: system-ui, -apple-system, "Segoe UI", "Lucida Sans Unicode", "Arial Unicode MS", sans-serif; font-weight: 400; color: var(--ink-2); overflow-wrap: anywhere; }
.intro-ip { margin-top: 8px; font-size: 21px; }
.intro-say { display: flex; justify-content: center; gap: 10px; margin: 16px 0 6px; }
.intro-say .say { width: 54px; height: 54px; border-radius: 18px; }
.intro-say .say .ic { width: 28px; height: 28px; }
.intro-de { font-size: 22px; font-weight: 600; color: var(--ink-2); margin-top: 14px; }
.intro-ex { display: flex; align-items: flex-start; gap: 10px; margin: 20px auto 0; max-width: 520px; text-align: left; padding: 12px 14px; border-radius: 16px; background: var(--card-2); }
.intro-ex p { flex: 1; font-style: italic; font-weight: 500; padding-top: 8px; }
.intro-ex .say { width: 38px; height: 38px; }
.notes { display: grid; gap: 8px; margin: 14px auto 0; max-width: 520px; text-align: left; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 14px; font-weight: 500; font-size: 15px; background: var(--sky-soft); color: var(--ink); }
.note .ic { color: var(--sky); margin-top: 2px; }
.note.tip { background: var(--gold-soft); }
.note.tip .ic { color: #B77900; }

/* Hören */
.listen { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 10px 0 26px; }
.say-big {
  display: grid; place-items: center; width: 116px; height: 116px; border-radius: 34px; border: 0;
  background: var(--sky); color: #fff; box-shadow: 0 6px 0 var(--sky-deep);
}
.say-big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sky-deep); }
.say-big .ic { width: 56px; height: 56px; }
.say-slow { width: 72px; height: 72px; border-radius: 24px; }
.say-slow .ic { width: 38px; height: 38px; }

/* Paare */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mcol { display: grid; gap: 10px; align-content: start; }
.mtile {
  min-height: 64px; padding: 10px 12px; border-radius: 16px; border: 2px solid var(--rule); background: var(--card);
  box-shadow: 0 4px 0 var(--rule); font-weight: 600; font-size: 16px; line-height: 1.2; word-break: break-word;
  transition: opacity .3s ease, transform .08s ease, background-color .15s, border-color .15s;
}
.mtile.en { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.mtile[aria-pressed="true"] { border-color: var(--sky); background: var(--sky-soft); box-shadow: 0 4px 0 var(--sky); }
.mtile.is-right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.mtile.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); animation: shake .4s; }
.mtile.is-gone { opacity: .35; box-shadow: none; transform: scale(.97); }
.mtile:disabled { cursor: default; }

/* Kacheln */
.tline {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 76px; padding: 12px 4px 14px;
  border-bottom: 2px solid var(--rule); margin-bottom: 22px;
}
.tline .pre { font-family: var(--f-display); font-weight: 600; font-size: 22px; color: var(--ink-3); margin-right: 4px; }
.tbank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 60px; }
.tile {
  min-width: 48px; height: 54px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--rule); background: var(--card);
  box-shadow: 0 4px 0 var(--rule); font-family: var(--f-display); font-weight: 600; font-size: 22px;
  transition: transform .12s var(--ease-pop), opacity .15s;
}
.tile.letter { width: 50px; min-width: 0; padding: 0; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rule); }
.tile.ghost { color: transparent; background: var(--rule); border-color: transparent; box-shadow: none; }
.tline .tile { animation: pop .25s var(--ease-pop); }
.tline.is-right .tile { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
/* Falsch gelegt: nur die falschen Kacheln rot, fehlende als gestrichelte Lücke */
.tline.is-checked .tile { animation: none; }
.tline .tile.is-bad { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); animation: shake .4s; }
.tile.tile-gap { border: 2px dashed var(--bad); background: transparent; box-shadow: none; }

/* Sätze (saetze.js): kleinere Kacheln, antippbare Wörter, „Finde den Fehler“ */
.sx-tiles.tline { gap: 6px; }
.sx-tiles.tbank { gap: 8px; }
.sx-tiles .tile { min-width: 0; height: 48px; padding: 0 11px; font-size: 19px; }
.prompt-text.sx-text { font-size: 21px; line-height: 1.35; }
.prompt-text.en.sx-text { font-size: 23px; }
.sx-w { padding: 0 1px; border: 0; border-bottom: 2px dotted var(--rule-strong); border-radius: 0; background: none; color: inherit; font: inherit; line-height: inherit; cursor: pointer; }
.sx-w.is-key { color: var(--fox); }
.sx-w:disabled { cursor: default; }
.sx-lang { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--fox-soft); color: var(--fox); font-weight: 700; font-size: 15px; letter-spacing: .05em; }
.sx-fix { margin: 8px 0 4px; font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 2.1; }
.sx-fix .sx-w { padding: 2px 8px; border: 2px solid var(--rule); border-radius: 12px; background: var(--card); box-shadow: 0 3px 0 var(--rule); }
.sx-fix .sx-w:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--rule); }
.sx-fix .sx-w.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); animation: shake .4s; }
.sx-fix .sx-w.is-dim { opacity: .45; }
.sx-fix .sx-w.is-found { border-color: var(--near); background: var(--near-soft); box-shadow: 0 3px 0 var(--near); color: var(--ink); }
.sx-fix .sx-w.is-fix { border-color: var(--good); background: var(--good-soft); box-shadow: 0 3px 0 var(--good); color: var(--ink); opacity: 1; }
.sx-opts { margin-top: 4px; }
.fb-row .sx-fb { flex: 1; min-width: 0; }
.sx-fb .sx-w { font-weight: 500; }
.sx-fb .sx-w.is-key { font-weight: 600; }
.sx-fb .sx-w.is-fix { padding: 0 3px; border-radius: 6px; border-bottom: 0; background: var(--good); color: var(--card); }
.sx-voc { display: flex; align-items: center; gap: 6px; }
.sx-voc .ic { width: 18px; height: 18px; flex: none; color: var(--fox); }

/* Schreiben */
.type-wrap { position: relative; }
.type-in {
  width: 100%; min-height: 64px; padding: 12px 18px; border-radius: 18px; border: 2px solid var(--rule);
  background: var(--card); font-family: var(--f-display); font-weight: 500; font-size: 26px;
  box-shadow: inset 0 3px 0 var(--card-2);
}
.type-in:focus { border-color: var(--sky); }
.type-in.is-right { border-color: var(--good); background: var(--good-soft); }
.type-in.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.type-in.is-near { border-color: var(--near); background: var(--near-soft); }
.type-in.shake { animation: shake .4s; }
.type-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.hint-line { font-family: var(--f-display); font-weight: 500; font-size: 22px; letter-spacing: .16em; color: var(--ink-3); }
.retry-msg { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--near-soft); color: var(--ink); font-weight: 500; }
.ph-note { margin-top: 10px; font-size: 14px; color: var(--ink-3); font-weight: 500; }

/* Lückensatz */
.gap-sent {
  padding: 20px; border-radius: 20px; background: var(--card); border: 2px solid var(--rule);
  font-size: 23px; font-weight: 500; line-height: 1.9;
}
.gap-slot { display: inline-block; min-width: 110px; border-bottom: 4px solid var(--fox); color: var(--fox); text-align: center; line-height: 1.3; padding: 0 6px; }
.gap-slot.is-right { border-color: var(--good); color: var(--good); }
.gap-slot.is-wrong { border-color: var(--bad); color: var(--bad); }
.gap-in {
  display: inline-block; width: auto; min-width: 120px; max-width: 100%; height: 44px; padding: 0 10px; vertical-align: 2px;
  border: 0; border-bottom: 4px solid var(--fox); border-radius: 10px 10px 0 0; background: var(--fox-soft);
  font-family: var(--f-display); font-weight: 500; font-size: 22px; color: var(--ink);
}
.gap-in:focus { background: var(--sky-soft); border-color: var(--sky); outline: none; }
.gap-de { margin: 12px 2px 20px; color: var(--ink-2); font-weight: 500; }
.gap-de b { color: var(--ink); }

/* Rückmeldung unten */
.ses-foot { border-top: 2px solid var(--rule); background: var(--card); transition: background-color .2s ease; }
.ses-foot-in {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; width: 100%; max-width: 760px; margin: 0 auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.fb { flex: 1 1 280px; min-width: 0; }
.fb:empty { display: none; }
.ses-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 1 1 auto; justify-content: flex-end; }
.ses-actions .btn-primary, .ses-actions .btn-good, .ses-actions .btn-bad, .ses-actions .btn-near { min-width: 180px; }
@media (max-width: 620px) {
  .ses-actions { flex-basis: 100%; }
  .ses-actions .btn:last-child { flex: 1; }
}
.ses-foot.is-ok { background: var(--good-soft); border-color: transparent; }
.ses-foot.is-bad { background: var(--bad-soft); border-color: transparent; }
.ses-foot.is-near { background: var(--near-soft); border-color: transparent; }
/* Auto-Weiter: Balken unten im Knopf läuft bis zum nächsten Schritt */
.btn.is-auto { position: relative; overflow: hidden; }
.btn.is-auto::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255, 255, 255, .55); transform-origin: left; animation: auto-fill var(--auto, 1.1s) linear forwards; }
@keyframes auto-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.fb-head { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 600; font-size: 24px; }
.fb-head .fox { width: 44px; height: 44px; flex: none; }
.is-ok .fb-head { color: var(--good); }
.is-bad .fb-head { color: var(--bad); }
.is-near .fb-head { color: var(--near); }
.fb-ans { margin-top: 4px; font-weight: 500; color: var(--ink); font-size: 17px; }
.fb-ans b { font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.fb-hint { margin-top: 4px; font-weight: 500; color: var(--ink-2); font-size: 15px; }
.fb-ip { margin-top: 2px; font-size: 16px; }
.fb-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
/* Korrektur Buchstabe für Buchstabe: falsch rot, fehlend als Lücke, korrigiert grün */
.fb-you { color: var(--ink-2); }
.dx { overflow-wrap: anywhere; letter-spacing: .03em; }
.dx mark { color: var(--card); border-radius: 6px; padding: 0 3px; margin: 0 1px; }
.dx .dx-bad { background: var(--bad); }
.dx .dx-fix { background: var(--good); }
.dx-gap { display: inline-block; width: .6em; height: 1em; margin: 0 2px; border: 2px dashed var(--bad); border-radius: 5px; vertical-align: -.15em; }
.fb .say { width: 36px; height: 36px; border-radius: 12px; }
.fb .say .ic { width: 20px; height: 20px; }
/* Blitz-Feier alle 5 richtigen in Folge; Stufe 1–4 = 5, 10, 15, ab 20 */
.zap-fx {
  position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 0 16px 24vh; overflow: hidden; pointer-events: none;
  --c: var(--fox); --c-deep: var(--fox-deep); animation: zap-out 2s ease both;
}
.zap-fx.lv2 { --c: var(--sky); --c-deep: var(--sky-deep); }
.zap-fx.lv3 { --c: var(--good); --c-deep: var(--good-deep); }
.zap-fx.lv4 { --c: var(--bad); --c-deep: var(--bad-deep); }
.zap-flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--gold) 55%, transparent), transparent 70%); animation: zap-flash .7s ease-out both; }
.zap-core { position: relative; display: grid; place-items: center; }
.zap-rays {
  position: absolute; left: 50%; top: 50%; width: 440px; height: 440px; margin: -220px; border-radius: 50%;
  background: repeating-conic-gradient(color-mix(in srgb, var(--gold) 50%, transparent) 0deg 9deg, transparent 9deg 30deg);
  -webkit-mask: radial-gradient(closest-side, #000 30%, transparent); mask: radial-gradient(closest-side, #000 30%, transparent);
  animation: zap-rays 2s linear both;
}
.zap-card {
  position: relative; display: grid; justify-items: center; min-width: 210px; max-width: 100%; padding: 40px 28px 16px; border-radius: var(--r-lg);
  background: var(--c); color: #fff; text-align: center; box-shadow: 0 7px 0 var(--c-deep), 0 20px 40px -12px rgba(0, 0, 0, .4);
  animation: zap-card .55s .06s var(--ease-pop) both;
}
.zap-fx.lv4 .zap-card { background: linear-gradient(135deg, var(--fox), var(--bad)); }
.zap-bolt { position: absolute; top: -54px; left: 50%; margin-left: -45px; width: 90px; height: 90px; color: var(--gold); filter: drop-shadow(0 0 14px color-mix(in srgb, var(--gold) 80%, transparent)); animation: zap-strike .5s ease-out both; }
.zap-bolt .ic { width: 100%; height: 100%; stroke: #fff; stroke-width: 1.3; }
.zap-fx.lv3 .zap-bolt, .zap-fx.lv4 .zap-bolt { top: -64px; margin-left: -52px; width: 104px; height: 104px; }
.zap-n { font-family: var(--f-display); font-weight: 600; font-size: 66px; line-height: 1; text-shadow: 0 3px 0 var(--c-deep); }
.zap-sub { font-weight: 600; font-size: 15px; }
.zap-word { margin-top: 2px; font-family: var(--f-display); font-weight: 600; font-size: 27px; }
.zap-xp { margin-top: 10px; padding: 3px 12px; border-radius: 99px; background: rgba(255, 255, 255, .22); font-weight: 600; font-size: 14px; }
.zap-spark { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 3px; background: var(--gold); opacity: 0; animation: zap-spark .9s .1s ease-out both; }
.zap-spark:nth-child(even) { background: var(--c); width: 9px; height: 9px; margin: -4px; }

/* Blitz */
.blitz-score { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; }
.blitz-score b { font-family: var(--f-display); font-weight: 600; font-size: 44px; line-height: 1; }
.blitz-score span { font-weight: 600; color: var(--ink-3); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.mult { display: inline-grid; place-items: center; height: 34px; padding: 0 12px; border-radius: 11px; background: var(--gold); color: #3A2600; font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.mult.pop { animation: pop .4s var(--ease-pop); }
.blitz-q { text-align: center; margin-bottom: 18px; }
.blitz-q .prompt-text { font-size: 30px; }
.opts.grid4 { grid-template-columns: 1fr 1fr; }
.opts.grid4 .opt { justify-content: center; text-align: center; min-height: 84px; font-size: 17px; }
.opts.grid4 .opt.en-opt { font-size: 19px; }
.opts.grid4 .opt .num { display: none; }
.timer { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.timer.is-low { color: var(--bad); animation: pop .5s ease infinite alternate; }

/* Probetest */
.t-setup { display: grid; gap: 18px; }
.t-setup .fox { width: 110px; height: 110px; display: block; margin: 0 auto; }
.t-setup h1 { text-align: center; font-size: 32px; }
.t-setup p.lead { text-align: center; color: var(--ink-2); font-weight: 500; max-width: 42ch; margin: 0 auto; }
.optrow { display: flex; flex-wrap: wrap; gap: 8px; }
.optrow .chip { height: 44px; padding: 0 16px; font-size: 15px; }
.t-num { font-weight: 600; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; margin-bottom: 10px; }
.grade-hero { text-align: center; }
.grade-big {
  display: inline-grid; place-content: center; width: 140px; height: 140px; border-radius: 42px; margin: 6px auto 12px;
  background: var(--gc); color: #fff; box-shadow: 0 8px 0 color-mix(in srgb, var(--gc) 60%, #000 40%); transform: rotate(-3deg);
  animation: pop .6s var(--ease-pop) both;
}
.grade-big b { font-family: var(--f-display); font-weight: 600; font-size: 84px; line-height: .9; }
.grade-big small { font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; opacity: .9; }
.t-review { display: grid; gap: 8px; margin-top: 18px; }
.t-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px; border-radius: 16px; background: var(--card); border: 2px solid var(--rule); }
.t-item .st { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; color: #fff; }
.t-item .st .ic { width: 20px; height: 20px; stroke-width: 3; }
.t-item.ok .st { background: var(--good); }
.t-item.near .st { background: var(--near); }
.t-item.bad .st { background: var(--bad); }
.t-item .q { font-weight: 600; }
.t-item .a { font-size: 15px; font-weight: 500; color: var(--ink-2); }
.t-item .a s { color: var(--bad); text-decoration-thickness: 2px; }
.t-item .a b { color: var(--good); font-weight: 600; }
.t-item .link { font-size: 14px; }

/* Ergebnis */
.result { text-align: center; padding-top: 10px; }
.result .fox { width: 150px; height: 150px; display: block; margin: 0 auto 4px; animation: cheer .9s var(--ease-pop) both; }
.result h1 { font-size: clamp(30px, 8vw, 42px); }
.result .lead { color: var(--ink-2); font-weight: 500; margin-top: 6px; }
.res-learned { margin-top: 18px; padding: 16px 18px 18px; border-radius: 18px; background: var(--card); border: 2px solid var(--rule); text-align: left; }
.res-learned .learned { margin-top: 0; }
.res-learned .learned b { font-size: clamp(52px, 15vw, 68px); }
.res-learned .lvbar .l4 { transition-duration: 1.2s; }
.res-learned + .rstats { margin-top: 14px; }
.rstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 24px 0 18px; }
.rs { border-radius: 18px; border: 2px solid var(--rc); overflow: hidden; background: var(--card); animation: rise .5s ease both; }
.rs:nth-child(2) { animation-delay: .12s; }
.rs:nth-child(3) { animation-delay: .24s; }
.rs span { display: block; padding: 5px 4px; background: var(--rc); color: #fff; font-weight: 600; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; }
.rs b { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 4px 14px; font-family: var(--f-display); font-weight: 600; font-size: 26px; color: var(--rc); }
.rs b .ic { width: 22px; height: 22px; }
.rs-xp { --rc: var(--gold); }
.rs-acc { --rc: var(--good); }
.rs-time { --rc: var(--sky); }
.goalbar { text-align: left; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 2px solid var(--rule); }
.goalbar-top { display: flex; justify-content: space-between; font-weight: 600; }
.goalbar-top span { color: var(--ink-3); }
.goalbar .xpbar i { background: linear-gradient(90deg, var(--fox), #FF9A4D); }
.goalbar.is-done .xpbar i { background: var(--good); }
.wchips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
.wchip { padding: 6px 12px; border-radius: 99px; background: var(--card); border: 2px solid var(--rule); font-weight: 600; font-size: 14px; }

/* Ergänzungen: Startseite, Linie, Eltern */
body.ses-open { overflow: hidden; }
.btn .cta-sub { font-family: var(--f-body); font-size: 13px; font-weight: 600; letter-spacing: .02em; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, .22); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.card-h h2 { font-size: 21px; }
.explain { padding-left: 20px; display: grid; gap: 8px; font-weight: 500; color: var(--ink-2); }
.explain b { color: var(--ink); }
.set-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; max-width: 100%; }
.lu-txt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.lu-sub { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.line-toggle { text-align: center; margin: 4px 0 8px; }
.more-row { text-align: center; margin-top: 16px; }
.ob-foot-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
.par-plan { margin-top: 10px; }
.small { font-size: 13px; }
.set-name { width: auto; max-width: 240px; flex: 1 1 200px; }
.par-reset { margin-top: 14px; }
.hero-empty .btn { margin-top: 4px; }

/* Ergänzungen: Übung */
.prompt-main { flex: 1; min-width: 0; }
.fb-xp { margin-left: auto; padding: 3px 10px; border-radius: 99px; background: var(--gold); color: #3A2600; font-family: var(--f-body); font-size: 14px; font-weight: 600; white-space: nowrap; }
.hint-line .hw { white-space: nowrap; }
.hint-line .hw + .hw { margin-left: .7em; }
.res-note { margin-top: 18px; font-weight: 600; color: var(--ink-2); }
.res-note + .wchips { margin-top: 8px; }
.wchip .de { font-weight: 500; color: var(--ink-3); }
.bz-n { display: grid; justify-items: center; gap: 2px; }
.t-card { display: grid; gap: 18px; }
.t-card .lbl { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.t-card p { margin: 0; }
.grade-hero .lead { color: var(--ink-2); font-weight: 500; margin-top: 6px; }
.grade-hero + .goalbar { margin-top: 20px; }
.ses-body:focus { outline: none; }

/* ---------- Sprechen (sprechen.js) ---------- */
.spk-text.is-ex { font-size: 23px; line-height: 1.35; }
.spk-text b { color: var(--fox); font-weight: 500; }
.spk-text .spk-miss { background: var(--near-soft); color: inherit; border-radius: 6px; padding: 0 3px; box-shadow: inset 0 -3px 0 var(--near); }
.spk-say { display: flex; flex-direction: column; gap: 8px; flex: none; }
.spk { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 6px 0 10px; }
.spk-mic {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  width: min(100%, 320px); min-height: 124px; padding: 16px; border: 0; border-radius: 28px; cursor: pointer;
  background: var(--sky); color: #fff; box-shadow: 0 6px 0 var(--sky-deep);
  font-family: var(--f-display); font-weight: 600; font-size: 20px;
}
.spk-mic .ic { width: 48px; height: 48px; }
.spk-mic:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sky-deep); }
.spk-mic.is-on { background: var(--good); box-shadow: 0 6px 0 var(--good-deep); animation: spk-pulse 1.2s ease-in-out infinite; }
.spk-mic:disabled { background: var(--card-2); color: var(--ink-3); box-shadow: 0 6px 0 var(--rule); cursor: default; transform: none; }
.spk-status { min-height: 1.5em; max-width: 520px; text-align: center; font-weight: 500; color: var(--ink-2); overflow-wrap: anywhere; }
.spk-status.is-live { color: var(--ink); }
.spk-status.is-bad { padding: 8px 14px; border-radius: 14px; background: var(--near-soft); color: var(--ink); }
@keyframes spk-pulse { 0%, 100% { box-shadow: 0 6px 0 var(--good-deep), 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); } 50% { box-shadow: 0 6px 0 var(--good-deep), 0 0 0 14px color-mix(in srgb, var(--good) 0%, transparent); } }

/* ---------- Dialog & Toast ---------- */
.modal {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px;
  background: rgba(10, 14, 28, .55); animation: fade .2s ease both;
}
.modal-card {
  width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto; text-align: center; padding: 26px 22px 22px;
  border-radius: 28px; background: var(--card); border: 2px solid var(--rule); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .45);
  animation: pop .4s var(--ease-pop) both;
}
.modal-card .fox { width: 120px; height: 120px; display: block; margin: -6px auto 6px; }
.modal-card .medal { width: 110px; height: 110px; margin: 4px auto 16px; animation: spin-in .8s var(--ease-pop) both; }
.modal-card .medal .ic { width: 54px; height: 54px; }
.modal-card h2 { font-size: 28px; }
.modal-card p { margin-top: 8px; color: var(--ink-2); font-weight: 500; }
.modal-btns { display: grid; gap: 10px; margin-top: 22px; }
.modal-art-flame { width: 110px; height: 110px; margin: 0 auto 10px; display: grid; place-items: center; border-radius: 34px; background: var(--fox-soft); color: var(--fox); animation: flame 1.2s ease-in-out infinite alternate; }
.modal-art-flame .ic { width: 70px; height: 70px; }
.modal-num { font-family: var(--f-display); font-weight: 600; font-size: 64px; line-height: 1; color: var(--fox); }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  transform: translateX(-50%); max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 16px;
  background: var(--ink); color: var(--paper); font-weight: 600; box-shadow: var(--shade); animation: rise .25s ease both; text-align: center;
  pointer-events: none;   /* liegt am Desktop über „Weiter“ – darf keinen Klick schlucken */
}
@media (min-width: 900px) { .toast { bottom: 28px; } }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 95; pointer-events: none; }

/* ---------- Fuchs ---------- */
.fox { display: inline-block; overflow: visible; }
.fox .fx-fur { fill: var(--fur); }
.fox .fx-ear-in { fill: #4A2417; }
.fox .fx-mask { fill: #FFF6EE; }
.fox .fx-dark { fill: #1B1826; }
.fox .fx-glint { fill: #fff; }
.fox .fx-line { fill: none; stroke: #1B1826; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
.fox .fx-mouth-open { fill: #8C2238; stroke: #1B1826; stroke-width: 3; stroke-linejoin: round; }
.fox .fx-blush { fill: #FF8C9E; opacity: .5; }
.fox .fx-scarf { fill: var(--sc1, #2A5BD7); }
.fox .fx-scarf-2 { fill: var(--sc2, #E5484D); }
.fox .m-happy, .fox .m-open, .fox .m-sad, .fox .m-o, .fox .m-brows { display: none; }
.fox.fox-happy .m-idle-eyes, .fox.fox-happy .m-smile { display: none; }
.fox.fox-happy .m-happy, .fox.fox-happy .m-open { display: inline; }
.fox.fox-sad .m-smile { display: none; }
.fox.fox-sad .m-sad, .fox.fox-sad .m-brows { display: inline; }
.fox.fox-wow .m-smile { display: none; }
.fox.fox-wow .m-o { display: inline; }
.fox .m-idle-eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
.fox.fox-happy { animation: hop .6s var(--ease-pop); }
.fox.fox-sad { animation: droop .6s ease; }

/* ---------- Bewegung ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, #000 45%), 0 0 0 0 color-mix(in srgb, var(--c) 45%, transparent); } 50% { box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, #000 45%), 0 0 0 12px color-mix(in srgb, var(--c) 0%, transparent); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-10px) rotate(-4deg); } 100% { transform: translateY(0); } }
@keyframes droop { 0% { transform: rotate(0); } 40% { transform: rotate(6deg); } 100% { transform: rotate(0); } }
@keyframes cheer { 0% { transform: scale(.4) rotate(-10deg); opacity: 0; } 70% { transform: scale(1.08) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@keyframes zap-out { 0%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-30px); } }
@keyframes zap-rays { 0% { opacity: 0; transform: rotate(0) scale(.4); } 20% { opacity: 1; transform: rotate(14deg) scale(1); } 100% { opacity: 1; transform: rotate(60deg) scale(1.05); } }
@keyframes zap-flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
@keyframes zap-card { from { opacity: 0; transform: scale(.3) rotate(-6deg); } to { opacity: 1; transform: none; } }
@keyframes zap-strike { 0% { opacity: 0; transform: translateY(-160px) scale(1.5) rotate(-10deg); } 35% { opacity: 1; transform: rotate(-10deg); } 55% { transform: scale(1.2) rotate(-10deg); } 100% { opacity: 1; transform: rotate(-10deg); } }
@keyframes zap-spark { 0% { opacity: 1; transform: rotate(var(--a)) scale(.5); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(1.1); } }
@keyframes spin-in { 0% { transform: scale(.3) rotate(-120deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes flame { from { transform: scale(1) rotate(-2deg); } to { transform: scale(1.06) rotate(2deg); } }


/* ---------- Fuchstaler ---------- */
.ob-foot-row.is-center { justify-content: center; flex-wrap: wrap; gap: 0 10px; }
.tal-gain {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; margin: 0 0 12px; padding: 10px 14px;
  border-radius: 16px; background: var(--card); border: 2px solid var(--rule); font-weight: 500; color: var(--ink-2);
}
.tal-gain .ic { width: 24px; height: 24px; color: var(--gold); flex: none; }
.tal-gain b { font-family: var(--f-display); font-weight: 600; font-size: 20px; color: var(--ink); }
.tal-gain.is-new { background: var(--gold-soft); border-color: var(--gold); }
.tal-gain.is-new .ic { animation: spin-in .7s var(--ease-pop) both; }

.tal-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 18px; align-items: center; }
.tal-coin { width: 76px; height: 76px; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: #3A2A00; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .14); }
.tal-coin .ic { width: 44px; height: 44px; stroke-width: 2.4; }
.tal-bal b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 52px; line-height: 1; margin: 2px 0 4px; }
.tal-bal > span:last-child { font-weight: 500; color: var(--ink-2); }
.tal-prog { grid-column: 1 / -1; }
.tal-row { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 15px; margin-top: 4px; }
.tal-row span { color: var(--ink-3); }
.tal-bar { height: 12px; margin: 6px 0 10px; }
.tal-bar i { background: linear-gradient(90deg, var(--gold), #FFC94D); }
.tal-bar.is-next i { background: linear-gradient(90deg, var(--sky), #6FA8FF); }
.tal-note { font-weight: 500; color: var(--ink-2); margin: 0; }
.tal-grid { display: grid; gap: 16px; margin: 16px 0; }
@media (min-width: 760px) { .tal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tal-grid .card + .card { margin-top: 0; }
.tal-game, .tal-redeem { display: flex; flex-direction: column; gap: 10px; }
.tal-game p, .tal-redeem p { margin: 0; }
.tal-game .btn, .tal-redeem .tal-ask { margin-top: auto; }
.tal-redeem .card-h .ic { width: 26px; height: 26px; color: var(--sky); }
.tal-game-art { height: 64px; border-radius: 14px; background: var(--card-2); display: grid; place-items: center; }
.tal-game-art svg { height: 52px; }
.tal-game-art .sa-body { fill: var(--good); }
.tal-game-art .sa-head { fill: var(--good-deep); }
.tal-game-art .sa-item { fill: var(--gold-soft); stroke: var(--gold); stroke-width: 1.2; }

<script>
/* Wortfuchs – Kern: Wortdaten, Antwort-Prüfung, Lernplan, Spielstand und Speichern.
   Enthält keine Oberfläche; app.js baut darauf auf. */
'use strict';

// ---------- Hilfen ----------
const DAY = 864e5;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rnd = n => Math.floor(Math.random() * n);
const pickOne = a => a[rnd(a.length)];
const sum = a => a.reduce((s, x) => s + x, 0);
const uniq = a => [...new Set(a)];
const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Kalendertage (Ortszeit) als fortlaufende Zahl, Schlüssel "JJJJ-MM-TT"
const dayNum = (d = new Date()) => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
const dayKey = n => new Date(n * DAY).toISOString().slice(0, 10);
const keyNum = k => Math.round(Date.parse(k + 'T00:00:00Z') / DAY);
const fmtDay = (n, opt = { weekday: 'short', day: 'numeric', month: 'short' }) =>
  new Date(n * DAY).toLocaleDateString('de-DE', { ...opt, timeZone: 'UTC' });
const today = () => dayNum();

// ---------- Text ----------
const APOS = /[’‘`´]/g;
const squash = s => String(s).replace(/\s+/g, ' ').trim();
const canon = s => squash(String(s).toLowerCase().replace(APOS, "'").replace(/…|\.\.\./g, ' ').replace(/[.,!?;:"“”„()]/g, ' '));
const loose = s => s.replace(/^to (?=\S)/, '').replace(/^(a|an|the) (?=\S)/, '');
const plainEn = en => squash(en.replace(/\([^)]*\)/g, ' ')).replace(/\s+([?!,]|\.(?!\.))(?=\s|$)/g, '$1');
// Was die Vorlesestimme sagen soll: "to point at sb/sth" -> "to point at somebody or something"
const speakable = en => squash(en
  .replace(/\((?:pl|no pl|=[^)]*|g|ml|c|£|XL)\)/gi, ' ')
  .replace(/[()]/g, '')
  .replace(/\bsb\b/g, 'somebody').replace(/\bsth\b/g, 'something')
  .replace(/\s*\/\s*/g, ' or ')
  .replace(/\s*(?:…|\.\.\.)\s*/g, ', ')
  .replace(/,\s*([?!.])/g, '$1').replace(/,\s*$/, ''));

// Damerau-Levenshtein (optimal string alignment): Tippfehler-Abstand
function osa(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 9;
  const d = [];
  for (let i = 0; i <= m; i++) d[i] = [i];
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      let v = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, d[i - 2][j - 2] + 1);
      d[i][j] = v;
    }
  }
  return d[m][n];
}

// ---------- Wortdaten ----------
const VOCAB = window.VOCAB;
const PAGES = VOCAB.pages;
const LABELS = VOCAB.labels;
const UNIT_C = ['#B7791F', '#E5484D', '#8E4EC6', '#1F7AE0', '#0E9384', '#2B9A5A', '#D1418F', '#4F5BD5', '#9A6B45', '#6B7280', '#A0522D', '#52708F'];
const UNITS = VOCAB.units.map((u, i) => {
  const [short, sub = ''] = u.n.split(/:\s*/);
  return { ...u, i, short, sub, c: UNIT_C[i % UNIT_C.length] };
});

// Welche Kapitel auf welcher Seite vorkommen (für die Farbbalken der Seitenwahl)
const PAGE_UNITS = {};
for (const e of VOCAB.e) for (const o of e.o) {
  const u = LABELS[o[2]].u;
  (PAGE_UNITS[o[0]] = PAGE_UNITS[o[0]] || []).includes(u) || PAGE_UNITS[o[0]].push(u);
}
Object.values(PAGE_UNITS).forEach(a => a.sort((x, y) => x - y));

// Großschreibung, die zählt: Eigennamen, Wochentage, "I" – nicht der Satzanfang
function capWordsOf(plain) {
  const toks = plain.replace(/[.,!?;:"“”„…]/g, ' ').split(/[\s/]+/).filter(Boolean);
  const cap = t => /[A-Z]/.test(t);
  const res = [];
  toks.forEach((t, k) => {
    if (!cap(t)) return;
    if (/^I(?:'|’|$)/.test(t)) { res.push(t.replace(APOS, "'")); return; }
    if (k === 0 && (toks.length === 1 ? /[.!?]$/.test(plain) : !cap(toks[1]))) return;
    res.push(t.replace(APOS, "'"));
  });
  return uniq(res);
}

// Buchstaben- oder Wortkacheln zum Zusammensetzen
function tileSpec(w) {
  const p = w.plain.replace(APOS, "'");

// -s-Form (Mehrzahl, he/she/it): marker → markers, watch → watches, hobby → hobbies.

const NO_S_FORM = new Set(['her', 'our', 'your', 'their']);

// Lückensatz aus dem Beispielsatz. Steht das Wort dort nur mit -s (markers, starts, hobbies),

// Deutsch prüfen (nur im Probetest, Richtung Englisch -> Deutsch)
const foldDe = s => squash(String(s).toLowerCase()
  .replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ß/g, 'ss')
  .replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u')

  [/v/, 'w'], [/w(?=[aeiou])/, 'v'], [/s(?=[aeiou])/, 'z'], [/igh/, 'ei'], [/ay/, 'ey'], [/ai/, 'ei'],
