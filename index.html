<script>
/* Wortfuchs – Üben: Station (Lektion), Wiederholen, Festigen, Fehler-Training,
   Blitz-Runde und Probetest. Baut auf kern.js, ui.js und views.js auf. */
'use strict';

let SES = null;   // die laufende Übung – oder null

const XP_OF = { mcEn: 8, mcDe: 8, listen: 8, spell: 8, gapc: 8, tiles: 10, type: 12, gapt: 12 };
const PRAISE = ['Super!', 'Richtig!', 'Klasse!', 'Genau!', 'Stark!', 'Perfekt!', 'Weiter so!'];
const GRADE_TXT = ['', 'Sehr gut!', 'Gut!', 'Befriedigend', 'Ausreichend', 'Mangelhaft', 'Ungenügend'];
const GRADE_BONUS = [0, 40, 30, 20, 10, 0, 0];
const gradeOf = p => p >= 92 ? 1 : p >= 81 ? 2 : p >= 67 ? 3 : p >= 50 ? 4 : p >= 30 ? 5 : 6;
const RES_TITLE = { lesson: 'Station geschafft!', replay: 'Station wiederholt!', review: 'Wiederholung geschafft!', strengthen: 'Gut gefestigt!', oops: 'Fehler ausgebügelt!' };
const COARSE = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
const INPUT_ATTRS = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"';
const EXTRA_LETTERS = 'eaiourstnlmdcbpgh';

function addXP(n) {
  if (!n) return;
  const r = todayRec();
  r.xp = (r.xp || 0) + n;
  if (SES) SES.xp += n;
  if (!SES || SES.kind !== 'blitz') talEarn(n);   // Blitz zählt erst am Ende (talBlitz)
}
const bump = (k, n = 1) => { const r = todayRec(); r[k] = (r[k] || 0) + n; };
const statInc = k => { S.st[k] = (S.st[k] || 0) + 1; };
const statMax = (k, v) => { S.st[k] = Math.max(S.st[k] || 0, v); };
function markDay() {
  const d = new Date(), h = d.getHours();
  if (h >= 4 && h < 8) S.st.early = 1;
  if (d.getDay() === 0 || d.getDay() === 6) S.st.weekend = 1;
}

// ---------- Wörter auswählen ----------
const sesPool = () => { const a = curAsg(); return a ? poolOf(a) : WORDS; };
const learnedNow = () => { const a = curAsg(); return a ? poolOf(a).filter(w => lvl(w) >= 3).length : -1; };
// Fällige Wörter: am längsten überfällig zuerst, dann die schwächsten
function dueWords(pool, n = 10) {
  const t = today();
  return pool.filter(w => isDue(w, t)).sort((x, y) => ws(x).d - ws(y).d || lvl(x) - lvl(y)).slice(0, n);
}
function weakWords(pool, n = 8) {
  return pool.filter(w => lvl(w) >= 1).sort((x, y) => lvl(x) - lvl(y) || ws(y).x - ws(x).x || ws(x).m - ws(y).m).slice(0, n);
}
function oopsWords(pool, n = 8) {
  return pool.filter(w => { const s = ws(w); return s && s.x > 0 && s.b < 4; })
    .sort((x, y) => ws(y).x - ws(x).x || lvl(x) - lvl(y)).slice(0, n);
}
function knownWords(pool) {
  const list = pool.filter(w => lvl(w) >= 1);
  return list.length >= 4 ? list : WORDS.filter(w => lvl(w) >= 1);
}

// ---------- Übungsschritte planen ----------
// Schritt {t, w, g}: t = intro | mcEn | mcDe | listen | spell | gapc | match | tiles | type | gapt | speak (sprechen.js),
// g = recog (erkennen) | recall (selbst wissen)
const stepA = w => canListen() && Math.random() < 0.4 ? { t: 'listen', w, g: 'recog' } : { t: 'mcEn', w, g: 'recog' };
function stepB(w) {
  const c = [{ t: 'mcDe', w, g: 'recog' }];
  if (misspell(w, 2).length >= 2) c.push({ t: 'spell', w, g: 'recog' });
  if (w.gap) c.push({ t: 'gapc', w, g: 'recog' });
  return pickOne(c);
}
function stepRecall(w, easy) {
  if (easy && w.tiles) return { t: 'tiles', w, g: 'recall' };
  if (w.typable) return w.gap && Math.random() < 0.35 ? { t: 'gapt', w, g: 'recall' } : { t: 'type', w, g: 'recall' };
  if (w.tiles) return { t: 'tiles', w, g: 'recall' };
  return { t: 'mcDe', w, g: 'recall' };
}
const introStep = (w, k, n) => ({ t: 'intro', w, k, n });
// Paare: 3–5 Wörter, die sich nicht verwechseln lassen
function matchStep(list, fill = []) {
  const out = [];
  const fits = w => !out.some(o => o === w || overlaps(o, w) || overlaps(w, o)
    || o.plain.toLowerCase() === w.plain.toLowerCase() || deShort(o) === deShort(w));
  for (const w of list) if (out.length < 5 && fits(w)) out.push(w);
  for (const w of shuffle(fill)) { if (out.length >= 5) break; if (fits(w)) out.push(w); }
  return out.length >= 3 ? { t: 'match', ws: out } : null;
}

// Neue Station: kennenlernen -> erkennen -> Paare -> selbst schreiben (+ ein paar fällige Wörter)
function planLesson(st, pool) {
  const nw = st.words.filter(w => lvl(w) === 0);
  if (!nw.length) return planReplay(st, pool);
  const steps = [];
  nw.forEach((w, k) => {
    steps.push(introStep(w, k + 1, nw.length), stepA(w));
    if (k % 2 === 1) steps.push(stepB(nw[k - 1]));
  });
  const m = matchStep(st.words, knownWords(pool));
  if (m) steps.push(m);
  const old = st.words.filter(w => lvl(w) > 0);
  const due = dueWords(pool.filter(w => !st.words.includes(w)), 3);
  steps.push(...shuffle([...nw.map(w => stepRecall(w, true)), ...old.concat(due).map(w => stepRecall(w, lvl(w) < 3))]));
  return steps;
}
function planReplay(st, pool) {
  const steps = [];
  const m = matchStep(shuffle(st.words), knownWords(pool));
  if (m) steps.push(m);
  steps.push(...shuffle(st.words.filter(w => lvl(w) < 3)).map(stepB));
  steps.push(...shuffle(st.words).map(w => stepRecall(w, lvl(w) < 3)));
  return steps;
}
// Wiederholen, Festigen, Fehler-Training
function planReview(list) {
  const nw = list.filter(w => lvl(w) === 0);
  const steps = nw.map((w, k) => introStep(w, k + 1, nw.length));
  if (list.length >= 4) { const m = matchStep(shuffle(list)); if (m) steps.push(m); }
  steps.push(...shuffle(list.filter(w => lvl(w) <= 2)).map(w => Math.random() < 0.5 ? stepA(w) : stepB(w)));
  steps.push(...shuffle(list).map(w => stepRecall(w, lvl(w) <= 2)));
  return steps;
}

// ---------- Übung öffnen und schließen ----------
function newSes(kind, extra) {
  return Object.assign({
    kind, q: [], done: 0, cur: null, phase: 'ask', view: {}, shownAt: 0,
    xp: 0, ok: 0, near: 0, bad: 0, errs: 0, combo: 0, best: 0, req: {}, intro: [], list: [], st: null,
    pool: WORDS, t0: Date.now(), L0: levelInfo().L, xp0: todayXP(), first: !streakInfo().todayDone, ln0: learnedNow(),
  }, extra);
}

function startSession(kind, o = {}) {
  if (SES) return;
  if (kind === 'blitz') return startBlitz();
  if (kind === 'test') return startTest();
  const a = curAsg();
  const pool = sesPool();
  let steps, st = null, list;
  if (kind === 'lesson' || kind === 'replay') {
    st = a ? stationsOf(a)[o.station] : null;
    if (!st) return;
    steps = kind === 'lesson' ? planLesson(st, pool) : planReplay(st, pool);
    list = st.words;
  } else {
    list = o.words || [];
    steps = planReview(list);
  }
  if (!steps.length) { toast('Hier gibt es gerade nichts zu üben.'); return; }
  steps = spkPlan(steps, kind);   // Sprech-Aufgaben (sprechen.js)
  SES = newSes(kind, { q: steps, st, list, pool });
  openSession();
  nextStep();
}

const BEHIND = ['#top', '#main', '#bottom-nav'];
function openSession() {
  $('#session').hidden = false;
  document.body.classList.add('ses-open');
  for (const s of BEHIND) $(s).inert = true;
  $('#ses-close').innerHTML = icon('x');
  $('#ses-bar').classList.toggle('is-blitz', SES.kind === 'blitz');
  $('#ses-foot').hidden = false;
  $('#ses-meta').innerHTML = '';
  $('#ses-fb').innerHTML = '';
  $('#ses-body').tabIndex = -1;
  setFoot('');
  renderBar(0);
  Sfx.play('start');
}

function closeSession() {
  if (!SES) return;
  if (SES.tick) clearInterval(SES.tick);
  stopAuto();
  spkStop();
  SES = null;
  TTS.stop();
  $('#session').hidden = true;
  $('#ses-body').innerHTML = '';
  $('#ses-fb').innerHTML = '';
  $('#ses-meta').innerHTML = '';
  for (const s of BEHIND) $(s).inert = false;
  if ($('#onboard').hidden) document.body.classList.remove('ses-open');
  refresh();
}

// Vorzeitig beenden – mit Nachfrage
async function sesQuit() {
  if (!SES || Modal.open) return;
  if (SES.phase === 'end' || SES.phase === 'setup' || SES.phase === 'ready') { closeSession(); return; }
  const bz = SES.kind === 'blitz', test = SES.kind === 'test';
  if (bz) { SES.pause = SES.end - performance.now(); clearInterval(SES.tick); SES.tick = 0; }
  const yes = await ask({
    title: test ? 'Probetest abbrechen?' : bz ? 'Blitz-Runde beenden?' : 'Übung beenden?',
    text: test ? 'Dann zählt dieser Test nicht.' : 'Was du bisher geübt hast, ist gespeichert.',
    yes: 'Beenden', no: 'Weitermachen', art: fox('sad'), stay: true,
  });
  if (!SES) return;
  if (!yes) {
    if (bz && SES.phase === 'q') { SES.end = performance.now() + SES.pause; SES.tick = setInterval(blitzTick, 200); }
    return;
  }
  if (!test) { bump('s', Math.min(1800, Math.round((Date.now() - SES.t0) / 1000))); commit(); }
  closeSession();
}

}
function setSkip(label, cls = 'btn-quiet') {

// Alle 5 richtigen in Folge: Blitz-Feier mit Bonus-XP (ab 10 in Folge doppelt)
const ZAP_TXT = ['Super Serie!', 'Wahnsinn!', 'Nicht zu stoppen!', 'Legendär!'];
function comboZap() {

    <b class="zap-n">${n}</b><span class="zap-sub">richtig in Folge</span><span class="zap-word">${ZAP_TXT[lv - 1]}</span><span class="zap-xp">+${bonus} XP Bonus</span></div>${sparks}</div>`;

function focusBody() { try { $('#ses-body').focus({ preventScroll: true }); } catch (e) { /* egal */ } }
const kicker = (txt, s) => `<div class="ex-kicker">${s && s.again ? '<span class="tag">Nochmal</span>' : ''}${txt}</div>`;
function promptHTML(text, o = {}) {

// ---------- Schritte anzeigen ----------
function nextStep() {
  stopAuto();

  if (!s) { finish(); return; }
  SES.cur = s;
  SES.phase = 'ask';
  SES.view = {};
  SES.shownAt = performance.now();

  else if (s.t === 'tiles') renderTiles(s);

// Auswahl: Bedeutung, Englisch, Hören, Schreibweise, Lückensatz
function renderChoice(s) {
  const w = s.w, V = SES.view, pool = SES.pool;
  let t = s.t, opts = null;
  if (t === 'spell') {
    const bad = misspell(w, 3);
    if (bad.length) opts = [{ x: w.plain, w }, ...bad.map(x => ({ x }))];
    else t = 'mcDe';
  }
  if (t === 'gapc') {
    const cap = /^[A-Z]/.test(w.gap.word);
    const want = canon(w.gap.word);
    // mit -s passen nur wenige Wörter als Ablenker (Buchform oder Verb) – darum viele Kandidaten ziehen
    const ds = distract(w, w.gap.inf ? 150 : 10, pool, 'en').filter(o => /^[a-z' -]{2,22}$/.test(o.k)).map(o => ({ x: gapForm(o, w.gap), w: o })).filter(o => o.x && o.x !== want).slice(0, 3);
    if (ds.length >= 2) opts = [{ x: w.gap.word, w }, ...ds.map(o => ({ x: cap ? o.x[0].toUpperCase() + o.x.slice(1) : o.x, w: o.w }))];
    else t = 'mcDe';
  }
  if (t === 'mcEn') opts = [w, ...distract(w, 3, pool, 'de')].map(o => ({ x: deShort(o), w: o }));
  else if (t === 'mcDe') opts = [w, ...distract(w, 3, pool, 'en')].map(o => ({ x: o.plain, w: o }));
  else if (t === 'listen') opts = [w, ...distract(w, 3, pool, 'sound')].map(o => ({ x: o.plain, w: o }));
  const seen = new Set();
  opts = opts.filter(o => { const k = o.x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  const right = opts[0];
  V.t = t;
  V.opts = shuffle(opts);
  V.right = V.opts.indexOf(right);
  let head;
  if (t === 'mcEn') head = kicker('Was bedeutet das?', s) + promptHTML(esc(w.plain), { en: true, w });
  else if (t === 'mcDe') head = kicker('Auf Englisch?', s) + promptHTML(esc(w.de));
  else if (t === 'spell') head = kicker('Richtig geschrieben?', s) + promptHTML(esc(w.de));
  else if (t === 'listen') {
    head = kicker('Was hörst du?', s) + `<div class="listen"><button class="say-big" type="button" data-act="say" data-id="${w.id}" aria-label="Nochmal anhören">${icon('volume')}</button>`
      + `<button class="say say-slow" type="button" data-act="say" data-id="${w.id}" data-slow="1" aria-label="Langsam anhören">${icon('snail')}</button></div>`;
  } else {
    head = kicker('Welches Wort fehlt?', s) + `<div class="gap-sent" lang="en">${esc(w.gap.before)}<span class="gap-slot" id="gap-slot">&nbsp;</span>${esc(w.gap.after)}</div>`
      + `<p class="gap-de">Gesucht: <b>${esc(w.de)}</b></p>`;
  }
  $('#ses-body').innerHTML = head + optsHTML(V.opts.map(o => o.x), t !== 'mcEn');
  setGo(`Weiter ${icon('arrow-right')}`, 'btn-primary', true);
  if (t === 'mcEn' || t === 'listen') autoSay(w, 300);
  focusBody();
}

ACT.opt = el => {
  if (!SES) return;
  const k = +el.dataset.k;
  if (SES.kind === 'blitz') { blitzPick(k); return; }
  const s = SES.cur, V = SES.view;
  if (SES.phase !== 'ask' || !V.opts || el.disabled) return;
  if (k !== V.right) {
    // Falsch: kurz rot aufleuchten, dann grau – die Lösung bleibt verborgen, er wählt nochmal
    const o = V.opts[k];
    if (V.hint === undefined) {
      V.hint = o.w && o.w !== s.w ? (V.t === 'mcEn' ? `„${esc(o.x)}“ heißt auf Englisch <b lang="en">${esc(o.w.plain)}</b>.`
        : `<span lang="en">„${esc(o.w.plain)}“</span> heißt ${esc(deShort(o.w))}.`)
        : V.t === 'spell' ? 'Schau dir die Buchstaben genau an.' : '';
    }
    V.tries = (V.tries || 0) + 1;
    el.disabled = true;
    el.classList.add('is-wrong');
    if (document.activeElement === el) focusBody();
    Sfx.play('bad');
    after(650, () => { el.classList.remove('is-wrong'); el.classList.add('is-dim'); });
    return;
  }
  markOpts(k, V.right);
  if (V.t === 'gapc') { const g = $('#gap-slot'); g.textContent = s.w.gap.word; g.classList.add('is-right'); }
  judge(s, V.tries ? 'bad' : 'ok', { hint: V.hint || '', found: !!V.tries });
  $('#ses-go').focus({ preventScroll: true });
};

// Paare finden
function renderMatch(s) {

    <div class="mcol" role="group" aria-label="Deutsch">${V.R.map((w, k) => `<button class="mtile" type="button" data-act="mt" data-s="R" data-k="${k}" aria-pressed="false">${esc(deShort(w))}</button>`).join('')}</div></div>`;

}

ACT.mt = el => {
  if (!SES || SES.phase !== 'ask' || !SES.cur || SES.cur.t !== 'match') return;
  const V = SES.view, side = el.dataset.s;
  const w = (side === 'L' ? V.L : V.R)[+el.dataset.k];
  if (!w || V.got.has(w.id) || V.busy) return;
  if (side === 'L' && canListen()) sayWord(w);
  if (!V.sel || V.sel.side === side) {
    const same = V.sel && V.sel.el === el;
    if (V.sel) V.sel.el.setAttribute('aria-pressed', 'false');
    V.sel = null;
    if (same) return;
    V.sel = { side, w, el };
    el.setAttribute('aria-pressed', 'true');
    Sfx.play('tap');
    return;
  }
  const a = V.sel;
  V.sel = null;
  a.el.setAttribute('aria-pressed', 'false');
  if (a.w === w) {
    V.got.add(w.id);
    for (const b of [a.el, el]) { b.classList.add('is-right'); b.disabled = true; }
    Sfx.play('pair');
    if (!V.miss.has(w.id)) grade(w, 'recog', 'ok');
    after(350, () => { a.el.classList.add('is-gone'); el.classList.add('is-gone'); });
    if (V.got.size === SES.cur.ws.length) matchDone();
  } else {
    V.miss.add(a.w.id);
    V.miss.add(w.id);
    for (const b of [a.el, el]) b.classList.add('is-wrong');
    Sfx.play('bad');
    V.busy = true;
    after(550, () => { a.el.classList.remove('is-wrong'); el.classList.remove('is-wrong'); V.busy = false; });
  }
};

function matchDone() {

// Kacheln: Buchstaben oder Wörter zusammensetzen
function renderTiles(s) {
  const w = s.w, sp = w.tiles, V = SES.view;
  const bank = sp.parts.slice();
  if (sp.m === 'letters') {
    for (let i = 0, n = sp.parts.length >= 5 ? 2 : 1; i < n; i++) bank.push(pickOne([...EXTRA_LETTERS]));
  } else {
    const have = new Set(sp.parts.map(p => p.toLowerCase()));
    bank.push(...shuffle(TOKENS).filter(t => !have.has(t)).slice(0, sp.parts.length >= 4 ? 3 : 2));
  }
  V.sp = sp;
  V.bank = shuffle(bank).map(t => ({ t, used: false }));
  V.line = [];
  $('#ses-body').innerHTML = kicker(sp.m === 'letters' ? 'Bau das Wort' : 'Bau den Ausdruck', s) + promptHTML(esc(w.de))
    + '<div class="tline" id="tline" aria-label="Deine Antwort"></div><div class="tbank" id="tbank" role="group" aria-label="Kacheln"></div>';
  drawTiles();
  setGo('Prüfen', 'btn-primary', true);
  focusBody();
}
function drawTiles() {
  const V = SES.view, lt = V.sp.m === 'letters' ? ' letter' : '';
  const hadFocus = document.activeElement && document.activeElement.classList.contains('tile');
  $('#tline').innerHTML = (V.sp.pre ? `<span class="pre" lang="en">${esc(V.sp.pre)}</span>` : '')
    + V.line.map(i => `<button class="tile${lt}" type="button" data-act="tile-back" data-i="${i}" lang="en" aria-label="${esc(V.bank[i].t)} zurücklegen">${esc(V.bank[i].t)}</button>`).join('');
  $('#tbank').innerHTML = V.bank.map((b, i) => b.used
    ? `<span class="tile${lt} ghost" aria-hidden="true">${esc(b.t)}</span>`
    : `<button class="tile${lt}" type="button" data-act="tile" data-i="${i}" lang="en">${esc(b.t)}</button>`).join('');
  if (SES.phase === 'ask') $('#ses-go').disabled = !V.line.length;
  if (hadFocus) { const f = $('#tbank button') || $('#tline button') || $('#ses-go'); if (f) f.focus({ preventScroll: true }); }
}
function tilePut(i) {
  if (!SES || SES.phase !== 'ask' || !SES.cur || SES.cur.t !== 'tiles') return;
  const V = SES.view, b = V.bank[i];
  if (!b || b.used) return;
  b.used = true;
  V.line.push(i);
  Sfx.play('tap');
  drawTiles();
}
function tileBack(i) {
  if (!SES || SES.phase !== 'ask' || !SES.cur || SES.cur.t !== 'tiles') return;
  const V = SES.view, k = V.line.indexOf(i);
  if (k < 0) return;
  V.line.splice(k, 1);
  V.bank[i].used = false;
  drawTiles();
}
// Tastatur: Buchstaben legen, Rücktaste nimmt den letzten zurück
function tileKey(key) {
  if (!SES || SES.phase !== 'ask' || !SES.cur || SES.cur.t !== 'tiles') return false;
  const V = SES.view;
  if (key === 'Backspace') { if (V.line.length) tileBack(V.line[V.line.length - 1]); return true; }
  if (V.sp.m !== 'letters' || key.length !== 1) return false;
  let i = V.bank.findIndex(b => !b.used && b.t === key);
  if (i < 0) i = V.bank.findIndex(b => !b.used && b.t.toLowerCase() === key.toLowerCase());
  if (i >= 0) tilePut(i);
  return true;
}
ACT.tile = el => tilePut(+el.dataset.i);
ACT['tile-back'] = el => tileBack(+el.dataset.i);

function checkTiles() {
  const s = SES.cur, V = SES.view, sp = V.sp, sep = sp.m === 'letters' ? '' : ' ';
  if (!V.line.length) return;
  const got = V.line.map(i => V.bank[i].t).join(sep);
  const ok = got === sp.target;
  $$('#ses-body button.tile').forEach(b => { b.disabled = true; });
  if (ok) {
    $('#tline').classList.add('is-right');
    judge(s, 'ok');
  } else {
    // Kachel für Kachel vergleichen: nur falsche Kacheln rot, fehlende als gestrichelte Lücke
    const unit = (c, i) => ({ c, k: c, free: false, i });
    const pre = sp.pre ? [{ c: sp.pre + ' ', k: sp.pre, free: true }] : [];
    const dx = dxAlign([...pre, ...V.line.map(i => unit(V.bank[i].t, i))], [...pre, ...sp.parts.map(c => unit(c))]).ops;
    const lt = sp.m === 'letters' ? ' letter' : '';
    $('#tline').innerHTML = (sp.pre ? `<span class="pre" lang="en">${esc(sp.pre)}</span>` : '')
      + dx.filter(o => !(o.a || o.b).free).map(o => o.a
        ? `<button class="tile${lt}${o.op === '=' ? '' : ' is-bad'}" type="button" disabled lang="en">${esc(o.a.c)}</button>`
        : `<span class="tile${lt} tile-gap" aria-hidden="true"></span>`).join('');
    $('#tline').classList.add('is-checked');
    judge(s, 'bad', { dx, sep });
  }
  $('#ses-go').focus({ preventScroll: true });
}

// Selbst schreiben (auch als Lückensatz)
function renderType(s) {
  const w = s.w;
  let html;
  if (s.t === 'gapt') {
    const g = w.gap;
    html = kicker('Ergänze den Satz', s) + `<div class="gap-sent" lang="en">${esc(g.before)}<input class="gap-in" id="ans" data-in="ans" type="text" lang="en" style="width:${Math.max(5, g.word.length + 2)}ch" ${INPUT_ATTRS} aria-label="Fehlendes Wort">${esc(g.after)}</div>`
      + `<p class="gap-de">Gesucht: <b>${esc(w.de)}</b></p>`;
  } else {
    html = kicker('Schreib auf Englisch', s) + promptHTML(esc(w.de))
      + `<div class="type-wrap"><input class="type-in" id="ans" data-in="ans" type="text" lang="en" ${INPUT_ATTRS} placeholder="Auf Englisch …" aria-label="Deine Antwort auf Englisch"></div>`;
  }
  html += `<div class="type-tools"><button class="btn btn-ghost btn-sm" type="button" data-act="hint">${icon('lightbulb')}Tipp</button><span class="hint-line" id="hint-line" aria-live="polite"></span></div>`
    + '<p class="retry-msg" id="retry-msg" hidden></p>';
  if (w.hasSb && s.t === 'type') html += '<p class="ph-note">„sb“ (somebody) und „sth“ (something) musst du nicht mittippen.</p>';
  $('#ses-body').innerHTML = html;
  setGo('Prüfen', 'btn-primary', true);
  $('#ans').focus({ preventScroll: true });
}
INP.ans = el => { if (SES && SES.phase === 'ask') $('#ses-go').disabled = !el.value.trim(); };

// Tipp: erste Buchstaben zeigen (zählt dann nur als „erkannt“)
function hintHTML(txt) {
  const toks = txt.split(' ');
  return toks.map((t, k) => {
    if (/^(sb|sth|sb\/sth)$/.test(t) || (k === 0 && toks.length > 1 && /^to$/i.test(t))) return `<span class="hw">${esc(t)}</span>`;
    let first = true;
    const cs = [...t].map(c => { if (!/[A-Za-z]/.test(c)) return esc(c); if (first) { first = false; return esc(c); } return '_'; });
    return `<span class="hw">${cs.join(' ')}</span>`;
  }).join('');
}
ACT.hint = el => {
  if (!SES || SES.phase !== 'ask' || !SES.cur) return;
  const s = SES.cur, V = SES.view;
  if (V.hinted || (s.t !== 'type' && s.t !== 'gapt')) return;
  V.hinted = true;
  el.disabled = true;
  $('#hint-line').innerHTML = hintHTML(s.t === 'gapt' ? s.w.gap.word : s.w.plain);
  const inp = $('#ans');
  if (inp) inp.focus({ preventScroll: true });
};

function checkTyped() {
  const s = SES.cur, w = s.w, V = SES.view;
  const inp = $('#ans');
  const raw = inp.value;
  const r = checkEn(w, raw, s.t === 'gapt' ? [canon(w.gap.word)] : null);
  if (r.res === 'empty') return;
  if (r.res === 'retry' && !V.retried) {
    V.retried = true;
    const m = $('#retry-msg');
    m.hidden = false;
    m.innerHTML = `„<span lang="en">${esc(raw.trim())}</span>“ passt auch, aber hier ist ein anderes Wort gemeint. Versuch's nochmal! Es fängt mit <b lang="en">${esc(w.plain.replace(/^to\s+/i, '')[0])}</b> an.`;
    Sfx.play('near');
    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('shake');
    inp.select();
    return;
  }
  let res = r.res === 'retry' ? 'bad' : r.res, hint = '';
  // Lücke braucht die -s-Form, getippt wurde die Grundform (marker statt markers)
  const bare = s.t === 'gapt' && w.gap.inf && r.res === 'ok' && !r.alt && normIn(w, raw) !== canon(w.gap.word);
  const dx = r.res === 'ok' && !bare ? null : spellDiff(w, raw, bare ? [w.gap.word] : [s.t === 'gapt' ? w.gap.word : w.plain, ...w.forms], s.t === 'type');
  if (bare) { res = 'near'; hint = `Das Wort stimmt! In diesen Satz passt aber <b lang="en">${esc(w.gap.word)}</b> – achte auf die Endung.`; }
  else if (res === 'ok' && r.cap) { res = 'near'; hint = `Achte auf die Großschreibung: <b lang="en">${r.cap.map(esc).join(', ')}</b>`; }
  else if (res === 'ok' && r.alt) hint = `Auch richtig! Im Buch steht <b lang="en">${esc(w.plain)}</b>.`;
  else if (res === 'ok' && r.full && s.t !== 'gapt') hint = `Im Buch: <b lang="en">${esc(w.plain)}</b>`;
  else if (res === 'ok' && r.low) hint = 'Kleiner Tipp: Englische Nomen schreibt man klein.';
  else if (res === 'near' && r.apos !== undefined) hint = 'Achte auf das Häkchen (Apostroph).';
  else if (res === 'near') hint = `Kleiner Tippfehler – schau dir ${dx ? 'die markierten Buchstaben' : 'die Schreibweise nochmal'} an.`;
  else if (r.other) hint = `„<span lang="en">${esc(r.other.plain)}</span>“ heißt ${esc(deShort(r.other))}.`;
  inp.readOnly = true;
  inp.classList.add(res === 'ok' ? 'is-right' : res === 'near' ? 'is-near' : 'is-wrong');
  if (COARSE) inp.blur();
  judge(s, res, { hint, dx });
}

// ---------- Antwort werten ----------
function judge(s, res, x = {}) {
  const w = s.w, V = SES.view;
  V.before = S.w[w.id] ? { ...S.w[w.id] } : null;
  V.combo0 = SES.combo;
  V.res = res;
  grade(w, V.hinted && s.g === 'recall' ? 'recog' : s.g, res);
  bump('a');
  let xp = 0;
  if (res === 'ok') {
    xp = V.hinted ? 6 : XP_OF[s.t] || 8;
    SES.ok++;
    SES.combo++;
    bump('ok');
    if ((s.t === 'type' || s.t === 'gapt') && !V.hinted) statInc('typed');
  } else if (res === 'near') {
    xp = 4;
    SES.near++;
  } else {
    SES.bad++;
    SES.errs++;
    SES.combo = 0;
    requeue(s);
    if (x.found) xp = 2;   // nach Fehlversuch selbst gefunden
  }
  V.xp = xp;
  addXP(xp);
  if (res === 'ok') comboZap();
  SES.best = Math.max(SES.best, SES.combo);
  statMax('combo', SES.combo);
  SES.done++;
  commit();
  showFeedback(s, res, x);
  renderBar();
  renderMeta(res === 'ok');
}

// Falsch? Dann kommt das Wort 3–5 Aufgaben später nochmal (höchstens zweimal)
function requeue(s) {
  const w = s.w, n = SES.req[w.id] || 0;
  if (n >= 2) return;
  SES.req[w.id] = n + 1;
  const r = s.g === 'recall' ? stepRecall(w, true) : { t: s.t, w, g: s.g };
  r.again = true;
  SES.q.splice(Math.min(SES.q.length, 2 + rnd(3)), 0, r);
  SES.view.req = r;
}

function showFeedback(s, res, x = {}) {
  const w = s.w, V = SES.view;
  SES.phase = 'fb';
  const cls = res === 'ok' ? 'ok' : res === 'near' || x.found ? 'near' : 'bad';
  setFoot(cls);
  const head = x.over ? 'Okay, zählt!' : res === 'ok' ? pickOne(PRAISE) : res === 'near' ? 'Fast richtig!'
    : x.found ? 'Gefunden!' : res === 'miss' ? 'Merk es dir:' : 'Nicht ganz.';
  const mood = res === 'ok' ? 'happy' : cls === 'near' ? 'wow' : 'sad';
  const shown = s.t === 'gapt' || s.t === 'gapc' ? w.gap.word : w.plain;
  const hints = [];
  if (x.hint) hints.push(x.hint);
  if (w.no) hints.push(`<b>Merke:</b> ${esc(w.no)}`);
  const dx = res !== 'ok' && x.dx;
  $('#ses-fb').innerHTML = `<div class="fb-head">${fox(mood)}<span>${head}</span>${V.xp ? `<span class="fb-xp">+${V.xp} XP</span>` : ''}</div>
    ${dx ? `<p class="fb-ans fb-you">Du: <b lang="en" class="dx">${dxHTML(dx, 'you', x.sep)}</b></p>` : ''}
    <div class="fb-row"><p class="fb-ans">${res === 'ok' || x.found ? '' : 'Richtig: '}<b lang="en"${dx ? ' class="dx"' : ''}>${dx ? dxHTML(dx, 'fix', x.sep) : esc(shown)}</b> = ${esc(deShort(w))}</p>${sayBtn(w)}</div>
    ${hints.map(h => `<p class="fb-hint">${h}</p>`).join('')}`;
  V.canOver = (s.t === 'type' || s.t === 'gapt') && (res === 'bad' || res === 'near') && !x.over;
  setSkip(V.canOver ? 'Ich hatte recht' : '');
  setGo(`Weiter ${icon('arrow-right')}`, res === 'ok' ? 'btn-good' : cls === 'near' ? 'btn-near' : 'btn-bad');
  if (res === 'ok') autoNext(hints.length ? AUTO_HINT_MS : V.zap ? ZAP_MS - 300 : AUTO_MS);
  if (!x.over) Sfx.play(res === 'ok' ? 'ok' : cls === 'near' ? 'near' : 'bad');
  autoSay(w, 200);
}

// Korrektur zeigen: „you“ = Eingabe mit falschen Buchstaben rot und Lücken, wo etwas fehlt;
// „fix“ = richtiges Wort, die korrigierten Buchstaben grün
// sep = ' ' bei Wort-Kacheln: Leerzeichen zwischen den Wörtern, jedes Wort eigens markiert
function dxHTML(ops, side, sep = '') {
  let html = '', run = '', cls = '', n = 0;
  const flush = () => { if (run) html += cls ? `<mark class="${cls}">${run}</mark>` : run; run = ''; };
  const space = () => { if (sep && n++) { flush(); html += sep; } };
  const put = (c, k, free) => { if (!free) space(); if (k !== cls) { flush(); cls = k; } run += esc(c); };
  for (const o of ops) {
    if (side === 'you') {
      if (o.op !== '+') put(o.a.c, o.op === '=' || o.a.free ? '' : 'dx-bad', o.a.free);
      else if (!o.b.free) { space(); flush(); html += '<span class="dx-gap" aria-hidden="true"></span>'; }
    } else if (o.op !== '-') put(o.b.c, o.op === '=' || o.b.free ? '' : 'dx-fix', o.b.free);
  }
  flush();
  return html;
}

// Richtig? Dann geht es nach kurzer Pause von selbst weiter (mit Hinweis länger).
// Bei Fehlern wartet die Übung auf „Weiter“, damit die Korrektur gelesen wird.
// Nach einer Blitz-Feier etwas länger, damit sie nicht über der nächsten Aufgabe liegt.
const AUTO_MS = 1100, AUTO_HINT_MS = 2400, AUTO_MAX = 4500, ZAP_MS = 2000;
function autoNext(ms) {
  const V = SES.view, go = $('#ses-go'), t0 = performance.now();
  go.style.setProperty('--auto', ms + 'ms');
  go.classList.add('is-auto');
  const tick = () => {
    V.auto = 0;
    if (!SES || SES.view !== V || SES.phase !== 'fb') return;
    // Fenster offen oder das Wort wird noch vorgelesen: kurz warten
    if (Modal.open || (TTS.busy() && performance.now() - t0 < AUTO_MAX)) { V.auto = setTimeout(tick, 150); return; }
    nextStep();
  };
  V.auto = setTimeout(tick, ms);
}
function stopAuto() {
  const V = SES && SES.view;
  if (V && V.auto) { clearTimeout(V.auto); V.auto = 0; }
  $('#ses-go').classList.remove('is-auto');
}
// Wer auf Anhören tippt, will in Ruhe zuhören – dann bleibt „Weiter“ stehen.
$('#session').addEventListener('click', e => {
  if (SES && SES.phase === 'fb' && e.target.closest('[data-act="say"], [data-act="say-ex"]')) stopAuto();
});

// „Ich hatte recht“: Bewertung zurücknehmen und als richtig zählen
function overrule() {
  const s = SES.cur, V = SES.view, w = s.w;
  if (!V.canOver) return;
  if (V.before) S.w[w.id] = V.before; else delete S.w[w.id];
  grade(w, V.hinted ? 'recog' : s.g, 'ok');
  if (V.res === 'near') SES.near--; else { SES.bad--; SES.errs--; }
  SES.ok++;
  bump('ok');
  const gain = (V.hinted ? 6 : XP_OF[s.t]) - V.xp;
  bump('fx');
  addXP(gain);
  V.xp += gain;
  if (!V.hinted) statInc('typed');
  SES.combo = V.combo0 + 1;
  SES.best = Math.max(SES.best, SES.combo);
  statMax('combo', SES.combo);
  comboZap();
  if (V.req) {
    const i = SES.q.indexOf(V.req);
    if (i >= 0) { SES.q.splice(i, 1); SES.req[w.id]--; }
    V.req = null;
  }
  V.res = 'ok';
  const inp = $('#ans');
  if (inp) { inp.classList.remove('is-wrong', 'is-near'); inp.classList.add('is-right'); }
  commit();
  showFeedback(s, 'ok', { over: true });
  Sfx.play('ok');
  renderBar();
  renderMeta(true);
  $('#ses-go').focus({ preventScroll: true });
}

// ---------- Hauptknopf und „Weiß ich nicht“ ----------
function sesGo() {
  if (!SES || Modal.open || $('#ses-go').disabled) return;
  if (SES.kind === 'test') { testGo(); return; }
  if (SES.kind === 'blitz') { blitzGo(); return; }
  if (SES.phase === 'end') { closeSession(); return; }
  if (SES.phase === 'fb') { nextStep(); return; }
  if (performance.now() - SES.shownAt < 250) return;   // Doppelklick überspringt nichts
  const t = SES.cur.t;
  if (t === 'intro') introDone();
  else if (t === 'tiles') checkTiles();
  else if (t === 'type' || t === 'gapt') checkTyped();
  else if (t === 'speak') spkGo();
}

function sesSkip() {
  if (!SES || Modal.open) return;
  if (SES.kind === 'test') { testSkip(); return; }
  if (SES.kind === 'blitz') return;
  if (SES.phase === 'fb') { overrule(); return; }
  if (SES.phase !== 'ask' || !SES.cur) return;
  const s = SES.cur, V = SES.view;
  if (s.t === 'intro' || s.t === 'match') return;
  if (s.t === 'speak') { spkSkip(); return; }
  if (V.opts) markOpts(-1, V.right);
  if (V.t === 'gapc') { const g = $('#gap-slot'); g.textContent = s.w.gap.word; g.classList.add('is-right'); }
  $$('#ses-body button.tile').forEach(b => { b.disabled = true; });
  const inp = $('#ans');
  if (inp) inp.readOnly = true;
  judge(s, 'miss');
  $('#ses-go').focus({ preventScroll: true });
}

// Tasten 1–4 wählen eine Antwort
function optKey(n) {
  if (!SES) return false;
  const b = $$('#ses-body .opt')[n - 1];
  if (!b || b.disabled) return false;
  b.click();
  return true;
}

$('#ses-go').addEventListener('click', sesGo);
$('#ses-skip').addEventListener('click', sesSkip);
$('#ses-close').addEventListener('click', sesQuit);

// ---------- Ergebnis und Belohnungen ----------
function goalHTML(xp0) {
  const goal = S.set.goal || 100, xp = todayXP(), done = xp >= goal;
  const pc = v => Math.min(100, v / goal * 100).toFixed(1);
  return `<div class="goalbar${done ? ' is-done' : ''}"><div class="goalbar-top"><b>${done ? 'Tagesziel geschafft!' : 'Tagesziel'}</b><span>${fmtN(xp)} / ${fmtN(goal)} XP</span></div>
    <div class="xpbar"><i id="goal-fill" style="width:${pc(xp0)}%" data-to="${pc(xp)}"></i></div></div>`;
}
function animateGoal() {
  for (const i of [$('#goal-fill'), $('#ln-fill')]) {
    if (i) requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = i.dataset.to + '%'; }));
  }
}
// Gelernte Wörter der Aufgabe: Zahl und Balken wachsen um die neuen
function resLearnedHTML() {
  const a = curAsg();
  if (!a || SES.ln0 < 0) return '';
  const n = poolOf(a).length, k = learnedNow(), pc = v => (n ? v / n * 100 : 0).toFixed(1);
  return `<div class="res-learned">${learnedHTML(k, n, k - SES.ln0)}
    <div class="lvbar" aria-hidden="true"><i class="l4" id="ln-fill" style="width:${pc(Math.min(k, SES.ln0))}%" data-to="${pc(k)}"></i></div></div>`;
}
function resultHTML(o) {
  return `<div class="result">${fox(o.mood)}<h1>${o.title}</h1>${o.lead ? `<p class="lead">${o.lead}</p>` : ''}
    ${o.learned ? resLearnedHTML() : ''}<div class="rstats">${o.stats.map(([cls, label, ic, val]) => `<div class="rs ${cls}"><span>${label}</span><b>${icon(ic)}${val}</b></div>`).join('')}</div>
    ${talGainHTML()}${goalHTML(SES.xp0)}
    ${o.chips ? `${o.note ? `<p class="res-note">${o.note}</p>` : ''}<div class="wchips">${o.chips}</div>` : ''}</div>`;
}

function finish() {
  const secs = Math.min(1800, Math.round((Date.now() - SES.t0) / 1000));
  bump('l');
  bump('s', secs);
  const n = SES.ok + SES.near + SES.bad;
  const perfect = SES.errs === 0 && n >= 3;
  statInc('les');
  if (perfect) statInc('perf');
  addXP(15 + (perfect ? 15 : 0));
  markDay();
  commit();
  const acc = n ? Math.round(100 * (SES.ok + SES.near / 2) / n) : 100;
  $('#ses-body').innerHTML = resultHTML({
    mood: acc >= 60 ? 'happy' : '', title: RES_TITLE[SES.kind] || 'Geschafft!', learned: true,
    lead: perfect ? '<b>Fehlerfrei! +15 XP</b>' : '',
    stats: [['rs-xp', 'XP', 'zap', '+' + fmtN(SES.xp)], ['rs-acc', 'Richtig', 'target', acc + ' %'], ['rs-time', 'Zeit', 'clock', fmtTime(secs)]],
    chips: SES.list.slice(0, 12).map(w => `<span class="wchip" lang="en">${esc(w.plain)}</span>`).join(''),
  });
  showEnd(true);
}

function showEnd(win) {
  SES.phase = 'end';
  SES.cur = null;
  setFoot('');
  $('#ses-fb').innerHTML = '';
  setSkip('');
  setGo(`Weiter ${icon('arrow-right')}`);
  $('#ses-meta').innerHTML = '';
  $('#ses-foot').hidden = false;
  renderBar(1);
  $('#ses-scroll').scrollTop = 0;
  animateGoal();
  if (win) { Sfx.play('win'); confetti(); }
  rewardModals();
  $('#ses-go').focus({ preventScroll: true });
}

const modalBtn = label => `<div class="modal-btns"><button class="btn btn-primary" type="button" data-act="modal-close" autofocus>${label}</button></div>`;
function badgeModals() {
  const got = checkBadges();
  if (got.length) commit();
  return got.map(b => [`<div class="kicker">Neues Abzeichen</div><div class="medal" style="--bc:${b.c}">${icon(b.ic)}</div>
    <h2 id="modal-title">${esc(b.n)}</h2><p>${esc(b.d)}</p>${modalBtn('Juhu!')}`]);
}
// Serie, Tagesziel, Abzeichen, Level – nacheinander
function rewardModals() {
  const out = [];
  const st = streakInfo();
  if (SES.first && st.todayDone && st.n > 0) {
    out.push([`<div class="modal-art-flame">${icon('flame', 'ic-fill')}</div><div class="modal-num">${st.n}</div>
      <h2 id="modal-title">${st.n === 1 ? 'Deine Serie startet!' : 'Tage in Folge!'}</h2>
      <p>${st.n === 1 ? 'Lern morgen wieder – dann wächst deine Flamme.' : 'Stark! Komm morgen wieder, damit deine Serie weiterläuft.'}</p>${modalBtn('Weiter')}`]);
    SES.first = false;
  }
  const goal = S.set.goal || 100;
  if (SES.xp0 < goal && todayXP() >= goal) {
    out.push([`${fox('happy')}<h2 id="modal-title">Tagesziel geschafft!</h2><p>${fmtN(todayXP())} XP heute – richtig stark!</p>${modalBtn('Super!')}`]);
  }
  out.push(...badgeModals());
  const L = levelInfo();
  if (L.L > SES.L0) {
    out.push([`${fox('wow')}<div class="kicker">Level-Aufstieg</div><h2 id="modal-title">Level ${L.L}!</h2><p>Du bist jetzt <b>${esc(L.name)}</b>.</p>${modalBtn('Weiter')}`,
      () => { Sfx.play('level'); confetti(70); }]);
    SES.L0 = L.L;
  }
  if (out.length) after(900, () => out.forEach(([html, onShow]) => Modal.show(html, { onShow })));
}

// ---------- Startknöpfe ----------
ACT.review = () => {
  if (SES) return;
  const list = dueWords(sesPool());
  if (!list.length) { toast(`${icon('check')} Gerade ist nichts fällig – lern eine neue Station!`); Sfx.play('near'); return; }
  startSession('review', { words: list });
};
ACT.strengthen = () => {
  if (SES) return;
  const list = weakWords(sesPool());
  if (!list.length) { toast('Lern erst eine Station – dann kannst du festigen.'); Sfx.play('near'); return; }
  startSession('strengthen', { words: list });
};
ACT.oops = () => {
  if (SES) return;
  const list = oopsWords(sesPool());
  if (!list.length) { toast(`${icon('sparkles')} Keine Fehlerwörter – stark!`); Sfx.play('near'); return; }
  startSession('oops', { words: list });
};
ACT.blitz = () => startBlitz();
ACT['test-setup'] = () => startTest();

// ======================= Blitz-Runde =======================
function startBlitz() {
  if (SES) return;
  const pool = sesPool();
  const list = knownWords(pool);
  if (list.length < 4) { toast(`${icon('zap')} Lern erst ein paar Wörter – dann kannst du blitzen!`); Sfx.play('near'); return; }
  SES = newSes('blitz', { phase: 'ready', list, pool, score: 0, mult: 1, run: 0, last: [], missed: new Map(), tick: 0, end: 0 });
  openSession();
  $('#ses-body').innerHTML = `<div class="t-setup">${fox('wow')}<h1>Blitz-Runde</h1>
    <p class="lead">60 Sekunden. So viele wie möglich!</p></div>`;
  $('#ses-meta').innerHTML = '<span class="timer" id="bz-time">1:00</span>';
  setGo(`Los! ${icon('zap')}`);
  setSkip('');
  renderBar(1);
  $('#ses-go').focus({ preventScroll: true });
}
function blitzGo() {
  if (SES.phase === 'ready') blitzBegin();
  else if (SES.phase === 'end') closeSession();
}
function blitzBegin() {
  SES.phase = 'q';
  SES.t0 = Date.now();
  SES.end = performance.now() + 60000;
  $('#ses-foot').hidden = true;
  SES.tick = setInterval(blitzTick, 200);
  blitzNext();
  blitzTick();
  focusBody();
}
function blitzNext() {
  const V = SES.view = {};
  let w;
  do { w = pickOne(SES.list); } while (SES.list.length > 4 && SES.last.includes(w));
  SES.last.push(w);
  if (SES.last.length > 3) SES.last.shift();
  const en = Math.random() < 0.5;   // en: englisches Wort, deutsche Antworten
  let opts = [w, ...distract(w, 3, SES.pool, en ? 'de' : 'en')].map(o => ({ x: en ? deShort(o) : o.plain, w: o }));
  const seen = new Set();
  opts = opts.filter(o => { const k = o.x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  V.w = w;
  V.opts = shuffle(opts);
  V.right = V.opts.indexOf(opts[0]);
  const pop = SES.multPop;
  SES.multPop = false;
  $('#ses-body').innerHTML = `<div class="blitz-score"><div class="bz-n"><b id="bz-score">${SES.score}</b><span>richtig</span></div><em class="mult${pop ? ' pop' : ''}" id="bz-mult" aria-label="Multiplikator ${SES.mult}">×${SES.mult}</em></div>
    <div class="blitz-q"><div class="prompt-text${en ? ' en' : ''}"${en ? ' lang="en"' : ''}>${esc(en ? w.plain : deShort(w))}</div><span class="prompt-sub">${en ? 'Was heißt das auf Deutsch?' : 'Was heißt das auf Englisch?'}</span></div>
    <div class="opts grid4" role="group" aria-label="Antworten">${V.opts.map((o, k) => `<button class="opt${en ? '' : ' en-opt'}" type="button" data-act="opt" data-k="${k}"${en ? '' : ' lang="en"'}><span class="num" aria-hidden="true">${k + 1}</span><span>${esc(o.x)}</span></button>`).join('')}</div>`;
}
function blitzPick(k) {
  if (SES.phase !== 'q' || SES.lock) return;
  const V = SES.view, w = V.w, ok = k === V.right;
  SES.lock = true;
  markOpts(k, V.right);
  bump('a');
  if (ok) {
    SES.score++;
    SES.run++;
    SES.ok++;
    bump('ok');
    const m = Math.min(4, 1 + Math.floor(SES.run / 4));
    if (m > SES.mult) { SES.mult = m; SES.multPop = true; Sfx.play('combo'); } else Sfx.play('ok');
    addXP(1 + SES.mult);
    grade(w, 'recog', 'ok');
    SES.best = Math.max(SES.best, SES.run);
  } else {
    SES.run = 0;
    SES.mult = 1;
    SES.bad++;
    SES.missed.set(w.id, w);
    Sfx.play('bad');
  }
  $('#bz-score').textContent = SES.score;
  after(ok ? 320 : 850, () => {
    if (!SES || SES.kind !== 'blitz' || SES.phase !== 'q') return;
    SES.lock = false;
    blitzNext();
  });
}
function blitzTick() {
  if (!SES || SES.kind !== 'blitz' || SES.phase !== 'q') return;
  const rem = Math.max(0, SES.end - performance.now());
  const sec = Math.ceil(rem / 1000);
  const el = $('#bz-time');
  if (el && el.textContent !== fmtTime(sec)) {
    el.textContent = fmtTime(sec);
    el.classList.toggle('is-low', sec <= 10);
    if (sec <= 5 && sec > 0) Sfx.play('tick');
  }
  renderBar(rem / 60000);
  if (rem <= 0) blitzEnd();
}
function blitzEnd() {
  clearInterval(SES.tick);
  SES.tick = 0;
  bump('l');
  bump('s', 60);
  const prev = S.st.blitz || 0;
  talBlitz();
  statMax('blitz', SES.score);
  statMax('combo', SES.best);
  markDay();
  commit();
  const n = SES.ok + SES.bad;
  const missed = [...SES.missed.values()];
  $('#ses-body').innerHTML = resultHTML({
    mood: SES.score ? 'happy' : '',
    title: SES.score ? `${SES.score} richtig!` : 'Zeit um!',
    lead: SES.score > prev ? '<b>Neuer Rekord!</b>' : `Rekord: ${prev}`,
    stats: [['rs-xp', 'XP', 'zap', '+' + fmtN(SES.xp)], ['rs-acc', 'Richtig', 'target', (n ? Math.round(100 * SES.ok / n) : 0) + ' %'], ['rs-time', 'Serie', 'flame', SES.best]],
    note: missed.length ? 'Knifflig:' : '',
    chips: missed.slice(0, 10).map(w => `<span class="wchip"><span lang="en">${esc(w.plain)}</span> <span class="de">· ${esc(deShort(w))}</span></span>`).join(''),
  });
  showEnd(SES.score > 0);
}

// ======================= Probetest =======================
function startTest() {
  if (SES) return;
  const a = curAsg();
  if (!a) { toast('Wähl zuerst deine Seiten!'); go('picker'); return; }
  const list = poolOf(a).filter(w => w.typable);
  if (!list.length) { toast('Auf diesen Seiten gibt es keine Wörter zum Testen.'); return; }
  SES = newSes('test', { phase: 'setup', a, list, tn: Math.min(10, list.length), tdir: 'de', items: [], qi: 0, txp: 0, pts: 0, rec: null });
  openSession();
  renderTestSetup();
}
function renderTestSetup() {
  const N = SES.list.length;
  const chip = (act, v, label, on) => `<button class="chip" type="button" data-act="${act}" data-v="${v}" aria-pressed="${on}">${label}</button>`;
  const ns = [10, 20, 30].filter(x => x < N).map(x => chip('t-n', x, String(x), SES.tn === x)).join('') + chip('t-n', N, `Alle ${N}`, SES.tn === N);
  $('#ses-body').innerHTML = `<div class="t-setup">${fox('happy')}<h1>Probetest</h1>
    <p class="lead">Ohne Tipps – mit Note.</p>
    <div class="card t-card">
      <div><span class="lbl" id="t-n-l">Wie viele Wörter?</span><div class="optrow" role="group" aria-labelledby="t-n-l">${ns}</div></div>
      <div><span class="lbl" id="t-d-l">Richtung</span><div class="optrow" role="group" aria-labelledby="t-d-l">${chip('t-dir', 'de', 'Deutsch → Englisch', SES.tdir === 'de')}${chip('t-dir', 'mix', 'Gemischt', SES.tdir === 'mix')}</div></div>
    </div></div>`;
  setGo(`Test starten ${icon('arrow-right')}`);
  setSkip('');
}
ACT['t-n'] = el => { if (SES && SES.kind === 'test' && SES.phase === 'setup') { SES.tn = +el.dataset.v; Sfx.play('tap'); renderTestSetup(); } };
ACT['t-dir'] = el => { if (SES && SES.kind === 'test' && SES.phase === 'setup') { SES.tdir = el.dataset.v; Sfx.play('tap'); renderTestSetup(); } };

function testBegin() {
  const list = shuffle(SES.list).slice(0, SES.tn);
  const nEn = SES.tdir === 'mix' ? Math.round(list.length / 3) : 0;
  const dirs = shuffle(list.map((w, i) => i < nEn ? 'en' : 'de'));
  SES.items = list.map((w, i) => ({ w, dir: dirs[i], ans: '', pts: 0 }));
  SES.qi = 0;
  SES.phase = 'q';
  SES.t0 = Date.now();
  renderTestQ();
}
function renderTestQ() {
  const it = SES.items[SES.qi], w = it.w, n = SES.items.length, en = it.dir === 'en';
  $('#ses-body').innerHTML = `<p class="t-num">Frage ${SES.qi + 1} von ${n}</p>`
    + promptHTML(esc(en ? w.plain : w.de), { en, w: en ? w : null, sub: en ? 'Schreib es auf Deutsch' : 'Schreib es auf Englisch' })
    + `<div class="type-wrap"><input class="type-in" id="t-in" type="text" lang="${en ? 'de' : 'en'}" ${INPUT_ATTRS} placeholder="${en ? 'Auf Deutsch …' : 'Auf Englisch …'}" aria-label="Deine Antwort"></div>`
    + (w.hasSb && !en ? '<p class="ph-note">„sb“ und „sth“ musst du nicht mittippen.</p>' : '');
  setGo(SES.qi === n - 1 ? `Abgeben ${icon('check')}` : `Weiter ${icon('arrow-right')}`);
  setSkip('Weiß ich nicht');
  renderBar(SES.qi / n);
  $('#ses-scroll').scrollTop = 0;
  $('#t-in').focus({ preventScroll: true });
}
function testGo() {
  if (SES.phase === 'setup') testBegin();
  else if (SES.phase === 'q') testNext($('#t-in').value);
  else if (SES.phase === 'end') closeSession();
}
function testSkip() {
  if (SES.phase === 'q') testNext('');
  else if (SES.phase === 'end') testPractice();
}
function testNext(v) {
  SES.items[SES.qi].ans = String(v).trim();
  SES.qi++;
  Sfx.play('tap');
  if (SES.qi < SES.items.length) renderTestQ(); else testEnd();
}

// Neue Wörter zählen nur, wenn sie richtig waren; bekannte werden normal bewertet
function gradeTestItem(it) {
  const w = it.w, b = it.before ? it.before.b : 0;
  if (b === 0) {
    if (it.pts === 1) { grade(w, 'intro'); grade(w, 'recall', 'ok'); }
    return;
  }
  grade(w, 'recall', it.pts === 1 ? 'ok' : it.pts > 0 ? 'near' : 'bad');
}
function testScore() {
  const items = SES.items, n = items.length;
  const pts = sum(items.map(it => it.pts));
  const p = Math.round(pts / n * 100);
  const g = gradeOf(p);
  Object.assign(SES.rec, { p, g, m: Date.now() });
  if (g === 1 && !SES.g1) { SES.g1 = true; statInc('g1'); }
  const xp = Math.round(5 * pts) + GRADE_BONUS[g];
  addXP(xp - SES.txp);
  SES.txp = xp;
  SES.pts = pts;
  commit();
}
function testEnd() {
  for (const it of SES.items) {
    const r = it.dir === 'en' ? checkDe(it.w, it.ans) : checkEn(it.w, it.ans);
    it.r = r;
    it.pts = r.res === 'ok' ? (r.cap ? 0.5 : 1) : r.res === 'retry' ? 1 : r.res === 'near' ? 0.5 : 0;
    it.before = S.w[it.w.id] ? { ...S.w[it.w.id] } : null;
    gradeTestItem(it);
  }
  bump('l');
  bump('s', Math.min(3600, Math.round((Date.now() - SES.t0) / 1000)));
  bump('a', SES.items.length);
  bump('ok', SES.items.filter(it => it.pts === 1).length);
  statInc('tests');
  markDay();
  const now = Date.now();
  SES.rec = { id: 't' + now, a: now, from: SES.a.from, to: SES.a.to, n: SES.items.length, p: 0, g: 6, m: now };
  S.tests.push(SES.rec);
  testScore();
  renderTestRes(false);
  showEnd(SES.rec.g <= 4);
  testButtons();
}
function testButtons() {
  setSkip(SES.items.some(it => it.pts < 1) ? 'Fehler üben' : '', 'btn-ghost');
  setGo(`Fertig ${icon('check')}`);
}
function renderTestRes(keep) {
  const items = SES.items, n = items.length, g = SES.rec.g;
  const sc = $('#ses-scroll').scrollTop;
  const rows = items.map((it, k) => {
    const w = it.w, en = it.dir === 'en';
    const cls = it.pts === 1 ? 'ok' : it.pts > 0 ? 'near' : 'bad';
    const want = esc(en ? w.de : w.plain), lang = en ? '' : ' lang="en"';
    let a;
    if (cls === 'ok') {
      a = `<b${lang}>${esc(it.ans) || want}</b>`;
      if (it.over) a += ' · von dir korrigiert';
      else if (it.r && (it.r.full || it.r.alt) && !en) a += ` · im Buch: <b lang="en">${want}</b>`;
    } else {
      a = `${it.ans ? `<s${lang}>${esc(it.ans)}</s>` : 'keine Antwort'} → <b${lang}>${want}</b>${cls === 'near' ? ' · halber Punkt' : ''}`;
    }
    return `<div class="t-item ${cls}"><span class="st">${icon(cls === 'ok' ? 'check' : cls === 'near' ? 'minus' : 'x')}</span>
      <div><p class="q"${en ? ' lang="en"' : ''}>${esc(en ? w.plain : w.de)}</p><p class="a">${a}</p>
      ${cls !== 'ok' && it.ans ? `<button class="link" type="button" data-act="t-fix" data-k="${k}">Ich hatte recht</button>` : ''}</div></div>`;
  }).join('');
  $('#ses-body').innerHTML = `<div class="grade-hero">
      <div class="grade-big" style="--gc:${GRADE_C[g]}"><small>Note</small><b>${g}</b></div>
      <h1>${GRADE_TXT[g]}</h1>
      <p class="lead">${String(SES.pts).replace('.', ',')} von ${n} Punkten · ${SES.rec.p} % · +${fmtN(SES.txp)} XP</p>
      ${g >= 4 ? "<p class=\"lead\">Üb die roten Wörter nochmal – dann klappt's im echten Test!</p>" : ''}
    </div>
    ${talGainHTML()}${goalHTML(SES.xp0)}
    <div class="section-title"><h2>Deine Antworten</h2><span class="kicker">${items.filter(it => it.pts === 1).length} von ${n} richtig</span></div>
    <div class="t-review">${rows}</div>`;
  if (keep) $('#ses-scroll').scrollTop = sc;
}
ACT['t-fix'] = el => {
  if (!SES || SES.kind !== 'test' || SES.phase !== 'end') return;
  const it = SES.items[+el.dataset.k];
  if (!it || it.pts === 1 || !it.ans) return;
  if (it.before) S.w[it.w.id] = { ...it.before }; else delete S.w[it.w.id];
  it.pts = 1;
  it.over = true;
  gradeTestItem(it);
  bump('ok');
  bump('fx');
  testScore();
  renderTestRes(true);
  animateGoal();
  testButtons();
  Sfx.play('ok');
  rewardModals();
};
function testPractice() {
  const list = SES.items.filter(it => it.pts < 1).map(it => it.w).slice(0, 12);
  closeSession();
  if (list.length) startSession('oops', { words: list });
}
</script>
<script>
/* Wortfuchs – Sprechen: ein Wort oder einen Beispielsatz laut vorlesen, die Spracherkennung
   des Browsers hört zu (Chrome, Edge, Safari auf iPad/iPhone/Mac). Wo sie fehlt oder das Mikrofon
   gesperrt ist (Firefox, claude.ai-Viewer), gibt es keine Sprech-Aufgaben. Baut auf ueben.js auf. */
'use strict';

ICONS.mic = '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/>';

const SPK_XP = 10, SPK_TRIES = 3, SPK_PAUSE = 15 * 60e3;
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
// Darf diese Seite das Mikrofon benutzen? In einem fremden Rahmen (claude.ai) meist nicht.
const SPK_ALLOWED = (() => {
  try {
    const p = document.permissionsPolicy || document.featurePolicy;
    return p ? p.allowsFeature('microphone') : window.top === window;
  } catch (e) { return false; }
})();
// rec = laufende Erkennung, until = „Jetzt nicht sprechen“ bis dahin, dead = geht hier nicht (bis zum Neuladen)
const SPK = { rec: null, until: 0, dead: false };
const spkOk = () => !!SpeechRec && SPK_ALLOWED && !SPK.dead;
const spkOn = () => spkOk() && S.set.spk !== false && Date.now() > SPK.until;

// ---------- Was gesagt werden soll ----------
// Das Wort selbst – ohne sb/sth, „…“ oder „/“ – oder der Beispielsatz, wenn er kurz ist
function spkTargets(w) {
  const out = [];
  const p = w.plain.replace(APOS, "'");
  if (p.length <= 40 && !/[…/()]|\.\.\.|\b(sb|sth)\b/.test(p)) out.push({ say: p, ex: false });
  const ex = w.ex && w.ex.replace(APOS, "'");
  if (ex && ex.length <= 70 && ex.split(' ').length <= 10 && !/[…/()–—]|\.\.\./.test(ex)) out.push({ say: ex, ex: true });
  return out;
}

// Sprech-Aufgaben in eine geplante Übung mischen: bei neuen Stationen 2, sonst 1–2,
// jeweils zwei Schritte nach dem ersten Auftritt des Wortes (in der Station: nach Kennenlernen und Erkennen)
function spkPlan(steps, kind) {
  if (!spkOn() || !steps.length) return steps;
  const first = new Map();
  steps.forEach((s, i) => { if (s.w && !first.has(s.w)) first.set(s.w, i); });
  const words = shuffle([...first.keys()].filter(w => spkTargets(w).length));
  const n = kind === 'lesson' || steps.length >= 10 ? 2 : 1;
  const add = words.slice(0, n).map(w => {
    const c = spkTargets(w), tg = c.length > 1 && Math.random() < 0.5 ? c[1] : c[0];
    return { at: first.get(w) + 2, s: { t: 'speak', w, g: 'recog', say: tg.say, ex: tg.ex } };
  });
  const out = steps.slice();
  for (const a of add.sort((x, y) => y.at - x.at)) out.splice(Math.min(a.at, out.length), 0, a.s);
  return out;
}

// ---------- Vergleichen ----------
// Kurzformen ausschreiben, Zahlen als Wort, gleich klingende Wörter zusammenlegen –
// so zählt „it is“ für „it's“, „11“ für „eleven“ und „hare“ für „hair“
const SPK_NUM = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty'.split(' ');
const SPK_TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
const spkNum = n => n <= 20 ? SPK_NUM[n] : n < 100 ? SPK_TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + SPK_NUM[n % 10] : '') : String(n);
const SPK_SAME = new Map();
for (const g of ['to too two', 'for four', 'right write', 'hair hare', 'sea see', 'son sun', 'there their', 'no know',
  'one won', 'by buy bye', 'eight ate', 'hour our', 'wear where', 'week weak', 'meet meat', 'new knew', 'piece peace',
  'blue blew', 'hear here', 'which witch', 'night knight', 'wait weight', 'pair pear', 'whole hole', 'mum mom mam',
  'okay ok', 'grey gray', 'mr mister', 'mrs missus', 'flour flower', 'tail tale', 'sail sale', 'road rode', 'red read', 'be bee'])
  for (const x of g.split(' ')) SPK_SAME.set(x, g.split(' ')[0]);
function spkToks(s) {
  return String(s).toLowerCase().replace(APOS, "'")
    .replace(/\bcan't\b|\bcannot\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/\blet's\b/g, 'let us')
    .replace(/n't\b/g, ' not').replace(/'re\b/g, ' are').replace(/'m\b/g, ' am').replace(/'ll\b/g, ' will')
    .replace(/'ve\b/g, ' have').replace(/'d\b/g, ' would').replace(/'s\b/g, ' is')
    .replace(/\d+/g, d => ' ' + spkNum(+d) + ' ')
    .replace(/[^a-z' ]+/g, ' ').replace(/'/g, '')
    .split(' ').filter(Boolean).map(t => SPK_SAME.get(t) || t);
}
// Gleiches Wort? Kurze Wörter genau, längere mit 1–2 Abweichungen (favorite ≈ favourite)
const spkSame = (a, b) => a === b || (a.length >= 4 && osa(a, b) <= (a.length >= 7 ? 2 : 1));

// Welche Wörter des Ziels kamen in der richtigen Reihenfolge vor? (längste gemeinsame Folge)
function spkMatch(want, heard) {
  const m = want.length, n = heard.length, d = [];
  for (let i = 0; i <= m; i++) d[i] = new Array(n + 1).fill(0);
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = spkSame(want[i - 1], heard[j - 1]) ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
  const hit = new Array(m).fill(false);
  for (let i = m, j = n; i && j;) {
    if (spkSame(want[i - 1], heard[j - 1]) && d[i][j] === d[i - 1][j - 1] + 1) { hit[i - 1] = true; i--; j--; }
    else if (d[i - 1][j] >= d[i][j - 1]) i--; else j--;
  }
  return hit;
}

// Locker werten: Beim Wort zählen to/a/an/the vorne nicht; bis 2 Wörter müssen alle passen, sonst 70 %.
// alts = alle Vorschläge der Erkennung; der beste zählt. Ergebnis {ok, hit, heard}
function spkJudge(s, alts) {
  const want = spkToks(s.say);
  const skip = s.ex ? 0 : (want.length > 1 && /^(to|a|an|the)$/.test(want[0]) ? 1 : 0);
  let best = null;
  for (const a of alts) {
    const hit = spkMatch(want, spkToks(a));
    const core = hit.slice(skip), got = core.filter(Boolean).length;
    const ok = core.length <= 2 ? got === core.length : got / core.length >= 0.7;
    const sc = got / Math.max(1, core.length) + (ok ? 1 : 0);
    if (!best || sc > best.sc) best = { ok, hit, heard: a, sc };
  }
  return best || { ok: false, hit: want.map(() => false), heard: '', sc: 0 };
}

// ---------- Anzeigen ----------
// Zieltext; nach einem Versuch sind die nicht verstandenen Wörter markiert
function spkTextHTML(s, hit) {
  const keys = s.ex && s.w.gap ? new Set(s.w.gap.word.toLowerCase().split(/\s+/)) : null;
  let k = 0;
  return s.say.split(' ').map(part => {
    const n = spkToks(part).length;
    const miss = hit && n && hit.slice(k, k + n).some(h => !h);
    k += n;
    const key = keys && keys.has(part.replace(/[^A-Za-z']/g, '').toLowerCase());
    return miss ? `<mark class="spk-miss">${esc(part)}</mark>` : key ? `<b>${esc(part)}</b>` : esc(part);
  }).join(' ');
}

function renderSpeak(s) {
  const w = s.w, V = SES.view;
  V.t = 'speak';
  V.tries = 0;
  const say = TTS.ok ? `<button class="say" type="button" data-act="spk-say" aria-label="Anhören">${icon('volume')}</button>
    <button class="say" type="button" data-act="spk-say" data-slow="1" aria-label="Langsam anhören">${icon('snail')}</button>` : '';
  $('#ses-body').innerHTML = `${kicker(s.ex ? 'Lies den Satz laut vor' : 'Sag das Wort laut', s)}
    <div class="prompt">${fox('')}<div class="prompt-box"><div class="prompt-main">
      <div class="prompt-text en spk-text${s.ex ? ' is-ex' : ''}" id="spk-text" lang="en">${spkTextHTML(s)}</div>
      ${s.ex ? '' : `<span class="prompt-sub">${esc(deShort(w))}</span>`}</div><div class="spk-say">${say}</div></div></div>
    <div class="spk">
      <button class="spk-mic" type="button" id="spk-mic" data-act="spk-mic" aria-describedby="spk-status">${icon('mic')}<span>Tippe und sprich</span></button>
      <p class="spk-status" id="spk-status" aria-live="polite">${COARSE ? 'Tippe aufs Mikrofon' : 'Klick aufs Mikrofon oder drück Enter'} und sprich deutlich.</p>
    </div>`;
  setSkip('Jetzt nicht sprechen');
  setGo(`${icon('mic')}Sprechen`);
  if (canListen()) after(350, () => { if (SES && SES.cur === s && !SPK.rec) TTS.speak(speakable(s.say)); });
}
ACT['spk-say'] = el => { const s = SES && SES.cur; if (s && s.t === 'speak') { spkStop(); TTS.speak(speakable(s.say), !!el.dataset.slow); } };
ACT['spk-mic'] = () => spkGo();

function spkStatus(html, cls = '') {
  const el = $('#spk-status');
  if (el) { el.innerHTML = html; el.className = 'spk-status' + (cls ? ' ' + cls : ''); }
}
function spkListening(on) {
  const b = $('#spk-mic');
  if (b) { b.classList.toggle('is-on', on); b.querySelector('span').textContent = on ? 'Ich höre zu …' : 'Tippe und sprich'; }
  setGo(on ? `${icon('check')}Fertig` : `${icon('mic')}Sprechen`, on ? 'btn-good' : 'btn-primary');
}

// ---------- Zuhören ----------
// Mikrofon an – oder, wenn es schon läuft, fertig gesprochen
function spkGo() {
  const s = SES && SES.cur;
  if (!s || s.t !== 'speak' || SES.phase !== 'ask') return;
  if (SPK.rec) { try { SPK.rec.stop(); } catch (e) { /* schon aus */ } return; }
  TTS.stop();
  let rec;
  try { rec = new SpeechRec(); } catch (e) { spkGone('Dein Browser kann hier leider nicht zuhören.'); return; }
  rec.lang = 'en-GB';
  rec.interimResults = true;
  rec.maxAlternatives = 5;
  rec.continuous = false;
  const R = { alts: [], live: '', err: '' };
  rec.onresult = e => {
    let live = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { for (let k = 0; k < r.length; k++) R.alts.push(r[k].transcript); }
      else live += r[0].transcript;
    }
    R.live = live || R.alts[0] || R.live;
    if (SES && SES.cur === s && R.live) spkStatus(`„<span lang="en">${esc(R.live.trim())}</span>“`, 'is-live');
  };
  rec.onerror = e => { R.err = e.error || 'x'; };
  rec.onend = () => {
    clearTimeout(R.cap);
    if (SPK.rec !== rec) return;
    SPK.rec = null;
    if (!SES || SES.cur !== s || SES.phase !== 'ask') return;
    spkListening(false);
    if (!R.alts.length && R.live) R.alts.push(R.live);   // Safari liefert manchmal kein „final“
    spkHeard(s, R);
  };
  SPK.rec = rec;
  try { rec.start(); } catch (e) { SPK.rec = null; spkStatus('Mikrofon geht gerade nicht. Nochmal?', 'is-bad'); return; }
  spkListening(true);
  spkStatus('Sprich jetzt!', 'is-live');
  // Sicherheitshalber: nach spätestens 8 bzw. 12 Sekunden auswerten – und falls dann kein Ende kommt, selbst beenden
  R.cap = setTimeout(() => {
    if (SPK.rec !== rec) return;
    try { rec.stop(); } catch (e) { /* egal */ }
    R.cap = setTimeout(() => { if (SPK.rec === rec) rec.onend(); }, 1500);
  }, s.ex ? 12000 : 8000);
}

function spkStop() {
  const r = SPK.rec;
  SPK.rec = null;
  if (r) try { r.abort(); } catch (e) { /* schon aus */ }
}

function spkHeard(s, R) {
  if (R.err && !R.alts.length) {
    if (R.err === 'not-allowed' || R.err === 'service-not-allowed' || R.err === 'audio-capture')
      return spkGone(R.err === 'audio-capture' ? 'Ich finde kein Mikrofon.' : 'Das Mikrofon ist hier nicht erlaubt.');
    if (R.err === 'network') return spkGone('Die Spracherkennung braucht Internet.');
    if (R.err !== 'no-speech' && R.err !== 'aborted') return spkStatus('Hat nicht geklappt. Nochmal?', 'is-bad');
  }
  if (!R.alts.length) { spkStatus('Nichts gehört. Etwas lauter!', 'is-bad'); return; }
  const r = spkJudge(s, R.alts), V = SES.view;
  if (r.ok) { spkDone(s, 'ok', r); return; }
  V.tries++;
  $('#spk-text').innerHTML = spkTextHTML(s, r.hit);
  if (V.tries >= SPK_TRIES) { spkDone(s, 'pass', r); return; }
  Sfx.play('near');
  spkStatus(`Gehört: „<span lang="en">${esc(r.heard)}</span>“<br>Die markierten Wörter nochmal!`, 'is-bad');
}

// Mikrofon geht hier nicht: ohne Fehler weiter, keine weiteren Sprech-Aufgaben
function spkGone(msg) {
  SPK.dead = true;
  toast(`${msg} Sprech-Aufgaben sind erstmal aus.`);
  spkDrop();
}
// „Jetzt nicht sprechen“: 15 Minuten keine Sprech-Aufgaben
function spkSkip() {
  spkStop();
  SPK.until = Date.now() + SPK_PAUSE;
  toast('Okay – 15 Minuten keine Sprech-Aufgaben.');
  spkDrop();
}
function spkDrop() {
  spkStop();
  SES.q = SES.q.filter(x => x.t !== 'speak');
  SES.done++;
  nextStep();
}

// Ergebnis: ok = XP und Kombo wie eine richtige Antwort; pass = nach 3 Versuchen ohne Fehler weiter.
// Der Lernstand des Wortes bleibt unverändert – Vorlesen zeigt nicht, ob man die Bedeutung weiß.
function spkDone(s, res, r) {
  const V = SES.view;
  V.res = res;
  V.xp = 0;
  if (res === 'ok') {
    V.xp = V.tries ? 6 : SPK_XP;
    SES.ok++;
    SES.combo++;
    bump('a');
    bump('ok');
    statInc('spoke');
    addXP(V.xp);
    comboZap();
    SES.best = Math.max(SES.best, SES.combo);
    statMax('combo', SES.combo);
  }
  SES.done++;
  SES.phase = 'fb';
  commit();
  const ok = res === 'ok';
  setFoot(ok ? 'ok' : 'near');
  $('#spk-text').innerHTML = spkTextHTML(s, ok ? null : r.hit);
  $('#spk-mic').disabled = true;
  $('#spk-mic span').textContent = ok ? 'Geschafft!' : 'Nächstes Mal klappt’s';
  spkStatus(r.heard ? `Gehört: „<span lang="en">${esc(r.heard)}</span>“` : '');
  $('#ses-fb').innerHTML = `<div class="fb-head">${fox(ok ? 'happy' : 'wow')}<span>${ok ? (V.tries ? 'Geschafft!' : pickOne(['Super ausgesprochen!', 'Klingt klasse!', 'Sehr gut gesprochen!'])) : 'Nicht schlimm – weiter geht’s!'}</span>${V.xp ? `<span class="fb-xp">+${V.xp} XP</span>` : ''}</div>
    <div class="fb-row"><p class="fb-ans"><b lang="en">${esc(s.w.plain)}</b> = ${esc(deShort(s.w))}</p>${sayBtn(s.w)}</div>
    ${ok ? '' : '<p class="fb-hint">Hör es dir nochmal an und sprich es leise mit. Das zählt nicht als Fehler.</p>'}`;
  setSkip('');
  setGo(`Weiter ${icon('arrow-right')}`, ok ? 'btn-good' : 'btn-near');
  Sfx.play(ok ? 'ok' : 'near');
  if (ok) autoNext(V.zap ? ZAP_MS - 300 : AUTO_HINT_MS);
  renderBar();
  renderMeta(ok);
  $('#ses-go').focus({ preventScroll: true });
}

// Eltern-Einstellung (views.js zeigt den Schalter nur, wo Sprechen möglich ist)
CHG['set-spk'] = el => setSet('spk', el.checked);
</script>
<script>
/* Wortfuchs – Fuchstaler: beim Lernen verdienen, für Wort-Snake ausgeben oder gegen
   Bildschirmzeit einlösen (Anfrage-Code → Freigabe-Code vom gekoppelten Eltern-Handy).
   Baut auf kern.js, ui.js, views.js und ueben.js auf. */
'use strict';

// ======================= Konto =======================
// Taler-Tageswerte in S.days: c verdient, cx XP-Topf zum nächsten Taler, sp für Spielrunden ausgegeben,
// bz Blitz-Taler heute schon vergeben, fx „Ich hatte recht“. Eingelöst wird über das Protokoll S.red.
const TAL_MIN = [0, 5, 10, 15, 20, 30];   // Ziffer in der Anfrage → Minuten
const TAL_ASK = [2, 3, 4, 5];             // das Kind fragt 10/15/20/30 Min an
const TAL_UNLOCK = 9;                     // Anfrage „Einstellungen entsperren“
const PAR_KEY = 'wortfuchs.eltern';       // Geheimnis des Eltern-Handys, nur in diesem Browser

const talOn = () => S.set.tal !== false;
const talRate = () => S.set.tk || 60;
const talSpent = () => sum(S.red.map(x => x.min || 0));
function talBalance() {
  let n = 0;
  for (const d of Object.values(S.days)) n += (d.c || 0) - (d.sp || 0);
  return Math.max(0, n - talSpent());
}
// Was frei ist, wenn eine offene Anfrage schon Minuten reserviert
const talFree = () => talBalance() - (S.req.c && S.req.o !== TAL_UNLOCK ? TAL_MIN[S.req.o] || 0 : 0);
const talLocked = () => !!S.pair.k && !PAR.tal;
// Spielrunden (Snake, Wortknacker, Fuchs-Sprung): warum gerade keine geht ('' = geht) und 1 Taler abbuchen
const talPlayWhy = () => !talOn() || talFree() >= 1 ? '' : talBalance() ? 'Deine Taler sind für die Anfrage reserviert.' : 'Keine Taler mehr – lern ein bisschen, dann geht es weiter!';
function talPay() {
  if (!talOn()) return;
  const r = todayRec();
  r.sp = (r.sp || 0) + 1;
  commit();
}

// XP füllen den Topf; ist die Tages- oder Kontogrenze erreicht, verfällt er
function talEarn(n) {
  if (!talOn() || !(n > 0)) return;
  const r = todayRec(), k = talRate();
  r.cx = (r.cx || 0) + n;
  while (r.cx >= k) {
    r.cx -= k;
    if ((r.c || 0) >= (S.set.td || 20) || talBalance() >= (S.set.tm || 60)) continue;
    r.c = (r.c || 0) + 1;
    if (SES) SES.tal = (SES.tal || 0) + 1;
  }
}
// Blitz-Runde: nur die erste am Tag zählt, höchstens 3 Taler
function talBlitz() {
  if (!talOn() || !SES) return;
  const r = todayRec();
  if (r.bz) return;
  r.bz = 1;
  SES.talBz = true;
  talEarn(Math.min(SES.xp, 3 * talRate()));
}

function talGainHTML() {
  if (!talOn() || !SES) return '';
  const n = SES.tal || 0, r = todayRec(), td = S.set.td || 20;
  let txt = '';
  if (n) txt = `<b>+${plural(n, 'Fuchstaler', 'Fuchstaler')}</b><span>Konto: ${talBalance()}</span>`;
  else if (SES.kind === 'blitz' && !SES.talBz) txt = '<span>Blitz-Runden bringen nur einmal am Tag Taler.</span>';
  else if ((r.c || 0) >= td) txt = `<span>Heute hast du alle ${td} Taler verdient – stark!</span>`;
  else if (talBalance() >= (S.set.tm || 60)) txt = '<span>Dein Taler-Konto ist voll – lös erst welche ein.</span>';
  else txt = `<span>Noch ${fmtN(talRate() - (r.cx || 0))} XP bis zum nächsten Taler</span>`;
  return `<div class="tal-gain${n ? ' is-new' : ''}">${icon('coin')}${txt}</div>`;
}

// ======================= Codes =======================
// cyrb53 – kurzer, schneller Hash; reicht für 4-stellige Freigabe-Codes
function talHash(s) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
const talCode = (K, req, o) => String(talHash(`${K}|${req}|${o}`) % 10000).padStart(4, '0');

// Anfrage-Code: 3 Zufallsziffern + Option + Prüfziffer (fängt Tippfehler der Eltern ab)
const reqCheck = s => String([1, 3, 7, 9].reduce((a, w, i) => a + w * +s[i], 0) % 10);
const reqCode = (n, o) => n + o + reqCheck(n + o);
function talNonce() {
  const used = new Set(S.red.map(x => x.n));
  let n;
  do n = String(rnd(1000)).padStart(3, '0'); while (used.has(n) && used.size < 900);
  return n;
}
const reqNone = () => ({ c: '', o: 0, n: 0, m: Date.now() });

// Kopplungs-Code: 7 Zeichen + Prüfzeichen, ohne verwechselbare (0/O, 1/I/L)
const PAIR_ABC = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const pairCheck = s => PAIR_ABC[[...s].reduce((h, c, i) => h + (i + 1) * PAIR_ABC.indexOf(c), 0) % PAIR_ABC.length];
const pairNorm = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
const pairOk = k => k.length === 8 && [...k].every(c => PAIR_ABC.includes(c)) && pairCheck(k.slice(0, 7)) === k[7];
const pairFmt = k => k.slice(0, 4) + '-' + k.slice(4);
function pairNew() {
  const a = new Uint8Array(7);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < 7; i++) a[i] = rnd(256); }
  const s = [...a].map(x => PAIR_ABC[x % PAIR_ABC.length]).join('');
  return s + pairCheck(s);
}
function parKey() {
  try { const k = localStorage.getItem(PAR_KEY) || ''; return pairOk(k) ? k : ''; } catch (e) { return ''; }
}
function parSetKey(k) {
  try { if (k) localStorage.setItem(PAR_KEY, k); else localStorage.removeItem(PAR_KEY); return true; } catch (e) { return false; }
}

// ======================= Ansicht „Taler“ (Kind) =======================
const pcOf = (v, max) => Math.min(100, max ? v / max * 100 : 0).toFixed(1);
const clockOf = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

VIEWS.taler = () => {
  const el = $('#v-taler');
  if (!talOn()) {
    el.innerHTML = `<div class="wrap"><div class="card hero-empty">${fox()}<h1>Fuchstaler sind aus</h1>
      <p>Deine Eltern können sie einschalten.</p></div></div>`;
    return;
  }
  const bal = talBalance(), r = S.days[dayKey(today())] || {}, k = talRate(), td = S.set.td || 20, tm = S.set.tm || 60;
  const got = r.c || 0, cx = r.cx || 0, full = got >= td || bal >= tm;
  const note = got >= td ? `Heute alle ${td} geschafft – super!` : bal >= tm ? 'Konto voll – lös erst welche ein!' : '';
  const playWhy = talPlayWhy(), recOf = k => S.st[k] ? `<span class="kicker">Rekord ${fmtN(S.st[k])}</span>` : '';
  const game = (art, h, kick, text, act) => `<div class="card tal-game">
      <div class="tal-game-art" aria-hidden="true">${art}</div>
      <div class="card-h"><h2>${h}</h2>${kick}</div>
      <p class="muted">${text}</p>
      <button class="btn btn-primary btn-block" type="button" data-act="${act}"${playWhy ? ` aria-disabled="true" data-why="${esc(playWhy)}"` : ''}>${icon('gamepad')}Spielen · 1 Taler</button></div>`;
  const own = bauOwned();
  const recent = S.red.filter(x => !x.k).slice(-5).reverse()
    .map(x => `<li><span>${fmtDay(dayNum(new Date(x.t)))}, ${clockOf(x.t)}</span><b>${x.min} Min</b></li>`).join('');

  el.innerHTML = `<div class="wrap">
    <div class="page-head"><h1>Fuchstaler</h1></div>
    <div class="card tal-hero">
      <div class="tal-coin" aria-hidden="true">${icon('coin')}</div>
      <div class="tal-bal"><b>${bal}</b><span>Taler = ${bal} Min.</span></div>
      <div class="tal-prog">
        <div class="tal-row"><span>Heute verdient</span><b>${got} / ${td}</b></div>
        <div class="xpbar tal-bar"><i style="width:${pcOf(got, td)}%"></i></div>
        <div class="tal-row"><span>Nächster Taler</span><b>${full ? '–' : `${fmtN(cx)} / ${fmtN(k)} XP`}</b></div>
        <div class="xpbar tal-bar is-next"><i style="width:${full ? 0 : pcOf(cx, k)}%"></i></div>
        ${note ? `<p class="tal-note">${note}</p>` : ''}
      </div>
    </div>
    <div class="tal-games">
      ${game(snArt(), 'Wort-Snake', recOf('snake'), 'Friss die Buchstaben der Reihe nach.', 'sn-open')}
      ${game(wkArt(), 'Wortknacker', S.st.wk ? `<span class="kicker">${fmtN(S.st.wk)} geknackt</span>` : '', 'Errate das Wort in 6 Versuchen.', 'wk-open')}
      ${game(fjArt(), 'Fuchs-Sprung', recOf('jump'), 'Spring und sammle Sterne.', 'fj-open')}
    </div>
    <div class="tal-grid">
      <div class="card tal-bau">
        <div class="card-h"><h2>Fuchsbau</h2><span class="kicker">${BAU.filter(x => own.has(x.id)).length} / ${BAU.length}</span></div>
        <div class="tal-bau-art">${bauRoom(own)}</div>
        <button class="btn btn-ghost btn-block" type="button" data-go="bau">${icon('sparkles')}Einrichten</button>
      </div>
      <div class="card tal-redeem">
        <div class="card-h"><h2>Bildschirmzeit</h2>${icon('smartphone')}</div>
        ${redeemHTML(bal)}
      </div>
    </div>
    <div class="card"><div class="card-h"><h2>So geht's</h2></div><ul class="explain">
      <li><b>${fmtN(k)} XP = 1 Taler</b></li>
      <li><b>1 Taler = 1 Minute</b> oder 1 Spiel</li>
      <li>Höchstens <b>${td} Taler</b> pro Tag</li></ul></div>
    ${recent ? `<div class="card"><div class="card-h"><h2>Zuletzt eingelöst</h2></div><ul class="tal-list">${recent}</ul></div>` : ''}
  </div>`;
};

function redeemHTML(bal) {
  if (!S.pair.k) {
    return `<p class="muted">Frag deine Eltern – sie richten es ein.</p>
      ${askBtns(TAL_ASK.map(o => [o, 'Erst koppeln – frag deine Eltern.']))}`;
  }
  if (S.req.c && S.req.o !== TAL_UNLOCK) return reqBoxHTML();
  return `<p class="muted">Wie viele Minuten?</p>
    ${askBtns(TAL_ASK.map(o => [o, bal < TAL_MIN[o] ? `Dafür brauchst du ${TAL_MIN[o]} Taler – du hast ${bal}.` : '']))}`;
}
const askBtns = list => `<div class="tal-ask">${list.map(([o, why]) =>
  `<button class="btn btn-ghost" type="button" data-act="tal-ask" data-o="${o}"${why ? ` aria-disabled="true" data-why="${esc(why)}"` : ''}><b>${TAL_MIN[o]}</b> Min</button>`).join('')}</div>`;

// Offene Anfrage: Code zeigen, Freigabe-Code eintippen (Kind: Minuten, Eltern am Kindergerät: Entsperren)
function reqBoxHTML() {
  const q = S.req, code = reqCode(q.c, q.o), unlock = q.o === TAL_UNLOCK;
  return `<div class="req-box">
    <p>${unlock ? 'Anfrage: <b>Einstellungen entsperren</b>' : `Anfrage über <b>${TAL_MIN[q.o]} Minuten</b>`}</p>
    <div class="req-code" role="text" aria-label="Anfrage-Code ${[...code].join(' ')}">${code.slice(0, 3)}<span>${code.slice(3)}</span></div>
    <p class="muted">${unlock ? 'Tippen Sie diesen Code am Eltern-Handy ein (Eltern → Freigabe erteilen) und den Freigabe-Code hier.'
      : 'Zeig den Code deinen Eltern.'}</p>
    <form class="gate-row" data-form="tal-ok" autocomplete="off"><input class="field code-in" id="tal-in" inputmode="numeric" maxlength="4" placeholder="4 Ziffern" aria-label="Freigabe-Code, 4 Ziffern">
      <button class="btn btn-primary" type="submit">${unlock ? 'Entsperren' : 'Einlösen'}</button></form>
    <button class="btn btn-quiet btn-sm" type="button" data-act="tal-cancel">Anfrage abbrechen</button></div>`;
}

const whyToast = el => { if (el.getAttribute('aria-disabled') !== 'true') return false; toast(esc(el.dataset.why || '')); return true; };
const talRedraw = () => { renderNav(); if (VIEWS[VIEW]) VIEWS[VIEW](false); };

ACT['tal-ask'] = el => {
  if (whyToast(el)) return;
  S.req = { c: talNonce(), o: +el.dataset.o, n: 0, m: Date.now() };
  commit();
  Sfx.play('tap');
  talRedraw();
  const i = $('#tal-in');
  if (i) i.focus({ preventScroll: true });
};
ACT['tal-cancel'] = () => { S.req = reqNone(); commit(); talRedraw(); };
ACT['tal-unlock'] = () => {
  if (!S.pair.k) return;
  S.req = { c: talNonce(), o: TAL_UNLOCK, n: 0, m: Date.now() };
  commit();
  VIEWS.parents(false);
};

SUB['tal-ok'] = () => {
  const inp = $('#tal-in'), v = inp.value.replace(/\D/g, ''), q = S.req, K = S.pair.k;
  if (!q.c || !K) return;
  if (v.length !== 4) { toast('Der Freigabe-Code hat 4 Ziffern.'); return; }
  const opts = q.o === TAL_UNLOCK ? [TAL_UNLOCK] : TAL_MIN.map((_, o) => o).filter(o => o >= 1 && o <= q.o);
  const o = opts.find(x => talCode(K, q.c, x) === v);
  if (!o) {
    q.n = (q.n || 0) + 1;
    q.m = Date.now();
    if (q.n >= 3) { S.req = reqNone(); toast('3-mal falsch – stell eine neue Anfrage.'); }
    else toast(`Der Code stimmt nicht. Noch ${plural(3 - q.n, 'Versuch', 'Versuche')}.`);
    commit();
    Sfx.play('bad');
    talRedraw();
    const i = $('#tal-in');
    if (i) i.focus({ preventScroll: true });
    return;
  }
  const t = Date.now(), unlock = o === TAL_UNLOCK;
