<script>
/* Wortfuchs – Üben: Station (Lektion), Wiederholen, Festigen, Fehler-Training,
   Blitz-Runde und Probetest. Baut auf kern.js, ui.js und views.js auf. */
'use strict';

let SES = null;   // die laufende Übung – oder null

const XP_OF = { mcEn: 8, mcDe: 8, listen: 8, spell: 8, gapc: 8, tiles: 10, type: 12, gapt: 12 };
const PRAISE = ['Super!', 'Richtig!', 'Klasse!', 'Genau!', 'Stark!', 'Perfekt!', 'Weiter so!'];
const GRADE_TXT = ['', 'Sehr gut!', 'Gut!', 'Befriedigend', 'Ausreichend', 'Mangelhaft', 'Ungenügend'];
const GRADE_BONUS = [0, 40, 30, 20, 10, 0, 0];
const gradeOf = p => p >= 92 ? 1 : p >= 81 ? 2 : p >= 67 ? 3 : p >= 50 ? 4 : p >= 30 ? 5 : 6;
const RES_TITLE = { lesson: 'Station geschafft!', replay: 'Station wiederholt!', review: 'Wiederholung geschafft!', strengthen: 'Gut gefestigt!', oops: 'Fehler ausgebügelt!', sent: 'Sätze geschafft!' };
const COARSE = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
const INPUT_ATTRS = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"';
const EXTRA_LETTERS = 'eaiourstnlmdcbpgh';

function addXP(n) {
  if (!n) return;
  const r = todayRec();
  r.xp = (r.xp || 0) + n;
  if (SES) SES.xp += n;
  if (!SES || SES.kind !== 'blitz') talEarn(n);   // Blitz zählt erst am Ende (talBlitz)
}
const bump = (k, n = 1) => { const r = todayRec(); r[k] = (r[k] || 0) + n; };
const statInc = k => { S.st[k] = (S.st[k] || 0) + 1; };
const statMax = (k, v) => { S.st[k] = Math.max(S.st[k] || 0, v); };
function markDay() {
  const d = new Date(), h = d.getHours();
  if (h >= 4 && h < 8) S.st.early = 1;
  if (d.getDay() === 0 || d.getDay() === 6) S.st.weekend = 1;
}

// ---------- Wörter auswählen ----------
const sesPool = () => { const a = curAsg(); return a ? poolOf(a) : WORDS; };
const learnedNow = () => { const a = curAsg(); return a ? poolOf(a).filter(w => lvl(w) >= 3).length : -1; };
// Fällige Wörter: am längsten überfällig zuerst, dann die schwächsten
function dueWords(pool, n = 10) {
  const t = today();
  return pool.filter(w => isDue(w, t)).sort((x, y) => ws(x).d - ws(y).d || lvl(x) - lvl(y)).slice(0, n);
}
function weakWords(pool, n = 8) {
  return pool.filter(w => lvl(w) >= 1).sort((x, y) => lvl(x) - lvl(y) || ws(y).x - ws(x).x || ws(x).m - ws(y).m).slice(0, n);
}
function oopsWords(pool, n = 8) {
  return pool.filter(w => { const s = ws(w); return s && s.x > 0 && s.b < 4; })
    .sort((x, y) => ws(y).x - ws(x).x || lvl(x) - lvl(y)).slice(0, n);
}
function knownWords(pool) {
  const list = pool.filter(w => lvl(w) >= 1);
  return list.length >= 4 ? list : WORDS.filter(w => lvl(w) >= 1);
}

// ---------- Übungsschritte planen ----------
// Schritt {t, w, g}: t = intro | mcEn | mcDe | listen | spell | gapc | match | tiles | type | gapt | speak (sprechen.js),
// g = recog (erkennen) | recall (selbst wissen)
const stepA = w => canListen() && Math.random() < 0.4 ? { t: 'listen', w, g: 'recog' } : { t: 'mcEn', w, g: 'recog' };
function stepB(w) {
  const c = [{ t: 'mcDe', w, g: 'recog' }];
  if (misspell(w, 2).length >= 2) c.push({ t: 'spell', w, g: 'recog' });
  if (w.gap) c.push({ t: 'gapc', w, g: 'recog' });
  return pickOne(c);
}
function stepRecall(w, easy) {
  if (easy && w.tiles) return { t: 'tiles', w, g: 'recall' };
  if (w.typable) return w.gap && Math.random() < 0.35 ? { t: 'gapt', w, g: 'recall' } : { t: 'type', w, g: 'recall' };
  if (w.tiles) return { t: 'tiles', w, g: 'recall' };
  return { t: 'mcDe', w, g: 'recall' };
}
const introStep = (w, k, n) => ({ t: 'intro', w, k, n });
// Paare: 3–5 Wörter, die sich nicht verwechseln lassen
function matchStep(list, fill = []) {
  const out = [];
  const fits = w => !out.some(o => o === w || overlaps(o, w) || overlaps(w, o)
    || o.plain.toLowerCase() === w.plain.toLowerCase() || deShort(o) === deShort(w));
  for (const w of list) if (out.length < 5 && fits(w)) out.push(w);
  for (const w of shuffle(fill)) { if (out.length >= 5) break; if (fits(w)) out.push(w); }
  return out.length >= 3 ? { t: 'match', ws: out } : null;
}

// Neue Station: kennenlernen -> erkennen -> Paare -> selbst schreiben (+ ein paar fällige Wörter)
function planLesson(st, pool) {
  const nw = st.words.filter(w => lvl(w) === 0);
  if (!nw.length) return planReplay(st, pool);
  const steps = [];
  nw.forEach((w, k) => {
    steps.push(introStep(w, k + 1, nw.length), stepA(w));
    if (k % 2 === 1) steps.push(stepB(nw[k - 1]));
  });
  const m = matchStep(st.words, knownWords(pool));
  if (m) steps.push(m);
  const old = st.words.filter(w => lvl(w) > 0);
  const due = dueWords(pool.filter(w => !st.words.includes(w)), 3);
  steps.push(...shuffle([...nw.map(w => stepRecall(w, true)), ...old.concat(due).map(w => stepRecall(w, lvl(w) < 3))]));
  return steps;
}
function planReplay(st, pool) {
  const steps = [];
  const m = matchStep(shuffle(st.words), knownWords(pool));
  if (m) steps.push(m);
  steps.push(...shuffle(st.words.filter(w => lvl(w) < 3)).map(stepB));
  steps.push(...shuffle(st.words).map(w => stepRecall(w, lvl(w) < 3)));
  return steps;
}
// Wiederholen, Festigen, Fehler-Training
function planReview(list) {
  const nw = list.filter(w => lvl(w) === 0);
  const steps = nw.map((w, k) => introStep(w, k + 1, nw.length));
  if (list.length >= 4) { const m = matchStep(shuffle(list)); if (m) steps.push(m); }
  steps.push(...shuffle(list.filter(w => lvl(w) <= 2)).map(w => Math.random() < 0.5 ? stepA(w) : stepB(w)));
  steps.push(...shuffle(list).map(w => stepRecall(w, lvl(w) <= 2)));
  return steps;
}

// ---------- Übung öffnen und schließen ----------
function newSes(kind, extra) {
  return Object.assign({
    kind, q: [], done: 0, cur: null, phase: 'ask', view: {}, shownAt: 0,
    xp: 0, ok: 0, near: 0, bad: 0, errs: 0, combo: 0, best: 0, req: {}, intro: [], list: [], st: null,
    pool: WORDS, t0: Date.now(), L0: levelInfo().L, xp0: todayXP(), first: !streakInfo().todayDone, ln0: learnedNow(),
  }, extra);
}

function startSession(kind, o = {}) {
  if (SES) return;
  if (kind === 'blitz') return startBlitz();
  if (kind === 'test') return startTest();
  const a = curAsg();
  const pool = sesPool();
  let steps, st = null, list;
  if (kind === 'lesson' || kind === 'replay') {
    st = a ? stationsOf(a)[o.station] : null;
    if (!st) return;
    steps = kind === 'lesson' ? planLesson(st, pool) : planReplay(st, pool);
    list = st.words;
  } else if (kind === 'sent') {
    steps = satzSession(pool);   // saetze.js
    list = uniq(steps.map(s => s.w));
  } else {
    list = o.words || [];
    steps = planReview(list);
  }
  if (!steps.length) { toast('Hier gibt es gerade nichts zu üben.'); return; }
  steps = spkPlan(steps, kind);   // Sprech-Aufgaben (sprechen.js)
  steps = satzPlan(steps, kind);  // Satz-Aufgaben (saetze.js)
  SES = newSes(kind, { q: steps, st, list, pool });
  openSession();
  nextStep();
}

const BEHIND = ['#top', '#main', '#bottom-nav'];
function openSession() {
  $('#session').hidden = false;
  document.body.classList.add('ses-open');
  for (const s of BEHIND) $(s).inert = true;
  $('#ses-close').innerHTML = icon('x');
  $('#ses-bar').classList.toggle('is-blitz', SES.kind === 'blitz');
  $('#ses-foot').hidden = false;
  $('#ses-meta').innerHTML = '';
  $('#ses-fb').innerHTML = '';
  $('#ses-body').tabIndex = -1;
  setFoot('');
  renderBar(0);
  Sfx.play('start');
}

function closeSession() {
  if (!SES) return;
  if (SES.tick) clearInterval(SES.tick);
  stopAuto();
  spkStop();
  SES = null;
  TTS.stop();
  $('#session').hidden = true;
  $('#ses-body').innerHTML = '';
  $('#ses-fb').innerHTML = '';
  $('#ses-meta').innerHTML = '';
  for (const s of BEHIND) $(s).inert = false;
  if ($('#onboard').hidden) document.body.classList.remove('ses-open');
  refresh();
}

// Vorzeitig beenden – mit Nachfrage
async function sesQuit() {
  if (!SES || Modal.open) return;
  if (SES.phase === 'end' || SES.phase === 'setup' || SES.phase === 'ready') { closeSession(); return; }
  const bz = SES.kind === 'blitz', test = SES.kind === 'test';
  if (bz) { SES.pause = SES.end - performance.now(); clearInterval(SES.tick); SES.tick = 0; }
  const yes = await ask({
    title: test ? 'Probetest abbrechen?' : bz ? 'Blitz-Runde beenden?' : 'Übung beenden?',
    text: test ? 'Dann zählt dieser Test nicht.' : 'Was du bisher geübt hast, ist gespeichert.',
    yes: 'Beenden', no: 'Weitermachen', art: fox('sad'), stay: true,
  });
  if (!SES) return;
  if (!yes) {
    if (bz && SES.phase === 'q') { SES.end = performance.now() + SES.pause; SES.tick = setInterval(blitzTick, 200); }
    return;
  }
  if (!test) { const d = Math.min(1800, Math.round((Date.now() - SES.t0) / 1000)); bump('s', d); aktSes(d, { q: 1 }); commit(); }
  closeSession();
}

// ---------- Fußzeile, Fortschritt, Kombo ----------
function setGo(label, cls = 'btn-primary', disabled = false) {
  const b = $('#ses-go');
  b.className = 'btn ' + cls;
  b.innerHTML = label;
  b.disabled = disabled;
}
function setSkip(label, cls = 'btn-quiet') {
  const b = $('#ses-skip');
  b.hidden = !label;
  b.className = 'btn ' + cls;
  b.textContent = label || '';
}
function setFoot(st) {
  const f = $('#ses-foot');
  f.classList.remove('is-ok', 'is-bad', 'is-near');
  if (st) f.classList.add('is-' + st);
}
function renderBar(p) {
  if (p === undefined) {
    const rest = SES.q.length + (SES.phase === 'ask' ? 1 : 0);
    p = SES.done / Math.max(1, SES.done + rest);
  }
  const pct = Math.round(clamp(p, 0, 1) * 100);
  $('#ses-bar-fill').style.width = pct + '%';
  $('#ses-bar').setAttribute('aria-valuenow', pct);
}
// Kombo oben rechts: Flamme, Zahl und 5 Striche, die sich bis zum nächsten Blitz füllen
function renderMeta(pop) {
  if (SES.kind === 'blitz' || SES.kind === 'test') return;
  const n = SES.combo, k = n % 5 || (n ? 5 : 0);
  $('#ses-meta').innerHTML = n
    ? `<span class="combo${n >= 5 ? ' is-hot' : ''}${pop ? ' pop' : ''}" role="img" aria-label="${n} richtig in Folge, noch ${5 - k || 5} bis zum Blitz">${icon('flame', 'ic-fill')}${n}<span class="pips${k === 5 ? ' is-full' : ''}">${'<i class="on"></i>'.repeat(k)}${'<i></i>'.repeat(5 - k)}</span></span>` : '';
}
// Alle 5 richtigen in Folge: Blitz-Feier mit Bonus-XP (ab 10 in Folge doppelt)
const ZAP_TXT = ['Super Serie!', 'Wahnsinn!', 'Nicht zu stoppen!', 'Legendär!'];
function comboZap() {
  const n = SES.combo, V = SES.view;
  if (!n || n % 5) return;
  const bonus = n >= 10 ? 10 : 5;
  addXP(bonus);
  V.xp += bonus;
  V.zap = true;
  zapFx(n, bonus);
}
function zapFx(n, bonus) {
  const lv = Math.min(4, n / 5), k = 8 + lv * 3, el = document.createElement('div');
  let sparks = '';
  if (!REDUCED) for (let i = 0; i < k; i++) sparks += `<i class="zap-spark" style="--a:${Math.round(i * 360 / k)}deg;--d:${150 + rnd(70) + lv * 15}px"></i>`;
  el.className = 'zap-fx lv' + lv;
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `<i class="zap-flash"></i><div class="zap-core"><i class="zap-rays"></i><div class="zap-card"><span class="zap-bolt">${icon('zap', 'ic-fill')}</span>
    <b class="zap-n">${n}</b><span class="zap-sub">richtig in Folge</span><span class="zap-word">${ZAP_TXT[lv - 1]}</span><span class="zap-xp">+${bonus} XP Bonus</span></div>${sparks}</div>`;
  document.querySelectorAll('.zap-fx').forEach(x => x.remove());
  document.body.appendChild(el);
  after(120, () => Sfx.play('zap', lv));
  after(ZAP_MS, () => el.remove());
}
function focusBody() { try { $('#ses-body').focus({ preventScroll: true }); } catch (e) { /* egal */ } }
const kicker = (txt, s) => `<div class="ex-kicker">${s && s.again ? '<span class="tag">Nochmal</span>' : ''}${txt}</div>`;
function promptHTML(text, o = {}) {
  return `<div class="prompt">${fox(o.mood || '')}<div class="prompt-box"><div class="prompt-main"><div class="prompt-text${o.en ? ' en' : ''}"${o.en ? ' lang="en"' : ''}>${text}</div>${o.sub ? `<span class="prompt-sub">${o.sub}</span>` : ''}</div>${o.w ? sayBtn(o.w) : ''}</div></div>`;
}
function optsHTML(list, en) {
  const two = list.length === 4 && list.every(x => x.length <= 22);
  return `<div class="opts${two ? ' two' : ''}" role="group" aria-label="Antworten">${list.map((x, k) =>
    `<button class="opt${en ? ' en-opt' : ''}" type="button" data-act="opt" data-k="${k}"${en ? ' lang="en"' : ''}><span class="num" aria-hidden="true">${k + 1}</span><span>${esc(x)}</span></button>`).join('')}</div>`;
}
function markOpts(k, right) {
  $$('#ses-body .opt').forEach((b, i) => {
    b.disabled = true;
    b.classList.add(i === right ? 'is-right' : i === k ? 'is-wrong' : 'is-dim');
  });
}

// ---------- Schritte anzeigen ----------
function nextStep() {
  stopAuto();
  const s = SES.q.shift();
  if (!s) { finish(); return; }
  SES.cur = s;
  SES.phase = 'ask';
  SES.view = {};
  SES.shownAt = performance.now();
  setFoot('');
  $('#ses-fb').innerHTML = '';
  setSkip(s.t === 'intro' || s.t === 'match' ? '' : 'Weiß ich nicht');
  if (s.t === 'intro') renderIntro(s);
  else if (s.t === 'match') renderMatch(s);
  else if (s.t === 'tiles') renderTiles(s);
  else if (s.t === 'type' || s.t === 'gapt') renderType(s);
  else if (s.t === 'speak') renderSpeak(s);
  else if (s.t === 'sent') renderSatz(s);
  else renderChoice(s);
  renderBar();
  renderMeta();
  $('#ses-scroll').scrollTop = 0;
}

function renderIntro(s) {
  const w = s.w;
  const notes = [];
  if (w.no) notes.push(`<div class="note">${icon('info')}<span>${esc(w.no)}</span></div>`);
  for (const t of w.t || []) notes.push(`<div class="note tip">${icon('lightbulb')}<span>${esc(t)}</span></div>`);
  for (const f of w.f || []) notes.push(`<div class="note">${icon('info')}<span>${esc(f)}</span></div>`);
  const say = sayBtn(w) + sayBtn(w, true);
  $('#ses-body').innerHTML = `<div class="ex-kicker">Neues Wort${s.n > 1 ? `<span class="tag">${s.k} / ${s.n}</span>` : ''}</div>
    <div class="intro">
      <div class="intro-en" lang="en">${esc(w.en)}</div>
      ${w.ip ? `<div class="intro-ip">${ipaHTML(w)}</div>` : ''}
      ${say ? `<div class="intro-say">${say}</div>` : ''}
      <div class="intro-de">${esc(w.de)}</div>
      ${w.ex ? `<div class="intro-ex"><p lang="en">${esc(w.ex)}</p>${TTS.ok ? `<button class="say" type="button" data-act="say-ex" data-id="${w.id}" aria-label="Beispielsatz anhören">${icon('volume')}</button>` : ''}</div>` : ''}
      ${notes.length ? `<div class="notes">${notes.join('')}</div>` : ''}
    </div>`;
  setGo(`Weiter ${icon('arrow-right')}`);
  autoSay(w, 350);
  $('#ses-go').focus({ preventScroll: true });
}

function introDone() {
  const w = SES.cur.w;
  grade(w, 'intro');
  addXP(2);
  SES.intro.push(w);
  SES.done++;
  commit();
  nextStep();
}

// Auswahl: Bedeutung, Englisch, Hören, Schreibweise, Lückensatz
function renderChoice(s) {
  const w = s.w, V = SES.view, pool = SES.pool;
  let t = s.t, opts = null;
  if (t === 'spell') {
    const bad = misspell(w, 3);
    if (bad.length) opts = [{ x: w.plain, w }, ...bad.map(x => ({ x }))];
    else t = 'mcDe';
  }
  if (t === 'gapc') {
    const cap = /^[A-Z]/.test(w.gap.word);
    const want = canon(w.gap.word);
    // mit -s passen nur wenige Wörter als Ablenker (Buchform oder Verb) – darum viele Kandidaten ziehen
    const ds = distract(w, w.gap.inf ? 150 : 10, pool, 'en').filter(o => /^[a-z' -]{2,22}$/.test(o.k)).map(o => ({ x: gapForm(o, w.gap), w: o })).filter(o => o.x && o.x !== want).slice(0, 3);
    if (ds.length >= 2) opts = [{ x: w.gap.word, w }, ...ds.map(o => ({ x: cap ? o.x[0].toUpperCase() + o.x.slice(1) : o.x, w: o.w }))];
    else t = 'mcDe';
  }
  if (t === 'mcEn') opts = [w, ...distract(w, 3, pool, 'de')].map(o => ({ x: deShort(o), w: o }));
  else if (t === 'mcDe') opts = [w, ...distract(w, 3, pool, 'en')].map(o => ({ x: o.plain, w: o }));
  else if (t === 'listen') opts = [w, ...distract(w, 3, pool, 'sound')].map(o => ({ x: o.plain, w: o }));
  const seen = new Set();
  opts = opts.filter(o => { const k = o.x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  const right = opts[0];
  V.t = t;
  V.opts = shuffle(opts);
  V.right = V.opts.indexOf(right);
  let head;
  if (t === 'mcEn') head = kicker('Was bedeutet das?', s) + promptHTML(esc(w.plain), { en: true, w });
  else if (t === 'mcDe') head = kicker('Auf Englisch?', s) + promptHTML(esc(w.de));
  else if (t === 'spell') head = kicker('Richtig geschrieben?', s) + promptHTML(esc(w.de));
  else if (t === 'listen') {
    head = kicker('Was hörst du?', s) + `<div class="listen"><button class="say-big" type="button" data-act="say" data-id="${w.id}" aria-label="Nochmal anhören">${icon('volume')}</button>`
      + `<button class="say say-slow" type="button" data-act="say" data-id="${w.id}" data-slow="1" aria-label="Langsam anhören">${icon('snail')}</button></div>`;
  } else {
    head = kicker('Welches Wort fehlt?', s) + `<div class="gap-sent" lang="en">${esc(w.gap.before)}<span class="gap-slot" id="gap-slot">&nbsp;</span>${esc(w.gap.after)}</div>`
      + `<p class="gap-de">Gesucht: <b>${esc(w.de)}</b></p>`;
  }
  $('#ses-body').innerHTML = head + optsHTML(V.opts.map(o => o.x), t !== 'mcEn');
  setGo(`Weiter ${icon('arrow-right')}`, 'btn-primary', true);
  if (t === 'mcEn' || t === 'listen') autoSay(w, 300);
  focusBody();
}

ACT.opt = el => {
  if (!SES) return;
  const k = +el.dataset.k;
  if (SES.kind === 'blitz') { blitzPick(k); return; }
  const s = SES.cur, V = SES.view;
  if (SES.phase !== 'ask' || !V.opts || el.disabled) return;
  if (k !== V.right) {
    // Falsch: kurz rot aufleuchten, dann grau – die Lösung bleibt verborgen, er wählt nochmal
    const o = V.opts[k];
    if (V.hint === undefined) {
      V.hint = o.w && o.w !== s.w ? (V.t === 'mcEn' ? `„${esc(o.x)}“ heißt auf Englisch <b lang="en">${esc(o.w.plain)}</b>.`
        : `<span lang="en">„${esc(o.w.plain)}“</span> heißt ${esc(deShort(o.w))}.`)
        : V.t === 'spell' ? 'Schau dir die Buchstaben genau an.' : '';
    }
    V.tries = (V.tries || 0) + 1;
    el.disabled = true;
    el.classList.add('is-wrong');
    if (document.activeElement === el) focusBody();
    Sfx.play('bad');
    after(650, () => { el.classList.remove('is-wrong'); el.classList.add('is-dim'); });
    return;
  }
  markOpts(k, V.right);
  if (V.t === 'gapc') { const g = $('#gap-slot'); g.textContent = s.w.gap.word; g.classList.add('is-right'); }
  judge(s, V.tries ? 'bad' : 'ok', { hint: V.hint || '', found: !!V.tries });
  $('#ses-go').focus({ preventScroll: true });
};

// Paare finden
function renderMatch(s) {
  const V = SES.view;
  V.L = shuffle(s.ws);
  V.R = shuffle(s.ws);
  V.sel = null;
  V.got = new Set();
  V.miss = new Set();
  $('#ses-body').innerHTML = kicker('Finde die Paare', s) + `<div class="match">
    <div class="mcol" role="group" aria-label="Englisch">${V.L.map((w, k) => `<button class="mtile en" type="button" data-act="mt" data-s="L" data-k="${k}" aria-pressed="false" lang="en">${esc(w.plain)}</button>`).join('')}</div>
    <div class="mcol" role="group" aria-label="Deutsch">${V.R.map((w, k) => `<button class="mtile" type="button" data-act="mt" data-s="R" data-k="${k}" aria-pressed="false">${esc(deShort(w))}</button>`).join('')}</div></div>`;
  setGo(`Weiter ${icon('arrow-right')}`, 'btn-primary', true);
  focusBody();
}

ACT.mt = el => {
  if (!SES || SES.phase !== 'ask' || !SES.cur || SES.cur.t !== 'match') return;
  const V = SES.view, side = el.dataset.s;
  const w = (side === 'L' ? V.L : V.R)[+el.dataset.k];
  if (!w || V.got.has(w.id) || V.busy) return;
  if (side === 'L' && canListen()) sayWord(w);
  if (!V.sel || V.sel.side === side) {
    const same = V.sel && V.sel.el === el;
    if (V.sel) V.sel.el.setAttribute('aria-pressed', 'false');
    V.sel = null;
    if (same) return;
    V.sel = { side, w, el };
    el.setAttribute('aria-pressed', 'true');
    Sfx.play('tap');
    return;
  }
  const a = V.sel;
  V.sel = null;
  a.el.setAttribute('aria-pressed', 'false');
  if (a.w === w) {
    V.got.add(w.id);
    for (const b of [a.el, el]) { b.classList.add('is-right'); b.disabled = true; }
    Sfx.play('pair');
    if (!V.miss.has(w.id)) grade(w, 'recog', 'ok');
    after(350, () => { a.el.classList.add('is-gone'); el.classList.add('is-gone'); });
    if (V.got.size === SES.cur.ws.length) matchDone();
  } else {
    V.miss.add(a.w.id);
    V.miss.add(w.id);
    for (const b of [a.el, el]) b.classList.add('is-wrong');
    Sfx.play('bad');
    V.busy = true;
    after(550, () => { a.el.classList.remove('is-wrong'); el.classList.remove('is-wrong'); V.busy = false; });
  }
};

function matchDone() {
  const V = SES.view;
  SES.done++;
  addXP(10);
  commit();
  SES.phase = 'fb';
  setFoot('ok');
  $('#ses-fb').innerHTML = `<div class="fb-head">${fox('happy')}<span>${V.miss.size ? 'Alle Paare gefunden!' : 'Perfekt gepaart!'}</span><span class="fb-xp">+10 XP</span></div>`;
  setGo(`Weiter ${icon('arrow-right')}`, 'btn-good');
  autoNext(AUTO_MS);
  after(250, () => Sfx.play('ok'));
  renderBar();
  $('#ses-go').focus({ preventScroll: true });
}

// Kacheln: Buchstaben oder Wörter zusammensetzen
function renderTiles(s) {
  const w = s.w, sp = w.tiles, V = SES.view;
  const bank = sp.parts.slice();
  if (sp.m === 'letters') {
    for (let i = 0, n = sp.parts.length >= 5 ? 2 : 1; i < n; i++) bank.push(pickOne([...EXTRA_LETTERS]));
  } else {
    const have = new Set(sp.parts.map(p => p.toLowerCase()));
    bank.push(...shuffle(TOKENS).filter(t => !have.has(t)).slice(0, sp.parts.length >= 4 ? 3 : 2));
  }
  V.sp = sp;
  V.bank = shuffle(bank).map(t => ({ t, used: false }));
  V.line = [];
  $('#ses-body').innerHTML = kicker(sp.m === 'letters' ? 'Bau das Wort' : 'Bau den Ausdruck', s) + promptHTML(esc(w.de))
    + '<div class="tline" id="tline" aria-label="Deine Antwort"></div><div class="tbank" id="tbank" role="group" aria-label="Kacheln"></div>';
  drawTiles();
  setGo('Prüfen', 'btn-primary', true);
  focusBody();
}
function drawTiles() {
  const V = SES.view, lt = V.sp.m === 'letters' ? ' letter' : '';
  const hadFocus = document.activeElement && document.activeElement.classList.contains('tile');
  $('#tline').innerHTML = (V.sp.pre ? `<span class="pre" lang="en">${esc(V.sp.pre)}</span>` : '')
    + V.line.map(i => `<button class="tile${lt}" type="button" data-act="tile-back" data-i="${i}" lang="${V.sp.lang || 'en'}" aria-label="${esc(V.bank[i].t)} zurücklegen">${esc(V.bank[i].t)}</button>`).join('');
  $('#tbank').innerHTML = V.bank.map((b, i) => b.used
    ? `<span class="tile${lt} ghost" aria-hidden="true">${esc(b.t)}</span>`
    : `<button class="tile${lt}" type="button" data-act="tile" data-i="${i}" lang="${V.sp.lang || 'en'}">${esc(b.t)}</button>`).join('');
  if (SES.phase === 'ask') $('#ses-go').disabled = !V.line.length;
  if (hadFocus) { const f = $('#tbank button') || $('#tline button') || $('#ses-go'); if (f) f.focus({ preventScroll: true }); }
}
function tilePut(i) {
  if (!SES || SES.phase !== 'ask' || !SES.cur || !SES.view.sp || !SES.view.bank) return;
  const V = SES.view, b = V.bank[i];
  if (!b || b.used) return;
  b.used = true;
  V.line.push(i);
  Sfx.play('tap');
  drawTiles();
}
function tileBack(i) {
  if (!SES || SES.phase !== 'ask' || !SES.cur || !SES.view.sp || !SES.view.bank) return;
  const V = SES.view, k = V.line.indexOf(i);
  if (k < 0) return;
  V.line.splice(k, 1);
  V.bank[i].used = false;
  drawTiles();
}
// Tastatur: Buchstaben legen, Rücktaste nimmt den letzten zurück
function tileKey(key) {
  if (!SES || SES.phase !== 'ask' || !SES.cur || !SES.view.sp || !SES.view.bank) return false;
  const V = SES.view;
  if (key === 'Backspace') { if (V.line.length) tileBack(V.line[V.line.length - 1]); return true; }
  if (V.sp.m !== 'letters' || key.length !== 1) return false;
  let i = V.bank.findIndex(b => !b.used && b.t === key);
  if (i < 0) i = V.bank.findIndex(b => !b.used && b.t.toLowerCase() === key.toLowerCase());
  if (i >= 0) tilePut(i);
  return true;
}
ACT.tile = el => tilePut(+el.dataset.i);
ACT['tile-back'] = el => tileBack(+el.dataset.i);

function checkTiles() {
  const s = SES.cur, V = SES.view, sp = V.sp, sep = sp.m === 'letters' ? '' : ' ';
  if (!V.line.length) return;
  const got = V.line.map(i => V.bank[i].t).join(sep);
  const ok = got === sp.target;
  $$('#ses-body button.tile').forEach(b => { b.disabled = true; });
  if (ok) {
    $('#tline').classList.add('is-right');
    judge(s, 'ok');
  } else {
    // Kachel für Kachel vergleichen: nur falsche Kacheln rot, fehlende als gestrichelte Lücke
    const unit = (c, i) => ({ c, k: c, free: false, i });
    const pre = sp.pre ? [{ c: sp.pre + ' ', k: sp.pre, free: true }] : [];
    const dx = dxAlign([...pre, ...V.line.map(i => unit(V.bank[i].t, i))], [...pre, ...sp.parts.map(c => unit(c))]).ops;
    const lt = sp.m === 'letters' ? ' letter' : '';
    $('#tline').innerHTML = (sp.pre ? `<span class="pre" lang="en">${esc(sp.pre)}</span>` : '')
      + dx.filter(o => !(o.a || o.b).free).map(o => o.a
        ? `<button class="tile${lt}${o.op === '=' ? '' : ' is-bad'}" type="button" disabled lang="en">${esc(o.a.c)}</button>`
        : `<span class="tile${lt} tile-gap" aria-hidden="true"></span>`).join('');
    $('#tline').classList.add('is-checked');
    judge(s, 'bad', { dx, sep });
  }
  $('#ses-go').focus({ preventScroll: true });
}

// Selbst schreiben (auch als Lückensatz)
function renderType(s) {
  const w = s.w;
  let html;
  if (s.t === 'gapt') {
    const g = w.gap;
    html = kicker('Ergänze den Satz', s) + `<div class="gap-sent" lang="en">${esc(g.before)}<input class="gap-in" id="ans" data-in="ans" type="text" lang="en" style="width:${Math.max(5, g.word.length + 2)}ch" ${INPUT_ATTRS} aria-label="Fehlendes Wort">${esc(g.after)}</div>`
      + `<p class="gap-de">Gesucht: <b>${esc(w.de)}</b></p>`;
  } else {
    html = kicker('Schreib auf Englisch', s) + promptHTML(esc(w.de))
      + `<div class="type-wrap"><input class="type-in" id="ans" data-in="ans" type="text" lang="en" ${INPUT_ATTRS} placeholder="Auf Englisch …" aria-label="Deine Antwort auf Englisch"></div>`;
  }
  html += `<div class="type-tools"><button class="btn btn-ghost btn-sm" type="button" data-act="hint">${icon('lightbulb')}Tipp</button><span class="hint-line" id="hint-line" aria-live="polite"></span></div>`
    + '<p class="retry-msg" id="retry-msg" hidden></p>';
  if (w.hasSb && s.t === 'type') html += '<p class="ph-note">„sb“ (somebody) und „sth“ (something) musst du nicht mittippen.</p>';
  $('#ses-body').innerHTML = html;
  setGo('Prüfen', 'btn-primary', true);
  $('#ans').focus({ preventScroll: true });
}
INP.ans = el => { if (SES && SES.phase === 'ask') $('#ses-go').disabled = !el.value.trim(); };

// Tipp: erste Buchstaben zeigen (zählt dann nur als „erkannt“)
function hintHTML(txt) {
  const toks = txt.split(' ');
  return toks.map((t, k) => {
    if (/^(sb|sth|sb\/sth)$/.test(t) || (k === 0 && toks.length > 1 && /^to$/i.test(t))) return `<span class="hw">${esc(t)}</span>`;
    let first = true;
    const cs = [...t].map(c => { if (!/[A-Za-z]/.test(c)) return esc(c); if (first) { first = false; return esc(c); } return '_'; });
    return `<span class="hw">${cs.join(' ')}</span>`;
  }).join('');
}
ACT.hint = el => {
  if (!SES || SES.phase !== 'ask' || !SES.cur) return;
  const s = SES.cur, V = SES.view;
  if (V.hinted || (s.t !== 'type' && s.t !== 'gapt')) return;
  V.hinted = true;
  el.disabled = true;
  $('#hint-line').innerHTML = hintHTML(s.t === 'gapt' ? s.w.gap.word : s.w.plain);
  const inp = $('#ans');
  if (inp) inp.focus({ preventScroll: true });
};

function checkTyped() {
  const s = SES.cur, w = s.w, V = SES.view;
  const inp = $('#ans');
  const raw = inp.value;
  const r = checkEn(w, raw, s.t === 'gapt' ? [canon(w.gap.word)] : null);
  if (r.res === 'empty') return;
  if (r.res === 'retry' && !V.retried) {
    V.retried = true;
    const m = $('#retry-msg');
    m.hidden = false;
    m.innerHTML = `„<span lang="en">${esc(raw.trim())}</span>“ passt auch, aber hier ist ein anderes Wort gemeint. Versuch's nochmal! Es fängt mit <b lang="en">${esc(w.plain.replace(/^to\s+/i, '')[0])}</b> an.`;
    Sfx.play('near');
    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('shake');
    inp.select();
    return;
  }
  let res = r.res === 'retry' ? 'bad' : r.res, hint = '';
  // Lücke braucht die -s-Form, getippt wurde die Grundform (marker statt markers)
  const bare = s.t === 'gapt' && w.gap.inf && r.res === 'ok' && !r.alt && normIn(w, raw) !== canon(w.gap.word);
  const dx = r.res === 'ok' && !bare ? null : spellDiff(w, raw, bare ? [w.gap.word] : [s.t === 'gapt' ? w.gap.word : w.plain, ...w.forms], s.t === 'type');
  if (bare) { res = 'near'; hint = `Das Wort stimmt! In diesen Satz passt aber <b lang="en">${esc(w.gap.word)}</b> – achte auf die Endung.`; }
  else if (res === 'ok' && r.cap) { res = 'near'; hint = `Achte auf die Großschreibung: <b lang="en">${r.cap.map(esc).join(', ')}</b>`; }
  else if (res === 'ok' && r.alt) hint = `Auch richtig! Im Buch steht <b lang="en">${esc(w.plain)}</b>.`;
  else if (res === 'ok' && r.full && s.t !== 'gapt') hint = `Im Buch: <b lang="en">${esc(w.plain)}</b>`;
  else if (res === 'ok' && r.low) hint = 'Kleiner Tipp: Englische Nomen schreibt man klein.';
  else if (res === 'near' && r.apos !== undefined) hint = 'Achte auf das Häkchen (Apostroph).';
  else if (res === 'near') hint = `Kleiner Tippfehler – schau dir ${dx ? 'die markierten Buchstaben' : 'die Schreibweise nochmal'} an.`;
  else if (r.other) hint = `„<span lang="en">${esc(r.other.plain)}</span>“ heißt ${esc(deShort(r.other))}.`;
  inp.readOnly = true;
  inp.classList.add(res === 'ok' ? 'is-right' : res === 'near' ? 'is-near' : 'is-wrong');
  if (COARSE) inp.blur();
  judge(s, res, { hint, dx });
}

// ---------- Antwort werten ----------
function judge(s, res, x = {}) {
  const w = s.w, V = SES.view;
  V.before = S.w[w.id] ? { ...S.w[w.id] } : null;
  V.combo0 = SES.combo;
  V.res = res;
  grade(w, V.hinted && s.g === 'recall' ? 'recog' : s.g, res);
  bump('a');
  let xp = 0;
  if (res === 'ok') {
    xp = V.hinted ? 6 : XP_OF[s.t] || 8;
    SES.ok++;
    SES.combo++;
    bump('ok');
    if ((s.t === 'type' || s.t === 'gapt') && !V.hinted) statInc('typed');
  } else if (res === 'near') {
    xp = 4;
    SES.near++;
  } else {
    SES.bad++;
    SES.errs++;
    SES.combo = 0;
    requeue(s);
    if (x.found) xp = 2;   // nach Fehlversuch selbst gefunden
  }
  V.xp = xp;
  addXP(xp);
  if (res === 'ok') comboZap();
  SES.best = Math.max(SES.best, SES.combo);
  statMax('combo', SES.combo);
  SES.done++;
  commit();
  showFeedback(s, res, x);
  renderBar();
  renderMeta(res === 'ok');
}

// Falsch? Dann kommt das Wort 3–5 Aufgaben später nochmal (höchstens zweimal)
function requeue(s) {
  const w = s.w, n = SES.req[w.id] || 0;
  if (n >= 2) return;
  SES.req[w.id] = n + 1;
  const r = s.g === 'recall' ? stepRecall(w, true) : { t: s.t, w, g: s.g };
  r.again = true;
  SES.q.splice(Math.min(SES.q.length, 2 + rnd(3)), 0, r);
  SES.view.req = r;
}

function showFeedback(s, res, x = {}) {
  const w = s.w, V = SES.view;
  SES.phase = 'fb';
  const cls = res === 'ok' ? 'ok' : res === 'near' || x.found ? 'near' : 'bad';
  setFoot(cls);
  const head = x.over ? 'Okay, zählt!' : res === 'ok' ? pickOne(PRAISE) : res === 'near' ? 'Fast richtig!'
    : x.found ? 'Gefunden!' : res === 'miss' ? 'Merk es dir:' : 'Nicht ganz.';
  const mood = res === 'ok' ? 'happy' : cls === 'near' ? 'wow' : 'sad';
  const shown = s.t === 'gapt' || s.t === 'gapc' ? w.gap.word : w.plain;
  const hints = [];
  if (x.hint) hints.push(x.hint);
  if (w.no) hints.push(`<b>Merke:</b> ${esc(w.no)}`);
  const dx = res !== 'ok' && x.dx;
  $('#ses-fb').innerHTML = `<div class="fb-head">${fox(mood)}<span>${head}</span>${V.xp ? `<span class="fb-xp">+${V.xp} XP</span>` : ''}</div>
    ${dx ? `<p class="fb-ans fb-you">Du: <b lang="en" class="dx">${dxHTML(dx, 'you', x.sep)}</b></p>` : ''}
    <div class="fb-row"><p class="fb-ans">${res === 'ok' || x.found ? '' : 'Richtig: '}<b lang="en"${dx ? ' class="dx"' : ''}>${dx ? dxHTML(dx, 'fix', x.sep) : esc(shown)}</b> = ${esc(deShort(w))}</p>${sayBtn(w)}</div>
    ${shown === w.plain && w.ip ? `<p class="fb-ip">${ipaHTML(w)}</p>` : ''}
    ${hints.map(h => `<p class="fb-hint">${h}</p>`).join('')}`;
  V.canOver = (s.t === 'type' || s.t === 'gapt') && (res === 'bad' || res === 'near') && !x.over;
  setSkip(V.canOver ? 'Ich hatte recht' : '');
  setGo(`Weiter ${icon('arrow-right')}`, res === 'ok' ? 'btn-good' : cls === 'near' ? 'btn-near' : 'btn-bad');
  if (res === 'ok') autoNext(hints.length ? AUTO_HINT_MS : V.zap ? ZAP_MS - 300 : AUTO_MS);
  if (!x.over) Sfx.play(res === 'ok' ? 'ok' : cls === 'near' ? 'near' : 'bad');
  autoSay(w, 200);
}

// Korrektur zeigen: „you“ = Eingabe mit falschen Buchstaben rot und Lücken, wo etwas fehlt;
// „fix“ = richtiges Wort, die korrigierten Buchstaben grün
// sep = ' ' bei Wort-Kacheln: Leerzeichen zwischen den Wörtern, jedes Wort eigens markiert
function dxHTML(ops, side, sep = '') {
  let html = '', run = '', cls = '', n = 0;
  const flush = () => { if (run) html += cls ? `<mark class="${cls}">${run}</mark>` : run; run = ''; };
  const space = () => { if (sep && n++) { flush(); html += sep; } };
  const put = (c, k, free) => { if (!free) space(); if (k !== cls) { flush(); cls = k; } run += esc(c); };
  for (const o of ops) {
    if (side === 'you') {
      if (o.op !== '+') put(o.a.c, o.op === '=' || o.a.free ? '' : 'dx-bad', o.a.free);
      else if (!o.b.free) { space(); flush(); html += '<span class="dx-gap" aria-hidden="true"></span>'; }
    } else if (o.op !== '-') put(o.b.c, o.op === '=' || o.b.free ? '' : 'dx-fix', o.b.free);
  }
  flush();
  return html;
}

// Richtig? Dann geht es nach kurzer Pause von selbst weiter (mit Hinweis länger).
// Bei Fehlern wartet die Übung auf „Weiter“, damit die Korrektur gelesen wird.
// Nach einer Blitz-Feier etwas länger, damit sie nicht über der nächsten Aufgabe liegt.
const AUTO_MS = 1100, AUTO_HINT_MS = 2400, AUTO_MAX = 4500, ZAP_MS = 2000;
function autoNext(ms) {
  const V = SES.view, go = $('#ses-go'), t0 = performance.now();
  go.style.setProperty('--auto', ms + 'ms');
  go.classList.add('is-auto');
  const tick = () => {
    V.auto = 0;
    if (!SES || SES.view !== V || SES.phase !== 'fb') return;
    // Fenster offen oder das Wort wird noch vorgelesen: kurz warten
    if (Modal.open || (TTS.busy() && performance.now() - t0 < AUTO_MAX)) { V.auto = setTimeout(tick, 150); return; }
    nextStep();
  };
  V.auto = setTimeout(tick, ms);
}
function stopAuto() {
  const V = SES && SES.view;
  if (V && V.auto) { clearTimeout(V.auto); V.auto = 0; }
  $('#ses-go').classList.remove('is-auto');
}
// Wer auf Anhören tippt, will in Ruhe zuhören – dann bleibt „Weiter“ stehen.
$('#session').addEventListener('click', e => {
  if (SES && SES.phase === 'fb' && e.target.closest('[data-act="say"], [data-act="say-ex"]')) stopAuto();
});

// „Ich hatte recht“: Bewertung zurücknehmen und als richtig zählen
function overrule() {
  const s = SES.cur, V = SES.view, w = s.w;
  if (!V.canOver) return;
  if (V.before) S.w[w.id] = V.before; else delete S.w[w.id];
  grade(w, V.hinted ? 'recog' : s.g, 'ok');
  if (V.res === 'near') SES.near--; else { SES.bad--; SES.errs--; }
  SES.ok++;
  bump('ok');
  const gain = (V.hinted ? 6 : XP_OF[s.t]) - V.xp;
  bump('fx');
  addXP(gain);
  V.xp += gain;
  if (!V.hinted) statInc('typed');
  SES.combo = V.combo0 + 1;
  SES.best = Math.max(SES.best, SES.combo);
  statMax('combo', SES.combo);
  comboZap();
  if (V.req) {
    const i = SES.q.indexOf(V.req);
    if (i >= 0) { SES.q.splice(i, 1); SES.req[w.id]--; }
    V.req = null;
  }
  V.res = 'ok';
  const inp = $('#ans');
  if (inp) { inp.classList.remove('is-wrong', 'is-near'); inp.classList.add('is-right'); }
  commit();
  showFeedback(s, 'ok', { over: true });
  Sfx.play('ok');
  renderBar();
  renderMeta(true);
  $('#ses-go').focus({ preventScroll: true });
}

// ---------- Hauptknopf und „Weiß ich nicht“ ----------
function sesGo() {
  if (!SES || Modal.open || $('#ses-go').disabled) return;
  if (SES.kind === 'test') { testGo(); return; }
  if (SES.kind === 'blitz') { blitzGo(); return; }
  if (SES.phase === 'end') { closeSession(); return; }
  if (SES.phase === 'fb') { nextStep(); return; }
  if (performance.now() - SES.shownAt < 250) return;   // Doppelklick überspringt nichts
  const t = SES.cur.t;
  if (t === 'intro') introDone();
  else if (t === 'tiles') checkTiles();
  else if (t === 'type' || t === 'gapt') checkTyped();
  else if (t === 'speak') spkGo();
  else if (t === 'sent') satzGo();
}

function sesSkip() {
  if (!SES || Modal.open) return;
  if (SES.kind === 'test') { testSkip(); return; }
  if (SES.kind === 'blitz') return;
  if (SES.phase === 'fb') { overrule(); return; }
  if (SES.phase !== 'ask' || !SES.cur) return;
  const s = SES.cur, V = SES.view;
  if (s.t === 'intro' || s.t === 'match') return;
  if (s.t === 'speak') { spkSkip(); return; }
  if (s.t === 'sent') { satzSkip(); return; }
  if (V.opts) markOpts(-1, V.right);
  if (V.t === 'gapc') { const g = $('#gap-slot'); g.textContent = s.w.gap.word; g.classList.add('is-right'); }
  $$('#ses-body button.tile').forEach(b => { b.disabled = true; });
  const inp = $('#ans');
  if (inp) inp.readOnly = true;
  judge(s, 'miss');
  $('#ses-go').focus({ preventScroll: true });
}

// Tasten 1–4 wählen eine Antwort
function optKey(n) {
  if (!SES) return false;
  const b = $$('#ses-body .opt')[n - 1];
  if (!b || b.disabled) return false;
  b.click();
  return true;
}

$('#ses-go').addEventListener('click', sesGo);
$('#ses-skip').addEventListener('click', sesSkip);
$('#ses-close').addEventListener('click', sesQuit);

// ---------- Ergebnis und Belohnungen ----------
function goalHTML(xp0) {
  const goal = S.set.goal || 100, xp = todayXP(), done = xp >= goal;
  const pc = v => Math.min(100, v / goal * 100).toFixed(1);
  return `<div class="goalbar${done ? ' is-done' : ''}"><div class="goalbar-top"><b>${done ? 'Tagesziel geschafft!' : 'Tagesziel'}</b><span>${fmtN(xp)} / ${fmtN(goal)} XP</span></div>
    <div class="xpbar"><i id="goal-fill" style="width:${pc(xp0)}%" data-to="${pc(xp)}"></i></div></div>`;
}
function animateGoal() {
  for (const i of [$('#goal-fill'), $('#ln-fill')]) {
    if (i) requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = i.dataset.to + '%'; }));
  }
}
// Gelernte Wörter der Aufgabe: Zahl und Balken wachsen um die neuen
function resLearnedHTML() {
  const a = curAsg();
  if (!a || SES.ln0 < 0) return '';
  const n = poolOf(a).length, k = learnedNow(), pc = v => (n ? v / n * 100 : 0).toFixed(1);
  return `<div class="res-learned">${learnedHTML(k, n, k - SES.ln0)}
    <div class="lvbar" aria-hidden="true"><i class="l4" id="ln-fill" style="width:${pc(Math.min(k, SES.ln0))}%" data-to="${pc(k)}"></i></div></div>`;
}
function resultHTML(o) {
  return `<div class="result">${fox(o.mood)}<h1>${o.title}</h1>${o.lead ? `<p class="lead">${o.lead}</p>` : ''}
    ${o.learned ? resLearnedHTML() : ''}<div class="rstats">${o.stats.map(([cls, label, ic, val]) => `<div class="rs ${cls}"><span>${label}</span><b>${icon(ic)}${val}</b></div>`).join('')}</div>
    ${talGainHTML()}${goalHTML(SES.xp0)}
    ${o.chips ? `${o.note ? `<p class="res-note">${o.note}</p>` : ''}<div class="wchips">${o.chips}</div>` : ''}</div>`;
}

function finish() {
  const secs = Math.min(1800, Math.round((Date.now() - SES.t0) / 1000));
  bump('l');
  bump('s', secs);
  const n = SES.ok + SES.near + SES.bad;
  const perfect = SES.errs === 0 && n >= 3;
  statInc('les');
  if (perfect) statInc('perf');
  addXP(15 + (perfect ? 15 : 0));
  markDay();
  aktSes(secs);
  commit();
  const acc = n ? Math.round(100 * (SES.ok + SES.near / 2) / n) : 100;
  $('#ses-body').innerHTML = resultHTML({
    mood: acc >= 60 ? 'happy' : '', title: RES_TITLE[SES.kind] || 'Geschafft!', learned: true,
    lead: perfect ? '<b>Fehlerfrei! +15 XP</b>' : '',
    stats: [['rs-xp', 'XP', 'zap', '+' + fmtN(SES.xp)], ['rs-acc', 'Richtig', 'target', acc + ' %'], ['rs-time', 'Zeit', 'clock', fmtTime(secs)]],
    chips: SES.list.slice(0, 12).map(w => `<span class="wchip" lang="en">${esc(w.plain)}</span>`).join(''),
  });
  showEnd(true);
}

function showEnd(win) {
  SES.phase = 'end';
  SES.cur = null;
  setFoot('');
  $('#ses-fb').innerHTML = '';
  setSkip('');
  setGo(`Weiter ${icon('arrow-right')}`);
  $('#ses-meta').innerHTML = '';
  $('#ses-foot').hidden = false;
  renderBar(1);
  $('#ses-scroll').scrollTop = 0;

}

const modalBtn = label => `<div class="modal-btns"><button class="btn btn-primary" type="button" data-act="modal-close" autofocus>${label}</button></div>`;
function badgeModals() {
  const got = checkBadges();
  if (got.length) commit();
  return got.map(b => [`<div class="kicker">Neues Abzeichen</div><div class="medal" style="--bc:${b.c}">${icon(b.ic)}</div>
    <h2 id="modal-title">${esc(b.n)}</h2><p>${esc(b.d)}</p>${modalBtn('Juhu!')}`]);
}
// Serie, Tagesziel, Abzeichen, Level – nacheinander
function rewardModals() {
  const out = [];
  const st = streakInfo();
  if (SES.first && st.todayDone && st.n > 0) {
    out.push([`<div class="modal-art-flame">${icon('flame', 'ic-fill')}</div><div class="modal-num">${st.n}</div>
      <h2 id="modal-title">${st.n === 1 ? 'Deine Serie startet!' : 'Tage in Folge!'}</h2>
      <p>${st.n === 1 ? 'Lern morgen wieder – dann wächst deine Flamme.' : 'Stark! Komm morgen wieder, damit deine Serie weiterläuft.'}</p>${modalBtn('Weiter')}`]);
    SES.first = false;
  }
  const goal = S.set.goal || 100;
  if (SES.xp0 < goal && todayXP() >= goal) {
    out.push([`${fox('happy')}<h2 id="modal-title">Tagesziel geschafft!</h2><p>${fmtN(todayXP())} XP heute – richtig stark!</p>${modalBtn('Super!')}`]);
  }
  out.push(...badgeModals());
  const L = levelInfo();
  if (L.L > SES.L0) {
    out.push([`${fox('wow')}<div class="kicker">Level-Aufstieg</div><h2 id="modal-title">Level ${L.L}!</h2><p>Du bist jetzt <b>${esc(L.name)}</b>.</p>${modalBtn('Weiter')}`,
      () => { Sfx.play('level'); confetti(70); }]);
    SES.L0 = L.L;
  }
  if (out.length) after(900, () => out.forEach(([html, onShow]) => Modal.show(html, { onShow })));
}

// ---------- Startknöpfe ----------
ACT.review = () => {
  if (SES) return;
  const list = dueWords(sesPool());

  startSession('review', { words: list });
};
ACT.strengthen = () => {
  if (SES) return;
  const list = weakWords(sesPool());
  if (!list.length) { toast('Lern erst eine Station – dann kannst du festigen.'); Sfx.play('near'); return; }
  startSession('strengthen', { words: list });
};
ACT.oops = () => {
  if (SES) return;
  const list = oopsWords(sesPool());
  if (!list.length) { toast(`${icon('sparkles')} Keine Fehlerwörter – stark!`); Sfx.play('near'); return; }
