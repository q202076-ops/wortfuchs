  r.req = (b.req.m || 0) > (a.req.m || 0) ? b.req : a.req;
  const red = new Map();
  for (const x of [...a.red, ...b.red]) red.set(x.id, x);
  r.red = [...red.values()].sort((x, y) => x.t - y.t).slice(-400);   // Kontostand rechnet mit dem Verlauf
  // Aktivität für die Eltern (aktivitaet.js): vereint nach id
  const log = new Map();
  for (const x of [...a.log, ...b.log]) log.set(x.id, x);
  r.log = [...log.values()].sort((x, y) => x.t - y.t).slice(-AKT_MAX);
  return r;
}

function loadLocal() {
  try {
    const t = localStorage.getItem(LS_KEY);
    if (t) return unpack(JSON.parse(t));
  } catch (e) { /* kein Speicher verfügbar */ }
  return null;
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(pack(S))); } catch (e) { /* voll oder gesperrt */ }
}

// ---------- Lernstand eines Worts ----------
const ws = w => S.w[w.id];
const lvl = w => (S.w[w.id] && S.w[w.id].b) || 0;
const isDue = (w, t = today()) => { const s = S.w[w.id]; return !!s && s.b >= 1 && s.d <= t; };
const groupOf = b => b <= 0 ? 0 : b <= 2 ? 1 : b === 3 ? 2 : 3;   // Neu, Am Lernen, Gelernt, Sicher
const GROUPS = ['Neu', 'Am Lernen', 'Gelernt', 'Sicher'];

// kind: intro | recog | recall;  res: ok | near | bad | miss
function grade(w, kind, res) {
  const t = today();
  const s = S.w[w.id] || (S.w[w.id] = { b: 0, d: t, n: 0, c: 0, x: 0, r: 0, f: t, m: 0 });
  if (!s.f) s.f = t;
  s.n++;
  if (kind === 'intro') {
    if (s.b < 1) { s.b = 1; s.f = t; }
    s.d = t;
  } else if (res === 'ok') {
    s.c++;
    if (kind === 'recog') {
      if (s.b < 2) { s.b = 2; s.d = t; }
    } else {
      const wasFive = s.b >= 5;
      if (s.b < 3) s.b = 3;
      else if (s.d <= t && s.r !== t) s.b = Math.min(5, s.b + 1);
      s.r = t;
      s.d = t + (wasFive ? 7 : INTERVAL[s.b]);
      const a = curAsg();
      if (a && a.test) {
        const T = keyNum(a.test);
        if (T > t) s.d = Math.min(s.d, Math.max(t + 1, T - 1));
      }
    }
  } else if (res === 'near') {
    s.d = t;
  } else if (res === 'bad') {
    s.x++; s.b = Math.max(1, s.b - 2); s.d = t;
  } else if (res === 'miss') {
    s.x++; s.d = t;
    if (s.b < 1) s.b = 1;
  }
  s.m = Date.now();
}

// ---------- Aufgaben (Seitenbereiche) ----------
const curAsg = () => { const a = S.asg[S.cur]; return a && !a.del ? a : null; };
const asgId = (from, to) => `p${from}-${to}`;
const poolCache = new Map();
function poolOf(a) {
  if (!a) return [];
  const key = `${a.from}-${a.to}-${a.box ? 1 : 0}-${a.ext ? 1 : 0}`;
  if (poolCache.has(key)) return poolCache.get(key);
  const res = [];
  for (const w of WORDS) {
    const o = w.o.find(o => o[0] >= a.from && o[0] <= a.to && (o[1] === 0 || (o[1] === 1 && a.box) || (o[1] === 2 && a.ext)));
    if (o) res.push([o[3], w, o]);
  }
  res.sort((x, y) => x[0] - y[0]);
  const out = res.map(x => x[1]);
  out.occ = new Map(res.map(x => [x[1].id, x[2]]));
  if (poolCache.size > 40) poolCache.delete(poolCache.keys().next().value);
  poolCache.set(key, out);
  return out;
}
// Wie viele Wörter ein Bereich hätte – und was die Schalter dazugeben würden
function rangeInfo(from, to, box, ext) {
  const n = a => poolOf(Object.assign({ from, to, box, ext }, a)).length;
  return { n: n({}), plusBox: n({ box: true }) - n({ box: false }), plusExt: n({ ext: true }) - n({ ext: false }) };
}

const STATION = 5;
function stationsOf(a) {
  const pool = poolOf(a);
  const out = [];
  let cur = null;
  for (const w of pool) {
    const o = pool.occ.get(w.id);
    const u = LABELS[o[2]].u;
    if (!cur || cur.unit !== u || cur.words.length >= STATION) {
      cur = { i: out.length, unit: u, words: [], page: o[0] };
      out.push(cur);
    }
    cur.words.push(w);
  }
  // Kleine Reste an die vorige Station derselben Unit hängen
  for (let i = out.length - 1; i > 0; i--) {
    const s = out[i], p = out[i - 1];
    if (s.words.length <= 2 && p.unit === s.unit && p.words.length + s.words.length <= 7) {
      p.words.push(...s.words);
      out.splice(i, 1);
    }
  }
  out.forEach((s, i) => { s.i = i; });
  let foundCur = false;
  for (const s of out) {
    const ls = s.words.map(lvl);
    s.done = ls.every(b => b >= 1);
    s.gold = ls.every(b => b >= 4);
    s.status = s.done ? (s.gold ? 'gold' : 'done') : foundCur ? 'locked' : 'current';
    if (!s.done) foundCur = true;
  }
  return out;
}

function poolInfo(a) {
  const pool = poolOf(a);
  const t = today();
  const counts = [0, 0, 0, 0];
  let r = 0, due = 0, newLeft = 0, introToday = 0;
  for (const w of pool) {
    const s = S.w[w.id];
    const b = (s && s.b) || 0;
    counts[groupOf(b)]++;
    r += WEIGHT[b];
    if (b === 0) newLeft++;
    else if (s.d <= t) due++;
    if (s && s.f === t && b > 0) introToday++;
  }
  const ready = pool.length ? r / pool.length : 0;
  const dl = a && a.test ? keyNum(a.test) - t : null;
  let newGoal;
  if (dl !== null && dl >= 1) newGoal = Math.ceil((newLeft + introToday) / Math.max(1, dl - 1));
  else newGoal = Math.min(newLeft + introToday, 10);
  const newToday = Math.max(0, Math.min(newLeft, newGoal - introToday));
  return { pool, counts, ready, due, newLeft, introToday, newToday, dl };
}

// ---------- XP, Level, Serie ----------
const todayRec = () => S.days[dayKey(today())] || (S.days[dayKey(today())] = { xp: 0, s: 0, a: 0, ok: 0, l: 0 });
const todayXP = () => (S.days[dayKey(today())] || {}).xp || 0;
const totalXP = () => sum(Object.values(S.days).map(d => d.xp || 0));
function levelInfo(xp = totalXP()) {
  let L = 1;
  while (xpAt(L + 1) <= xp) L++;
  const a = xpAt(L), b = xpAt(L + 1);
  return { L, name: LEVEL_NAMES[Math.min(L, LEVEL_NAMES.length) - 1], xp, from: a, to: b, p: (xp - a) / (b - a) };
}
function streakInfo() {
  const keys = Object.keys(S.days).filter(k => (S.days[k].l || 0) > 0).sort();
  const t = today();
  if (!keys.length) return { n: 0, best: 0, freezes: 0, todayDone: false, active: 0 };
  let n = 0, best = 0, freezes = 0, prev = null, active = 0, usedLast = 0;
  for (const k of keys) {
    const d = keyNum(k);
    if (d > t) continue;
    if (prev !== null) {
      const gap = d - prev - 1;
      if (gap > 0) {
        if (gap <= freezes) { freezes -= gap; usedLast = gap; } else { n = 0; }
      }
    }
    n++; active++;
    if (active % 7 === 0 && freezes < 2) freezes++;
    best = Math.max(best, n);
    prev = d;
  }
  let alive = true;
  const gapNow = t - prev - 1;
  if (gapNow > 0) {
    if (gapNow <= freezes) { freezes -= gapNow; usedLast = gapNow; } else alive = false;
  }
  return { n: alive ? n : 0, best, freezes, todayDone: prev === t, active, frozen: alive && gapNow > 0 ? gapNow : 0 };
}
const wordsLearned = () => Object.values(S.w).filter(s => s.b >= 3).length;

// Schlüsselreihenfolge-unabhängiger Vergleich (der Speicher liefert Felder evtl. anders sortiert)
const stable = x => Array.isArray(x) ? '[' + x.map(stable).join(',') + ']'
  : isObj(x) ? '{' + Object.keys(x).filter(k => x[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(x[k])).join(',') + '}'
  : JSON.stringify(x === undefined ? null : x);
const hasProgress = () => !!(Object.keys(S.w).length || Object.keys(S.asg).length || S.onb);

// ---------- Speichern: Browser + Claude-Konto ----------
const STOP_CODES = ['invalid_argument', 'quota_exceeded', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'transform_error'];
const Sync = {
  mode: 'local',          // local | wait | cloud | off
  ref: null, lastPull: 0, timer: 0, busy: false, again: false, dirty: false, backoff: 0,
  onChange: null, onStatus: null,
  status(m) { this.mode = m; if (this.onStatus) this.onStatus(m); },
  async start() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return this.status('local');
    this.status('wait');
    try {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return this.status('local');
      const uid = await user.id();
      if (!uid) return this.status('local');
      this.ref = db.doc('data/users/' + uid + '/progress');
      await this.pull();
      this.status('cloud');
      if (this.dirty) this.schedule();
    } catch (e) {
      this.fail(e);
    }
  },
  async call(fn) {
    try { return await fn(); } catch (e) {
      const code = e && e.code;
      if (code === 'resource_exhausted' || STOP_CODES.includes(code)) throw e;
      await sleep(400 + Math.random() * 900);
      return await fn();
    }
  },
  async pull() {
    const snap = await this.call(() => this.ref.get());
    this.lastPull = Date.now();
    if (snap && snap.exists) {
      const raw = snap.data() || {};
      const remote = unpack(JSON.parse(JSON.stringify(raw)));
      const before = stable(pack(S));
      S = mergeState(S, remote);
      const after = stable(pack(S));
      if (after !== before) { saveLocal(); if (this.onChange) this.onChange(); }
      if (after !== stable(raw)) this.dirty = true;
    } else if (hasProgress()) {
      this.dirty = true;
    }
  },
  mark() { this.dirty = true; this.schedule(); },
  schedule(ms = 3000) {
    if (this.mode !== 'cloud') return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), Math.max(ms, this.backoff));
  },
  async flush() {
    if (this.mode !== 'cloud' || !this.ref) return;
    if (!this.dirty && this.lastPull) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    clearTimeout(this.timer);
    try {
      if (Date.now() - this.lastPull > 60000) await this.pull();
      if (this.dirty) {
        const body = pack(S);
        this.dirty = false;
        await this.call(() => this.ref.set(body));
        this.lastPush = Date.now();
      }
      this.backoff = 0;
    } catch (e) {
      this.dirty = true;
      this.fail(e);
    }
    this.busy = false;
    if (this.again) { this.again = false; this.schedule(); }
  },
  fail(e) {
    const code = e && e.code;
    if (code === 'resource_exhausted') this.backoff = Math.min(120000, (this.backoff || 5000) * 2);
    if (STOP_CODES.includes(code) || !this.ref) return this.status('off');
    // vorübergehend (unavailable, unbekannt, Rate-Limit): später erneut versuchen
    this.status('cloud');
    this.schedule(Math.max(30000, this.backoff));
  },
};

function commit() {
  saveLocal();
  Sync.mark();
  fcMark();   // Fuchs-Code (sichern.js)
}
</script>

// ---------- Vorlesen ----------
// Zuerst feste Aufnahmen: VOCAB.sv = Stimmen [{id, l}], die erste ist Standard. Nur die gewählte wird nachgeladen
// (stimme-<id>.js neben dem Spiel, setzt window.STIMME = { v: id, a: { Text: MP3 als base64 } }).
// Sonst – oder bis die Datei da ist – die Sprachausgabe des Browsers.
// S.set.voice: '' = Standard-Aufnahme, 'rec:<id>' = diese Aufnahme, sonst voiceURI einer Gerätestimme.
const TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance === 'function',
  voices: [],
  voice: null,
  // Höchstens 3 gut verständliche Stimmen anbieten, britische zuerst – keine Spaß- und Roboterstimmen (Bubbles, Zarvox, Grandpa …)
  MAX: 3,
  odd: /^(albert|bad news|bahh|bells|boing|bruce|bubbles|cellos|deranged|eddy|flo|fred|good news|grandma|grandpa|hysterical|jester|junior|kathy|organ|pipe organ|princess|ralph|reed|rocko|sandy|shelley|superstar|trinoids|vicki|victoria|whisper|wobble|zarvox)\b/i,
  good: /\b(daniel|kate|serena|arthur|martha|oliver|stephanie|jamie|libby|sonia|ryan|maisie|thomas|hazel|george|susan|samantha|aaron|nicky|alex|ava|allison|tom|zoe|evan|google)\b/i,
  score(v) {
    const n = v.name || '';
    if (this.odd.test(n) || /eloquence|novelty/i.test(v.voiceURI || '')) return -1;
    return (/en[-_]GB/i.test(v.lang) ? 100 : /en[-_]US/i.test(v.lang) ? 50 : 0)
      + (/natural|neural|premium|enhanced|erweitert|verbessert|optimiert/i.test(n + ' ' + (v.voiceURI || '')) ? 20 : 0)
      + (this.good.test(n) ? 10 : 0);
  },
  // "Microsoft Libby Online (Natural) - English (United Kingdom)" -> "Libby · britisch"
  label(v) {
    const n = (v.name || '').replace(/^microsoft\s+/i, '').replace(/\s+online\b.*$/i, '').replace(/\s+[-–]\s.*$|\s*\(.*$/, '').trim() || v.name;
    return `${n} · ${/en[-_]GB/i.test(v.lang) ? 'britisch' : /en[-_]US/i.test(v.lang) ? 'amerikanisch' : 'englisch'}`;
  },
  init() {
    // einmalig: früher gewählte Gerätestimme durch die Aufnahmen ersetzen
    if ((VOCAB.sv || []).length && !S.set.vr) { S.set.vr = 1; if (S.set.voice && !S.set.voice.startsWith('rec:')) S.set.voice = ''; }
    this.loadRec();
    const un = () => this.unlock();
    for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, un, { once: true, capture: true });
    if (!this.ok) return;
    const load = () => {
      try {
        const seen = new Set();
        this.voices = speechSynthesis.getVoices()
          .filter(v => /^en([-_]|$)/i.test(v.lang) && this.score(v) >= 0)
          .sort((a, b) => this.score(b) - this.score(a))
          .filter(v => { const k = this.label(v); return !seen.has(k) && seen.add(k); })
          .slice(0, this.MAX);
      } catch (e) { this.voices = []; }
      this.pick();
    };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  pick() {
    // Liste ist schon nach Güte sortiert; eine früher gewählte Spaßstimme fällt so automatisch weg
    this.voice = this.voices.find(v => v.voiceURI === S.set.voice) || this.voices[0] || null;
    this.loadRec();
  },
  au: null,
  rec: '',       // geladene Aufnahme-Stimme
  recLoading: '',
  recWait: [],
  recBad: {},    // Datei fehlt (z. B. auf claude.ai) – nicht immer wieder versuchen
  recId() {
    const sv = VOCAB.sv || [], v = S.set.voice || '';
    if (!sv.length || (v && !v.startsWith('rec:'))) return '';
    return (sv.find(x => 'rec:' + x.id === v) || sv[0]).id;
  },
  recOn() { const id = this.recId(); return !!id && this.rec === id && !!(window.STIMME && STIMME.v === id); },
  // gewählte Aufnahme-Stimme nachladen; cb läuft, sobald sie da ist (oder feststeht, dass es keine gibt)
  loadRec(cb) {
    const id = this.recId();
    if (!id || this.rec === id || this.recBad[id]) { if (cb) cb(); return; }
    if (cb) this.recWait.push(cb);
    if (this.recLoading === id) return;
    this.recLoading = id;
    const s = document.createElement('script');
    const done = () => {
      if (window.STIMME && STIMME.v === id) this.rec = id;
      if (this.recLoading === id) this.recLoading = '';
      s.remove();
      if (id === this.recId()) this.recWait.splice(0).forEach(f => f());
    };
    s.onload = done;
    s.onerror = () => { this.recBad[id] = 1; done(); };
    s.async = true;
    s.src = `stimme-${id}.js`;
    document.head.appendChild(s);
  },
  // iOS spielt Audio ohne Fingertipp erst, nachdem dasselbe Element einmal beim Tippen lief
  unlock() {
    if (this.au || typeof Audio !== 'function') return;
    try {
      const silent = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQQAAAAAAAAA';
      this.au = new Audio(silent);
      this.au.preload = 'auto';
      this.au.play().catch(() => {});
    } catch (e) { this.au = null; }
  },
  playRec(text, slow) {
    const b64 = STIMME.a[text];
    if (!b64) return false;
    this.unlock();
    const a = this.au;
    if (!a) return false;
    try {
      if (this.ok) speechSynthesis.cancel();
      a.pause();
      a.src = 'data:audio/mpeg;base64,' + b64;
      a.preservesPitch = a.webkitPreservesPitch = true;
      a.playbackRate = a.defaultPlaybackRate = clamp((S.set.rate || 0.9) / 0.9 * (slow ? 0.72 : 1), 0.5, 1.5);
      // Abspielen verweigert (z. B. noch kein Fingertipp) -> Browserstimme
      a.play().catch(e => { if (!e || e.name !== 'AbortError') this.speakTTS(text, slow); });
      return true;
    } catch (e) { return false; }
  },
  speak(text, slow = false) {
    if (!text) return;
    if (this.recOn() && this.playRec(text, slow)) return;
    this.speakTTS(text, slow);
  },
  speakTTS(text, slow) {
    if (!this.ok) return;
    if (this.au) this.au.pause();
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = this.voice ? this.voice.lang : 'en-GB';
      if (this.voice) u.voice = this.voice;
      u.rate = clamp((S.set.rate || 0.9) * (slow ? 0.6 : 1), 0.4, 1.5);
      // Chrome verschluckt manchmal den Anfang direkt nach cancel()
      setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { /* stumm */ } }, 30);
    } catch (e) { /* Sprachausgabe nicht verfügbar */ }
  },
  stop() {
    if (this.au) { try { this.au.pause(); } catch (e) { /* egal */ } }
    if (this.ok) { try { speechSynthesis.cancel(); } catch (e) { /* egal */ } }
  },
  busy() {
    if (this.au && !this.au.paused && !this.au.ended) return true;
    try { return this.ok && (speechSynthesis.speaking || speechSynthesis.pending); } catch (e) { return false; }
  },
};
const canListen = () => TTS.ok && S.set.tts;
const sayWord = (w, slow) => TTS.speak(speakable(w.en), slow);
const autoSay = (w, ms = 0) => { if (canListen()) after(ms, () => sayWord(w)); };
const sayBtn = (w, slow = false, cls = 'say') => TTS.ok

  : '';
// Lautschrift wie im Buch, z. B. [ˈsɪzəz]
const ipaHTML = (w, cls = 'ipa') => w.ip ? `<span class="${cls}" lang="en-fonipa">[${esc(w.ip)}]</span>` : '';
ACT.say = el => { const w = BY_ID.get(el.dataset.id); if (w) sayWord(w, !!el.dataset.slow); };

// ---------- Klänge (kurz, selbst erzeugt) ----------
const Sfx = {
  ctx: null,
  get() {
    if (!this.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { this.ctx = new C(); } catch (e) { return null; }
    }
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { /* egal */ } }
    return this.ctx;
  },
  tone(c, f, t, d, type, v, f2) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + d + 0.05);
  },
  // Knistern für den Blitz: kurzes Rauschen durch einen Bandpass
  noise(c, t, d, v, hz) {
    const n = Math.round(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = b;
    f.type = 'bandpass';
    f.frequency.value = hz;
    f.Q.value = 0.9;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f);
    f.connect(g);
    g.connect(c.destination);
    src.start(t);
    src.stop(t + d + 0.02);
  },
  play(name, lv = 1) {
    if (!S.set.sfx) return;
    const c = this.get();
    if (!c) return;
    const t = c.currentTime + 0.02;
    const T = (f, dt, d, type = 'sine', v = 0.14, f2) => this.tone(c, f, t + dt, d, type, v, f2);
    switch (name) {
      case 'ok': T(784, 0, 0.12, 'sine', 0.16); T(1175, 0.08, 0.24); break;
      case 'near': T(659, 0, 0.14, 'sine', 0.13); T(740, 0.1, 0.18, 'sine', 0.11); break;
      case 'bad': T(330, 0, 0.16, 'triangle', 0.16, 300); T(247, 0.13, 0.28, 'triangle', 0.15, 220); break;
      case 'tap': T(1320, 0, 0.05, 'sine', 0.05); break;
      case 'pair': T(988, 0, 0.09, 'sine', 0.12); T(1319, 0.06, 0.12, 'sine', 0.1); break;
      case 'combo': [659, 784, 988, 1319].forEach((f, i) => T(f, i * 0.065, 0.16, 'triangle', 0.12)); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => T(f, i * 0.11, 0.3, 'triangle', 0.14)); T(1319, 0.46, 0.5, 'sine', 0.12); break;
      case 'level': [392, 523, 659, 784, 1047, 1319].forEach((f, i) => T(f, i * 0.08, 0.3, 'square', 0.045)); break;
      // Blitz-Feier: Zischen, dann Fanfare – je Stufe einen Ton höher und voller
      case 'zap': {
        const k = Math.pow(2, [0, 2, 4, 5][lv - 1] / 12), n = [523, 659, 784, 1047].map(f => f * k);
        try { this.noise(c, t, 0.22, 0.22, 2600); } catch (e) { /* egal */ }
        T(1900, 0, 0.2, 'sawtooth', 0.045, 140);
        n.forEach((f, i) => T(f, 0.16 + i * 0.07, 0.2, 'triangle', 0.13));
        T(n[3], 0.46, 0.55, 'sine', 0.11);
        T(n[1] * 2, 0.46, 0.55, 'sine', 0.06);
        if (lv >= 3) [2, 2.52].forEach((m, i) => T(n[0] * m * 2, 0.62 + i * 0.07, 0.25, 'sine', 0.05));
        break;
      }
      case 'tick': T(1760, 0, 0.03, 'square', 0.03); break;
      case 'start': T(440, 0, 0.1); T(660, 0.1, 0.1); T(880, 0.2, 0.2, 'sine', 0.16); break;
    }
  },
};

const Modal = {
  q: [], open: false, cur: null, back: null,
  show(html, opts = {}) {
    this.q.push({ html, opts });
    if (!this.open) this.next();
  },
  next() {
    const m = this.q.shift();
    const el = $('#modal');
    if (!m) {
      el.hidden = true;
      this.open = false;
      this.cur = null;
      if (this.back && this.back.isConnected) { try { this.back.focus({ preventScroll: true }); } catch (e) { /* egal */ } }
      this.back = null;
      return;
    }
    if (!this.open) this.back = document.activeElement;
    this.open = true;
    this.cur = m;
    $('#modal-card').innerHTML = m.html;
    el.hidden = false;
    const f = $('#modal-card [autofocus]') || $('#modal-card button');
    if (f) f.focus({ preventScroll: true });
    if (m.opts.onShow) m.opts.onShow();
  },
  close(val) {
    const m = this.cur;
    this.cur = null;
    if (m && m.opts.onClose) m.opts.onClose(val);
    this.next();
  },
};
ACT['modal-close'] = el => Modal.close(el.dataset.val);

function ask({ title, text = '', yes = 'Ja', no = 'Abbrechen', danger = false, art = '', stay = false }) {
  return new Promise(res => {
    const yesB = `<button class="btn ${stay ? 'btn-ghost' : danger ? 'btn-bad' : 'btn-primary'}" type="button" data-act="modal-close" data-val="1">${yes}</button>`;

      <div class="modal-btns">${stay ? noB + yesB : yesB + noB}</div>`,
    { onClose: v => res(v === '1') });
  });
}

function trapFocus(e, root) {
  const f = $$('button:not([disabled]), input:not([disabled]), select, [tabindex]:not([tabindex="-1"])', root)
    .filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
}

// ---------- Konfetti ----------
function confetti(n = 110) {
  if (REDUCED) return;
  const cv = $('#confetti');
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = Math.round(innerWidth * dpr), H = cv.height = Math.round(innerHeight * dpr);
  const cols = ['#E65C0E', '#F2AE00', '#1E9A55', '#2E78F0', '#E5484D', '#8E4EC6', '#0E9384'];
  const ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({
      x: W * (0.3 + Math.random() * 0.4), y: H * 0.34,
      vx: (Math.random() - 0.5) * 22 * dpr, vy: (-8 - Math.random() * 15) * dpr,
      s: (7 + Math.random() * 6) * dpr, c: pickOne(cols), a: Math.random() * 6.3, va: (Math.random() - 0.5) * 0.35, k: rnd(3),
    });
  }
  const t0 = performance.now();
  let last = t0;
  cancelAnimationFrame(confetti.raf);
  const step = now => {
    const dt = Math.min(3, (now - last) / 16.7);
    last = now;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of ps) {
      p.vy += 0.5 * dpr * dt;
      p.vx *= Math.pow(0.985, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.a += p.va * dt;
      if (p.y > H + 30) continue;
      alive++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.fillStyle = p.c;
      if (p.k === 0) ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      else if (p.k === 1) { ctx.beginPath(); ctx.arc(0, 0, p.s / 3, 0, 6.3); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(0, -p.s / 2); ctx.lineTo(p.s / 2, p.s / 2); ctx.lineTo(-p.s / 2, p.s / 2); ctx.fill(); }
      ctx.restore();
    }
    if (alive && now - t0 < 5000) confetti.raf = requestAnimationFrame(step);
    else ctx.clearRect(0, 0, W, H);
  };
  confetti.raf = requestAnimationFrame(step);
}

// ---------- Kopfzeile: Serie, Tagesziel, Level ----------
function ring(p, size, sw, color) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, h = size / 2;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--rule)" stroke-width="${sw}"/>`
    + (p > 0.001 ? `<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - clamp(p, 0, 1))).toFixed(2)}" transform="rotate(-90 ${h} ${h})"/>` : '')
    + '</svg>';
}
function renderTop() {
  const st = streakInfo(), xp = todayXP(), goal = S.set.goal || 100, L = levelInfo();
  const done = xp >= goal;
  $('#stats').innerHTML =
    `<button class="stat stat-streak${st.todayDone ? '' : ' is-off'}" type="button" data-go="awards" aria-label="Serie: ${plural(st.n, 'Tag', 'Tage')}">${icon('flame', 'ic-fill')}${st.n}</button>`
    + `<button class="stat stat-goal" type="button" data-go="awards" aria-label="Tagesziel: ${fmtN(xp)} von ${fmtN(goal)} XP">${ring(xp / goal, 28, 4, done ? 'var(--good)' : 'var(--fox)')}${fmtN(xp)}<small>/${fmtN(goal)}</small></button>`
    + `<button class="stat stat-level" type="button" data-go="awards" aria-label="Level ${L.L}">${icon('star', 'ic-fill')}${L.L}</button>`;
}

// ---------- Ereignisse (ein Verteiler für alles) ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-go]');
  if (!t || t.disabled) return;
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  const f = ACT[t.dataset.act];
  if (f) f(t, e);
});
document.addEventListener('input', e => {
  const t = e.target.closest && e.target.closest('[data-in]');
  if (t && INP[t.dataset.in]) INP[t.dataset.in](t, e);
});
document.addEventListener('change', e => {
  const t = e.target.closest && e.target.closest('[data-ch]');
  if (t && CHG[t.dataset.ch]) CHG[t.dataset.ch](t, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest && e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  if (SUB[f.dataset.form]) SUB[f.dataset.form](f, e);
});
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal' && Modal.cur && !Modal.cur.opts.sticky) Modal.close();
});
</script>
<script>
/* Wortfuchs – Ansichten: Start (Aufgabe, Linie, Übungsarten), Seitenwahl,
   Wörterliste, Erfolge, Elternbereich und Willkommen. */
'use strict';

const LV_CLS = b => b >= 4 ? 'l4' : b === 3 ? 'l3' : b >= 1 ? 'l1' : '';
const LV_COL = ['var(--lv0)', 'var(--lv1)', 'var(--lv3)', 'var(--lv4)'];
const unitsOf = pool => uniq(pool.map(w => LABELS[pool.occ.get(w.id)[2]].u)).sort((x, y) => x - y);
const rangeTxt = a => a.from === a.to ? `Seite ${a.from}` : `Seite ${a.from}–${a.to}`;
const longDay = n => fmtDay(n, { weekday: 'long', day: 'numeric', month: 'long' });
const GOAL_TXT = { 50: ['Locker', '3 Min.'], 100: ['Normal', '5 Min.'], 200: ['Ehrgeizig', '10 Min.'], 300: ['Profi', '15 Min.'],
  500: ['Fleißig', '25 Min.'], 1000: ['Superfleißig', '50 Min.'], 2000: ['Marathon', '1¾ Std.'], 5000: ['Extrem', '4 Std.'], 10000: ['Legendär', '8 Std.'] };

// ======================= Start =======================
let lineOpen = false;

VIEWS.home = () => {
  const a = curAsg();
  const el = $('#v-home');
  if (!a) {
    el.innerHTML = `<div class="wrap">${greetHTML(null, null)}
      <div class="card hero-empty">${fox('happy')}<h1>Welche Seiten lernst du?</h1>
      <button class="btn btn-primary" type="button" data-go="picker">Seiten wählen ${icon('arrow-right')}</button></div></div>`;
    return;
  }
  const info = poolInfo(a);
  const st = stationsOf(a);
  el.innerHTML = `<div class="wrap">${greetHTML(a, info)}
    <div class="home-grid">${heroHTML(a, info, st)}${lineHTML(st)}${modesHTML(info)}</div></div>`;
};

function greetHTML(a, info) {
  const h = new Date().getHours();
  const nm = S.set.name ? ', ' + esc(S.set.name) : '';
  const hi = (h >= 5 && h < 11 ? 'Guten Morgen' : h >= 18 ? 'Guten Abend' : 'Hallo') + nm;
  const st = streakInfo();
  const goalDone = todayXP() >= S.set.goal;
  let msg;
  if (a && info.dl !== null && info.dl >= 0 && info.dl <= 1) msg = `${hi}! <b>Du schaffst das!</b>`;
  else if (a && st.n >= 2 && !st.todayDone) msg = `Rette deine <b>${st.n}-Tage-Serie</b>!`;
  else if (a && goalDone) msg = `<b>Tagesziel geschafft!</b>`;
  else if (!Object.keys(S.w).length) msg = `${hi}! Ich bin <b>Fitz</b>.`;
  else msg = `${hi}!`;
  return `<div class="greet">${fox(goalDone ? 'happy' : '')}<p class="bubble">${msg}</p></div>`;
}

function heroHTML(a, info, st) {
  const n = info.pool.length;
  const us = unitsOf(info.pool);
  const [, , c2, c3] = info.counts;
  const pc = x => (n ? x / n * 100 : 0).toFixed(1) + '%';
  const title = a.from === a.to ? `Seite ${a.from}` : `Seite ${a.from}<span class="dash">–</span>${a.to}`;
  return `<section class="card hero" style="--hero-c:${us.length ? UNITS[us[0]].c : 'var(--fox)'}" aria-label="Deine Aufgabe">
    <div class="hero-head"><h1>${title}</h1>
      <button class="btn btn-ghost btn-sm hero-edit" type="button" data-go="picker" aria-label="Seiten ändern">${icon('pencil')}</button></div>
    ${learnedHTML(c2 + c3, n)}
    <div class="lvbar" aria-hidden="true"><i class="l4" style="width:${pc(c2 + c3)}"></i></div>
    ${testHTML(a, info)}
    ${ctaHTML(info, st)}
  </section>`;
}

// „18 / 102 Wörter gelernt“ – auf der Startseite und im Ergebnis
function learnedHTML(k, n, plus = 0) {
  return `<p class="learned"><b>${k}</b><span class="of">/ ${n}</span>${plus > 0 ? `<span class="plus">+${plus}</span>` : ''}
    <small>${k >= n ? 'Alle Wörter gelernt!' : 'Wörter gelernt'}</small></p>`;
}

function testHTML(a, info) {
  const dl = info.dl;
  if (dl === null) return `<button class="hero-test link" type="button" data-go="picker">${icon('calendar')}Testtag eintragen</button>`;
  if (dl < 0) return `<p class="hero-test">${icon('check')}Test vorbei</p>`;
  if (dl === 0) return `<p class="hero-test is-hot">${icon('flag')}<b>Heute ist Test!</b></p>`;
  if (dl === 1) return `<p class="hero-test is-hot">${icon('flag')}<b>Morgen ist Test!</b></p>`;
  return `<p class="hero-test${dl <= 2 ? ' is-hot' : ''}">${icon('calendar')}<span>Noch <b>${dl} Tage</b> bis zum Test</span></p>`;
}

function planText(info) {
  const { newToday, due, newLeft, dl, introToday } = info;
  if (dl !== null && dl < 0) return 'Der Test ist vorbei. Wähl die Seiten für den nächsten Test!';
  if (!newLeft && !due) {
    return info.ready >= 0.9 ? 'Du bist <b>testbereit</b>! Halte die Wörter mit Blitz-Runden frisch.'
      : 'Alle Wörter kennst du schon. Jetzt heißt es <b>festigen</b>, bis alles sitzt!';
  }
  const parts = [];
  if (newToday) parts.push(`<b>${plural(newToday, 'neues Wort', 'neue Wörter')}</b>`);
  if (due) parts.push(`<b>${plural(due, 'Wiederholung', 'Wiederholungen')}</b>`);
  if (!parts.length) return 'Tagesplan geschafft! Wenn du magst, lern schon weiter.';
  const tail = dl !== null && dl >= 1 && newToday ? ' – dann schaffst du alles bis zum Test.' : '';
  return `${introToday && newToday ? 'Heute noch' : 'Heute'}: ${parts.join(' und ')}${tail}`;
}

function ctaHTML(info, st) {
  const cur = st.find(s => s.status === 'current');
  const btn = (attrs, label, sub) => `<button class="btn btn-primary btn-block" type="button" ${attrs}>${label}${sub ? `<small class="cta-sub">${sub}</small>` : ''}${icon('arrow-right')}</button>`;
  if (info.dl !== null && info.dl < 0) return btn('data-go="picker"', 'Neue Seiten wählen');
  if (cur && info.newToday > 0) return btn(`data-act="stop" data-i="${cur.i}"`, 'Weiterlernen', esc(stationName(cur.i)));
  if (info.due > 0) return btn('data-act="review"', 'Wiederholen', plural(info.due, 'Wort', 'Wörter'));
  if (cur) return btn(`data-act="stop" data-i="${cur.i}"`, 'Weiterlernen', 'Bonus');
  if (info.ready < 0.9) return btn('data-act="strengthen"', 'Festigen');
  return btn('data-act="test-setup"', 'Probetest machen');
}

function modesHTML(info) {
  const pool = info.pool;
  const oops = pool.filter(w => { const s = S.w[w.id]; return s && s.x > 0 && s.b < 4; }).length;
  const known = pool.filter(w => lvl(w) >= 1).length || Object.keys(S.w).length;
  const m = (cls, act, ic, title, pill, off) => `<button class="mode ${cls}${off ? ' is-off' : ''}" type="button" data-act="${act}"${off ? ' aria-disabled="true"' : ''}>
    <span class="mode-ic">${icon(ic)}</span><b>${title}</b>${pill ? `<span class="pill">${pill}</span>` : ''}</button>`;
  return `<div class="modes">
    ${m('m-review', 'review', 'repeat', 'Wiederholen', info.due, !info.due)}
    ${m('m-blitz', 'blitz', 'zap', 'Blitz-Runde', 0, known < 4)}
    ${m('m-test', 'test-setup', 'clipboard-check', 'Probetest', 0, false)}
    ${m('m-oops', 'oops', 'wrench', 'Fehler üben', oops, !oops)}
    ${m('m-sent', 'sent', 'chat', 'Sätze', 0, !pool.some(w => w.s))}
  </div>`;
}

// ---------- Die Linie ----------
function lineHTML(st) {
  const n = st.length;
  if (!n) return '';
  const curS = st.find(s => s.status === 'current');
  const curI = curS ? curS.i : n - 1;
  let lo = 0, hi = n - 1;
  if (n > 8 && !lineOpen) {
    lo = Math.max(0, curI - 2);
    hi = Math.min(n - 1, lo + 5);
    lo = Math.max(0, hi - 5);
  }
  const items = [];
  if (lo > 0) items.push(lineMoreHTML(lo, st[lo].unit, 'up'));
  let prevU = -1;
  for (let i = lo; i <= hi; i++) {
    const s = st[i];
    if (s.unit !== prevU) { items.push(unitHTML(s.unit, !items.length)); prevU = s.unit; }
    items.push(stopHTML(s, !items.length));
  }
  if (hi < n - 1) items.push(lineMoreHTML(n - 1 - hi, st[hi].unit, 'down'));
  items.push(finalHTML(st));
  const done = st.filter(s => s.done).length;
  return `<section class="card line-card" aria-label="Deine Linie">
    <div class="line-head"><h2>Stationen</h2><span class="kicker">${done} / ${n}</span></div>
    <ol class="line">${items.join('')}</ol>
    ${n > 8 ? `<p class="line-toggle"><button class="link" type="button" data-act="line-open">${lineOpen ? 'Weniger zeigen' : 'Alle Stationen zeigen'}</button></p>` : ''}
  </section>`;
}

function unitHTML(u, first) {
  const U = UNITS[u];
  return `<li class="line-unit${first ? ' is-first' : ''}" style="--c:${U.c}"><span class="knot"></span>
    <span class="lu-txt"><span class="utag" style="--c:${U.c}">${esc(U.short)}</span>${U.sub ? `<span class="lu-sub">${esc(U.sub)}</span>` : ''}</span></li>`;
}

function lineMoreHTML(count, u, dir) {
  return `<li class="line-more" style="--c:${UNITS[u].c}"><span></span>
    <button class="btn btn-ghost btn-sm" type="button" data-act="line-open">${icon(dir === 'up' ? 'chevron-up' : 'chevron-down')}${plural(count, 'weitere Station', 'weitere Stationen')}</button></li>`;
}

function stopHTML(s, first) {
  const cls = { gold: 'is-done is-gold', done: 'is-done', current: 'is-current', locked: 'is-locked' }[s.status];
  const ic = s.status === 'gold' ? icon('star', 'ic-fill') : s.status === 'done' ? icon('check')
    : s.status === 'locked' ? icon('lock') : icon('play', 'ic-fill');
  const what = { gold: 'sitzt perfekt', done: 'geschafft – nochmal üben', current: 'jetzt dran', locked: 'noch gesperrt' }[s.status];
  const name = stationName(s.i);
  return `<li class="stop ${cls}${first ? ' is-first' : ''}" style="--c:${UNITS[s.unit].c}">
    <button class="stop-dot" type="button" data-act="stop" data-i="${s.i}" aria-label="${esc(`${name}, Station ${s.i + 1}: ${what}`)}">${ic}</button>
    <div class="stop-info"><b>${esc(name)}</b>
      <div class="stop-meter" aria-hidden="true">${s.words.map(w => `<i class="${LV_CLS(lvl(w))}"></i>`).join('')}</div>
      ${s.status === 'current' ? `<div class="stop-go">${fox('happy')}<button class="btn btn-primary btn-sm" type="button" data-act="stop" data-i="${s.i}">Los geht's ${icon('arrow-right')}</button></div>` : ''}
    </div></li>`;
}

function finalHTML(st) {
  const all = st.every(s => s.done);
  return `<li class="stop is-final is-last${all ? ' is-open' : ''}" style="--c:${UNITS[st[st.length - 1].unit].c}">
    <button class="stop-dot" type="button" data-act="test-setup" aria-label="Endstation: Probetest">${icon('flag')}</button>
    <div class="stop-info"><b>Probetest</b></div></li>`;
}

ACT['line-open'] = () => { lineOpen = !lineOpen; VIEWS.home(false); };
ACT.stop = el => {
  const a = curAsg();
  if (!a) return;
  const s = stationsOf(a)[+el.dataset.i];
  if (!s) return;
  if (s.status === 'locked') { toast(`${icon('lock')} Schaff erst die Station davor!`); Sfx.play('near'); return; }
  startSession(s.status === 'current' ? 'lesson' : 'replay', { station: s.i });
};

// ======================= Seitenwahl =======================
const PK = { from: 0, to: 0, box: true, ext: false, test: '', step: 0, root: '#v-picker', autoExt: false };

function pkLoad() {
  const a = curAsg();
  Object.assign(PK, a
    ? { from: a.from, to: a.to, box: !!a.box, ext: !!a.ext, test: a.test || '', step: 0, autoExt: false }
    : { from: 0, to: 0, box: true, ext: false, test: '', step: 0, autoExt: false });
}
VIEWS.picker = isNew => {
  if (isNew) { pkLoad(); PK.root = '#v-picker'; }
  renderPicker();
};

// Nur Zusatzseiten gewählt? Dann die Zusatz-Wörter automatisch einschalten (und wieder aus).
function pkAutoExt() {
  if (!PK.from) return;
  const base = rangeInfo(PK.from, PK.to, PK.box, false);
  if (!base.n && base.plusExt > 0) { if (!PK.ext) { PK.ext = true; PK.autoExt = true; } }
  else if (PK.autoExt) { PK.ext = false; PK.autoExt = false; }
}

const switchRow = (ch, on, label, sub) => `<div class="set-row"><div><span class="lbl">${label}</span>${sub ? `<small>${sub}</small>` : ''}</div>
  <label class="switch"><input type="checkbox" data-ch="${ch}"${on ? ' checked' : ''} aria-label="${label}"><span></span></label></div>`;

function renderPicker() {
  const root = $(PK.root);
  if (!root) return;
  const ob = PK.root !== '#v-picker';
  const has = PK.from > 0;
  const ri = has ? rangeInfo(PK.from, PK.to, PK.box, PK.ext) : null;
  const nSt = has && ri.n ? stationsOf({ from: PK.from, to: PK.to, box: PK.box, ext: PK.ext }).length : 0;

  const pages = [];
  for (let p = PAGES.min; p <= PAGES.max; p++) {
    const inR = has && p >= PK.from && p <= PK.to;
    const edge = has && (p === PK.from || p === PK.to);
    const miss = PAGES.missing.includes(p);
    const us = PAGE_UNITS[p] || [];
    pages.push(`<button class="pg-btn${inR ? ' in' : ''}${edge ? ' edge' : ''}${miss ? ' missing' : ''}" type="button" data-act="pk-page" data-p="${p}" aria-pressed="${inR}" aria-label="Seite ${p}${miss ? ' (Foto fehlt)' : ''}">${p}${us.length
      ? `<span class="bars">${us.map(u => `<i style="--c:${UNITS[u].c}"></i>`).join('')}</span>` : ''}</button>`);
  }
  const legend = UNITS.map(u => `<button type="button" style="--c:${u.c}" data-act="pk-unit" data-u="${u.i}" aria-label="${esc(u.n)}: Seite ${u.a} bis ${u.b}">${esc(u.short)}</button>`).join('');

  let sumTxt;
  if (!has) sumTxt = '<div><b>Tipp auf die erste Seite</b><span>… und dann auf die letzte.</span></div>';
  else if (PK.step === 1) sumTxt = `<div><b>Seite ${PK.from} – …</b><span>Jetzt die letzte Seite antippen</span></div>`;
  else sumTxt = `<div><b>${rangeTxt(PK)}</b><span>${ri.n ? `${plural(ri.n, 'Wort', 'Wörter')} · ${plural(nSt, 'Station', 'Stationen')}` : 'Hier gibt es keine Wörter'}</span></div>`
    + (ob ? '' : `<button class="btn btn-primary" type="button" data-act="pk-save"${ri.n ? '' : ' disabled'}>Übernehmen ${icon('check')}</button>`);

  let opts = '';
  if (has) {
    const t0 = today();
    const quick = [[1, 'Morgen'], [3, 'In 3 Tagen'], [7, 'In 1 Woche'], [0, 'Kein Datum']].map(([d, l]) => {
      const v = d ? dayKey(t0 + d) : '';
      return `<button class="chip" type="button" data-act="pk-quick" data-v="${v}" aria-pressed="${PK.test === v}">${l}</button>`;
    }).join('');
    const miss = PAGES.missing.filter(p => p >= PK.from && p <= PK.to);
    opts = `<div class="pk-opts">
      ${ri.plusBox > 0 || PK.box ? switchRow('pk-box', PK.box, 'Wörter aus den Kästen', ri.plusBox ? `+${plural(ri.plusBox, 'Wort', 'Wörter')}` : '') : ''}
      ${ri.plusExt > 0 || PK.ext ? switchRow('pk-ext', PK.ext, 'Zusatzseiten', ri.plusExt ? `+${plural(ri.plusExt, 'Wort', 'Wörter')}` : '') : ''}
      <div><div class="set-row"><div><span class="lbl">Wann ist der Test?</span></div></div>
        <div class="pk-date"><input class="field" type="date" data-ch="pk-date" value="${PK.test}" min="${dayKey(t0)}" aria-label="Datum des Tests"><div class="chips">${quick}</div></div>
        ${PK.test ? `<p class="pk-hint">${icon('calendar')} Test am ${longDay(keyNum(PK.test))}</p>` : ''}</div>
      ${miss.length ? `<p class="pk-hint">${icon('info')} Seite ${miss.join(' und ')} fehlt.</p>` : ''}
    </div>`;
  }

  const card = `<div class="card pk-card">
    <div class="pk-legend">${legend}</div>
    <div class="pk-grid">${pages.join('')}</div>
    <div class="pk-sum" aria-live="polite">${sumTxt}</div>
    ${opts}
  </div>`;
  root.innerHTML = ob ? card : `<div class="wrap"><div class="page-head"><h1>Seiten wählen</h1>
    <button class="btn btn-ghost btn-sm" type="button" data-go="home">Zurück</button></div>${card}${asgListHTML()}</div>`;
}

function asgListHTML() {
  const list = Object.values(S.asg).filter(a => a && !a.del).sort((x, y) => (y.m || 0) - (x.m || 0));
  if (!list.length) return '';
  return `<div class="section-title"><h2>Deine Aufgaben</h2></div><div class="asg-list">${list.map(a => {
    const cur = a.id === S.cur;
    const inf = poolInfo(a);
    const test = a.test ? ` · Test ${fmtDay(keyNum(a.test), { day: 'numeric', month: 'short' })}` : '';
    return `<div class="asg${cur ? ' is-cur' : ''}"><div class="asg-txt"><b>${rangeTxt(a)}</b>
      <span>${inf.counts[2] + inf.counts[3]} / ${inf.pool.length} gelernt${test}</span></div>
      ${cur ? '<span class="pill">aktiv</span>' : `<button class="btn btn-ghost btn-sm" type="button" data-act="asg-pick" data-id="${a.id}">Wählen</button>`}
      <button class="icon-btn" type="button" data-act="asg-del" data-id="${a.id}" aria-label="${rangeTxt(a)} löschen">${icon('trash')}</button></div>`;
  }).join('')}</div>`;
}

ACT['pk-page'] = el => {
  const p = +el.dataset.p;
  if (PK.step === 0 || !PK.from) { PK.from = PK.to = p; PK.step = 1; }
  else {
    if (p < PK.from) { PK.to = PK.from; PK.from = p; } else PK.to = p;
    PK.step = 0;
  }
  pkAutoExt();
  Sfx.play('tap');
  renderPicker();
};
ACT['pk-unit'] = el => {
  const u = UNITS[+el.dataset.u];
  PK.from = u.a; PK.to = u.b; PK.step = 0;
  if (u.x && !PK.ext) { PK.ext = true; PK.autoExt = true; } else pkAutoExt();
  Sfx.play('tap');
  renderPicker();
};
ACT['pk-quick'] = el => { PK.test = el.dataset.v; renderPicker(); };
CHG['pk-date'] = el => { PK.test = el.value || ''; renderPicker(); };
CHG['pk-box'] = el => { PK.box = el.checked; renderPicker(); };
CHG['pk-ext'] = el => { PK.ext = el.checked; PK.autoExt = false; renderPicker(); };

function pkSave() {
  if (!PK.from) return false;
  if (!rangeInfo(PK.from, PK.to, PK.box, PK.ext).n) { toast('Auf diesen Seiten gibt es keine Wörter.'); return false; }
  const id = asgId(PK.from, PK.to);
  const now = Date.now();
  const old = S.asg[id];
  S.asg[id] = { id, from: PK.from, to: PK.to, box: PK.box, ext: PK.ext, test: PK.test || '', c: (old && !old.del && old.c) || now, m: now };
  S.cur = id;
  S.curM = now;
  lineOpen = false;
  commit();
  return true;
}
ACT['pk-save'] = () => {
  if (!pkSave()) return;
  Sfx.play('start');
  go('home');
  toast(`${icon('check')} Dein Plan für ${rangeTxt(PK)} steht!`);
};
ACT['asg-pick'] = el => {
  const a = S.asg[el.dataset.id];
  if (!a || a.del) return;
  S.cur = a.id;
  S.curM = Date.now();
  lineOpen = false;
  commit();
  go('home');
};
ACT['asg-del'] = async el => {
  const a = S.asg[el.dataset.id];
  if (!a) return;
  const yes = await ask({ title: `${rangeTxt(a)} löschen?`, text: 'Die gelernten Wörter bleiben gespeichert – nur die Aufgabe verschwindet aus der Liste.', yes: 'Löschen', danger: true });
  if (!yes) return;
  const now = Date.now();
  S.asg[a.id] = { ...a, del: 1, m: now };
  if (S.cur === a.id) { S.cur = ''; S.curM = now; }
  commit();
  if (PK.root === '#v-picker') { pkLoad(); renderPicker(); }
};

// ======================= Wörter =======================
const WV = { scope: 'asg', q: '', f: 'all', open: new Set(), limit: 300 };
const WV_F = [['all', 'Alle'], ['g0', 'Neu'], ['g1', 'Am Lernen'], ['g2', 'Gelernt'], ['g3', 'Sicher'], ['due', 'Fällig'], ['err', 'Mit Fehlern']];
const firstOcc = w => w.o.reduce((m, o) => !m || o[0] < m[0] || (o[0] === m[0] && o[3] < m[3]) ? o : m, null);
let allSortedCache = null;
const allSorted = () => allSortedCache || (allSortedCache = WORDS.slice().sort((a, b) => {
  const x = firstOcc(a), y = firstOcc(b);
  return x[0] - y[0] || x[3] - y[3];
}));

VIEWS.words = isNew => {
  if (isNew) WV.limit = 300;
  const a = curAsg();
  $('#v-words').innerHTML = `<div class="wrap">
    <div class="page-head"><h1>Wörter</h1>${a ? `<div class="seg" role="group" aria-label="Welche Wörter">
      <button type="button" data-act="wv-scope" data-v="asg" aria-pressed="${WV.scope === 'asg'}">${rangeTxt(a)}</button>
      <button type="button" data-act="wv-scope" data-v="all" aria-pressed="${WV.scope === 'all'}">Alle</button></div>` : ''}</div>
    <div class="search">${icon('search')}<input class="field" type="search" id="wv-q" data-in="wv-q" value="${esc(WV.q)}" placeholder="Suchen" aria-label="Wörter durchsuchen" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="chips" id="wl-chips"></div>
    <div id="wl-list"></div>
  </div>`;
  renderWordList();
};

function wvMatch(w, f) {
  if (f === 'all') return true;
  const s = S.w[w.id];
  if (f === 'due') return isDue(w);
  if (f === 'err') return !!s && s.x > 0;
  return groupOf((s && s.b) || 0) === +f.slice(1);
}

function renderWordList() {
  const a = curAsg();
  const inAsg = WV.scope === 'asg' && !!a;
  const pool = inAsg ? poolOf(a) : null;
  const base = inAsg ? pool : allSorted();
  const q = WV.q.trim().toLowerCase(), qf = q ? foldDe(q) : '';
  const hit = q ? base.filter(w => w.plain.toLowerCase().includes(q) || w.de.toLowerCase().includes(q) || (qf && foldDe(w.de).includes(qf))) : base;
  const counts = {};
  for (const [k] of WV_F) counts[k] = hit.filter(w => wvMatch(w, k)).length;
  $('#wl-chips').innerHTML = WV_F.filter(([k]) => k === 'all' || counts[k] || WV.f === k)
    .map(([k, l]) => `<button class="chip" type="button" data-act="wv-f" data-v="${k}" aria-pressed="${WV.f === k}">${l} <i>${counts[k]}</i></button>`).join('');
  const list = hit.filter(w => wvMatch(w, WV.f));
  if (!list.length) {
    $('#wl-list').innerHTML = `<div class="empty">${fox('wow')}<p>${q ? `Nichts gefunden für „${esc(WV.q.trim())}“.` : 'Hier ist gerade kein Wort.'}</p></div>`;
    return;
  }
  const groups = [];
  let g = null;
  for (const w of list.slice(0, WV.limit)) {
    const o = inAsg ? pool.occ.get(w.id) : firstOcc(w);
    if (!g || g.page !== o[0]) { g = { page: o[0], u: LABELS[o[2]].u, rows: [] }; groups.push(g); }
    g.rows.push(wordRowHTML(w, o));
  }
  $('#wl-list').innerHTML = groups.map(gr => `<div class="wgroup"><div class="wgroup-h"><b>Seite ${gr.page}</b>
      <span class="utag" style="--c:${UNITS[gr.u].c}">${esc(UNITS[gr.u].short)}</span></div>
      <div class="wlist">${gr.rows.join('')}</div></div>`).join('')
    + (list.length > WV.limit ? `<p class="more-row"><button class="btn btn-ghost" type="button" data-act="wv-more">Mehr zeigen (${list.length - WV.limit})</button></p>` : '');
}

function wordRowHTML(w, o) {
  const s = S.w[w.id], b = (s && s.b) || 0, g = groupOf(b);
  const open = WV.open.has(w.id);
  const mark = o[1] === 1 ? '<span class="box-mark">Kasten</span>' : o[1] === 2 ? '<span class="box-mark">Extra</span>' : '';
  return `<div class="wrow"><div class="wrow-main">
    <button class="wrow-txt" type="button" data-act="wv-row" data-id="${w.id}" aria-expanded="${open}"><b lang="en">${esc(w.en)}${mark}</b>${ipaHTML(w)}<span>${esc(w.de)}</span></button>
    <span class="lv" style="--dot:${LV_COL[g]}" role="img" aria-label="${GROUPS[g]}">${[1, 2, 3, 4, 5].map(k => `<i${b >= k ? ' class="on"' : ''}></i>`).join('')}</span>
    ${sayBtn(w)}</div>${open ? wordMoreHTML(w, s) : ''}</div>`;
}

function wordMoreHTML(w, s) {
  const parts = [];
  if (w.ex) parts.push(`<p class="ex" lang="en">„${esc(w.ex)}“${TTS.ok ? ` <button class="link" type="button" data-act="say-ex" data-id="${w.id}">anhören</button>` : ''}</p>`);
  if (w.no) parts.push(`<p>${esc(w.no)}</p>`);
  for (const t of w.t || []) parts.push(`<div class="note tip">${icon('lightbulb')}<span>${esc(t)}</span></div>`);
  for (const f of w.f || []) parts.push(`<div class="note">${icon('info')}<span>${esc(f)}</span></div>`);
  const pages = uniq(w.o.map(o => o[0])).sort((x, y) => x - y);
  const box = w.o.map(o => LABELS[o[2]].b).find(Boolean);
  const meta = [`Seite ${pages.join(', ')}`, UNITS[w.unit].short];
  if (box) meta.push(`Kasten „${box}“`);
  if (s) {
    meta.push(`${s.n}× geübt`, plural(s.x, 'Fehler', 'Fehler'));
    meta.push(s.d <= today() ? 'heute dran' : `wieder dran: ${fmtDay(s.d, { weekday: 'short', day: 'numeric', month: 'short' })}`);
  }
  parts.push(`<p class="meta">${meta.map(esc).join(' · ')}</p>`);
  return `<div class="wrow-more">${parts.join('')}</div>`;
}

ACT['wv-scope'] = el => { WV.scope = el.dataset.v; WV.limit = 300; VIEWS.words(false); };
ACT['wv-f'] = el => { WV.f = el.dataset.v; WV.limit = 300; renderWordList(); };
ACT['wv-more'] = () => { WV.limit += 300; renderWordList(); };
ACT['wv-row'] = el => {
  const id = el.dataset.id;
  if (WV.open.has(id)) WV.open.delete(id); else WV.open.add(id);
  renderWordList();
  const b = $(`#wl-list [data-act="wv-row"][data-id="${id}"]`);
  if (b) b.focus({ preventScroll: true });
};
let wvTimer = 0;
INP['wv-q'] = el => {
  WV.q = el.value;
  WV.limit = 300;
  clearTimeout(wvTimer);
  wvTimer = setTimeout(renderWordList, 120);
};

function checkBadges() {
  const a = curAsg();
  const ctx = {
    st: streakInfo(), L: levelInfo().L, learned: wordsLearned(),
    goals: Object.values(S.days).filter(d => (d.xp || 0) >= S.set.goal).length,
    ready: a ? poolInfo(a).ready : 0,
  };
  const got = [];
  for (const b of BADGES) {
    if (!S.bdg[b.id] && b.ok(ctx)) { S.bdg[b.id] = Date.now(); got.push(b); }
  }
  return got;
}

  cloud: ['cloud', 'Im Konto gespeichert'],
  wait: ['cloud', 'Verbinde …'],

};

VIEWS.awards = () => {
  const L = levelInfo(), st = streakInfo(), goal = S.set.goal, t = today();
  const days = [];
  for (let k = 6; k >= 0; k--) days.push({ d: t - k, xp: (S.days[dayKey(t - k)] || {}).xp || 0 });

  const week = days.map(x => `<div class="week-col"><em>${x.xp || ''}</em>

  const got = BADGES.filter(b => S.bdg[b.id]).length;
  const badges = BADGES.map(b => {
    const on = !!S.bdg[b.id];
    return `<div class="bdg${on ? '' : ' is-locked'}"><div class="medal" style="--bc:${b.c}">${icon(on ? b.ic : 'lock')}</div>
      <b>${b.n}</b><span>${b.d}</span></div>`;
  }).join('');
  const [sic, stxt] = STORE_TXT[Sync.mode] || STORE_TXT.local;
  $('#v-awards').innerHTML = `<div class="wrap">
    <div class="page-head"><h1>Erfolge</h1></div>

SUB.gate = () => {

function parentsHTML() {
  const t = today(), st = streakInfo(), a = curAsg();
  const days = k => { const r = S.days[dayKey(t - k)] || {}; return { d: t - k, s: r.s || 0, xp: r.xp || 0 }; };
  const last14 = []; for (let k = 13; k >= 0; k--) last14.push(days(k));
  const min7 = Math.round(sum(last14.slice(7).map(x => x.s)) / 60);
  const days7 = last14.slice(7).filter(x => x.s > 0 || x.xp > 0).length;
  const started = Object.keys(S.w).length;
  const tests = S.tests.slice().sort((x, y) => y.a - x.a);
  const lastT = tests[0];
  const maxS = Math.max(60, ...last14.map(x => x.s));
  const chart = last14.map(x => `<div class="chart-col" title="${fmtDay(x.d)}: ${Math.round(x.s / 60)} min"><i${x.s ? '' : ' class="zero"'} style="height:${Math.round(3 + 120 * x.s / maxS)}px"></i><small>${new Date(x.d * DAY).getUTCDate()}</small></div>`).join('');

  let asgCard = '<p class="muted">Noch keine Aufgabe gewählt.</p>';
  if (a) {
    const inf = poolInfo(a), n = inf.pool.length, [c0, c1, c2, c3] = inf.counts;
    const pc = x => (n ? x / n * 100 : 0).toFixed(1) + '%';
    asgCard = `<p><b>${rangeTxt(a)}</b> · ${plural(n, 'Wort', 'Wörter')}${a.test ? ` · Test am ${longDay(keyNum(a.test))}` : ' · kein Testdatum'}</p>
      <div class="lvbar"><i class="l4" style="width:${pc(c3)}"></i><i class="l3" style="width:${pc(c2)}"></i><i class="l1" style="width:${pc(c1)}"></i></div>
      <div class="lvlegend"><span style="--dot:var(--lv4)">${c3} sicher</span><span style="--dot:var(--lv3)">${c2} gelernt</span><span style="--dot:var(--lv1)">${c1} am Lernen</span><span style="--dot:var(--lv0)">${c0} neu</span></div>
      <p class="muted par-plan">${Math.round(inf.ready * 100)} % testbereit · ${planText(inf).replace(/<[^>]+>/g, '')}</p>`;
  }
  const testRows = tests.slice(0, 10).map(x => `<tr><td>${fmtDay(dayNum(new Date(x.a)))}</td><td>${x.from ? `S. ${x.from}–${x.to}` : '–'}</td><td>${x.n}</td><td>${x.p} %</td><td><span class="grade-dot" style="background:${GRADE_C[x.g] || GRADE_C[6]}">${x.g}</span></td></tr>`).join('');
  const hard = WORDS.filter(w => S.w[w.id] && S.w[w.id].x > 0).sort((x, y) => S.w[y.id].x - S.w[x.id].x || lvl(x) - lvl(y)).slice(0, 10);
  const hardRows = hard.map(w => { const s = S.w[w.id]; return `<tr><td lang="en"><b>${esc(w.plain)}</b></td><td>${esc(deShort(w))}</td><td>${s.x}</td><td>${GROUPS[groupOf(s.b)]}</td></tr>`; }).join('');

  const sel = (ch, cur, opts, label) => `<select class="select" data-ch="${ch}" aria-label="${label}">${opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const voices = TTS.voices.map(v => [v.voiceURI, TTS.label(v)]);
  // Aufnahmen zuerst (die erste ist Standard = ''), dann die Stimmen des Geräts
  const recs = (VOCAB.sv || []).map((x, i) => [i ? 'rec:' + x.id : '', x.l]);
  const voiceRow = TTS.ok
    ? `<div class="set-row"><div><span class="lbl">Stimme</span><small>${voices.length || recs.length ? 'Britisches Englisch klingt wie im Schulbuch.' : 'Keine englische Stimme gefunden.'}</small></div>
        <div class="set-ctl">${voices.length || recs.length ? sel('set-voice', S.set.voice, [...(recs.length ? recs : [['', 'Automatisch']]), ...voices.map(([v, l]) => [v, `${l} (Gerät)`])], 'Stimme') : ''}<button class="btn btn-ghost btn-sm" type="button" data-act="voice-test">${icon('volume')}Testen</button></div></div>
      <div class="set-row"><div><span class="lbl">Sprechtempo</span></div>${sel('set-rate', S.set.rate, [[0.75, 'Langsam'], [0.9, 'Normal'], [1.05, 'Schnell']], 'Sprechtempo')}</div>`
    : '<p class="muted">Dieser Browser kann nicht vorlesen.</p>';

  return `<div class="wrap">
    <div class="page-head"><h1>Für Eltern</h1><button class="btn btn-ghost btn-sm" type="button" data-act="par-lock">${icon('lock')}Sperren</button></div>
    ${fgCardHTML()}
    ${aktRemoteHTML()}
    <div class="kpis">
      <div class="kpi"><span>Wörter gelernt</span><b>${wordsLearned()}</b><em>von ${started} begonnenen</em></div>
      <div class="kpi"><span>Lernzeit (7 Tage)</span><b>${min7} min</b><em>an ${plural(days7, 'Tag', 'Tagen')}</em></div>
      <div class="kpi"><span>Serie</span><b>${plural(st.n, 'Tag', 'Tage')}</b><em>Rekord: ${st.best}</em></div>
      <div class="kpi"><span>Probetests</span><b>${tests.length}</b><em>${lastT ? `zuletzt Note ${lastT.g} (${lastT.p} %)` : 'noch keiner'}</em></div>
    </div>
    <div class="card"><div class="card-h"><h2>Lernzeit</h2><span class="kicker">letzte 14 Tage, Minuten</span></div><div class="chart">${chart}</div></div>
    ${aktLocalHTML()}
    <div class="card"><div class="card-h"><h2>Aktuelle Aufgabe</h2></div>${asgCard}</div>
    <div class="card"><div class="card-h"><h2>Probetests</h2></div>${testRows
      ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Datum</th><th>Seiten</th><th>Wörter</th><th>Ergebnis</th><th>Note</th></tr></thead><tbody>${testRows}</tbody></table></div>`
      : '<p class="muted">Noch kein Probetest gemacht.</p>'}</div>
    <div class="card"><div class="card-h"><h2>Schwierigste Wörter</h2></div>${hardRows
      ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Englisch</th><th>Deutsch</th><th>Fehler</th><th>Stand</th></tr></thead><tbody>${hardRows}</tbody></table></div>`
      : '<p class="muted">Noch keine Fehler – oder noch nicht geübt.</p>'}</div>
    ${talParentHTML()}
    ${fcParentHTML()}
    <div class="card"><div class="card-h"><h2>So funktioniert Wortfuchs</h2></div><ul class="explain">
      <li><b>Seiten wählen:</b> Ihr Kind trägt die aufgegebenen Seiten und das Testdatum ein. Die neuen Wörter werden gleichmäßig auf die Tage bis zum Test verteilt.</li>
      <li><b>Stationen:</b> Je etwa 5 Wörter – erst kennenlernen und anhören, dann erkennen, dann selbst schreiben.</li>
