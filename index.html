.wk-hint { min-height: 60px; display: grid; justify-items: center; align-content: center; gap: 2px; text-align: center; outline: none; }
.wk-hint small { font-weight: 700; }
.wk-board { --n: 5; display: grid; gap: 6px; width: min(100%, calc(var(--n) * 54px)); }
.wk-row { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; }
.wk-t { aspect-ratio: 1; display: grid; place-items: center; border-radius: 10px; border: 2px solid var(--rule); background: var(--card); color: var(--ink); font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1; }
.wk-row.is-cur .wk-t { border-color: var(--rule-strong); }
.wk-row.is-cur .wk-t.is-in { border-color: var(--ink-3); }
.wk-t.is-ok { background: var(--good); border-color: var(--good); color: #fff; }
.wk-t.is-near { background: var(--gold); border-color: var(--gold); color: #3A2A00; }
.wk-t.is-no { background: var(--rule-strong); border-color: var(--rule-strong); color: var(--ink-2); }
.wk-t.is-flip { animation: wk-flip .45s ease both; animation-delay: calc(var(--i) * 90ms); }
.wk-row.is-shake { animation: sn-shake .35s ease; }
.wk-msg { min-height: 22px; margin: 0; text-align: center; font-weight: 800; color: var(--ink-2); }
.wk-keys { width: 100%; max-width: 500px; display: grid; gap: 7px; touch-action: manipulation; }
.wk-krow { display: flex; justify-content: center; gap: 5px; }
.wk-key {
  flex: 1 1 0; min-width: 0; max-width: 44px; height: 50px; padding: 0; display: grid; place-items: center; border-radius: 10px;
  border: 2px solid var(--rule); background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--rule);
  font-family: var(--f-display); font-weight: 600; font-size: 20px; -webkit-user-select: none; user-select: none;
}
.wk-key.wk-wide { flex-grow: 1.5; max-width: 66px; }
.wk-key .ic { width: 22px; height: 22px; }
.wk-key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rule); }
.wk-key.is-ok { background: var(--good); border-color: var(--good); color: #fff; box-shadow: 0 3px 0 var(--good-deep); }
.wk-key.is-near { background: var(--gold); border-color: var(--gold); color: #3A2A00; box-shadow: 0 3px 0 var(--near); }
.wk-key.is-no { background: var(--rule); border-color: var(--rule); color: var(--ink-3); box-shadow: none; }
.wk-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.wk-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.wk-legend .wk-t { width: 28px; border-radius: 7px; font-size: 17px; }

f.","o":[[220,2,80,1690]],"al":["write the words","write the sentences"],"dk":["schreibe die wörter","sätze auf"]},{"id":"dvukec","k":"write down the number","en":"Write down the number.","de":"Schreibe die Zahl auf.","o":[[220,2,80,1691]],"al":["write down the number"],"dk":["schreibe die zahl auf"]},{"id":"9nptu3","k":"write about your school","en":"Write about your school.","de":"Schreibe über deine Schule.","o":[[220,2,80,1692]],"al":["write about your school"],"dk":["schreibe über deine schule"]},{"id":"1wd0rep","k":"dialogue","en":"dialogue","de":"Dialog","o":[[220,2,21,1695]],"al":["dialogue"],"dk":["Dialog"]},{"id":"p8x3hk","k":"drawing","en":"drawing","de":"Zeichnung","o":[[220,2,21,1696]],"al":["drawing"],"dk":["Zeichnung"]},{"id":"wa1sl8","k":"example","en":"example","de":"Beispiel","o":[[220,2,21,1697]],"al":["example"],"dk":["Beispiel"]},{"id":"1fnao56","k":"grid","en":"grid","de":"Gitter; Tabelle; Raster","o":[[220,2,21,1699]],"al":["grid"],"dk":["Gitter","Tabelle","Raster"]},{"id":"1dkid32","k":"list","en":"list","de":"Liste","o":[[220,2,21,1701]],"al":["list"],"dk":["Liste"]},{"id":"490jxh","k":"mind map","en":"mind map","de":"Mindmap","o":[[220,2,21,1702]],"al":["mind map"],"dk":["Mindmap"]},{"id":"sznlpz","k":"order","en":"order","de":"Reihenfolge","o":[[220,2,21,1703]],"al":["order"],"dk":["Reihenfolge"]},{"id":"arno1a","k":"phrase","en":"phrase","de":"Satz; Redewendung; Ausdruck","o":[[220,2,21,1704]],"al":["phrase"],"dk":["Satz","Redewendung","Ausdruck"]},{"id":"16b5skw","k":"quiz","en":"quiz","de":"Quiz; Rätsel","o":[[220,2,21,1707]],"al":["quiz"],"dk":["Quiz","Rätsel"]},{"id":"1irntdm","k":"role play","en":"role play","de":"Rollenspiel","o":[[220,2,21,1708]],"al":["role play"],"dk":["Rollenspiel"]},{"id":"r26mvr","k":"story","en":"story","de":"Geschichte","o":[[220,2,21,1711]],"al":["story"],"dk":["Geschichte"]},{"id":"1q87u2x","k":"task","en":"task","de":"Aufgabe","o":[[220,2,21,1712]],"al":["task"],"dk":["Aufgabe"]},{"id":"1oorped","k":"text","en":"text","de":"Text","o":[[220,2,21,1713]],"al":["text"],"dk":["Text"]},{"id":"1u4vgc9","k":"tip","en":"tip","de":"Tipp","o":[[220,2,21,1714]],"al":["tip"],"dk":["Tipp"]},{"id":"bltmr2","k":"unit","en":"unit","de":"Lektion; Kapitel","o":[[220,2,21,1715]],"al":["unit"],"dk":["Lektion","Kapitel"]},{"id":"1xuatqs","k":"vocabulary","en":"vocabulary","de":"Vokabular; Wortschatz","o":[[220,2,21,1716]],"al":["vocabulary"],"dk":["Vokabular","Wortschatz"]}]};</script>
<script>
/* Wortfuchs – Kern: Wortdaten, Antwort-Prüfung, Lernplan, Spielstand und Speichern.
   Enthält keine Oberfläche; app.js baut darauf auf. */
'use strict';

// ---------- Hilfen ----------
const DAY = 864e5;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rnd = n => Math.floor(Math.random() * n);
const pickOne = a => a[rnd(a.length)];
const sum = a => a.reduce((s, x) => s + x, 0);
const uniq = a => [...new Set(a)];
const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Kalendertage (Ortszeit) als fortlaufende Zahl, Schlüssel "JJJJ-MM-TT"
const dayNum = (d = new Date()) => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
const dayKey = n => new Date(n * DAY).toISOString().slice(0, 10);
const keyNum = k => Math.round(Date.parse(k + 'T00:00:00Z') / DAY);
const fmtDay = (n, opt = { weekday: 'short', day: 'numeric', month: 'short' }) =>
  new Date(n * DAY).toLocaleDateString('de-DE', { ...opt, timeZone: 'UTC' });
const today = () => dayNum();

// ---------- Text ----------
const APOS = /[’‘`´]/g;
const squash = s => String(s).replace(/\s+/g, ' ').trim();
const canon = s => squash(String(s).toLowerCase().replace(APOS, "'").replace(/…|\.\.\./g, ' ').replace(/[.,!?;:"“”„()]/g, ' '));
const loose = s => s.replace(/^to (?=\S)/, '').replace(/^(a|an|the) (?=\S)/, '');
const plainEn = en => squash(en.replace(/\([^)]*\)/g, ' ')).replace(/\s+([?!,]|\.(?!\.))(?=\s|$)/g, '$1');
// Was die Vorlesestimme sagen soll: "to point at sb/sth" -> "to point at somebody or something"
const speakable = en => squash(en
  .replace(/\((?:pl|no pl|=[^)]*|g|ml|c|£|XL)\)/gi, ' ')
  .replace(/[()]/g, '')
  .replace(/\bsb\b/g, 'somebody').replace(/\bsth\b/g, 'something')
  .replace(/\s*\/\s*/g, ' or ')
  .replace(/\s*(?:…|\.\.\.)\s*/g, ', ')
  .replace(/,\s*([?!.])/g, '$1').replace(/,\s*$/, ''));

// Damerau-Levenshtein (optimal string alignment): Tippfehler-Abstand
function osa(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 9;
  const d = [];
  for (let i = 0; i <= m; i++) d[i] = [i];
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      let v = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, d[i - 2][j - 2] + 1);
      d[i][j] = v;
    }
  }
  return d[m][n];
}

// ---------- Wortdaten ----------
const VOCAB = window.VOCAB;
const PAGES = VOCAB.pages;
const LABELS = VOCAB.labels;
const UNIT_C = ['#B7791F', '#E5484D', '#8E4EC6', '#1F7AE0', '#0E9384', '#2B9A5A', '#D1418F', '#4F5BD5', '#9A6B45', '#6B7280', '#A0522D', '#52708F'];
const UNITS = VOCAB.units.map((u, i) => {
  const [short, sub = ''] = u.n.split(/:\s*/);
  return { ...u, i, short, sub, c: UNIT_C[i % UNIT_C.length] };
});

// Welche Kapitel auf welcher Seite vorkommen (für die Farbbalken der Seitenwahl)
const PAGE_UNITS = {};
for (const e of VOCAB.e) for (const o of e.o) {
  const u = LABELS[o[2]].u;
  (PAGE_UNITS[o[0]] = PAGE_UNITS[o[0]] || []).includes(u) || PAGE_UNITS[o[0]].push(u);
}
Object.values(PAGE_UNITS).forEach(a => a.sort((x, y) => x - y));

// Großschreibung, die zählt: Eigennamen, Wochentage, "I" – nicht der Satzanfang
function capWordsOf(plain) {
  const toks = plain.replace(/[.,!?;:"“”„…]/g, ' ').split(/[\s/]+/).filter(Boolean);
  const cap = t => /[A-Z]/.test(t);
  const res = [];
  toks.forEach((t, k) => {
    if (!cap(t)) return;
    if (/^I(?:'|’|$)/.test(t)) { res.push(t.replace(APOS, "'")); return; }
    if (k === 0 && (toks.length === 1 ? /[.!?]$/.test(plain) : !cap(toks[1]))) return;
    res.push(t.replace(APOS, "'"));
  });
  return uniq(res);
}

// Buchstaben- oder Wortkacheln zum Zusammensetzen
function tileSpec(w) {
  const p = w.plain.replace(APOS, "'");
  if (/…|\.\.\.|\//.test(p) || p.length > 40) return null;
  const toks = p.replace(/[.,!?;:]+$/, '').split(' ').map(t => t.replace(/[.,!?;:"]+$/g, '')).filter(Boolean);
  const keep = t => w.capWords.includes(t) ? t : t.toLowerCase();
  let pre = '', core = toks;
  if (toks.length === 2 && /^(to|a|an|the)$/i.test(toks[0])) { pre = toks[0].toLowerCase(); core = toks.slice(1); }
  if (core.length === 1) {
    const word = keep(core[0]);
    if (/^[A-Za-z][A-Za-z'-]{2,11}$/.test(word)) return { m: 'letters', pre, target: word, parts: [...word] };
    return null;
  }
  if (toks.length >= 2 && toks.length <= 6) {
    const parts = toks.map(keep);
    return { m: 'words', pre: '', target: parts.join(' '), parts };
  }
  return null;
}

// -s-Form (Mehrzahl, he/she/it): marker → markers, watch → watches, hobby → hobbies.
// Kurze Wörter und Possessiva nie (it → its, her → hers).
const NO_S_FORM = new Set(['her', 'our', 'your', 'their']);
const sFormable = p => p.length >= 3 && !NO_S_FORM.has(p) && !p.includes("'");
const sForm = p => p === 'have' ? 'has' : /(s|x|z|ch|sh|[^aeiou]o)$/.test(p) ? p + 'es' : /[^aeiou]y$/.test(p) ? p.slice(0, -1) + 'ies' : p + 's';
const sFormRx = p => !sFormable(p) ? escRx(p) : `(?:${escRx(p)}(?:e?s)?${/[^aeiou]y$/.test(p) ? `|${escRx(p.slice(0, -1))}ies` : ''})`;
// Ablenker im Lückensatz in dieselbe Form bringen wie das gesuchte Wort: die Form aus dem
// eigenen Beispielsatz oder bei Verben he/she/it + s. null = keine sichere Form (alone → alones)
let VERB_KEYS = null;
function gapForm(o, gap) {
  if (!gap.inf) return o.k;
  if (o.gap && o.gap.inf) return o.gap.word.toLowerCase();
  if (!VERB_KEYS) VERB_KEYS = new Set(WORDS.filter(x => /^to \S+$/.test(x.en)).map(x => x.k));
  const v = o.k.split(' ')[0];
  // mehrteilig nur, wenn das erste Wort selbst ein Verb ist (look after → looks after, nicht videos chat)
  if (!/^to /.test(o.en) || !sFormable(v) || (v !== o.k && !VERB_KEYS.has(v))) return null;
  return o.k.replace(/^\S+/, sForm);
}

// Lückensatz aus dem Beispielsatz. Steht das Wort dort nur mit -s (markers, starts, hobbies),
// wird diese Form gesucht (inf).
function gapSpec(w) {
  if (!w.ex || w.ex.length > 110) return null;
  const key = w.k;
  if (!key || key.length < 2 || /[^a-z' -]/.test(key)) return null;
  const parts = key.split(' ');
  if (parts.length > 4) return null;
  const ex = w.ex.replace(APOS, "'");
  const find = ps => ex.match(new RegExp(`(^|[^A-Za-z']|(?:^|[^A-Za-z])')(${ps.join('\\s+')})(?=$|[^A-Za-z']|'(?![A-Za-z]))`, 'i'));
  let m = find(parts.map(escRx)), inf = false;
  if (!m) {
    const n = parts.length - 1;
    m = find(parts.map((p, i) => i === 0 || i === n ? sFormRx(p) : escRx(p)));
    inf = !!m;
  }
  if (!m) return null;
  const start = m.index + m[1].length;
  const word = m[2];
  const before = ex.slice(0, start), after = ex.slice(start + word.length);
  if (!/[A-Za-z]{2}/.test(before + after)) return null;
  return { before, word, after, inf };
}

const lc = s => s.toLowerCase();
const WORDS = VOCAB.e.map((e, i) => {
  const plain = plainEn(e.en);
  const toks = plain.split(' ');
  const w = Object.assign({}, e, {
    i, plain,
    forms: new Set(e.al),
    rxs: (e.rx || []).map(r => new RegExp(r)),
    de1: e.de.split(';')[0].trim(),
    deSet: new Set(e.dk.map(lc)),
    dxSet: new Set((e.dx || e.dk).map(lc)),
    hasSb: /\b(sb|sth)\b/.test(e.en),
    unit: LABELS[e.o[0][2]].u,
    page: Math.min(...e.o.map(o => o[0])),
    typable: plain.length <= 32 && toks.length <= 5 && !(plain.includes('/') && toks.length > 3),
    capWords: capWordsOf(plain),
  });
  w.tiles = tileSpec(w);
  w.gap = gapSpec(w);
  w.recallable = !!(w.tiles || w.typable);
  w.words = toks.length;
  return w;
});
const BY_ID = new Map(WORDS.map(w => [w.id, w]));

// Alle Schreibweisen -> Wörter (um "anderes Wort getippt" zu erkennen)
const FORMS = new Map();
const addForm = (f, i) => { if (!f) return; const l = FORMS.get(f); if (!l) FORMS.set(f, [i]); else if (!l.includes(i)) l.push(i); };
for (const w of WORDS) for (const f of w.forms) { addForm(f, w.i); addForm(loose(f), w.i); }

// Einzelwörter für Wortkachel-Ablenker
const TOKENS = uniq(WORDS.flatMap(w => w.plain.toLowerCase().replace(/[.,!?;:"…]/g, ' ').split(/\s+/)).filter(t => /^[a-z']{2,10}$/.test(t)));

const overlaps = (a, b) => { for (const p of a.dxSet) if (b.dxSet.has(p)) return true; return false; };
const covers = (o, w) => { for (const p of w.deSet) if (!o.dxSet.has(p)) return false; return true; };

// ---------- Antworten prüfen ----------
// Ergebnis: {res:'ok'|'near'|'bad'|'retry'|'empty', full?, alt?, other?, cap?}
function normIn(w, raw) {
  let s = canon(raw).replace(/\b(sb|sth)\b/g, ' ');
  if (w && w.hasSb) s = s.replace(/\b(somebody|someone|something)\b/g, ' ');
  return squash(s);
}
function capMiss(w, raw) {
  if (!w.capWords.length) return null;
  const toks = String(raw).replace(APOS, "'").split(/[^A-Za-z'-]+/).filter(Boolean);
  const miss = w.capWords.filter(cw => toks.some(t => t.toLowerCase() === cw.toLowerCase() && t !== cw));
  return miss.length ? miss : null;
}
// Großgeschriebene Nomen wie im Deutschen ("Friend") – nur ein Hinweis, kein Fehler
function capExtra(w, raw) {
  const toks = String(raw).replace(APOS, "'").split(/[^A-Za-z'-]+/).filter(Boolean);
  const multi = w.words > 1;
  const low = new Set(w.capWords.map(c => c.toLowerCase()));
  const own = new Set(w.plain.toLowerCase().replace(APOS, "'").split(/[^a-z'-]+/));
  return toks.some((t, k) => /[A-Z]/.test(t) && !(multi && k === 0) && !/^I('|$)/.test(t) && own.has(t.toLowerCase()) && !low.has(t.toLowerCase()));
}
const exactly = (w, s) => w.forms.has(s) || w.rxs.some(r => r.test(s));
const noAp = x => x.replace(/'/g, '').replace(/[\s-]+/g, ' ');
function checkEn(w, raw, alsoOk) {
  const s = normIn(w, raw);
  if (!s) return { res: 'empty' };
  const withCap = r => {
    const c = capMiss(w, raw);
    if (c) r.cap = c; else if (capExtra(w, raw)) r.low = true;
    return r;
  };
  if (exactly(w, s) || (alsoOk && alsoOk.includes(s))) return withCap({ res: 'ok' });
  const ls = loose(s);
  if ([...w.forms].some(f => loose(f) === ls) || w.rxs.some(r => r.test(ls))) return withCap({ res: 'ok', full: true });
  const others = (FORMS.get(s) || FORMS.get(ls) || []).map(i => WORDS[i]).filter(o => o.k !== w.k);
  if (others.length) {
    const same = others.find(o => covers(o, w));
    if (same) return { res: 'ok', alt: same };
    const ov = others.find(o => overlaps(o, w));
    if (ov) return { res: 'retry', other: ov };
    return { res: 'bad', other: others[0] };
  }
  const cands = [...w.forms, ...(alsoOk || [])];
  if (cands.some(f => noAp(f) === noAp(s) || noAp(loose(f)) === noAp(ls))) return { res: 'near', apos: s.includes("'") ? 0 : 1 };
  let best = 9, bestLen = 0;
  for (const f of cands) {
    const d = Math.min(osa(s, f), osa(ls, loose(f)));
    if (d < best || (d === best && f.length > bestLen)) { best = d; bestLen = f.length; }
  }
  const tol = bestLen >= 8 ? 2 : bestLen >= 4 ? 1 : 0;
  if (best <= tol) return { res: 'near' };
  return { res: 'bad' };
}

// Korrektur Buchstabe für Buchstabe: Eingabe gegen die nächstliegende richtige Schreibweise.
// Satzzeichen, sb/sth und (bei pre) „to“/Artikel vorne muss man nicht tippen – die werden nie markiert.
// Ergebnis: Liste von {op: '=' gleich | '~' falsch | '-' zu viel | '+' fehlt, a?: getippt, b?: richtig} oder null
const DX_FREE = /[.,!?;:"“”„()…]/;
function dxChars(s, pre, sb) {
  const out = s.split('').map(c => ({ c, k: c.toLowerCase(), free: DX_FREE.test(c) }));
  const rx = new RegExp(`${pre ? '^(?:to|a|an|the) (?=\\S)|' : ''}\\s*\\b(?:${sb ? 'somebody|someone|something|' : ''}sb|sth)\\b(?:\\s*/\\s*(?:sb|sth)\\b)?`, 'gi');
  for (const m of s.matchAll(rx)) for (let i = m.index; i < m.index + m[0].length; i++) out[i].free = true;
  return out;
}
function dxAlign(a, b) {
  const m = a.length, n = b.length, d = [[0]];
  const del = i => a[i].free ? 0 : 1, ins = j => b[j].free ? 0 : 1;
  const sub = (i, j) => a[i].k === b[j].k ? 0 : a[i].free || b[j].free ? 2 : 1;
  for (let i = 1; i <= m; i++) d[i] = [d[i - 1][0] + del(i - 1)];
  for (let j = 1; j <= n; j++) d[0][j] = d[0][j - 1] + ins(j - 1);
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j - 1] + sub(i - 1, j - 1), d[i - 1][j] + del(i - 1), d[i][j - 1] + ins(j - 1));
  const ops = [];
  let i = m, j = n;
  while (i || j) {
    if (i && j && d[i][j] === d[i - 1][j - 1] + sub(i - 1, j - 1)) { i--; j--; ops.push({ op: a[i].k === b[j].k ? '=' : '~', a: a[i], b: b[j] }); }
    else if (i && d[i][j] === d[i - 1][j] + del(i - 1)) { i--; ops.push({ op: '-', a: a[i] }); }
    else { j--; ops.push({ op: '+', b: b[j] }); }
  }
  return { cost: d[m][n], ops: ops.reverse() };
}
function spellDiff(w, raw, cands, pre) {
  const a = dxChars(squash(String(raw).replace(APOS, "'")), pre, w.hasSb);
  if (!a.length || w.rxs.length) return null;
  let best = null;
  const seen = new Set();
  for (const c of cands) {
    const t = squash(String(c).replace(APOS, "'"));
    if (!t || seen.has(canon(t))) continue;
    seen.add(canon(t));
    const r = dxAlign(a, dxChars(t, pre, false));
    if (!best || r.cost < best.cost) best = r;
  }
  if (!best || !best.cost) return null;
  // Ganz anderes Wort? Dann hilft keine Markierung – nur das richtige Wort zeigen.
  const hits = best.ops.filter(o => o.op === '=' && !o.b.free).length;
  const len = Math.max(a.filter(x => !x.free).length, best.ops.filter(o => o.b && !o.b.free).length);
  return hits * 2 >= len ? best.ops : null;
}

// Deutsch prüfen (nur im Probetest, Richtung Englisch -> Deutsch)
const foldDe = s => squash(String(s).toLowerCase()
  .replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ß/g, 'ss')
  .replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u')
  .replace(/\([^)]*\)/g, ' ').replace(/[.,!?;:"“”„…]/g, ' ')
  .replace(/\b(etw|jmdn|jmdm|jmd|sich)\b/g, ' ')
  .replace(/^(ein|eine|einen|einem|einer|eines|der|die|das|den|dem|des)\s+/, ''));
function checkDe(w, raw) {
  const input = String(raw).trim();
  if (!input) return { res: 'empty' };
  const want = new Set([...w.dxSet].map(foldDe).filter(Boolean));
  want.add(foldDe(w.de));
  const parts = input.split(/[,;/]|\boder\b/).map(foldDe).filter(Boolean);
  if (!parts.length) return { res: 'empty' };
  if (parts.some(p => want.has(p))) return { res: 'ok' };
  let best = 9, bestLen = 0;
  for (const p of parts) for (const f of want) {
    const d = osa(p, f);
    if (d < best) { best = d; bestLen = f.length; }
  }
  const tol = bestLen >= 8 ? 2 : bestLen >= 4 ? 1 : 0;
  return { res: best <= tol ? 'near' : 'bad' };
}

// Ablenker für Auswahlfragen: gleiche Art (Wortzahl/Länge), keine mehrdeutigen Bedeutungen
function distract(w, n, pool, mode = 'en') {
  const src = pool && pool.length > n * 3 ? pool : WORDS;
  const disp = o => mode === 'de' ? o.de1 : o.plain.toLowerCase();
  const seen = new Set([disp(w)]);
  const target = w.plain.toLowerCase();
  const cands = [];
  for (const o of src) {
    if (o === w || o.k === w.k || overlaps(o, w)) continue;
    const d = disp(o);
    if (seen.has(d)) continue;
    seen.add(d);
    const score = mode === 'sound'
      ? osa(o.plain.toLowerCase(), target) + Math.random()
      : Math.abs(o.words - w.words) * 3 + Math.abs(o.plain.length - w.plain.length) / 3 + Math.random() * 3;
    cands.push([score, o]);
  }
  cands.sort((a, b) => a[0] - b[0]);
  return shuffle(cands.slice(0, Math.max(n * 3, 8))).slice(0, n).map(c => c[1]);
}

// Plausible Rechtschreibfehler (für "Welche Schreibweise ist richtig?")
const MISSPELL = [
  [/ie/, 'ei'], [/ei/, 'ie'], [/ee/, 'ea'], [/ea/, 'ee'], [/ou/, 'ow'], [/ow/, 'ou'], [/oo/, 'u'],
  [/([bcdfglmnprstz])\1/, '$1'], [/([aeiou])([bdglmnprt])([aeiouy])/, '$1$2$2$3'],
  [/ph/, 'f'], [/th/, 'd'], [/ck/, 'k'], [/c(?=[aou])/, 'k'], [/wh/, 'w'], [/^wr/, 'r'], [/^kn/, 'n'],
  [/y$/, 'i'], [/y$/, 'ie'], [/([^e])e$/, '$1'], [/([bcdfgklmnprst])$/, '$1e'], [/er$/, 'a'], [/ture$/, 'tscher'],
  [/v/, 'w'], [/w(?=[aeiou])/, 'v'], [/s(?=[aeiou])/, 'z'], [/igh/, 'ei'], [/ay/, 'ey'], [/ai/, 'ei'],
  [/u/, 'a'], [/o/, 'u'], [/a/, 'e'], [/e(?!$)/, 'a'], [/i/, 'e'], [/qu/, 'kw'], [/sh/, 'sch'], [/j/, 'dsch'], [/x/, 'ks'],
];
function misspell(w, n = 3) {
  const plain = w.plain.replace(APOS, "'");
  const toks = plain.split(' ');
  let k = 0;
  toks.forEach((t, i) => { if (t.replace(/[^A-Za-z]/g, '').length > toks[k].replace(/[^A-Za-z]/g, '').length) k = i; });
  const word = toks[k];
  const core = word.replace(/[^A-Za-z'-]/g, '');
  if (core.length < 3) return [];
  const out = new Set();
  for (const [rx, rep] of shuffle(MISSPELL)) {
    if (!rx.test(core)) continue;
    const bad = core.replace(rx, rep);
    if (bad === core || bad.length < 2) continue;
    const cand = toks.map((t, i) => i === k ? t.replace(core, bad) : t).join(' ');
    if (FORMS.has(canon(cand)) || cand.toLowerCase() === plain.toLowerCase()) continue;
    out.add(cand);
    if (out.size >= n) break;
  }
  return [...out];
}

function deShort(w) {

  if (s.length > 26) s = s.split(/,\s*/)[0].trim();

  return s;
}

// ---------- Spielstand ----------
const LS_KEY = 'wortfuchs.v1';
const GOALS = [50, 100, 200, 300, 500, 1000, 2000, 5000, 10000];
const INTERVAL = [0, 0, 0, 1, 2, 4];
const WEIGHT = [0, .15, .35, .65, .85, 1];
const LEVEL_NAMES = ['Fuchswelpe', 'Spurenleser', 'Entdecker', 'Wortjäger', 'Schlaufuchs', 'Sprachtalent', 'London-Kenner', 'Vokabel-Profi', 'Meisterfuchs', 'Legende'];
const xpAt = L => 50 * L * (L - 1);

function fresh() {
  return {
    v: 1, t0: Date.now(), onb: false, rs: 0,
    set: { name: '', goal: 100, sfx: true, tts: true, spk: true, rate: 0.9, voice: '', m: 0, tal: true, tk: 60, td: 20, tm: 60, hat: '', scarf: '' },
    w: {}, days: {}, asg: {}, cur: '', curM: 0, tests: [], bdg: {}, st: {},
    pair: { k: '', m: 0 }, req: { c: '', o: 0, n: 0, m: 0 }, red: [],
  };
}
let S = fresh();

const WF = ['b', 'd', 'n', 'c', 'x', 'r', 'f', 'm'];
const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
function pack(s) {
  const w = {};
  for (const [id, x] of Object.entries(s.w)) w[id] = WF.map(k => x[k] || 0);
  return { ...s, w };
}
function unpack(d) {
  const f = fresh();
  if (!isObj(d)) return f;
  const s = Object.assign(f, d);
  s.set = Object.assign(fresh().set, isObj(d.set) ? d.set : {});
  s.w = {};
  for (const [id, x] of Object.entries(isObj(d.w) ? d.w : {})) {
    s.w[id] = Array.isArray(x) ? Object.fromEntries(WF.map((k, i) => [k, +x[i] || 0])) : isObj(x) ? { ...x } : null;
    if (!s.w[id]) delete s.w[id];
  }
  for (const k of ['days', 'asg', 'bdg', 'st']) if (!isObj(s[k])) s[k] = {};
  for (const k of ['pair', 'req']) if (!isObj(s[k])) s[k] = fresh()[k];
  if (!Array.isArray(s.tests)) s.tests = [];
  if (!Array.isArray(s.red)) s.red = [];
  return s;
}

function mergeState(a, b) {
  if ((a.rs || 0) !== (b.rs || 0)) {
    // Nach "Alles zurücksetzen" gilt nur noch die neuere Seite
    const [nw, old] = (a.rs || 0) > (b.rs || 0) ? [a, b] : [b, a];
    const r = unpack(pack(nw));
    if ((old.set.m || 0) > (nw.set.m || 0)) r.set = { ...nw.set, ...old.set };
    return r;
  }
  const r = fresh();
  r.t0 = Math.min(a.t0 || Date.now(), b.t0 || Date.now());
  r.rs = a.rs || 0;
  r.onb = !!(a.onb || b.onb);
  r.set = (b.set.m || 0) > (a.set.m || 0) ? { ...a.set, ...b.set } : { ...b.set, ...a.set };
  const newest = (x, y) => {
    const o = { ...x };
    for (const [k, v] of Object.entries(y)) if (!o[k] || (v.m || 0) > (o[k].m || 0)) o[k] = v;
    return o;
  };
  r.w = newest(a.w, b.w);
  r.asg = newest(a.asg, b.asg);
  if ((b.curM || 0) > (a.curM || 0)) { r.cur = b.cur; r.curM = b.curM; } else { r.cur = a.cur; r.curM = a.curM; }
  for (const src of [a.days, b.days]) {
    for (const [k, d] of Object.entries(src)) {
      const t = r.days[k] || (r.days[k] = {});
      for (const [f, v] of Object.entries(d || {})) t[f] = Math.max(t[f] || 0, +v || 0);
    }
  }
  const tests = new Map();
  for (const t of [...a.tests, ...b.tests]) {
    const o = tests.get(t.id);
    if (!o || (t.m || 0) > (o.m || 0)) tests.set(t.id, t);
  }
  r.tests = [...tests.values()].sort((x, y) => x.a - y.a).slice(-60);
  r.bdg = { ...b.bdg };
  for (const [k, v] of Object.entries(a.bdg)) r.bdg[k] = r.bdg[k] ? Math.min(r.bdg[k], v) : v;
  for (const src of [a.st, b.st]) for (const [k, v] of Object.entries(src)) r.st[k] = Math.max(r.st[k] || 0, +v || 0);
  // Fuchstaler: Kopplung und offene Anfrage nach m, Einlöse-Verlauf vereint
  r.pair = (b.pair.m || 0) > (a.pair.m || 0) ? b.pair : a.pair;
  r.req = (b.req.m || 0) > (a.req.m || 0) ? b.req : a.req;
  const red = new Map();
  for (const x of [...a.red, ...b.red]) red.set(x.id, x);
  r.red = [...red.values()].sort((x, y) => x.t - y.t).slice(-400);   // Kontostand rechnet mit dem Verlauf
  return r;
}

// ---------- Lernstand eines Worts ----------
const ws = w => S.w[w.id];
const lvl = w => (S.w[w.id] && S.w[w.id].b) || 0;
const isDue = (w, t = today()) => { const s = S.w[w.id]; return !!s && s.b >= 1 && s.d <= t; };
const groupOf = b => b <= 0 ? 0 : b <= 2 ? 1 : b === 3 ? 2 : 3;   // Neu, Am Lernen, Gelernt, Sicher
const GROUPS = ['Neu', 'Am Lernen', 'Gelernt', 'Sicher'];

// kind: intro | recog | recall;  res: ok | near | bad | miss
function grade(w, kind, res) {
  const t = today();
  const s = S.w[w.id] || (S.w[w.id] = { b: 0, d: t, n: 0, c: 0, x: 0, r: 0, f: t, m: 0 });
  if (!s.f) s.f = t;
  s.n++;
  if (kind === 'intro') {
    if (s.b < 1) { s.b = 1; s.f = t; }
    s.d = t;
  } else if (res === 'ok') {
    s.c++;
    if (kind === 'recog') {
      if (s.b < 2) { s.b = 2; s.d = t; }
    } else {
      const wasFive = s.b >= 5;
      if (s.b < 3) s.b = 3;
      else if (s.d <= t && s.r !== t) s.b = Math.min(5, s.b + 1);
      s.r = t;
      s.d = t + (wasFive ? 7 : INTERVAL[s.b]);
      const a = curAsg();
      if (a && a.test) {
        const T = keyNum(a.test);
        if (T > t) s.d = Math.min(s.d, Math.max(t + 1, T - 1));
      }
    }
  } else if (res === 'near') {
    s.d = t;
  } else if (res === 'bad') {
    s.x++; s.b = Math.max(1, s.b - 2); s.d = t;
  } else if (res === 'miss') {
    s.x++; s.d = t;
    if (s.b < 1) s.b = 1;
  }
  s.m = Date.now();
}

// ---------- Aufgaben (Seitenbereiche) ----------
const curAsg = () => { const a = S.asg[S.cur]; return a && !a.del ? a : null; };
const asgId = (from, to) => `p${from}-${to}`;
const poolCache = new Map();
function poolOf(a) {
  if (!a) return [];
  const key = `${a.from}-${a.to}-${a.box ? 1 : 0}-${a.ext ? 1 : 0}`;
  if (poolCache.has(key)) return poolCache.get(key);
  const res = [];
  for (const w of WORDS) {
    const o = w.o.find(o => o[0] >= a.from && o[0] <= a.to && (o[1] === 0 || (o[1] === 1 && a.box) || (o[1] === 2 && a.ext)));
    if (o) res.push([o[3], w, o]);
  }
  res.sort((x, y) => x[0] - y[0]);
  const out = res.map(x => x[1]);
  out.occ = new Map(res.map(x => [x[1].id, x[2]]));
  if (poolCache.size > 40) poolCache.delete(poolCache.keys().next().value);
  poolCache.set(key, out);
  return out;
}
// Wie viele Wörter ein Bereich hätte – und was die Schalter dazugeben würden
function rangeInfo(from, to, box, ext) {
  const n = a => poolOf(Object.assign({ from, to, box, ext }, a)).length;
  return { n: n({}), plusBox: n({ box: true }) - n({ box: false }), plusExt: n({ ext: true }) - n({ ext: false }) };
}

const STATION = 5;
function stationsOf(a) {
  const pool = poolOf(a);
  const out = [];
  let cur = null;
  for (const w of pool) {
    const o = pool.occ.get(w.id);
    const u = LABELS[o[2]].u;
    if (!cur || cur.unit !== u || cur.words.length >= STATION) {
      cur = { i: out.length, unit: u, words: [], page: o[0] };
      out.push(cur);
    }
    cur.words.push(w);
  }
  // Kleine Reste an die vorige Station derselben Unit hängen
  for (let i = out.length - 1; i > 0; i--) {
    const s = out[i], p = out[i - 1];
    if (s.words.length <= 2 && p.unit === s.unit && p.words.length + s.words.length <= 7) {
      p.words.push(...s.words);
      out.splice(i, 1);
    }
  }
  out.forEach((s, i) => { s.i = i; });
  let foundCur = false;
  for (const s of out) {
    const ls = s.words.map(lvl);
    s.done = ls.every(b => b >= 1);
    s.gold = ls.every(b => b >= 4);
    s.status = s.done ? (s.gold ? 'gold' : 'done') : foundCur ? 'locked' : 'current';
    if (!s.done) foundCur = true;
  }
  return out;
}

function poolInfo(a) {
  const pool = poolOf(a);
  const t = today();
  const counts = [0, 0, 0, 0];
  let r = 0, due = 0, newLeft = 0, introToday = 0;
  for (const w of pool) {
    const s = S.w[w.id];
    const b = (s && s.b) || 0;
    counts[groupOf(b)]++;
    r += WEIGHT[b];
    if (b === 0) newLeft++;
    else if (s.d <= t) due++;
    if (s && s.f === t && b > 0) introToday++;
  }
  const ready = pool.length ? r / pool.length : 0;
  const dl = a && a.test ? keyNum(a.test) - t : null;
  let newGoal;
  if (dl !== null && dl >= 1) newGoal = Math.ceil((newLeft + introToday) / Math.max(1, dl - 1));
  else newGoal = Math.min(newLeft + introToday, 10);
  const newToday = Math.max(0, Math.min(newLeft, newGoal - introToday));
  return { pool, counts, ready, due, newLeft, introToday, newToday, dl };
}

// ---------- XP, Level, Serie ----------
const todayRec = () => S.days[dayKey(today())] || (S.days[dayKey(today())] = { xp: 0, s: 0, a: 0, ok: 0, l: 0 });
const todayXP = () => (S.days[dayKey(today())] || {}).xp || 0;
const totalXP = () => sum(Object.values(S.days).map(d => d.xp || 0));
function levelInfo(xp = totalXP()) {
  let L = 1;
  while (xpAt(L + 1) <= xp) L++;
  const a = xpAt(L), b = xpAt(L + 1);
  return { L, name: LEVEL_NAMES[Math.min(L, LEVEL_NAMES.length) - 1], xp, from: a, to: b, p: (xp - a) / (b - a) };
}
function streakInfo() {
  const keys = Object.keys(S.days).filter(k => (S.days[k].l || 0) > 0).sort();
  const t = today();
  if (!keys.length) return { n: 0, best: 0, freezes: 0, todayDone: false, active: 0 };
  let n = 0, best = 0, freezes = 0, prev = null, active = 0, usedLast = 0;
  for (const k of keys) {

    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + d + 0.05);
  },
  // Knistern für den Blitz: kurzes Rauschen durch einen Bandpass
  noise(c, t, d, v, hz) {
    const n = Math.round(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = b;
    f.type = 'bandpass';
    f.frequency.value = hz;
    f.Q.value = 0.9;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f);
    f.connect(g);
    g.connect(c.destination);
    src.start(t);
    src.stop(t + d + 0.02);
  },
  play(name, lv = 1) {
    if (!S.set.sfx) return;
    const c = this.get();
    if (!c) return;
    const t = c.currentTime + 0.02;
    const T = (f, dt, d, type = 'sine', v = 0.14, f2) => this.tone(c, f, t + dt, d, type, v, f2);
    switch (name) {
      case 'ok': T(784, 0, 0.12, 'sine', 0.16); T(1175, 0.08, 0.24); break;
      case 'near': T(659, 0, 0.14, 'sine', 0.13); T(740, 0.1, 0.18, 'sine', 0.11); break;
      case 'bad': T(330, 0, 0.16, 'triangle', 0.16, 300); T(247, 0.13, 0.28, 'triangle', 0.15, 220); break;
      case 'tap': T(1320, 0, 0.05, 'sine', 0.05); break;
      case 'pair': T(988, 0, 0.09, 'sine', 0.12); T(1319, 0.06, 0.12, 'sine', 0.1); break;
      case 'combo': [659, 784, 988, 1319].forEach((f, i) => T(f, i * 0.065, 0.16, 'triangle', 0.12)); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => T(f, i * 0.11, 0.3, 'triangle', 0.14)); T(1319, 0.46, 0.5, 'sine', 0.12); break;
      case 'level': [392, 523, 659, 784, 1047, 1319].forEach((f, i) => T(f, i * 0.08, 0.3, 'square', 0.045)); break;
      // Blitz-Feier: Zischen, dann Fanfare – je Stufe einen Ton höher und voller
      case 'zap': {
        const k = Math.pow(2, [0, 2, 4, 5][lv - 1] / 12), n = [523, 659, 784, 1047].map(f => f * k);
        try { this.noise(c, t, 0.22, 0.22, 2600); } catch (e) { /* egal */ }
        T(1900, 0, 0.2, 'sawtooth', 0.045, 140);
        n.forEach((f, i) => T(f, 0.16 + i * 0.07, 0.2, 'triangle', 0.13));
        T(n[3], 0.46, 0.55, 'sine', 0.11);
        T(n[1] * 2, 0.46, 0.55, 'sine', 0.06);
        if (lv >= 3) [2, 2.52].forEach((m, i) => T(n[0] * m * 2, 0.62 + i * 0.07, 0.25, 'sine', 0.05));
        break;
      }
      case 'tick': T(1760, 0, 0.03, 'square', 0.03); break;
      case 'start': T(440, 0, 0.1); T(660, 0.1, 0.1); T(880, 0.2, 0.2, 'sine', 0.16); break;
    }
  },
};

const Modal = {
  q: [], open: false, cur: null, back: null,
  show(html, opts = {}) {
    this.q.push({ html, opts });
    if (!this.open) this.next();
  },
  next() {
    const m = this.q.shift();
    const el = $('#modal');
    if (!m) {
      el.hidden = true;
      this.open = false;
      this.cur = null;
      if (this.back && this.back.isConnected) { try { this.back.focus({ preventScroll: true }); } catch (e) { /* egal */ } }
      this.back = null;
      return;
    }
    if (!this.open) this.back = document.activeElement;
    this.open = true;
    this.cur = m;
    $('#modal-card').innerHTML = m.html;
    el.hidden = false;
    const f = $('#modal-card [autofocus]') || $('#modal-card button');
    if (f) f.focus({ preventScroll: true });
    if (m.opts.onShow) m.opts.onShow();
  },
  close(val) {
    const m = this.cur;
    this.cur = null;
    if (m && m.opts.onClose) m.opts.onClose(val);
    this.next();
  },
};
ACT['modal-close'] = el => Modal.close(el.dataset.val);

function ask({ title, text = '', yes = 'Ja', no = 'Abbrechen', danger = false, art = '', stay = false }) {

      <div class="modal-btns">${stay ? noB + yesB : yesB + noB}</div>`,
    { onClose: v => res(v === '1') });

function trapFocus(e, root) {
  const f = $$('button:not([disabled]), input:not([disabled]), select, [tabindex]:not([tabindex="-1"])', root)
    .filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
}

// ---------- Konfetti ----------
function confetti(n = 110) {
  if (REDUCED) return;
  const cv = $('#confetti');
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = Math.round(innerWidth * dpr), H = cv.height = Math.round(innerHeight * dpr);
  const cols = ['#E65C0E', '#F2AE00', '#1E9A55', '#2E78F0', '#E5484D', '#8E4EC6', '#0E9384'];
  const ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({
      x: W * (0.3 + Math.random() * 0.4), y: H * 0.34,
      vx: (Math.random() - 0.5) * 22 * dpr, vy: (-8 - Math.random() * 15) * dpr,
      s: (7 + Math.random() * 6) * dpr, c: pickOne(cols), a: Math.random() * 6.3, va: (Math.random() - 0.5) * 0.35, k: rnd(3),
    });
  }
  const t0 = performance.now();
  let last = t0;
  cancelAnimationFrame(confetti.raf);
  const step = now => {
    const dt = Math.min(3, (now - last) / 16.7);
    last = now;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of ps) {
      p.vy += 0.5 * dpr * dt;
      p.vx *= Math.pow(0.985, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.a += p.va * dt;
      if (p.y > H + 30) continue;
      alive++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.fillStyle = p.c;
      if (p.k === 0) ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      else if (p.k === 1) { ctx.beginPath(); ctx.arc(0, 0, p.s / 3, 0, 6.3); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(0, -p.s / 2); ctx.lineTo(p.s / 2, p.s / 2); ctx.lineTo(-p.s / 2, p.s / 2); ctx.fill(); }
      ctx.restore();
    }
    if (alive && now - t0 < 5000) confetti.raf = requestAnimationFrame(step);
    else ctx.clearRect(0, 0, W, H);
  };
  confetti.raf = requestAnimationFrame(step);
}

// ---------- Kopfzeile: Serie, Tagesziel, Level ----------
function ring(p, size, sw, color) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, h = size / 2;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--rule)" stroke-width="${sw}"/>`
    + (p > 0.001 ? `<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - clamp(p, 0, 1))).toFixed(2)}" transform="rotate(-90 ${h} ${h})"/>` : '')
    + '</svg>';
}

<script>
/* Wortfuchs – Ansichten: Start (Aufgabe, Linie, Übungsarten), Seitenwahl,
   Wörterliste, Erfolge, Elternbereich und Willkommen. */
'use strict';

const LV_CLS = b => b >= 4 ? 'l4' : b === 3 ? 'l3' : b >= 1 ? 'l1' : '';
const LV_COL = ['var(--lv0)', 'var(--lv1)', 'var(--lv3)', 'var(--lv4)'];
const unitsOf = pool => uniq(pool.map(w => LABELS[pool.occ.get(w.id)[2]].u)).sort((x, y) => x - y);
const rangeTxt = a => a.from === a.to ? `Seite ${a.from}` : `Seite ${a.from}–${a.to}`;
const longDay = n => fmtDay(n, { weekday: 'long', day: 'numeric', month: 'long' });
const GOAL_TXT = { 50: ['Locker', '3 Min.'], 100: ['Normal', '5 Min.'], 200: ['Ehrgeizig', '10 Min.'], 300: ['Profi', '15 Min.'],
  500: ['Fleißig', '25 Min.'], 1000: ['Superfleißig', '50 Min.'], 2000: ['Marathon', '1¾ Std.'], 5000: ['Extrem', '4 Std.'], 10000: ['Legendär', '8 Std.'] };

// ======================= Start =======================
let lineOpen = false;

VIEWS.home = () => {
  const a = curAsg();
  const el = $('#v-home');
  if (!a) {
    el.innerHTML = `<div class="wrap">${greetHTML(null, null)}
      <div class="card hero-empty">${fox('happy')}<h1>Welche Seiten lernst du?</h1>
      <button class="btn btn-primary" type="button" data-go="picker">Seiten wählen ${icon('arrow-right')}</button></div></div>`;
    return;
  }
  const info = poolInfo(a);
  const st = stationsOf(a);
  el.innerHTML = `<div class="wrap">${greetHTML(a, info)}
    <div class="home-grid">${heroHTML(a, info, st)}${lineHTML(st)}${modesHTML(info)}</div></div>`;
};

function greetHTML(a, info) {
  const h = new Date().getHours();
  const nm = S.set.name ? ', ' + esc(S.set.name) : '';
  const hi = (h >= 5 && h < 11 ? 'Guten Morgen' : h >= 18 ? 'Guten Abend' : 'Hallo') + nm;
  const st = streakInfo();
  const goalDone = todayXP() >= S.set.goal;
  let msg;
  if (a && info.dl !== null && info.dl >= 0 && info.dl <= 1) msg = `${hi}! <b>Du schaffst das!</b>`;
  else if (a && st.n >= 2 && !st.todayDone) msg = `Rette deine <b>${st.n}-Tage-Serie</b>!`;
  else if (a && goalDone) msg = `<b>Tagesziel geschafft!</b>`;
  else if (!Object.keys(S.w).length) msg = `${hi}! Ich bin <b>Fitz</b>.`;
  else msg = `${hi}!`;
  return `<div class="greet">${fox(goalDone ? 'happy' : '')}<p class="bubble">${msg}</p></div>`;
}

function heroHTML(a, info, st) {
  const n = info.pool.length;
  const us = unitsOf(info.pool);
  const [, , c2, c3] = info.counts;
  const pc = x => (n ? x / n * 100 : 0).toFixed(1) + '%';
  const title = a.from === a.to ? `Seite ${a.from}` : `Seite ${a.from}<span class="dash">–</span>${a.to}`;
  return `<section class="card hero" style="--hero-c:${us.length ? UNITS[us[0]].c : 'var(--fox)'}" aria-label="Deine Aufgabe">

      <button class="btn btn-ghost btn-sm hero-edit" type="button" data-go="picker" aria-label="Seiten ändern">${icon('pencil')}</button></div>
    ${learnedHTML(c2 + c3, n)}
    <div class="lvbar" aria-hidden="true"><i class="l4" style="width:${pc(c2 + c3)}"></i></div>
    ${testHTML(a, info)}
    ${ctaHTML(info, st)}
  </section>`;
}

// „18 / 102 Wörter gelernt“ – auf der Startseite und im Ergebnis
function learnedHTML(k, n, plus = 0) {
  return `<p class="learned"><b>${k}</b><span class="of">/ ${n}</span>${plus > 0 ? `<span class="plus">+${plus}</span>` : ''}
    <small>${k >= n ? 'Alle Wörter gelernt!' : 'Wörter gelernt'}</small></p>`;
}

function testHTML(a, info) {
  const dl = info.dl;
  if (dl === null) return `<button class="hero-test link" type="button" data-go="picker">${icon('calendar')}Testtag eintragen</button>`;
  if (dl < 0) return `<p class="hero-test">${icon('check')}Test vorbei</p>`;
  if (dl === 0) return `<p class="hero-test is-hot">${icon('flag')}<b>Heute ist Test!</b></p>`;
  if (dl === 1) return `<p class="hero-test is-hot">${icon('flag')}<b>Morgen ist Test!</b></p>`;
  return `<p class="hero-test${dl <= 2 ? ' is-hot' : ''}">${icon('calendar')}<span>Noch <b>${dl} Tage</b> bis zum Test</span></p>`;
}

function planText(info) {
  const { newToday, due, newLeft, dl, introToday } = info;
  if (dl !== null && dl < 0) return 'Der Test ist vorbei. Wähl die Seiten für den nächsten Test!';
  if (!newLeft && !due) {
    return info.ready >= 0.9 ? 'Du bist <b>testbereit</b>! Halte die Wörter mit Blitz-Runden frisch.'
      : 'Alle Wörter kennst du schon. Jetzt heißt es <b>festigen</b>, bis alles sitzt!';
  }
  const parts = [];
  if (newToday) parts.push(`<b>${plural(newToday, 'neues Wort', 'neue Wörter')}</b>`);
  if (due) parts.push(`<b>${plural(due, 'Wiederholung', 'Wiederholungen')}</b>`);
  if (!parts.length) return 'Tagesplan geschafft! Wenn du magst, lern schon weiter.';
  const tail = dl !== null && dl >= 1 && newToday ? ' – dann schaffst du alles bis zum Test.' : '';
  return `${introToday && newToday ? 'Heute noch' : 'Heute'}: ${parts.join(' und ')}${tail}`;
}

function ctaHTML(info, st) {
  const cur = st.find(s => s.status === 'current');
  const btn = (attrs, label, sub) => `<button class="btn btn-primary btn-block" type="button" ${attrs}>${label}${sub ? `<small class="cta-sub">${sub}</small>` : ''}${icon('arrow-right')}</button>`;
  if (info.dl !== null && info.dl < 0) return btn('data-go="picker"', 'Neue Seiten wählen');
  if (cur && info.newToday > 0) return btn(`data-act="stop" data-i="${cur.i}"`, 'Weiterlernen', esc(stationName(cur.i)));
  if (info.due > 0) return btn('data-act="review"', 'Wiederholen', plural(info.due, 'Wort', 'Wörter'));
  if (cur) return btn(`data-act="stop" data-i="${cur.i}"`, 'Weiterlernen', 'Bonus');
  if (info.ready < 0.9) return btn('data-act="strengthen"', 'Festigen');
  return btn('data-act="test-setup"', 'Probetest machen');
}

function modesHTML(info) {
  const pool = info.pool;
  const oops = pool.filter(w => { const s = S.w[w.id]; return s && s.x > 0 && s.b < 4; }).length;
  const known = pool.filter(w => lvl(w) >= 1).length || Object.keys(S.w).length;
  const m = (cls, act, ic, title, pill, off) => `<button class="mode ${cls}${off ? ' is-off' : ''}" type="button" data-act="${act}"${off ? ' aria-disabled="true"' : ''}>
    <span class="mode-ic">${icon(ic)}</span><b>${title}</b>${pill ? `<span class="pill">${pill}</span>` : ''}</button>`;
  return `<div class="modes">
    ${m('m-review', 'review', 'repeat', 'Wiederholen', info.due, !info.due)}
    ${m('m-blitz', 'blitz', 'zap', 'Blitz-Runde', 0, known < 4)}
    ${m('m-test', 'test-setup', 'clipboard-check', 'Probetest', 0, false)}
    ${m('m-oops', 'oops', 'wrench', 'Fehler üben', oops, !oops)}
  </div>`;

// ---------- Die Linie ----------
function lineHTML(st) {
  const n = st.length;
  if (!n) return '';
  const curS = st.find(s => s.status === 'current');
  const curI = curS ? curS.i : n - 1;
  let lo = 0, hi = n - 1;
  if (n > 8 && !lineOpen) {
    lo = Math.max(0, curI - 2);
    hi = Math.min(n - 1, lo + 5);
    lo = Math.max(0, hi - 5);
  }
  const items = [];
  if (lo > 0) items.push(lineMoreHTML(lo, st[lo].unit, 'up'));
  let prevU = -1;
  for (let i = lo; i <= hi; i++) {
    const s = st[i];
    if (s.unit !== prevU) { items.push(unitHTML(s.unit, !items.length)); prevU = s.unit; }
    items.push(stopHTML(s, !items.length));
  }
  if (hi < n - 1) items.push(lineMoreHTML(n - 1 - hi, st[hi].unit, 'down'));
  items.push(finalHTML(st));
  const done = st.filter(s => s.done).length;
  return `<section class="card line-card" aria-label="Deine Linie">
    <div class="line-head"><h2>Stationen</h2><span class="kicker">${done} / ${n}</span></div>
    <ol class="line">${items.join('')}</ol>
    ${n > 8 ? `<p class="line-toggle"><button class="link" type="button" data-act="line-open">${lineOpen ? 'Weniger zeigen' : 'Alle Stationen zeigen'}</button></p>` : ''}
  </section>`;
}

function unitHTML(u, first) {
  const U = UNITS[u];
  return `<li class="line-unit${first ? ' is-first' : ''}" style="--c:${U.c}"><span class="knot"></span>
    <span class="lu-txt"><span class="utag" style="--c:${U.c}">${esc(U.short)}</span>${U.sub ? `<span class="lu-sub">${esc(U.sub)}</span>` : ''}</span></li>`;
}

function lineMoreHTML(count, u, dir) {
  return `<li class="line-more" style="--c:${UNITS[u].c}"><span></span>
    <button class="btn btn-ghost btn-sm" type="button" data-act="line-open">${icon(dir === 'up' ? 'chevron-up' : 'chevron-down')}${plural(count, 'weitere Station', 'weitere Stationen')}</button></li>`;
}

function stopHTML(s, first) {
  const cls = { gold: 'is-done is-gold', done: 'is-done', current: 'is-current', locked: 'is-locked' }[s.status];
  const ic = s.status === 'gold' ? icon('star', 'ic-fill') : s.status === 'done' ? icon('check')
    : s.status === 'locked' ? icon('lock') : icon('play', 'ic-fill');
  const what = { gold: 'sitzt perfekt', done: 'geschafft – nochmal üben', current: 'jetzt dran', locked: 'noch gesperrt' }[s.status];
  const name = stationName(s.i);
  return `<li class="stop ${cls}${first ? ' is-first' : ''}" style="--c:${UNITS[s.unit].c}">
    <button class="stop-dot" type="button" data-act="stop" data-i="${s.i}" aria-label="${esc(`${name}, Station ${s.i + 1}: ${what}`)}">${ic}</button>
    <div class="stop-info"><b>${esc(name)}</b>
      <div class="stop-meter" aria-hidden="true">${s.words.map(w => `<i class="${LV_CLS(lvl(w))}"></i>`).join('')}</div>
      ${s.status === 'current' ? `<div class="stop-go">${fox('happy')}<button class="btn btn-primary btn-sm" type="button" data-act="stop" data-i="${s.i}">Los geht's ${icon('arrow-right')}</button></div>` : ''}
    </div></li>`;
}

function finalHTML(st) {
  const all = st.every(s => s.done);
  return `<li class="stop is-final is-last${all ? ' is-open' : ''}" style="--c:${UNITS[st[st.length - 1].unit].c}">
    <button class="stop-dot" type="button" data-act="test-setup" aria-label="Endstation: Probetest">${icon('flag')}</button>

}

ACT['line-open'] = () => { lineOpen = !lineOpen; VIEWS.home(false); };
ACT.stop = el => {
  const a = curAsg();
  if (!a) return;
  const s = stationsOf(a)[+el.dataset.i];
  if (!s) return;
  if (s.status === 'locked') { toast(`${icon('lock')} Schaff erst die Station davor!`); Sfx.play('near'); return; }

// ======================= Seitenwahl =======================
const PK = { from: 0, to: 0, box: true, ext: false, test: '', step: 0, root: '#v-picker', autoExt: false };

function pkLoad() {
  const a = curAsg();
  Object.assign(PK, a
    ? { from: a.from, to: a.to, box: !!a.box, ext: !!a.ext, test: a.test || '', step: 0, autoExt: false }
    : { from: 0, to: 0, box: true, ext: false, test: '', step: 0, autoExt: false });
}
VIEWS.picker = isNew => {
  if (isNew) { pkLoad(); PK.root = '#v-picker'; }
  renderPicker();
};

// Nur Zusatzseiten gewählt? Dann die Zusatz-Wörter automatisch einschalten (und wieder aus).
function pkAutoExt() {
  if (!PK.from) return;
  const base = rangeInfo(PK.from, PK.to, PK.box, false);
  if (!base.n && base.plusExt > 0) { if (!PK.ext) { PK.ext = true; PK.autoExt = true; } }
  else if (PK.autoExt) { PK.ext = false; PK.autoExt = false; }
}

const switchRow = (ch, on, label, sub) => `<div class="set-row"><div><span class="lbl">${label}</span>${sub ? `<small>${sub}</small>` : ''}</div>
  <label class="switch"><input type="checkbox" data-ch="${ch}"${on ? ' checked' : ''} aria-label="${label}"><span></span></label></div>`;

function renderPicker() {
  const root = $(PK.root);
  if (!root) return;
  const ob = PK.root !== '#v-picker';
  const has = PK.from > 0;
  const ri = has ? rangeInfo(PK.from, PK.to, PK.box, PK.ext) : null;
  const nSt = has && ri.n ? stationsOf({ from: PK.from, to: PK.to, box: PK.box, ext: PK.ext }).length : 0;

  const pages = [];
  for (let p = PAGES.min; p <= PAGES.max; p++) {
    const inR = has && p >= PK.from && p <= PK.to;
    const edge = has && (p === PK.from || p === PK.to);
    const miss = PAGES.missing.includes(p);
    const us = PAGE_UNITS[p] || [];
    pages.push(`<button class="pg-btn${inR ? ' in' : ''}${edge ? ' edge' : ''}${miss ? ' missing' : ''}" type="button" data-act="pk-page" data-p="${p}" aria-pressed="${inR}" aria-label="Seite ${p}${miss ? ' (Foto fehlt)' : ''}">${p}${us.length
      ? `<span class="bars">${us.map(u => `<i style="--c:${UNITS[u].c}"></i>`).join('')}</span>` : ''}</button>`);
  }
  const legend = UNITS.map(u => `<button type="button" style="--c:${u.c}" data-act="pk-unit" data-u="${u.i}" aria-label="${esc(u.n)}: Seite ${u.a} bis ${u.b}">${esc(u.short)}</button>`).join('');

  let sumTxt;
  if (!has) sumTxt = '<div><b>Tipp auf die erste Seite</b><span>… und dann auf die letzte.</span></div>';
  else if (PK.step === 1) sumTxt = `<div><b>Seite ${PK.from} – …</b><span>Jetzt die letzte Seite antippen</span></div>`;
  else sumTxt = `<div><b>${rangeTxt(PK)}</b><span>${ri.n ? `${plural(ri.n, 'Wort', 'Wörter')} · ${plural(nSt, 'Station', 'Stationen')}` : 'Hier gibt es keine Wörter'}</span></div>`
    + (ob ? '' : `<button class="btn btn-primary" type="button" data-act="pk-save"${ri.n ? '' : ' disabled'}>Übernehmen ${icon('check')}</button>`);

  let opts = '';
  if (has) {
    const t0 = today();
    const quick = [[1, 'Morgen'], [3, 'In 3 Tagen'], [7, 'In 1 Woche'], [0, 'Kein Datum']].map(([d, l]) => {
      const v = d ? dayKey(t0 + d) : '';
      return `<button class="chip" type="button" data-act="pk-quick" data-v="${v}" aria-pressed="${PK.test === v}">${l}</button>`;
    }).join('');
    const miss = PAGES.missing.filter(p => p >= PK.from && p <= PK.to);
    opts = `<div class="pk-opts">
      ${ri.plusBox > 0 || PK.box ? switchRow('pk-box', PK.box, 'Wörter aus den Kästen', ri.plusBox ? `+${plural(ri.plusBox, 'Wort', 'Wörter')}` : '') : ''}
      ${ri.plusExt > 0 || PK.ext ? switchRow('pk-ext', PK.ext, 'Zusatzseiten', ri.plusExt ? `+${plural(ri.plusExt, 'Wort', 'Wörter')}` : '') : ''}
      <div><div class="set-row"><div><span class="lbl">Wann ist der Test?</span></div></div>
        <div class="pk-date"><input class="field" type="date" data-ch="pk-date" value="${PK.test}" min="${dayKey(t0)}" aria-label="Datum des Tests"><div class="chips">${quick}</div></div>
        ${PK.test ? `<p class="pk-hint">${icon('calendar')} Test am ${longDay(keyNum(PK.test))}</p>` : ''}</div>
      ${miss.length ? `<p class="pk-hint">${icon('info')} Seite ${miss.join(' und ')} fehlt.</p>` : ''}
    </div>`;
  }

  const card = `<div class="card pk-card">
    <div class="pk-legend">${legend}</div>
    <div class="pk-grid">${pages.join('')}</div>
    <div class="pk-sum" aria-live="polite">${sumTxt}</div>
    ${opts}
  </div>`;
  root.innerHTML = ob ? card : `<div class="wrap"><div class="page-head"><h1>Seiten wählen</h1>
    <button class="btn btn-ghost btn-sm" type="button" data-go="home">Zurück</button></div>${card}${asgListHTML()}</div>`;
}

function asgListHTML() {
  const list = Object.values(S.asg).filter(a => a && !a.del).sort((x, y) => (y.m || 0) - (x.m || 0));
  if (!list.length) return '';
  return `<div class="section-title"><h2>Deine Aufgaben</h2></div><div class="asg-list">${list.map(a => {
    const cur = a.id === S.cur;
    const inf = poolInfo(a);
    const test = a.test ? ` · Test ${fmtDay(keyNum(a.test), { day: 'numeric', month: 'short' })}` : '';
    return `<div class="asg${cur ? ' is-cur' : ''}"><div class="asg-txt"><b>${rangeTxt(a)}</b>
      <span>${inf.counts[2] + inf.counts[3]} / ${inf.pool.length} gelernt${test}</span></div>
      ${cur ? '<span class="pill">aktiv</span>' : `<button class="btn btn-ghost btn-sm" type="button" data-act="asg-pick" data-id="${a.id}">Wählen</button>`}
      <button class="icon-btn" type="button" data-act="asg-del" data-id="${a.id}" aria-label="${rangeTxt(a)} löschen">${icon('trash')}</button></div>`;
  }).join('')}</div>`;
}

ACT['pk-page'] = el => {
  const p = +el.dataset.p;
  if (PK.step === 0 || !PK.from) { PK.from = PK.to = p; PK.step = 1; }
  else {
    if (p < PK.from) { PK.to = PK.from; PK.from = p; } else PK.to = p;
    PK.step = 0;
  }
  pkAutoExt();
  Sfx.play('tap');
  renderPicker();
};
ACT['pk-unit'] = el => {
  const u = UNITS[+el.dataset.u];
  PK.from = u.a; PK.to = u.b; PK.step = 0;
  if (u.x && !PK.ext) { PK.ext = true; PK.autoExt = true; } else pkAutoExt();
  Sfx.play('tap');
  renderPicker();
};
ACT['pk-quick'] = el => { PK.test = el.dataset.v; renderPicker(); };
CHG['pk-date'] = el => { PK.test = el.value || ''; renderPicker(); };
CHG['pk-box'] = el => { PK.box = el.checked; renderPicker(); };
CHG['pk-ext'] = el => { PK.ext = el.checked; PK.autoExt = false; renderPicker(); };

function pkSave() {
  if (!PK.from) return false;
  if (!rangeInfo(PK.from, PK.to, PK.box, PK.ext).n) { toast('Auf diesen Seiten gibt es keine Wörter.'); return false; }
  const id = asgId(PK.from, PK.to);
  const now = Date.now();
  const old = S.asg[id];
  S.asg[id] = { id, from: PK.from, to: PK.to, box: PK.box, ext: PK.ext, test: PK.test || '', c: (old && !old.del && old.c) || now, m: now };
  S.cur = id;
  S.curM = now;
  lineOpen = false;
  commit();
  return true;
}
ACT['pk-save'] = () => {
  if (!pkSave()) return;
  Sfx.play('start');
  go('home');
  toast(`${icon('check')} Dein Plan für ${rangeTxt(PK)} steht!`);
};
ACT['asg-pick'] = el => {
  const a = S.asg[el.dataset.id];
  if (!a || a.del) return;
  S.cur = a.id;
  S.curM = Date.now();
  lineOpen = false;
  commit();
  go('home');
};
ACT['asg-del'] = async el => {
  const a = S.asg[el.dataset.id];
  if (!a) return;
  const yes = await ask({ title: `${rangeTxt(a)} löschen?`, text: 'Die gelernten Wörter bleiben gespeichert – nur die Aufgabe verschwindet aus der Liste.', yes: 'Löschen', danger: true });
  if (!yes) return;
  const now = Date.now();
  S.asg[a.id] = { ...a, del: 1, m: now };
  if (S.cur === a.id) { S.cur = ''; S.curM = now; }
  commit();
  if (PK.root === '#v-picker') { pkLoad(); renderPicker(); }
};

// ======================= Wörter =======================
const WV = { scope: 'asg', q: '', f: 'all', open: new Set(), limit: 300 };
const WV_F = [['all', 'Alle'], ['g0', 'Neu'], ['g1', 'Am Lernen'], ['g2', 'Gelernt'], ['g3', 'Sicher'], ['due', 'Fällig'], ['err', 'Mit Fehlern']];
const firstOcc = w => w.o.reduce((m, o) => !m || o[0] < m[0] || (o[0] === m[0] && o[3] < m[3]) ? o : m, null);
let allSortedCache = null;
const allSorted = () => allSortedCache || (allSortedCache = WORDS.slice().sort((a, b) => {
  const x = firstOcc(a), y = firstOcc(b);
  return x[0] - y[0] || x[3] - y[3];
}));

VIEWS.words = isNew => {
  if (isNew) WV.limit = 300;
  const a = curAsg();
  $('#v-words').innerHTML = `<div class="wrap">
    <div class="page-head"><h1>Wörter</h1>${a ? `<div class="seg" role="group" aria-label="Welche Wörter">
      <button type="button" data-act="wv-scope" data-v="asg" aria-pressed="${WV.scope === 'asg'}">${rangeTxt(a)}</button>
      <button type="button" data-act="wv-scope" data-v="all" aria-pressed="${WV.scope === 'all'}">Alle</button></div>` : ''}</div>
    <div class="search">${icon('search')}<input class="field" type="search" id="wv-q" data-in="wv-q" value="${esc(WV.q)}" placeholder="Suchen" aria-label="Wörter durchsuchen" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="chips" id="wl-chips"></div>
    <div id="wl-list"></div>
  </div>`;
  renderWordList();
};

function wvMatch(w, f) {
  if (f === 'all') return true;
  const s = S.w[w.id];
  if (f === 'due') return isDue(w);
  if (f === 'err') return !!s && s.x > 0;
  return groupOf((s && s.b) || 0) === +f.slice(1);
}

function renderWordList() {
  const a = curAsg();
  const inAsg = WV.scope === 'asg' && !!a;
  const pool = inAsg ? poolOf(a) : null;
  const base = inAsg ? pool : allSorted();
  const q = WV.q.trim().toLowerCase(), qf = q ? foldDe(q) : '';
  const hit = q ? base.filter(w => w.plain.toLowerCase().includes(q) || w.de.toLowerCase().includes(q) || (qf && foldDe(w.de).includes(qf))) : base;
  const counts = {};
  for (const [k] of WV_F) counts[k] = hit.filter(w => wvMatch(w, k)).length;
  $('#wl-chips').innerHTML = WV_F.filter(([k]) => k === 'all' || counts[k] || WV.f === k)
    .map(([k, l]) => `<button class="chip" type="button" data-act="wv-f" data-v="${k}" aria-pressed="${WV.f === k}">${l} <i>${counts[k]}</i></button>`).join('');
  const list = hit.filter(w => wvMatch(w, WV.f));
  if (!list.length) {
    $('#wl-list').innerHTML = `<div class="empty">${fox('wow')}<p>${q ? `Nichts gefunden für „${esc(WV.q.trim())}“.` : 'Hier ist gerade kein Wort.'}</p></div>`;
    return;
  }
  const groups = [];
  let g = null;
  for (const w of list.slice(0, WV.limit)) {
    const o = inAsg ? pool.occ.get(w.id) : firstOcc(w);
    if (!g || g.page !== o[0]) { g = { page: o[0], u: LABELS[o[2]].u, rows: [] }; groups.push(g); }
    g.rows.push(wordRowHTML(w, o));
  }
  $('#wl-list').innerHTML = groups.map(gr => `<div class="wgroup"><div class="wgroup-h"><b>Seite ${gr.page}</b>
      <span class="utag" style="--c:${UNITS[gr.u].c}">${esc(UNITS[gr.u].short)}</span></div>
      <div class="wlist">${gr.rows.join('')}</div></div>`).join('')
    + (list.length > WV.limit ? `<p class="more-row"><button class="btn btn-ghost" type="button" data-act="wv-more">Mehr zeigen (${list.length - WV.limit})</button></p>` : '');
}

function wordRowHTML(w, o) {
  const s = S.w[w.id], b = (s && s.b) || 0, g = groupOf(b);
  const open = WV.open.has(w.id);
  const mark = o[1] === 1 ? '<span class="box-mark">Kasten</span>' : o[1] === 2 ? '<span class="box-mark">Extra</span>' : '';
  return `<div class="wrow"><div class="wrow-main">
    <button class="wrow-txt" type="button" data-act="wv-row" data-id="${w.id}" aria-expanded="${open}"><b lang="en">${esc(w.en)}${mark}</b><span>${esc(w.de)}</span></button>
    <span class="lv" style="--dot:${LV_COL[g]}" role="img" aria-label="${GROUPS[g]}">${[1, 2, 3, 4, 5].map(k => `<i${b >= k ? ' class="on"' : ''}></i>`).join('')}</span>
    ${sayBtn(w)}</div>${open ? wordMoreHTML(w, s) : ''}</div>`;
}

function wordMoreHTML(w, s) {
  const parts = [];
  if (w.ex) parts.push(`<p class="ex" lang="en">„${esc(w.ex)}“${TTS.ok ? ` <button class="link" type="button" data-act="say-ex" data-id="${w.id}">anhören</button>` : ''}</p>`);
  if (w.no) parts.push(`<p>${esc(w.no)}</p>`);
  for (const t of w.t || []) parts.push(`<div class="note tip">${icon('lightbulb')}<span>${esc(t)}</span></div>`);
  for (const f of w.f || []) parts.push(`<div class="note">${icon('info')}<span>${esc(f)}</span></div>`);
  const pages = uniq(w.o.map(o => o[0])).sort((x, y) => x - y);
  const box = w.o.map(o => LABELS[o[2]].b).find(Boolean);
  const meta = [`Seite ${pages.join(', ')}`, UNITS[w.unit].short];
  if (box) meta.push(`Kasten „${box}“`);
  if (s) {
    meta.push(`${s.n}× geübt`, plural(s.x, 'Fehler', 'Fehler'));
    meta.push(s.d <= today() ? 'heute dran' : `wieder dran: ${fmtDay(s.d, { weekday: 'short', day: 'numeric', month: 'short' })}`);
  }
  parts.push(`<p class="meta">${meta.map(esc).join(' · ')}</p>`);
  return `<div class="wrow-more">${parts.join('')}</div>`;
}

ACT['wv-scope'] = el => { WV.scope = el.dataset.v; WV.limit = 300; VIEWS.words(false); };
ACT['wv-f'] = el => { WV.f = el.dataset.v; WV.limit = 300; renderWordList(); };
ACT['wv-more'] = () => { WV.limit += 300; renderWordList(); };
ACT['wv-row'] = el => {
  const id = el.dataset.id;
  if (WV.open.has(id)) WV.open.delete(id); else WV.open.add(id);
  renderWordList();
  const b = $(`#wl-list [data-act="wv-row"][data-id="${id}"]`);
  if (b) b.focus({ preventScroll: true });
};
let wvTimer = 0;
INP['wv-q'] = el => {
  WV.q = el.value;
  WV.limit = 300;
  clearTimeout(wvTimer);
  wvTimer = setTimeout(renderWordList, 120);
};

function checkBadges() {
  const a = curAsg();
  const ctx = {
    st: streakInfo(), L: levelInfo().L, learned: wordsLearned(),
    goals: Object.values(S.days).filter(d => (d.xp || 0) >= S.set.goal).length,
    ready: a ? poolInfo(a).ready : 0,
  };
  const got = [];
  for (const b of BADGES) {
    if (!S.bdg[b.id] && b.ok(ctx)) { S.bdg[b.id] = Date.now(); got.push(b); }
  }
  return got;
}

const STORE_TXT = {
  cloud: ['cloud', 'Im Konto gespeichert'],
  wait: ['cloud', 'Verbinde …'],
  local: ['monitor', 'In diesem Browser gespeichert'],
  off: ['cloud-off', 'Konto gerade weg – im Browser gespeichert'],
};
const weekday = n => fmtDay(n, { weekday: 'short' }).replace('.', '');

VIEWS.awards = () => {
  const L = levelInfo(), st = streakInfo(), goal = S.set.goal, t = today();
  const days = [];
  for (let k = 6; k >= 0; k--) days.push({ d: t - k, xp: (S.days[dayKey(t - k)] || {}).xp || 0 });
  const max = Math.max(goal, ...days.map(x => x.xp));
  const week = days.map(x => `<div class="week-col"><em>${x.xp || ''}</em>
    <div class="week-bar${x.xp >= goal ? ' is-goal' : ''}${x.d === t ? ' is-today' : ''}" style="height:${Math.round(6 + 94 * x.xp / max)}px"></div><small>${weekday(x.d)}</small></div>`).join('');
  const got = BADGES.filter(b => S.bdg[b.id]).length;
  const badges = BADGES.map(b => {
    const on = !!S.bdg[b.id];
    return `<div class="bdg${on ? '' : ' is-locked'}"><div class="medal" style="--bc:${b.c}">${icon(on ? b.ic : 'lock')}</div>
      <b>${b.n}</b><span>${b.d}</span></div>`;
  }).join('');
  const [sic, stxt] = STORE_TXT[Sync.mode] || STORE_TXT.local;
  $('#v-awards').innerHTML = `<div class="wrap">
    <div class="page-head"><h1>Erfolge</h1></div>
    <div class="aw-grid">
      <div class="card lvl-card"><div class="lvl-badge"><small>Level</small><b>${L.L}</b></div>
        <div><span class="kicker">${fmtN(L.xp)} XP</span><h2>${esc(L.name)}</h2>
        <div class="xpbar"><i style="width:${(L.p * 100).toFixed(1)}%"></i></div>
        <span class="muted">Noch ${fmtN(L.to - L.xp)} XP</span></div></div>
      <div class="card streak-card${st.n ? '' : ' is-off'}"><div class="streak-flame">${icon('flame', 'ic-fill')}</div>
        <div><div class="big-num">${st.n}</div><b>${st.n === 1 ? 'Tag' : 'Tage'} in Folge</b>
        <p class="muted">Rekord: ${st.best} · ${icon('snowflake')} ${st.freezes} Serienschutz</p>
        ${st.frozen ? '<p class="muted small">Serienschutz hat geholfen!</p>' : ''}</div></div>
    </div>
    <div class="card week-card"><div class="card-h"><h2>Deine Woche</h2><span class="kicker">Ziel: ${fmtN(goal)} XP</span></div><div class="week">${week}</div></div>
    <div class="section-title"><h2>Abzeichen</h2><span class="kicker">${got} von ${BADGES.length}</span></div>
    <div class="badges">${badges}</div>
    <p class="store-note">${icon(sic)}<span>${stxt}</span></p>
  </div>`;
};

// ======================= Eltern =======================
const PAR = { ok: false, a: 0, b: 0, tal: false };   // tal: Taler-Einstellungen per Freigabe-Code entsperrt
const GRADE_C = ['', '#1E9A55', '#5BAF63', '#D99A00', '#E07B00', '#DC3B40', '#A61E24'];

VIEWS.parents = isNew => {
  const el = $('#v-parents');
  if (!PAR.ok) {
    if (isNew || !PAR.a) { PAR.a = 6 + rnd(4); PAR.b = 6 + rnd(4); }

SUB.gate = () => {

};
ACT['par-lock'] = () => { PAR.ok = false; PAR.tal = false; VIEWS.parents(true); };

function parentsHTML() {
  const t = today(), st = streakInfo(), a = curAsg();
  const days = k => { const r = S.days[dayKey(t - k)] || {}; return { d: t - k, s: r.s || 0, xp: r.xp || 0 }; };
  const last14 = []; for (let k = 13; k >= 0; k--) last14.push(days(k));
  const min7 = Math.round(sum(last14.slice(7).map(x => x.s)) / 60);
  const days7 = last14.slice(7).filter(x => x.s > 0 || x.xp > 0).length;
  const started = Object.keys(S.w).length;
  const tests = S.tests.slice().sort((x, y) => y.a - x.a);
  const lastT = tests[0];
  const maxS = Math.max(60, ...last14.map(x => x.s));
  const chart = last14.map(x => `<div class="chart-col" title="${fmtDay(x.d)}: ${Math.round(x.s / 60)} min"><i${x.s ? '' : ' class="zero"'} style="height:${Math.round(3 + 120 * x.s / maxS)}px"></i><small>${new Date(x.d * DAY).getUTCDate()}</small></div>`).join('');

  let asgCard = '<p class="muted">Noch keine Aufgabe gewählt.</p>';
  if (a) {
    const inf = poolInfo(a), n = inf.pool.length, [c0, c1, c2, c3] = inf.counts;
    const pc = x => (n ? x / n * 100 : 0).toFixed(1) + '%';
    asgCard = `<p><b>${rangeTxt(a)}</b> · ${plural(n, 'Wort', 'Wörter')}${a.test ? ` · Test am ${longDay(keyNum(a.test))}` : ' · kein Testdatum'}</p>
      <div class="lvbar"><i class="l4" style="width:${pc(c3)}"></i><i class="l3" style="width:${pc(c2)}"></i><i class="l1" style="width:${pc(c1)}"></i></div>
      <div class="lvlegend"><span style="--dot:var(--lv4)">${c3} sicher</span><span style="--dot:var(--lv3)">${c2} gelernt</span><span style="--dot:var(--lv1)">${c1} am Lernen</span><span style="--dot:var(--lv0)">${c0} neu</span></div>
      <p class="muted par-plan">${Math.round(inf.ready * 100)} % testbereit · ${planText(inf).replace(/<[^>]+>/g, '')}</p>`;
  }
  const testRows = tests.slice(0, 10).map(x => `<tr><td>${fmtDay(dayNum(new Date(x.a)))}</td><td>${x.from ? `S. ${x.from}–${x.to}` : '–'}</td><td>${x.n}</td><td>${x.p} %</td><td><span class="grade-dot" style="background:${GRADE_C[x.g] || GRADE_C[6]}">${x.g}</span></td></tr>`).join('');
  const hard = WORDS.filter(w => S.w[w.id] && S.w[w.id].x > 0).sort((x, y) => S.w[y.id].x - S.w[x.id].x || lvl(x) - lvl(y)).slice(0, 10);
  const hardRows = hard.map(w => { const s = S.w[w.id]; return `<tr><td lang="en"><b>${esc(w.plain)}</b></td><td>${esc(deShort(w))}</td><td>${s.x}</td><td>${GROUPS[groupOf(s.b)]}</td></tr>`; }).join('');

  const sel = (ch, cur, opts, label) => `<select class="select" data-ch="${ch}" aria-label="${label}">${opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const voices = TTS.voices.map(v => [v.voiceURI, TTS.label(v)]);
  const voiceRow = TTS.ok
    ? `<div class="set-row"><div><span class="lbl">Stimme</span><small>${voices.length ? 'Britisches Englisch klingt wie im Schulbuch.' : 'Keine englische Stimme gefunden.'}</small></div>
        <div class="set-ctl">${voices.length ? sel('set-voice', S.set.voice, [['', 'Automatisch'], ...voices], 'Stimme') : ''}<button class="btn btn-ghost btn-sm" type="button" data-act="voice-test">${icon('volume')}Testen</button></div></div>
      <div class="set-row"><div><span class="lbl">Sprechtempo</span></div>${sel('set-rate', S.set.rate, [[0.75, 'Langsam'], [0.9, 'Normal'], [1.05, 'Schnell']], 'Sprechtempo')}</div>`
    : '<p class="muted">Dieser Browser kann nicht vorlesen.</p>';

  return `<div class="wrap">
    <div class="page-head"><h1>Für Eltern</h1><button class="btn btn-ghost btn-sm" type="button" data-act="par-lock">${icon('lock')}Sperren</button></div>
    ${fgCardHTML()}
    <div class="kpis">
      <div class="kpi"><span>Wörter gelernt</span><b>${wordsLearned()}</b><em>von ${started} begonnenen</em></div>
      <div class="kpi"><span>Lernzeit (7 Tage)</span><b>${min7} min</b><em>an ${plural(days7, 'Tag', 'Tagen')}</em></div>
      <div class="kpi"><span>Serie</span><b>${plural(st.n, 'Tag', 'Tage')}</b><em>Rekord: ${st.best}</em></div>
      <div class="kpi"><span>Probetests</span><b>${tests.length}</b><em>${lastT ? `zuletzt Note ${lastT.g} (${lastT.p} %)` : 'noch keiner'}</em></div>
    </div>
    <div class="card"><div class="card-h"><h2>Lernzeit</h2><span class="kicker">letzte 14 Tage, Minuten</span></div><div class="chart">${chart}</div></div>
    <div class="card"><div class="card-h"><h2>Aktuelle Aufgabe</h2></div>${asgCard}</div>
    <div class="card"><div class="card-h"><h2>Probetests</h2></div>${testRows
      ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Datum</th><th>Seiten</th><th>Wörter</th><th>Ergebnis</th><th>Note</th></tr></thead><tbody>${testRows}</tbody></table></div>`
      : '<p class="muted">Noch kein Probetest gemacht.</p>'}</div>
    <div class="card"><div class="card-h"><h2>Schwierigste Wörter</h2></div>${hardRows
      ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Englisch</th><th>Deutsch</th><th>Fehler</th><th>Stand</th></tr></thead><tbody>${hardRows}</tbody></table></div>`
      : '<p class="muted">Noch keine Fehler – oder noch nicht geübt.</p>'}</div>
    ${talParentHTML()}
    <div class="card"><div class="card-h"><h2>So funktioniert Wortfuchs</h2></div><ul class="explain">
      <li><b>Seiten wählen:</b> Ihr Kind trägt die aufgegebenen Seiten und das Testdatum ein. Die neuen Wörter werden gleichmäßig auf die Tage bis zum Test verteilt.</li>
      <li><b>Stationen:</b> Je etwa 5 Wörter – erst kennenlernen und anhören, dann erkennen, dann selbst schreiben.</li>
      <li><b>Wiederholen mit System:</b> Wörter kommen nach 1, 2, 4 und 7 Tagen wieder, Fehlerwörter sofort – und alle noch einmal am Tag vor dem Test.</li>
      <li><b>Probetest:</b> Wie der echte Test, mit Note (ab 92 % eine 1, ab 81 % eine 2, ab 67 % eine 3, ab 50 % eine 4).</li>
      <li><b>Speichern:</b> Der Fortschritt wird im Konto gespeichert, wenn das möglich ist – sonst in diesem Browser.</li></ul></div>
    <div class="card settings"><div class="card-h"><h2>Einstellungen</h2></div>
      <div class="set-row"><div><label class="lbl" for="set-name">Name</label><small>Für die Begrüßung</small></div><input class="field set-name" id="set-name" data-ch="set-name" value="${esc(S.set.name)}" maxlength="20" placeholder="Vorname" autocomplete="off"></div>
      <div class="set-row"><div><span class="lbl">Tagesziel</span></div>${sel('set-goal', S.set.goal, GOALS.map(g => [g, `${fmtN(g)} XP – ${GOAL_TXT[g][0]}`]), 'Tagesziel')}</div>
      ${switchRow('set-sfx', S.set.sfx, 'Soundeffekte', 'Kurze Klänge bei richtig und falsch')}
      ${TTS.ok ? switchRow('set-tts', S.set.tts, 'Wörter vorlesen', 'Liest englische Wörter automatisch vor und aktiviert Hör-Übungen') : ''}
      ${spkOk() ? switchRow('set-spk', S.set.spk !== false, 'Sprech-Übungen', 'Wörter und Sätze laut vorlesen. Die Aufnahme wertet die Spracherkennung des Browsers aus (Google bzw. Apple).') : ''}
      ${voiceRow}
    </div>
    <div class="card danger"><div class="card-h"><h2>Neu anfangen</h2></div>
      <p class="muted">Löscht Aufgaben, gelernte Wörter, Serie, Tests und Abzeichen. Die Einstellungen bleiben.</p>
      <button class="btn btn-bad par-reset" type="button" data-act="reset">${icon('trash')}Alles zurücksetzen</button></div>
  </div>`;
}

const setSet = (k, v) => { S.set[k] = v; S.set.m = Date.now(); commit(); };
CHG['set-name'] = el => { setSet('name', el.value.trim().slice(0, 20)); toast('Gespeichert'); };
CHG['set-goal'] = el => { setSet('goal', +el.value); renderTop(); };
CHG['set-sfx'] = el => { setSet('sfx', el.checked); if (el.checked) Sfx.play('ok'); };
CHG['set-tts'] = el => setSet('tts', el.checked);
CHG['set-voice'] = el => { setSet('voice', el.value); TTS.pick(); TTS.speak('Hello! Nice to meet you.'); };
CHG['set-rate'] = el => { setSet('rate', +el.value); TTS.speak('Hello! Nice to meet you.'); };
ACT['voice-test'] = () => TTS.speak('Hello! My name is Fitz. Nice to meet you.');
ACT.reset = async () => {
  const yes = await ask({ title: 'Wirklich alles zurücksetzen?', text: 'Aller Fortschritt geht verloren. Das kann man nicht rückgängig machen.', yes: 'Ja, zurücksetzen', danger: true });
  if (!yes) return;
  const set = { ...S.set, m: Date.now() };
  S = fresh();
  S.rs = Date.now();
  S.set = set;
  commit();
  PAR.ok = false;
  lineOpen = false;
  go('home');
  openOnboarding();
};

// ======================= Willkommen =======================
const OB = { step: 0, name: '', goal: 100 };

function openOnboarding() {
  OB.step = 0;
  OB.name = S.set.name || '';
  OB.goal = S.set.goal || 100;
  pkLoad();
  PK.root = '#ob-pk';
  $('#onboard').hidden = false;
  document.body.classList.add('ses-open');
  renderOnboard();
}
function closeOnboarding() {
  $('#onboard').hidden = true;
  PK.root = '#v-picker';
  if (!SES) document.body.classList.remove('ses-open');
}

function renderOnboard() {
  const s = OB.step;
  let body = '', foot = '';
  if (s === 0) {
    body = `<div class="ob-hero">${fox('happy')}<h1>Hallo, ich bin Fitz!</h1>
      <p class="ob-lead">Lern deine Vokabeln – Station für Station.</p></div>`;
    foot = `<button class="btn btn-primary btn-block" type="button" data-act="ob-next">Los geht's! ${icon('arrow-right')}</button>
      <div class="ob-foot-row is-center"><button class="btn btn-quiet" type="button" data-act="ob-parent">Ich richte das Eltern-Handy ein</button></div>`;
  } else if (s === 1) {
    body = `<div class="ob-q">${fox()}<h2 id="ob-t">Wie heißt du?</h2></div>
      <input class="field" id="ob-name" data-in="ob-name" value="${esc(OB.name)}" maxlength="20" placeholder="Dein Vorname" autocomplete="off" aria-labelledby="ob-t">
`;
  } else if (s === 2) {
    body = `<div class="ob-q">${fox()}<h2>Welche Seiten?</h2></div><div id="ob-pk"></div>`;
  } else {
    body = `<div class="ob-q">${fox('happy')}<h2>Wie viel pro Tag?</h2></div>
      <div class="goal-opts">${GOALS.slice(0, 4).map(g => `<button class="goal-opt" type="button" data-act="ob-goal" data-v="${g}" aria-pressed="${OB.goal === g}"><b>${GOAL_TXT[g][0]}</b><span>${GOAL_TXT[g][1]}</span></button>`).join('')}</div>`;
  }
  if (s > 0) {
    const last = s === 3;
    foot = `<button class="btn btn-primary btn-block" type="button" data-act="ob-next">${last ? `Fertig – los geht's!` : 'Weiter'} ${icon(last ? 'rocket' : 'arrow-right')}</button>
      <div class="ob-foot-row"><button class="btn btn-quiet" type="button" data-act="ob-back">Zurück</button>${s === 2 ? '<button class="btn btn-quiet" type="button" data-act="ob-skip">Später wählen</button>' : ''}</div>`;
  }
  $('#onboard').innerHTML = `<div class="ob"><div class="ob-steps" aria-hidden="true">${[0, 1, 2, 3].map(i => `<i${i <= s ? ' class="on"' : ''}></i>`).join('')}</div>
    <div class="ob-body">${body}</div><div class="ob-foot">${foot}</div></div>`;
  $('#onboard').scrollTop = 0;
  if (s === 2) renderPicker();
  const f = s === 1 ? $('#ob-name') : $('#onboard .ob-foot .btn-primary');
  if (f) f.focus({ preventScroll: true });
}

INP['ob-name'] = el => { OB.name = el.value; };
ACT['ob-goal'] = el => { OB.goal = +el.dataset.v; Sfx.play('tap'); renderOnboard(); };
ACT['ob-back'] = () => { OB.step = Math.max(0, OB.step - 1); renderOnboard(); };
ACT['ob-skip'] = () => { PK.from = 0; OB.step = 3; renderOnboard(); };
ACT['ob-next'] = () => {
  if (OB.step === 2) {
    if (!PK.from) { toast('Tipp zuerst auf die erste Seite – oder wähl „Später“.'); return; }
    if (!rangeInfo(PK.from, PK.to, PK.box, PK.ext).n) { toast('Auf diesen Seiten gibt es keine Wörter.'); return; }
  }
  if (OB.step < 3) { OB.step++; Sfx.play('tap'); renderOnboard(); return; }
  S.set.name = OB.name.trim().slice(0, 20);
  S.set.goal = OB.goal;
  S.set.m = Date.now();
  if (PK.from) pkSave();
  S.onb = true;
  commit();
  closeOnboarding();
  go('home');
  Sfx.play('win');
  confetti();
};
