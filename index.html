};
ACT.blitz = () => startBlitz();
ACT['test-setup'] = () => startTest();

// ======================= Blitz-Runde =======================
function startBlitz() {
  if (SES) return;
  const pool = sesPool();
  const list = knownWords(pool);
  if (list.length < 4) { toast(`${icon('zap')} Lern erst ein paar Wörter – dann kannst du blitzen!`); Sfx.play('near'); return; }
  SES = newSes('blitz', { phase: 'ready', list, pool, score: 0, mult: 1, run: 0, last: [], missed: new Map(), tick: 0, end: 0 });
  openSession();
  $('#ses-body').innerHTML = `<div class="t-setup">${fox('wow')}<h1>Blitz-Runde</h1>
    <p class="lead">60 Sekunden. So viele wie möglich!</p></div>`;
  $('#ses-meta').innerHTML = '<span class="timer" id="bz-time">1:00</span>';
  setGo(`Los! ${icon('zap')}`);
  setSkip('');
  renderBar(1);
  $('#ses-go').focus({ preventScroll: true });
}
function blitzGo() {
  if (SES.phase === 'ready') blitzBegin();
  else if (SES.phase === 'end') closeSession();
}
function blitzBegin() {
  SES.phase = 'q';
  SES.t0 = Date.now();
  SES.end = performance.now() + 60000;
  $('#ses-foot').hidden = true;
  SES.tick = setInterval(blitzTick, 200);
  blitzNext();
  blitzTick();
  focusBody();
}
function blitzNext() {
  const V = SES.view = {};
  let w;
  do { w = pickOne(SES.list); } while (SES.list.length > 4 && SES.last.includes(w));
  SES.last.push(w);
  if (SES.last.length > 3) SES.last.shift();
  const en = Math.random() < 0.5;   // en: englisches Wort, deutsche Antworten
  let opts = [w, ...distract(w, 3, SES.pool, en ? 'de' : 'en')].map(o => ({ x: en ? deShort(o) : o.plain, w: o }));
  const seen = new Set();
  opts = opts.filter(o => { const k = o.x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  V.w = w;
  V.opts = shuffle(opts);
  V.right = V.opts.indexOf(opts[0]);
  const pop = SES.multPop;
  SES.multPop = false;
  $('#ses-body').innerHTML = `<div class="blitz-score"><div class="bz-n"><b id="bz-score">${SES.score}</b><span>richtig</span></div><em class="mult${pop ? ' pop' : ''}" id="bz-mult" aria-label="Multiplikator ${SES.mult}">×${SES.mult}</em></div>
    <div class="blitz-q"><div class="prompt-text${en ? ' en' : ''}"${en ? ' lang="en"' : ''}>${esc(en ? w.plain : deShort(w))}</div><span class="prompt-sub">${en ? 'Was heißt das auf Deutsch?' : 'Was heißt das auf Englisch?'}</span></div>
    <div class="opts grid4" role="group" aria-label="Antworten">${V.opts.map((o, k) => `<button class="opt${en ? '' : ' en-opt'}" type="button" data-act="opt" data-k="${k}"${en ? '' : ' lang="en"'}><span class="num" aria-hidden="true">${k + 1}</span><span>${esc(o.x)}</span></button>`).join('')}</div>`;
}
function blitzPick(k) {
  if (SES.phase !== 'q' || SES.lock) return;
  const V = SES.view, w = V.w, ok = k === V.right;
  SES.lock = true;
  markOpts(k, V.right);
  bump('a');
  if (ok) {
    SES.score++;
    SES.run++;
    SES.ok++;
    bump('ok');
    const m = Math.min(4, 1 + Math.floor(SES.run / 4));
    if (m > SES.mult) { SES.mult = m; SES.multPop = true; Sfx.play('combo'); } else Sfx.play('ok');
    addXP(1 + SES.mult);
    grade(w, 'recog', 'ok');
    SES.best = Math.max(SES.best, SES.run);
  } else {
    SES.run = 0;
    SES.mult = 1;
    SES.bad++;
    SES.missed.set(w.id, w);
    Sfx.play('bad');
  }
  $('#bz-score').textContent = SES.score;
  after(ok ? 320 : 850, () => {
    if (!SES || SES.kind !== 'blitz' || SES.phase !== 'q') return;
    SES.lock = false;
    blitzNext();
  });
}
function blitzTick() {
  if (!SES || SES.kind !== 'blitz' || SES.phase !== 'q') return;
  const rem = Math.max(0, SES.end - performance.now());
  const sec = Math.ceil(rem / 1000);
  const el = $('#bz-time');
  if (el && el.textContent !== fmtTime(sec)) {
    el.textContent = fmtTime(sec);
    el.classList.toggle('is-low', sec <= 10);
    if (sec <= 5 && sec > 0) Sfx.play('tick');
  }
  renderBar(rem / 60000);
  if (rem <= 0) blitzEnd();
}
function blitzEnd() {
  clearInterval(SES.tick);
  SES.tick = 0;
  bump('l');
  bump('s', 60);
  const prev = S.st.blitz || 0;
  talBlitz();
  statMax('blitz', SES.score);
  statMax('combo', SES.best);
  markDay();
  aktSes(60);
  commit();
  const n = SES.ok + SES.bad;
  const missed = [...SES.missed.values()];
  $('#ses-body').innerHTML = resultHTML({
    mood: SES.score ? 'happy' : '',
    title: SES.score ? `${SES.score} richtig!` : 'Zeit um!',
    lead: SES.score > prev ? '<b>Neuer Rekord!</b>' : `Rekord: ${prev}`,
    stats: [['rs-xp', 'XP', 'zap', '+' + fmtN(SES.xp)], ['rs-acc', 'Richtig', 'target', (n ? Math.round(100 * SES.ok / n) : 0) + ' %'], ['rs-time', 'Serie', 'flame', SES.best]],
    note: missed.length ? 'Knifflig:' : '',
    chips: missed.slice(0, 10).map(w => `<span class="wchip"><span lang="en">${esc(w.plain)}</span> <span class="de">· ${esc(deShort(w))}</span></span>`).join(''),
  });
  showEnd(SES.score > 0);
}

// ======================= Probetest =======================
function startTest() {
  if (SES) return;
  const a = curAsg();
  if (!a) { toast('Wähl zuerst deine Seiten!'); go('picker'); return; }
  const list = poolOf(a).filter(w => w.typable);
  if (!list.length) { toast('Auf diesen Seiten gibt es keine Wörter zum Testen.'); return; }
  SES = newSes('test', { phase: 'setup', a, list, tn: Math.min(10, list.length), tdir: 'de', items: [], qi: 0, txp: 0, pts: 0, rec: null });
  openSession();
  renderTestSetup();
}
function renderTestSetup() {
  const N = SES.list.length;
  const chip = (act, v, label, on) => `<button class="chip" type="button" data-act="${act}" data-v="${v}" aria-pressed="${on}">${label}</button>`;
  const ns = [10, 20, 30].filter(x => x < N).map(x => chip('t-n', x, String(x), SES.tn === x)).join('') + chip('t-n', N, `Alle ${N}`, SES.tn === N);
  $('#ses-body').innerHTML = `<div class="t-setup">${fox('happy')}<h1>Probetest</h1>
    <p class="lead">Ohne Tipps – mit Note.</p>
    <div class="card t-card">
      <div><span class="lbl" id="t-n-l">Wie viele Wörter?</span><div class="optrow" role="group" aria-labelledby="t-n-l">${ns}</div></div>
      <div><span class="lbl" id="t-d-l">Richtung</span><div class="optrow" role="group" aria-labelledby="t-d-l">${chip('t-dir', 'de', 'Deutsch → Englisch', SES.tdir === 'de')}${chip('t-dir', 'mix', 'Gemischt', SES.tdir === 'mix')}</div></div>
    </div></div>`;
  setGo(`Test starten ${icon('arrow-right')}`);
  setSkip('');
}
ACT['t-n'] = el => { if (SES && SES.kind === 'test' && SES.phase === 'setup') { SES.tn = +el.dataset.v; Sfx.play('tap'); renderTestSetup(); } };
ACT['t-dir'] = el => { if (SES && SES.kind === 'test' && SES.phase === 'setup') { SES.tdir = el.dataset.v; Sfx.play('tap'); renderTestSetup(); } };

function testBegin() {
  const list = shuffle(SES.list).slice(0, SES.tn);
  const nEn = SES.tdir === 'mix' ? Math.round(list.length / 3) : 0;
  const dirs = shuffle(list.map((w, i) => i < nEn ? 'en' : 'de'));
  SES.items = list.map((w, i) => ({ w, dir: dirs[i], ans: '', pts: 0 }));
  SES.qi = 0;
  SES.phase = 'q';
  SES.t0 = Date.now();
  renderTestQ();
}
function renderTestQ() {
  const it = SES.items[SES.qi], w = it.w, n = SES.items.length, en = it.dir === 'en';
  $('#ses-body').innerHTML = `<p class="t-num">Frage ${SES.qi + 1} von ${n}</p>`
    + promptHTML(esc(en ? w.plain : w.de), { en, w: en ? w : null, sub: en ? 'Schreib es auf Deutsch' : 'Schreib es auf Englisch' })
    + `<div class="type-wrap"><input class="type-in" id="t-in" type="text" lang="${en ? 'de' : 'en'}" ${INPUT_ATTRS} placeholder="${en ? 'Auf Deutsch …' : 'Auf Englisch …'}" aria-label="Deine Antwort"></div>`
    + (w.hasSb && !en ? '<p class="ph-note">„sb“ und „sth“ musst du nicht mittippen.</p>' : '');
  setGo(SES.qi === n - 1 ? `Abgeben ${icon('check')}` : `Weiter ${icon('arrow-right')}`);
  setSkip('Weiß ich nicht');
  renderBar(SES.qi / n);
  $('#ses-scroll').scrollTop = 0;
  $('#t-in').focus({ preventScroll: true });
}
function testGo() {
  if (SES.phase === 'setup') testBegin();
  else if (SES.phase === 'q') testNext($('#t-in').value);
  else if (SES.phase === 'end') closeSession();
}
function testSkip() {
  if (SES.phase === 'q') testNext('');
  else if (SES.phase === 'end') testPractice();
}
function testNext(v) {
  SES.items[SES.qi].ans = String(v).trim();
  SES.qi++;
  Sfx.play('tap');
  if (SES.qi < SES.items.length) renderTestQ(); else testEnd();
}

// Neue Wörter zählen nur, wenn sie richtig waren; bekannte werden normal bewertet
function gradeTestItem(it) {
  const w = it.w, b = it.before ? it.before.b : 0;
  if (b === 0) {
    if (it.pts === 1) { grade(w, 'intro'); grade(w, 'recall', 'ok'); }
    return;
  }
  grade(w, 'recall', it.pts === 1 ? 'ok' : it.pts > 0 ? 'near' : 'bad');
}
function testScore() {
  const items = SES.items, n = items.length;
  const pts = sum(items.map(it => it.pts));
  const p = Math.round(pts / n * 100);
  const g = gradeOf(p);
  Object.assign(SES.rec, { p, g, m: Date.now() });
  if (g === 1 && !SES.g1) { SES.g1 = true; statInc('g1'); }
  const xp = Math.round(5 * pts) + GRADE_BONUS[g];
  addXP(xp - SES.txp);
  SES.txp = xp;
  SES.pts = pts;
  commit();
}
function testEnd() {
  for (const it of SES.items) {
    const r = it.dir === 'en' ? checkDe(it.w, it.ans) : checkEn(it.w, it.ans);
    it.r = r;
    it.pts = r.res === 'ok' ? (r.cap ? 0.5 : 1) : r.res === 'retry' ? 1 : r.res === 'near' ? 0.5 : 0;
    it.before = S.w[it.w.id] ? { ...S.w[it.w.id] } : null;
    gradeTestItem(it);
  }
  bump('l');
  bump('s', Math.min(3600, Math.round((Date.now() - SES.t0) / 1000)));
  bump('a', SES.items.length);
  bump('ok', SES.items.filter(it => it.pts === 1).length);
  statInc('tests');
  markDay();
  const now = Date.now();
  SES.rec = { id: 't' + now, a: now, from: SES.a.from, to: SES.a.to, n: SES.items.length, p: 0, g: 6, m: now };
  S.tests.push(SES.rec);
  aktTest(Math.min(3600, Math.round((now - SES.t0) / 1000)));
  testScore();
  renderTestRes(false);
  showEnd(SES.rec.g <= 4);
  testButtons();
}
function testButtons() {
  setSkip(SES.items.some(it => it.pts < 1) ? 'Fehler üben' : '', 'btn-ghost');
  setGo(`Fertig ${icon('check')}`);
}
function renderTestRes(keep) {
  const items = SES.items, n = items.length, g = SES.rec.g;
  const sc = $('#ses-scroll').scrollTop;
  const rows = items.map((it, k) => {
    const w = it.w, en = it.dir === 'en';
    const cls = it.pts === 1 ? 'ok' : it.pts > 0 ? 'near' : 'bad';
    const want = esc(en ? w.de : w.plain), lang = en ? '' : ' lang="en"';
    let a;
    if (cls === 'ok') {
      a = `<b${lang}>${esc(it.ans) || want}</b>`;
      if (it.over) a += ' · von dir korrigiert';
      else if (it.r && (it.r.full || it.r.alt) && !en) a += ` · im Buch: <b lang="en">${want}</b>`;
    } else {
      a = `${it.ans ? `<s${lang}>${esc(it.ans)}</s>` : 'keine Antwort'} → <b${lang}>${want}</b>${cls === 'near' ? ' · halber Punkt' : ''}`;
    }
    return `<div class="t-item ${cls}"><span class="st">${icon(cls === 'ok' ? 'check' : cls === 'near' ? 'minus' : 'x')}</span>
      <div><p class="q"${en ? ' lang="en"' : ''}>${esc(en ? w.plain : w.de)}</p><p class="a">${a}</p>
      ${cls !== 'ok' && it.ans ? `<button class="link" type="button" data-act="t-fix" data-k="${k}">Ich hatte recht</button>` : ''}</div></div>`;
  }).join('');
  $('#ses-body').innerHTML = `<div class="grade-hero">
      <div class="grade-big" style="--gc:${GRADE_C[g]}"><small>Note</small><b>${g}</b></div>
      <h1>${GRADE_TXT[g]}</h1>
      <p class="lead">${String(SES.pts).replace('.', ',')} von ${n} Punkten · ${SES.rec.p} % · +${fmtN(SES.txp)} XP</p>
      ${g >= 4 ? "<p class=\"lead\">Üb die roten Wörter nochmal – dann klappt's im echten Test!</p>" : ''}
    </div>
    ${talGainHTML()}${goalHTML(SES.xp0)}
    <div class="section-title"><h2>Deine Antworten</h2><span class="kicker">${items.filter(it => it.pts === 1).length} von ${n} richtig</span></div>
    <div class="t-review">${rows}</div>`;
  if (keep) $('#ses-scroll').scrollTop = sc;
}
ACT['t-fix'] = el => {
  if (!SES || SES.kind !== 'test' || SES.phase !== 'end') return;
  const it = SES.items[+el.dataset.k];
  if (!it || it.pts === 1 || !it.ans) return;
  if (it.before) S.w[it.w.id] = { ...it.before }; else delete S.w[it.w.id];
  it.pts = 1;
  it.over = true;
  gradeTestItem(it);
  bump('ok');
  bump('fx');
  testScore();
  renderTestRes(true);
  animateGoal();
  testButtons();
  Sfx.play('ok');
  rewardModals();
};
function testPractice() {
  const list = SES.items.filter(it => it.pts < 1).map(it => it.w).slice(0, 12);
  closeSession();
  if (list.length) startSession('oops', { words: list });
}
</script>
<script>
/* Wortfuchs – Sprechen: ein Wort oder einen Beispielsatz laut vorlesen, die Spracherkennung
   des Browsers hört zu (Chrome, Edge, Safari auf iPad/iPhone/Mac). Wo sie fehlt oder das Mikrofon
   gesperrt ist (Firefox, claude.ai-Viewer), gibt es keine Sprech-Aufgaben. Baut auf ueben.js auf. */
'use strict';

ICONS.mic = '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/>';

const SPK_XP = 10, SPK_TRIES = 3, SPK_PAUSE = 15 * 60e3;
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
// Darf diese Seite das Mikrofon benutzen? In einem fremden Rahmen (claude.ai) meist nicht.
const SPK_ALLOWED = (() => {
  try {
    const p = document.permissionsPolicy || document.featurePolicy;
    return p ? p.allowsFeature('microphone') : window.top === window;
  } catch (e) { return false; }
})();
// rec = laufende Erkennung, until = „Jetzt nicht sprechen“ bis dahin, dead = geht hier nicht (bis zum Neuladen)
const SPK = { rec: null, until: 0, dead: false };
const spkOk = () => !!SpeechRec && SPK_ALLOWED && !SPK.dead;
const spkOn = () => spkOk() && S.set.spk !== false && Date.now() > SPK.until;

// ---------- Was gesagt werden soll ----------
// Das Wort selbst – ohne sb/sth, „…“ oder „/“ – oder der Beispielsatz, wenn er kurz ist
function spkTargets(w) {
  const out = [];
  const p = w.plain.replace(APOS, "'");
  if (p.length <= 40 && !/[…/()]|\.\.\.|\b(sb|sth)\b/.test(p)) out.push({ say: p, ex: false });
  const ex = w.ex && w.ex.replace(APOS, "'");
  if (ex && ex.length <= 70 && ex.split(' ').length <= 10 && !/[…/()–—]|\.\.\./.test(ex)) out.push({ say: ex, ex: true });
  return out;
}

// Sprech-Aufgaben in eine geplante Übung mischen: bei neuen Stationen 2, sonst 1–2,
// jeweils zwei Schritte nach dem ersten Auftritt des Wortes (in der Station: nach Kennenlernen und Erkennen)
function spkPlan(steps, kind) {
  if (!spkOn() || !steps.length) return steps;
  const first = new Map();
  steps.forEach((s, i) => { if (s.w && !first.has(s.w)) first.set(s.w, i); });
  const words = shuffle([...first.keys()].filter(w => spkTargets(w).length));
  const n = kind === 'lesson' || steps.length >= 10 ? 2 : 1;
  const add = words.slice(0, n).map(w => {
    const c = spkTargets(w), tg = c.length > 1 && Math.random() < 0.5 ? c[1] : c[0];
    return { at: first.get(w) + 2, s: { t: 'speak', w, g: 'recog', say: tg.say, ex: tg.ex } };
  });
  const out = steps.slice();
  for (const a of add.sort((x, y) => y.at - x.at)) out.splice(Math.min(a.at, out.length), 0, a.s);
  return out;
}

// ---------- Vergleichen ----------
// Kurzformen ausschreiben, Zahlen als Wort, gleich klingende Wörter zusammenlegen –
// so zählt „it is“ für „it's“, „11“ für „eleven“ und „hare“ für „hair“
const SPK_NUM = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty'.split(' ');
const SPK_TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
const spkNum = n => n <= 20 ? SPK_NUM[n] : n < 100 ? SPK_TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + SPK_NUM[n % 10] : '') : String(n);
const SPK_SAME = new Map();
for (const g of ['to too two', 'for four', 'right write', 'hair hare', 'sea see', 'son sun', 'there their', 'no know',
  'one won', 'by buy bye', 'eight ate', 'hour our', 'wear where', 'week weak', 'meet meat', 'new knew', 'piece peace',
  'blue blew', 'hear here', 'which witch', 'night knight', 'wait weight', 'pair pear', 'whole hole', 'mum mom mam',
  'okay ok', 'grey gray', 'mr mister', 'mrs missus', 'flour flower', 'tail tale', 'sail sale', 'road rode', 'red read', 'be bee'])
  for (const x of g.split(' ')) SPK_SAME.set(x, g.split(' ')[0]);
function spkToks(s) {
  return String(s).toLowerCase().replace(APOS, "'")
    .replace(/\bcan't\b|\bcannot\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/\blet's\b/g, 'let us')
    .replace(/n't\b/g, ' not').replace(/'re\b/g, ' are').replace(/'m\b/g, ' am').replace(/'ll\b/g, ' will')
    .replace(/'ve\b/g, ' have').replace(/'d\b/g, ' would').replace(/'s\b/g, ' is')
    .replace(/\d+/g, d => ' ' + spkNum(+d) + ' ')
    .replace(/[^a-z' ]+/g, ' ').replace(/'/g, '')
    .split(' ').filter(Boolean).map(t => SPK_SAME.get(t) || t);
}
// Gleiches Wort? Kurze Wörter genau, längere mit 1–2 Abweichungen (favorite ≈ favourite)
const spkSame = (a, b) => a === b || (a.length >= 4 && osa(a, b) <= (a.length >= 7 ? 2 : 1));

// Welche Wörter des Ziels kamen in der richtigen Reihenfolge vor? (längste gemeinsame Folge)
function spkMatch(want, heard) {
  const m = want.length, n = heard.length, d = [];
  for (let i = 0; i <= m; i++) d[i] = new Array(n + 1).fill(0);
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = spkSame(want[i - 1], heard[j - 1]) ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
  const hit = new Array(m).fill(false);
  for (let i = m, j = n; i && j;) {
    if (spkSame(want[i - 1], heard[j - 1]) && d[i][j] === d[i - 1][j - 1] + 1) { hit[i - 1] = true; i--; j--; }
    else if (d[i - 1][j] >= d[i][j - 1]) i--; else j--;
  }
  return hit;
}

// Locker werten: Beim Wort zählen to/a/an/the vorne nicht; bis 2 Wörter müssen alle passen, sonst 70 %.
// alts = alle Vorschläge der Erkennung; der beste zählt. Ergebnis {ok, hit, heard}
function spkJudge(s, alts) {
  const want = spkToks(s.say);
  const skip = s.ex ? 0 : (want.length > 1 && /^(to|a|an|the)$/.test(want[0]) ? 1 : 0);
  let best = null;
  for (const a of alts) {
    const hit = spkMatch(want, spkToks(a));
    const core = hit.slice(skip), got = core.filter(Boolean).length;
    const ok = core.length <= 2 ? got === core.length : got / core.length >= 0.7;
    const sc = got / Math.max(1, core.length) + (ok ? 1 : 0);
    if (!best || sc > best.sc) best = { ok, hit, heard: a, sc };
  }
  return best || { ok: false, hit: want.map(() => false), heard: '', sc: 0 };
}

// ---------- Anzeigen ----------
// Zieltext; nach einem Versuch sind die nicht verstandenen Wörter markiert
function spkTextHTML(s, hit) {
  const keys = s.ex && s.w.gap ? new Set(s.w.gap.word.toLowerCase().split(/\s+/)) : null;
  let k = 0;
  return s.say.split(' ').map(part => {
    const n = spkToks(part).length;
    const miss = hit && n && hit.slice(k, k + n).some(h => !h);
    k += n;
    const key = keys && keys.has(part.replace(/[^A-Za-z']/g, '').toLowerCase());
    return miss ? `<mark class="spk-miss">${esc(part)}</mark>` : key ? `<b>${esc(part)}</b>` : esc(part);
  }).join(' ');
}

function renderSpeak(s) {
  const w = s.w, V = SES.view;
  V.t = 'speak';
  V.tries = 0;
  const say = TTS.ok ? `<button class="say" type="button" data-act="spk-say" aria-label="Anhören">${icon('volume')}</button>
    <button class="say" type="button" data-act="spk-say" data-slow="1" aria-label="Langsam anhören">${icon('snail')}</button>` : '';
  $('#ses-body').innerHTML = `${kicker(s.ex ? 'Lies den Satz laut vor' : 'Sag das Wort laut', s)}
    <div class="prompt">${fox('')}<div class="prompt-box"><div class="prompt-main">
      <div class="prompt-text en spk-text${s.ex ? ' is-ex' : ''}" id="spk-text" lang="en">${spkTextHTML(s)}</div>
      ${s.ex ? '' : `<span class="prompt-sub">${esc(deShort(w))}</span>`}</div><div class="spk-say">${say}</div></div></div>
    <div class="spk">
      <button class="spk-mic" type="button" id="spk-mic" data-act="spk-mic" aria-describedby="spk-status">${icon('mic')}<span>Tippe und sprich</span></button>
      <p class="spk-status" id="spk-status" aria-live="polite">${COARSE ? 'Tippe aufs Mikrofon' : 'Klick aufs Mikrofon oder drück Enter'} und sprich deutlich.</p>
    </div>`;
  setSkip('Jetzt nicht sprechen');
  setGo(`${icon('mic')}Sprechen`);
  if (canListen()) after(350, () => { if (SES && SES.cur === s && !SPK.rec) TTS.speak(speakable(s.say)); });
}
ACT['spk-say'] = el => { const s = SES && SES.cur; if (s && s.t === 'speak') { spkStop(); TTS.speak(speakable(s.say), !!el.dataset.slow); } };
ACT['spk-mic'] = () => spkGo();

function spkStatus(html, cls = '') {
  const el = $('#spk-status');
  if (el) { el.innerHTML = html; el.className = 'spk-status' + (cls ? ' ' + cls : ''); }
}
function spkListening(on) {
  const b = $('#spk-mic');
  if (b) { b.classList.toggle('is-on', on); b.querySelector('span').textContent = on ? 'Ich höre zu …' : 'Tippe und sprich'; }
  setGo(on ? `${icon('check')}Fertig` : `${icon('mic')}Sprechen`, on ? 'btn-good' : 'btn-primary');
}

// ---------- Zuhören ----------
// Mikrofon an – oder, wenn es schon läuft, fertig gesprochen
function spkGo() {
  const s = SES && SES.cur;
  if (!s || s.t !== 'speak' || SES.phase !== 'ask') return;
  if (SPK.rec) { try { SPK.rec.stop(); } catch (e) { /* schon aus */ } return; }
  TTS.stop();
  let rec;
  try { rec = new SpeechRec(); } catch (e) { spkGone('Dein Browser kann hier leider nicht zuhören.'); return; }
  rec.lang = 'en-GB';
  rec.interimResults = true;
  rec.maxAlternatives = 5;
  rec.continuous = false;
  const R = { alts: [], live: '', err: '' };
  rec.onresult = e => {
    let live = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { for (let k = 0; k < r.length; k++) R.alts.push(r[k].transcript); }
      else live += r[0].transcript;
    }
    R.live = live || R.alts[0] || R.live;
    if (SES && SES.cur === s && R.live) spkStatus(`„<span lang="en">${esc(R.live.trim())}</span>“`, 'is-live');
  };
  rec.onerror = e => { R.err = e.error || 'x'; };
  rec.onend = () => {
    clearTimeout(R.cap);
    if (SPK.rec !== rec) return;
    SPK.rec = null;
    if (!SES || SES.cur !== s || SES.phase !== 'ask') return;
    spkListening(false);
    if (!R.alts.length && R.live) R.alts.push(R.live);   // Safari liefert manchmal kein „final“
    spkHeard(s, R);
  };
  SPK.rec = rec;
  try { rec.start(); } catch (e) { SPK.rec = null; spkStatus('Mikrofon geht gerade nicht. Nochmal?', 'is-bad'); return; }
  spkListening(true);
  spkStatus('Sprich jetzt!', 'is-live');
  // Sicherheitshalber: nach spätestens 8 bzw. 12 Sekunden auswerten – und falls dann kein Ende kommt, selbst beenden
  R.cap = setTimeout(() => {
    if (SPK.rec !== rec) return;
    try { rec.stop(); } catch (e) { /* egal */ }
    R.cap = setTimeout(() => { if (SPK.rec === rec) rec.onend(); }, 1500);
  }, s.ex ? 12000 : 8000);
}

function spkStop() {
  const r = SPK.rec;
  SPK.rec = null;
  if (r) try { r.abort(); } catch (e) { /* schon aus */ }
}

function spkHeard(s, R) {
  if (R.err && !R.alts.length) {
    if (R.err === 'not-allowed' || R.err === 'service-not-allowed' || R.err === 'audio-capture')
      return spkGone(R.err === 'audio-capture' ? 'Ich finde kein Mikrofon.' : 'Das Mikrofon ist hier nicht erlaubt.');
    if (R.err === 'network') return spkGone('Die Spracherkennung braucht Internet.');
    if (R.err !== 'no-speech' && R.err !== 'aborted') return spkStatus('Hat nicht geklappt. Nochmal?', 'is-bad');
  }
  if (!R.alts.length) { spkStatus('Nichts gehört. Etwas lauter!', 'is-bad'); return; }
  const r = spkJudge(s, R.alts), V = SES.view;
  if (r.ok) { spkDone(s, 'ok', r); return; }
  V.tries++;
  $('#spk-text').innerHTML = spkTextHTML(s, r.hit);
  if (V.tries >= SPK_TRIES) { spkDone(s, 'pass', r); return; }
  Sfx.play('near');
  spkStatus(`Gehört: „<span lang="en">${esc(r.heard)}</span>“<br>Die markierten Wörter nochmal!`, 'is-bad');
}

// Mikrofon geht hier nicht: ohne Fehler weiter, keine weiteren Sprech-Aufgaben
function spkGone(msg) {
  SPK.dead = true;
  toast(`${msg} Sprech-Aufgaben sind erstmal aus.`);
  spkDrop();
}
// „Jetzt nicht sprechen“: 15 Minuten keine Sprech-Aufgaben
function spkSkip() {
  spkStop();
  SPK.until = Date.now() + SPK_PAUSE;
  toast('Okay – 15 Minuten keine Sprech-Aufgaben.');
  spkDrop();
}
function spkDrop() {
  spkStop();
  SES.q = SES.q.filter(x => x.t !== 'speak');
  SES.done++;
  nextStep();
}

// Ergebnis: ok = XP und Kombo wie eine richtige Antwort; pass = nach 3 Versuchen ohne Fehler weiter.
// Der Lernstand des Wortes bleibt unverändert – Vorlesen zeigt nicht, ob man die Bedeutung weiß.
function spkDone(s, res, r) {
  const V = SES.view;
  V.res = res;
  V.xp = 0;
  if (res === 'ok') {
    V.xp = V.tries ? 6 : SPK_XP;
    SES.ok++;
    SES.combo++;
    bump('a');
    bump('ok');
    statInc('spoke');
    addXP(V.xp);
    comboZap();
    SES.best = Math.max(SES.best, SES.combo);
    statMax('combo', SES.combo);
  }
  SES.done++;
  SES.phase = 'fb';
  commit();
  const ok = res === 'ok';
  setFoot(ok ? 'ok' : 'near');
  $('#spk-text').innerHTML = spkTextHTML(s, ok ? null : r.hit);
  $('#spk-mic').disabled = true;
  $('#spk-mic span').textContent = ok ? 'Geschafft!' : 'Nächstes Mal klappt’s';
  spkStatus(r.heard ? `Gehört: „<span lang="en">${esc(r.heard)}</span>“` : '');
  $('#ses-fb').innerHTML = `<div class="fb-head">${fox(ok ? 'happy' : 'wow')}<span>${ok ? (V.tries ? 'Geschafft!' : pickOne(['Super ausgesprochen!', 'Klingt klasse!', 'Sehr gut gesprochen!'])) : 'Nicht schlimm – weiter geht’s!'}</span>${V.xp ? `<span class="fb-xp">+${V.xp} XP</span>` : ''}</div>
    <div class="fb-row"><p class="fb-ans"><b lang="en">${esc(s.w.plain)}</b> = ${esc(deShort(s.w))}</p>${sayBtn(s.w)}</div>
    ${ok ? '' : '<p class="fb-hint">Hör es dir nochmal an und sprich es leise mit. Das zählt nicht als Fehler.</p>'}`;
  setSkip('');
  setGo(`Weiter ${icon('arrow-right')}`, ok ? 'btn-good' : 'btn-near');
  Sfx.play(ok ? 'ok' : 'near');
  if (ok) autoNext(V.zap ? ZAP_MS - 300 : AUTO_HINT_MS);
  renderBar();
  renderMeta(ok);
  $('#ses-go').focus({ preventScroll: true });
}

// Eltern-Einstellung (views.js zeigt den Schalter nur, wo Sprechen möglich ist)
CHG['set-spk'] = el => setSet('spk', el.checked);
</script>
<script>
/* Wortfuchs – Satz-Übungen mit den Beispielsätzen aus dem Buch (Daten: saetze/ → VOCAB.sx, VOCAB.gl).
   Satz bauen (Englisch → Deutsch, Deutsch → Englisch), Hör-Puzzle (Englisch oder Deutsch hören → Englisch bauen)
   und „Finde den Fehler“. Zählt für XP und Kombo, nicht für den Lernkasten (wie die Sprech-Übung).
   In Stationen und Wiederholungen 2–3 Aufgaben, dazu der Modus „Sätze“. Baut auf ueben.js auf. */
'use strict';

ICONS.chat = '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>';

const SX = VOCAB.sx || [];
const SX_GL = VOCAB.gl || {};
const SX_XP = { de: 12, en: 12, hen: 12, hde: 12, fix: 10 };
const SX_MODES = ['en', 'de', 'hen', 'fix', 'hde'];
const SX_MIN = 3, SX_MAX = 14, SX_HEAR_MAX = 12, SX_N = 8;

// Wörter eines Satzes wie in build.js (sentToks): Satzzeichen am Rand weg, Apostroph/Bindestrich im Wort bleiben
const SX_SEP = /([\s–—/]+)/;
const SX_EDGE = /^([.,!?;:"“”„'()…-]*)(.*?)([.,!?;:"“”„'()…-]*)$/;
const satzToks = s => String(s).replace(APOS, "'").split(SX_SEP).filter((p, i) => !(i % 2)).map(p => p.match(SX_EDGE)[2]).filter(Boolean);
const SATZ = SX.map(x => ({ en: satzToks(x.e), de: satzToks(x.d[0]), deAlt: x.d.slice(1).map(satzToks) }));

// Verwechslungs-Kacheln: Wörter, die gern vertauscht werden – nie Wörter mit gleicher Bedeutung
const sxGroups = list => {
  const m = new Map();
  for (const g of list) { const ws = g.split(' '); for (const w of ws) m.set(w, ws.filter(x => x !== w)); }
  return m;
};
const SX_MIX = {
  en: sxGroups(['is are am be', 'a an', 'this these that those', 'there their they', 'to too two', 'in on at', 'he she it',
    'his her its', 'my your our', 'do does', 'have has', "don't doesn't", "isn't aren't", 'where were wear', 'what which who',
    'some any', 'much many', 'go goes', 'me my', 'him his', 'we us', 'them they', 'of off', 'for from', 'then than', "it's its", "you're your"]),
  de: sxGroups(['ist sind bin bist', 'der die das den dem', 'ein eine einen einem', 'mein meine meinen meinem', 'dein deine deinen deinem',
    'kein keine keinen', 'er sie es', 'ich du wir', 'mich mir', 'dich dir', 'im ins am', 'hat habe hast haben', 'kann kannst können',
    'mag magst mögen', 'wo wer was wie', 'auf aus', 'mit von', 'nicht nichts', 'unser unsere unseren', 'gibt gib']),
};
const SX_POOL = {};   // Wörter aus allen Sätzen als Füll-Kacheln (englisch ohne Namen, deutsch mit Großschreibung)
const sxCap = (like, w) => /^[A-ZÄÖÜ]/.test(like) ? w[0].toUpperCase() + w.slice(1) : w;

function satzBank(parts, lang, x) {
  const have = new Set(parts.map(p => p.toLowerCase()));
  // erst ein Wort je Gruppe, dann die übrigen – sonst stehen „Meinem“ und „Meinen“ nebeneinander
  const groups = shuffle(parts).map(p => shuffle(SX_MIX[lang].get(p.toLowerCase()) || []).map(d => sxCap(p, d)));
  const cand = [...groups.map(g => g[0]), ...groups.flatMap(g => g.slice(1))].filter(Boolean);
  // das eingebaute Fehler-Wort, wenn es ein echtes Wort ist (glass → grass)
  if (lang === 'en' && (FORMS.has(x.f[1].toLowerCase()) || SX_GL[x.f[1].toLowerCase()])) cand.unshift(x.f[1]);
  if (!SX_POOL[lang]) SX_POOL[lang] = uniq(SATZ.flatMap(it => it[lang]).filter(t => t.length >= 3 && (lang === 'de' ? /^[\p{L}-]+$/u : /^[a-z][a-z'-]*$/).test(t)));
  const fill = shuffle(SX_POOL[lang]).slice(0, 40);
  const n = parts.length <= 4 ? 2 : parts.length <= 8 ? 3 : 4, out = [];
  for (const c of [...cand, ...fill]) {
    const l = c.toLowerCase();
    if (have.has(l) || out.some(o => o.toLowerCase() === l)) continue;
    out.push(c);
    if (out.length >= n) break;
  }
  return out;
}

// ---------- Vorlesen (Englisch: wie überall; Deutsch: deutsche Gerätestimme, falls vorhanden) ----------
function satzDeVoice() {
  if (!TTS.ok) return null;
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^de([-_]|$)/i.test(v.lang) && !TTS.odd.test(v.name || ''));
    const de = vs.filter(v => /de[-_]DE/i.test(v.lang));
    return de.find(v => /natural|neural|premium|enhanced|erweitert|verbessert|optimiert/i.test(v.name || '')) || de[0] || vs[0] || null;
  } catch (e) { return null; }
}
function satzSay(s, lang, slow = false) {
  const x = SX[s.k];
  if (lang !== 'de') { TTS.speak(x.e, slow); return; }
  const v = satzDeVoice();
  if (!v) return;
  TTS.stop();
  try {
    const u = new SpeechSynthesisUtterance(x.d[0]);
    u.lang = v.lang;
    u.voice = v;
    u.rate = clamp((S.set.rate || 0.9) * (slow ? 0.65 : 1), 0.4, 1.5);
    setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { /* stumm */ } }, 30);
  } catch (e) { /* Sprachausgabe nicht verfügbar */ }
}

// ---------- Was gibt es zu einem Satz? ----------
function satzModes(k) {
  const it = SATZ[k], fits = n => n >= SX_MIN && n <= SX_MAX;
  const m = ['fix'];
  if (fits(it.de.length)) m.push('de');
  if (fits(it.en.length)) {
    m.push('en');
    if (canListen() && it.en.length <= SX_HEAR_MAX) { m.push('hen'); if (satzDeVoice()) m.push('hde'); }
  }
  return m;
}
// Eine Satz-Aufgabe zum Wort; used verhindert denselben Satz zweimal in einer Übung
function satzStep(w, want, used) {
  const ks = shuffle((w.s || []).filter(k => SX[k] && !(used && used.has(k))));
  if (!ks.length) return null;
  const k = ks[0], ms = satzModes(k);
  if (used) used.add(k);
  return { t: 'sent', w, g: 'recog', k, m: ms.includes(want) ? want : pickOne(ms) };
}

// In Stationen und Wiederholungen: 2–3 Satz-Aufgaben zu Wörtern, die schon vorgestellt sind,
// verteilt über die Übung (nach dem Kennenlernen und frühestens 3 Schritte nach dem ersten Auftritt)
function satzPlan(steps, kind) {
  if (!SX.length || !steps.length || kind === 'sent') return steps;
  const first = new Map(), intro = new Set();
  let lastIntro = -1;
  steps.forEach((s, i) => {
    if (s.w && !first.has(s.w)) first.set(s.w, i);
    if (s.t === 'intro') { lastIntro = i; intro.add(s.w); }
  });
  const words = shuffle([...first.keys()].filter(w => w.s && (lvl(w) >= 1 || intro.has(w))));
  const n = kind === 'lesson' || steps.length >= 10 ? 3 : steps.length >= 6 ? 2 : 1;
  const used = new Set(), off = rnd(SX_MODES.length), add = [];
  const from = lastIntro + 2, span = Math.max(1, steps.length - from);
  for (const w of words) {
    if (add.length >= n) break;
    const s = satzStep(w, SX_MODES[(off + add.length) % SX_MODES.length], used);
    if (s) add.push({ at: Math.max(first.get(w) + 3, from + Math.round((add.length + 0.5) * span / n)), s });
  }
  // nie zwei Satz-Aufgaben direkt hintereinander
  add.sort((x, y) => x.at - y.at).forEach((a, i) => { if (i) a.at = Math.max(a.at, add[i - 1].at + 1); });
  const out = steps.slice();
  for (const a of add.reverse()) out.splice(Math.min(a.at, out.length), 0, a.s);
  return out;
}

// Modus „Sätze“: etwa 8 Aufgaben, bekannte Wörter zuerst, die Arten im Wechsel
function satzSession(pool) {
  const have = pool.filter(w => w.s);
  const words = [...shuffle(have.filter(w => lvl(w) >= 1)), ...shuffle(have.filter(w => !lvl(w)))];
  const used = new Set(), off = rnd(SX_MODES.length), steps = [];
  for (const w of words) {
    if (steps.length >= SX_N) break;
    const s = satzStep(w, SX_MODES[(off + steps.length) % SX_MODES.length], used);
    if (s) steps.push(s);
  }
  return steps;
}

// ---------- Anzeigen ----------
// Satz mit einzeln antippbaren Wörtern (act) – o.bold: Buch-Wort hervorheben, o.swap: [Index, Ersatz], o.cls: {Index: Klasse}
function satzHTML(text, act, o = {}) {
  let k = 0;
  return String(text).replace(APOS, "'").split(SX_SEP).map((part, i) => {
    if (i % 2) return esc(part);
    const m = part.match(SX_EDGE);
    if (!m[2]) return esc(part);
    const n = k++;
    const core = o.swap && o.swap[0] === n ? o.swap[1] : m[2];
    const cls = ['sx-w', o.bold && o.bold.has(n) ? 'is-key' : '', (o.cls && o.cls[n]) || ''].filter(Boolean).join(' ');
    const el = act ? `<button class="${cls}" type="button" data-act="${act}" data-k="${n}" data-t="${esc(core)}">${esc(core)}</button>` : `<span class="${cls}">${esc(core)}</span>`;
    return esc(m[1]) + el + esc(m[3]);
  }).join('');
}
// Welche Wörter des Satzes gehören zur Buch-Vokabel? (cats → cat, hobbies → hobby, Karam's → karam)
const SX_STOP = new Set(['to', 'a', 'an', 'the', 'sb', 'sth', 'somebody', 'something', 'be', 'of', 'in', 'on', 'at']);
const satzCands = t => { const l = t.toLowerCase(); return uniq([l, l.replace(/'s$/, ''), l.replace(/ies$/, 'y'), l.replace(/es$/, ''), l.replace(/s$/, '')]); };
function satzBold(s) {
  const want = new Set(satzToks(s.w.plain).map(t => t.toLowerCase()).filter(t => !SX_STOP.has(t)));
  const out = new Set();
  SATZ[s.k].en.forEach((t, i) => { if (satzCands(t).some(c => want.has(c))) out.add(i); });
  return out;
}
// Bedeutung eines Satzworts: Buch-Vokabel(n), sonst saetze/woerter.txt
function satzLook(t) {
  const cs = satzCands(t);
  for (const c of cs) {
    const ids = FORMS.get(c);
    if (ids) return uniq(ids.slice(0, 2).map(i => deShort(WORDS[i]))).join(' · ');
  }
  for (const c of cs) if (SX_GL[c]) return SX_GL[c];
  return '';
}

const satzPrompt = (inner, extra = '') => `<div class="prompt">${fox('')}<div class="prompt-box"><div class="prompt-main">${inner}</div>${extra}</div></div>`;
const satzSayBtn = (lang, slow, cls = 'say') => TTS.ok
  ? `<button class="${cls}" type="button" data-act="sx-say" data-l="${lang}"${slow ? ' data-slow="1"' : ''} aria-label="${slow ? 'Langsam anhören' : 'Anhören'}">${icon(slow ? 'snail' : 'volume')}</button>` : '';

function renderSatz(s) {
  const V = SES.view, x = SX[s.k], it = SATZ[s.k];
  V.t = 'sent';
  if (s.m === 'fix') { renderSatzFix(s); return; }
  const lang = s.m === 'de' ? 'de' : 'en', parts = lang === 'de' ? it.de : it.en;
  V.sp = { m: 'words', pre: '', parts, target: parts.join(' '), lang };
  V.bank = shuffle([...parts, ...satzBank(parts, lang, x)]).map(t => ({ t, used: false }));
  V.line = [];
  let head;
  if (s.m === 'de') head = kicker('Auf Deutsch?', s) + satzPrompt(`<div class="prompt-text en sx-text" lang="en">${satzHTML(x.e, 'sx-word', { bold: satzBold(s) })}</div>`, satzSayBtn('en'));
  else if (s.m === 'en') head = kicker('Auf Englisch?', s) + satzPrompt(`<div class="prompt-text sx-text">${esc(x.d[0])}</div>`);
  else {
    const lg = s.m === 'hde' ? 'de' : 'en';
    head = kicker(lg === 'de' ? 'Auf Englisch?' : 'Was hörst du?', s)
      + `<div class="listen"><span class="sx-lang" aria-label="${lg === 'de' ? 'Deutsch' : 'Englisch'}">${lg.toUpperCase()}</span>${satzSayBtn(lg, false, 'say-big')}${satzSayBtn(lg, true, 'say say-slow')}</div>`;
  }
  $('#ses-body').innerHTML = head + '<div class="tline sx-tiles" id="tline" aria-label="Deine Antwort"></div><div class="tbank sx-tiles" id="tbank" role="group" aria-label="Kacheln"></div>';
  drawTiles();
  setGo('Prüfen', 'btn-primary', true);
  if (canListen() && s.m !== 'en') after(300, () => { if (SES && SES.cur === s) satzSay(s, s.m === 'hde' ? 'de' : 'en'); });
  focusBody();
}

// „Finde den Fehler“: erst das falsche Wort antippen, dann das richtige wählen
function renderSatzFix(s) {
  const V = SES.view, x = SX[s.k];
  V.bad = SATZ[s.k].en.indexOf(x.f[0]);
  V.miss = 0;
  V.step = 'pick';
  V.opts = shuffle([x.f[0], x.f[2], x.f[3]]);
  $('#ses-body').innerHTML = kicker('Finde den Fehler', s)
    + `<div class="gap-sent sx-fix" id="sx-fix" lang="en">${satzHTML(x.e, 'sx-pick', { swap: [V.bad, x.f[1]] })}</div>`
    + `<p class="gap-de">${esc(x.d[0])}</p><div id="sx-opts"></div>`;
  setGo('Prüfen', 'btn-primary', true);
  focusBody();
}
function satzFixFound() {
  const V = SES.view;
  V.step = 'opt';
  $$('#sx-fix .sx-w').forEach(b => { b.disabled = true; });
  const b = $(`#sx-fix [data-k="${V.bad}"]`);
  if (b) b.classList.add('is-found');
  $('#sx-opts').innerHTML = `<div class="opts sx-opts" role="group" aria-label="Richtiges Wort">${V.opts.map((o, k) =>
    `<button class="opt en-opt" type="button" data-act="sx-opt" data-k="${k}" lang="en"><span class="num" aria-hidden="true">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  const f = $('#sx-opts .opt');
  if (f) f.focus({ preventScroll: true });
}
const sxFixStep = () => SES && SES.phase === 'ask' && SES.cur && SES.cur.t === 'sent' && SES.cur.m === 'fix';
ACT['sx-pick'] = el => {
  if (!sxFixStep() || SES.view.step !== 'pick') return;
  const V = SES.view;
  if (+el.dataset.k === V.bad) { Sfx.play('tap'); satzFixFound(); return; }
  V.miss++;
  el.disabled = true;
  el.classList.add('is-wrong');
  after(500, () => { el.classList.remove('is-wrong'); el.classList.add('is-dim'); });
  Sfx.play('near');
  if (V.miss >= 2) after(350, () => { if (sxFixStep() && SES.view === V && V.step === 'pick') satzFixFound(); });
};
ACT['sx-opt'] = el => {
  if (!sxFixStep() || SES.view.step !== 'opt') return;
  const s = SES.cur, V = SES.view, x = SX[s.k], k = +el.dataset.k, right = V.opts.indexOf(x.f[0]);
  V.step = 'done';
  markOpts(k, right);
  const b = $(`#sx-fix [data-k="${V.bad}"]`);
  if (b) { b.textContent = x.f[0]; b.classList.remove('is-found'); b.classList.add('is-fix'); }
  satzDone(s, k !== right ? 'bad' : V.miss ? 'near' : 'ok');
  $('#ses-go').focus({ preventScroll: true });
};
ACT['sx-word'] = el => {
  const t = el.dataset.t, m = satzLook(t);
  toast(`<b lang="en">${esc(t)}</b> = ${esc(m || '–')}`);
  if (canListen()) TTS.speak(t);
};
ACT['sx-say'] = el => { const s = SES && SES.cur; if (s && s.t === 'sent') satzSay(s, el.dataset.l, !!el.dataset.slow); };
// Wer im Ergebnis anhört oder Wörter antippt, will in Ruhe lesen – dann bleibt „Weiter“ stehen
$('#session').addEventListener('click', e => {
  if (SES && SES.phase === 'fb' && e.target.closest('[data-act="sx-say"], [data-act="sx-word"]')) stopAuto();
});

// ---------- Prüfen und werten ----------
function satzGo() { if (SES.view.sp) satzCheck(); }

function satzCheck() {
  const s = SES.cur, V = SES.view, sp = V.sp;
  if (!V.line.length) return;
  const got = V.line.map(i => V.bank[i].t);
  const norm = a => a.join(' ').toLowerCase();
  const ok = [sp.parts, ...(sp.lang === 'de' ? SATZ[s.k].deAlt : [])].some(p => norm(p) === norm(got));
  $$('#ses-body button.tile').forEach(b => { b.disabled = true; });
  if (ok) {
    $('#tline').classList.add('is-right');
    satzDone(s, 'ok');
  } else {
    const unit = c => ({ c, k: c.toLowerCase(), free: false });
    const dx = dxAlign(got.map(unit), sp.parts.map(unit)).ops;
    $('#tline').innerHTML = dx.map(o => o.a
      ? `<button class="tile${o.op === '=' ? '' : ' is-bad'}" type="button" disabled lang="${sp.lang}">${esc(o.a.c)}</button>`
      : '<span class="tile tile-gap" aria-hidden="true"></span>').join('');
    $('#tline').classList.add('is-checked');
    satzDone(s, 'bad', { dx });
  }
  $('#ses-go').focus({ preventScroll: true });
}

function satzSkip() {
  const s = SES.cur, V = SES.view, x = SX[s.k];
  $$('#ses-body button.tile, #ses-body .sx-w').forEach(b => { b.disabled = true; });
  if (s.m === 'fix') {
    const b = $(`#sx-fix [data-k="${V.bad}"]`);
    if (b) { b.textContent = x.f[0]; b.classList.remove('is-found'); b.classList.add('is-fix'); }
    if (V.step === 'opt') markOpts(-1, V.opts.indexOf(x.f[0]));
    V.step = 'done';
  }
  satzDone(s, 'miss');
  $('#ses-go').focus({ preventScroll: true });
}

// Falsch? Dann kommt der Satz 3–5 Aufgaben später einmal wieder
function satzAgain(s) {
  const key = 'sx' + s.k;
  if (s.again || SES.req[key]) return;
  SES.req[key] = 1;
  SES.q.splice(Math.min(SES.q.length, 2 + rnd(3)), 0, Object.assign({}, s, { again: true }));
}

function satzDone(s, res, x = {}) {
  const V = SES.view;
  V.res = res;
  V.xp = 0;
  bump('a');
  if (res === 'ok') {
    V.xp = SX_XP[s.m];
    SES.ok++;
    SES.combo++;
    bump('ok');
    statInc('sx');
  } else if (res === 'near') {
    V.xp = 4;
    SES.near++;
  } else {
    SES.bad++;
    SES.errs++;
    SES.combo = 0;
    satzAgain(s);
  }
  addXP(V.xp);
  if (res === 'ok') comboZap();
  SES.best = Math.max(SES.best, SES.combo);
  statMax('combo', SES.combo);
  SES.done++;
  SES.phase = 'fb';
  commit();
  satzFeedback(s, res, x);
  renderBar();
  renderMeta(res === 'ok');
}

function satzFeedback(s, res, x) {
  const V = SES.view, w = s.w, it = SX[s.k];
  const ok = res === 'ok', cls = ok ? 'ok' : res === 'near' ? 'near' : 'bad';
  setFoot(cls);
  const head = ok ? pickOne(PRAISE) : res === 'near' ? 'Gefunden!' : res === 'miss' ? 'Merk es dir:' : 'Nicht ganz.';
  const en = `<div class="fb-row"><p class="fb-ans sx-fb" lang="en">${satzHTML(it.e, 'sx-word', { bold: satzBold(s), cls: s.m === 'fix' ? { [V.bad]: 'is-fix' } : null })}</p>${satzSayBtn('en')}</div>`;
  let body;
  if (x.dx && V.sp.lang === 'de') {
    body = `<p class="fb-ans fb-you">Du: <b lang="de" class="dx">${dxHTML(x.dx, 'you', ' ')}</b></p>
      <p class="fb-ans">Richtig: <b lang="de" class="dx">${dxHTML(x.dx, 'fix', ' ')}</b></p>${en}`;
  } else {
    body = (x.dx ? `<p class="fb-ans fb-you">Du: <b lang="en" class="dx">${dxHTML(x.dx, 'you', ' ')}</b></p>` : '')
      + en + `<p class="fb-hint">${esc(it.d[0])}</p>`;
  }
  if (s.m === 'fix' && !ok) body += `<p class="fb-hint" lang="en"><s>${esc(it.f[1])}</s> → <b>${esc(it.f[0])}</b></p>`;
  $('#ses-fb').innerHTML = `<div class="fb-head">${fox(ok ? 'happy' : cls === 'near' ? 'wow' : 'sad')}<span>${head}</span>${V.xp ? `<span class="fb-xp">+${V.xp} XP</span>` : ''}</div>
    ${body}<p class="fb-hint sx-voc">${icon('book-open')}<b lang="en">${esc(w.plain)}</b> = ${esc(deShort(w))}</p>`;
  setSkip('');
  setGo(`Weiter ${icon('arrow-right')}`, ok ? 'btn-good' : cls === 'near' ? 'btn-near' : 'btn-bad');
  Sfx.play(ok ? 'ok' : cls === 'near' ? 'near' : 'bad');
  if (ok) autoNext(V.zap ? ZAP_MS - 300 : AUTO_HINT_MS);
  if (canListen()) after(250, () => { if (SES && SES.view === V) TTS.speak(it.e); });
}

// ---------- Startknopf ----------
ACT.sent = () => {
  if (SES) return;
  if (!sesPool().some(w => w.s)) { toast('Hier gibt es keine Sätze.'); Sfx.play('near'); return; }
  startSession('sent');
};
</script>
<script>
/* Wortfuchs – Fuchstaler: beim Lernen verdienen, für Wort-Snake ausgeben oder gegen
   Bildschirmzeit einlösen (Anfrage-Code → Freigabe-Code vom gekoppelten Eltern-Handy).
   Baut auf kern.js, ui.js, views.js und ueben.js auf. */
'use strict';

// ======================= Konto =======================
// Taler-Tageswerte in S.days: c verdient, cx XP-Topf zum nächsten Taler, sp für Spielrunden ausgegeben,
// bz Blitz-Taler heute schon vergeben, fx „Ich hatte recht“. Eingelöst wird über das Protokoll S.red.
const TAL_MIN = [0, 5, 10, 15, 20, 30];   // Ziffer in der Anfrage → Minuten
const TAL_ASK = [2, 3, 4, 5];             // das Kind fragt 10/15/20/30 Min an
const TAL_UNLOCK = 9;                     // Anfrage „Einstellungen entsperren“
const PAR_KEY = 'wortfuchs.eltern';       // Geheimnis des Eltern-Handys, nur in diesem Browser

const talOn = () => S.set.tal !== false;
const talRate = () => S.set.tk || 60;
const talSpent = () => sum(S.red.map(x => x.min || 0));
function talBalance() {
  let n = 0;
  for (const d of Object.values(S.days)) n += (d.c || 0) - (d.sp || 0);
  return Math.max(0, n - talSpent());
}
// Was frei ist, wenn eine offene Anfrage schon Minuten reserviert
const talFree = () => talBalance() - (S.req.c && S.req.o !== TAL_UNLOCK ? TAL_MIN[S.req.o] || 0 : 0);
const talLocked = () => !!S.pair.k && !PAR.tal;
// Spielrunden (Snake, Wortknacker, Fuchs-Sprung): warum gerade keine geht ('' = geht) und 1 Taler abbuchen

}

// XP füllen den Topf; ist die Tages- oder Kontogrenze erreicht, verfällt er
function talEarn(n) {
  if (!talOn() || !(n > 0)) return;
  const r = todayRec(), k = talRate();
  r.cx = (r.cx || 0) + n;
  while (r.cx >= k) {
    r.cx -= k;
    if ((r.c || 0) >= (S.set.td || 20) || talBalance() >= (S.set.tm || 60)) continue;
    r.c = (r.c || 0) + 1;
    if (SES) SES.tal = (SES.tal || 0) + 1;
  }
}
// Blitz-Runde: nur die erste am Tag zählt, höchstens 3 Taler
function talBlitz() {
  if (!talOn() || !SES) return;
  const r = todayRec();
  if (r.bz) return;
  r.bz = 1;
  SES.talBz = true;
  talEarn(Math.min(SES.xp, 3 * talRate()));
}

function talGainHTML() {
  if (!talOn() || !SES) return '';

  else if (SES.kind === 'blitz' && !SES.talBz) txt = '<span>Blitz-Runden bringen nur einmal am Tag Taler.</span>';
  else if ((r.c || 0) >= td) txt = `<span>Heute hast du alle ${td} Taler verdient – stark!</span>`;
  else if (talBalance() >= (S.set.tm || 60)) txt = '<span>Dein Taler-Konto ist voll – lös erst welche ein.</span>';
  else txt = `<span>Noch ${fmtN(talRate() - (r.cx || 0))} XP bis zum nächsten Taler</span>`;
  return `<div class="tal-gain${n ? ' is-new' : ''}">${icon('coin')}${txt}</div>`;
}

// ======================= Codes =======================
// cyrb53 – kurzer, schneller Hash; reicht für 4-stellige Freigabe-Codes
function talHash(s) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
const talCode = (K, req, o) => String(talHash(`${K}|${req}|${o}`) % 10000).padStart(4, '0');

// Anfrage-Code: 3 Zufallsziffern + Option + Prüfziffer (fängt Tippfehler der Eltern ab)
const reqCheck = s => String([1, 3, 7, 9].reduce((a, w, i) => a + w * +s[i], 0) % 10);
const reqCode = (n, o) => n + o + reqCheck(n + o);
function talNonce() {
  const used = new Set(S.red.map(x => x.n));
  let n;
  do n = String(rnd(1000)).padStart(3, '0'); while (used.has(n) && used.size < 900);
  return n;
}
const reqNone = () => ({ c: '', o: 0, n: 0, m: Date.now() });

// Kopplungs-Code: 7 Zeichen + Prüfzeichen, ohne verwechselbare (0/O, 1/I/L)
const PAIR_ABC = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const pairCheck = s => PAIR_ABC[[...s].reduce((h, c, i) => h + (i + 1) * PAIR_ABC.indexOf(c), 0) % PAIR_ABC.length];
const pairNorm = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
const pairOk = k => k.length === 8 && [...k].every(c => PAIR_ABC.includes(c)) && pairCheck(k.slice(0, 7)) === k[7];
const pairFmt = k => k.slice(0, 4) + '-' + k.slice(4);
function pairNew() {
  const a = new Uint8Array(7);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < 7; i++) a[i] = rnd(256); }
  const s = [...a].map(x => PAIR_ABC[x % PAIR_ABC.length]).join('');
  return s + pairCheck(s);
}
function parKey() {
  try { const k = localStorage.getItem(PAR_KEY) || ''; return pairOk(k) ? k : ''; } catch (e) { return ''; }
}
function parSetKey(k) {
  try { if (k) localStorage.setItem(PAR_KEY, k); else localStorage.removeItem(PAR_KEY); return true; } catch (e) { return false; }
}

  talRedraw();

  if (i) i.focus({ preventScroll: true });
};

ACT['tal-unlock'] = () => {

};

SUB['tal-ok'] = () => {
  const inp = $('#tal-in'), v = inp.value.replace(/\D/g, ''), q = S.req, K = S.pair.k;
  if (!q.c || !K) return;
  if (v.length !== 4) { toast('Der Freigabe-Code hat 4 Ziffern.'); return; }
  const opts = q.o === TAL_UNLOCK ? [TAL_UNLOCK] : TAL_MIN.map((_, o) => o).filter(o => o >= 1 && o <= q.o);
  const o = opts.find(x => talCode(K, q.c, x) === v);
  if (!o) {
    q.n = (q.n || 0) + 1;
    q.m = Date.now();
    if (q.n >= 3) { S.req = reqNone(); toast('3-mal falsch – stell eine neue Anfrage.'); }

    commit();
    Sfx.play('bad');
    talRedraw();
    const i = $('#tal-in');
    if (i) i.focus({ preventScroll: true });
    return;
  }
  const t = Date.now(), unlock = o === TAL_UNLOCK;
  const min = unlock ? 0 : Math.min(TAL_MIN[o], talBalance());
  S.red.push(unlock ? { id: `${q.c}-${t.toString(36)}`, t, n: q.c, min: 0, k: 's' } : { id: `${q.c}-${t.toString(36)}`, t, n: q.c, min });

  commit();
  $('#toast').hidden = true;
  if (unlock) { PAR.tal = true; Sfx.play('ok'); toast('Entsperrt'); VIEWS.parents(false); return; }

  Sfx.play('win');

      <div class="set-row"><div><span class="lbl">Kurs</span><small>Wie viel XP ein Taler (1 Minute) kostet</small></div>${sel('tal-tk', k, [[30, '30 XP – etwa 1:1'], [60, '60 XP – etwa 2:1'], [90, '90 XP – etwa 3:1']], 'Kurs')}</div>
      <div class="set-row"><div><span class="lbl">Höchstens pro Tag</span></div>${sel('tal-td', td, [5, 10, 15, 20, 30, 45, 60].map(n => [n, `${n} Taler`]), 'Höchstens pro Tag')}</div>
      <div class="set-row"><div><span class="lbl">Höchstens auf dem Konto</span></div>${sel('tal-tm', tm, [30, 60, 90, 120].map(n => [n, `${n} Taler`]), 'Höchstens auf dem Konto')}</div>
      ${S.pair.k && !K ? `<div class="set-row"><div><span class="lbl">Kopplung lösen</span><small>Danach kann Ihr Kind keine Taler mehr einlösen.</small></div>
        <button class="btn btn-ghost btn-sm" type="button" data-act="pair-off"${lock ? ' aria-disabled="true" data-why="Erst entsperren – mit einem Freigabe-Code vom Eltern-Handy."' : ''}>Lösen</button></div>` : ''}
    </div>`;
}

function talSet(k, v) {
  if (talLocked()) { toast('Gesperrt – erst mit einem Freigabe-Code entsperren.'); VIEWS.parents(false); return; }

CHG['tal-on'] = el => { talSet('tal', el.checked); renderNav(); };

CHG['tal-td'] = el => talSet('td', +el.value);

SUB.pair = () => {

ACT['par-dev'] = async () => {

  const inp = $('#pair-in'), typed = pairNorm(inp ? inp.value : ''), take = pairOk(typed);

      : 'Dieses Handy bekommt einen neuen Kopplungs-Code. Damit koppeln Sie danach das Gerät Ihres Kindes.' });
  if (!yes) return;

ACT['ob-parent'] = () => {
