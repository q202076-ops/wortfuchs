// ======================= Wort-Snake =======================
const SN_N = 12, SN_TIME = 90000, SN_HEARTS = 3;
const SN_DIR = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
const SN_OPP = { u: 'd', d: 'u', l: 'r', r: 'l' };
const SN_KEYS = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r', W: 'u', S: 'd', A: 'l', D: 'r' };
const SN = { on: false, phase: '', raf: 0, cv: null, cx: null, col: null, sw: null };

// Kleines Bild für die Karte in der Taler-Ansicht
function snArt() {
  const cells = [[1, 3], [2, 3], [3, 3], [3, 2], [4, 2], [5, 2]];
  return `<svg viewBox="0 0 80 40">${cells.map(([x, y], i) => `<rect x="${x * 10 + 1}" y="${y * 10 - 9}" width="9" height="9" rx="3" class="${i === cells.length - 1 ? 'sa-head' : 'sa-body'}"/>`).join('')}
    <circle cx="69" cy="15" r="6" class="sa-item"/><text x="69" y="18.5" class="sa-ch">a</text></svg>`;
}

function snWords() {
  const ok = w => /^[a-z]{3,8}$/.test(w.plain);
  let list = knownWords(sesPool()).filter(ok);
  if (list.length < 4) list = sesPool().filter(ok);
  if (list.length < 4) list = WORDS.filter(ok);
  return shuffle(list);
}

ACT['sn-open'] = el => {
  if (whyToast(el)) return;
  SN.on = true;
  SN.phase = 'intro';
  const root = $('#snake');
  root.innerHTML = `<div class="sn">
    <div class="sn-top"><button class="icon-btn" type="button" id="sn-x" data-act="sn-quit" aria-label="Wort-Snake beenden">${icon('x')}</button>
      <div class="sn-hearts" id="sn-hearts" aria-label="Herzen"></div><div class="sn-score" id="sn-score" aria-label="Punkte">0</div><div class="sn-time" id="sn-time">${fmtTime(SN_TIME / 1000)}</div></div>
    <div class="sn-hint" id="sn-hint" aria-live="polite"></div>
    <div class="sn-stage" id="sn-stage"><canvas id="sn-cv" aria-label="Spielfeld" role="img"></canvas><div class="sn-over" id="sn-over"></div></div>
    <div class="sn-pad" aria-label="Steuerung">${[['u', 'arrow-up', 'Hoch'], ['l', 'arrow-left', 'Links'], ['d', 'arrow-down', 'Runter'], ['r', 'arrow-right', 'Rechts']]
      .map(([d, ic, l]) => `<button class="sn-btn sn-${d}" type="button" data-act="sn-dir" data-d="${d}" aria-label="${l}">${icon(ic)}</button>`).join('')}</div></div>`;
  root.hidden = false;
  document.body.classList.add('ses-open');
  for (const s of BEHIND) $(s).inert = true;
  SN.cv = $('#sn-cv');
  SN.cx = SN.cv.getContext('2d');
  snColors();
  snReset();
  snFit();
  snIntro();
};

function snColors() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  SN.col = { a: v('--card'), b: v('--card-2'), ink: v('--ink'), body: v('--good'), head: v('--good-deep'), item: v('--gold-soft'),
    ring: v('--gold'), bad: v('--bad'), font: v('--f-display') || 'system-ui, sans-serif' };
}

function snReset() {
  const c = SN_N >> 1;
  Object.assign(SN, { body: [[c, c], [c - 1, c], [c - 2, c]], dir: 'r', q: [], grow: 0, hearts: SN_HEARTS, score: 0, done: [],
    left: SN_TIME, ms: 170, acc: 0, last: 0, hold: 0, list: snWords(), wi: 0, items: [], hud: '' });
  snWord();
}
function snWord() {
  SN.word = SN.list[SN.wi++ % SN.list.length];
  SN.w = SN.word.plain;
  SN.idx = 0;
  snSpawn();
  snHint();
}
// Gesuchter Buchstabe + 2 Köder (einer davon möglichst aus dem Rest des Worts)
function snSpawn() {
  const want = SN.w[SN.idx];
  const rest = shuffle([...new Set(SN.w.slice(SN.idx + 1))].filter(ch => ch !== want));
  const abc = shuffle([...'abcdefghijklmnopqrstuvwxyz'].filter(ch => ch !== want && !rest.includes(ch)));
  const decoys = [...rest.slice(0, 1), ...abc].slice(0, 2);
  const taken = new Set(SN.body.map(p => p.join()));
  const [hx, hy] = SN.body[0];
  const free = [];
  for (let y = 0; y < SN_N; y++) for (let x = 0; x < SN_N; x++) if (!taken.has(x + ',' + y)) free.push([x, y]);
  const far = free.filter(([x, y]) => Math.abs(x - hx) + Math.abs(y - hy) >= 3);
  const spots = shuffle(far.length >= 3 ? far : free);
  SN.items = [want, ...decoys].map((ch, i) => ({ ch, ok: i === 0, x: spots[i][0], y: spots[i][1] }));
}

function snHint(done) {
  const h = $('#sn-hint');
  if (!h) return;
  const slots = [...SN.w].map((ch, i) => i < SN.idx || done ? `<b>${esc(ch)}</b>` : '<i></i>').join('');
  h.className = 'sn-hint' + (done ? ' is-done' : '');
  h.innerHTML = `<div class="sn-de"><span>${esc(deShort(SN.word))}</span>${TTS.ok && S.set.tts ? `<button class="icon-btn sn-say" type="button" data-act="sn-say" aria-label="Wort anhören">${icon('volume')}</button>` : ''}</div>
    <div class="sn-slots" lang="en" aria-label="${done ? esc(SN.w) : `${SN.idx} von ${SN.w.length} Buchstaben`}">${slots}</div>`;
}
ACT['sn-say'] = () => sayWord(SN.word);

function snHud() {
  const s = `${SN.hearts}|${SN.score}|${Math.ceil(SN.left / 1000)}`;
  if (s === SN.hud) return;
  SN.hud = s;
  $('#sn-hearts').innerHTML = [0, 1, 2].map(i => `<span class="${i < SN.hearts ? 'on' : ''}">${icon('heart', 'ic-fill')}</span>`).join('');
  $('#sn-hearts').setAttribute('aria-label', plural(SN.hearts, 'Herz', 'Herzen'));
  $('#sn-score').textContent = fmtN(SN.score);
  const sec = Math.max(0, Math.ceil(SN.left / 1000));
  $('#sn-time').textContent = fmtTime(sec);
  $('#sn-time').classList.toggle('is-low', sec <= 10);
}

function snOver(html) {
  const o = $('#sn-over');
  o.innerHTML = html ? `<div class="sn-card">${html}</div>` : '';
  o.hidden = !html;
  const f = $('#sn-over .btn-primary');
  if (f) f.focus({ preventScroll: true });
}
function snStartBtn(label) {
  const why = talPlayWhy();
  return `<button class="btn btn-primary" type="button" data-act="sn-start"${why ? ` aria-disabled="true" data-why="${esc(why)}"` : ''}>${icon('play', 'ic-fill')}${label}${talOn() ? ' · 1 Taler' : ''}</button>`;
}
function snIntro() {
  snHud();
  snDraw();
  snOver(`<h2>Wort-Snake</h2>
    <p>Friss die Buchstaben <b>der Reihe nach</b>.</p>
    <p class="muted">Wischen oder Pfeiltasten.</p>
    ${snStartBtn('Start')}
    <small class="muted">${S.st.snake ? `Rekord: ${fmtN(S.st.snake)} · ` : ''}${talOn() ? `Du hast ${plural(talBalance(), 'Taler', 'Taler')}` : ''}</small>`);
}

ACT['sn-start'] = el => {
  if (whyToast(el)) return;
  talPay();
  if (SN.phase === 'end') snReset();
  snOver('');
  SN.phase = 'play';
  SN.last = 0;
  Sfx.play('start');
  snHud();
  SN.raf = requestAnimationFrame(snLoop);
};

function snLoop(t) {
  if (SN.phase !== 'play') return;
  const dt = SN.last ? Math.min(100, t - SN.last) : 0;
  SN.last = t;
  if (SN.hold > 0) {
    SN.hold -= dt;
    if (SN.hold <= 0) snWord();
  } else {
    SN.left -= dt;
    SN.acc += dt;
    while (SN.acc >= SN.ms && SN.phase === 'play' && SN.hold <= 0) { SN.acc -= SN.ms; snStep(); }
  }
  if (SN.phase === 'play' && SN.left <= 0) { snEnd(); return; }
  if (SN.phase !== 'play') return;
  snDraw();
  snHud();
  SN.raf = requestAnimationFrame(snLoop);
}

function snTurn(d) {
  if (SN.phase !== 'play') return;
  const last = SN.q.length ? SN.q[SN.q.length - 1] : SN.dir;
  if (d === last || d === SN_OPP[last] || SN.q.length >= 3) return;
  SN.q.push(d);
}

function snStep() {
  if (SN.q.length) SN.dir = SN.q.shift();
  const [dx, dy] = SN_DIR[SN.dir], [hx, hy] = SN.body[0];
  const nx = (hx + dx + SN_N) % SN_N, ny = (hy + dy + SN_N) % SN_N;
  SN.body.unshift([nx, ny]);
  if (SN.grow > 0) SN.grow--; else SN.body.pop();
  const bite = SN.body.findIndex((p, i) => i > 0 && p[0] === nx && p[1] === ny);
  if (bite > 0) { SN.body = SN.body.slice(0, Math.max(3, bite)); snHurt(); if (SN.phase !== 'play') return; }
  const it = SN.items.find(i => i.x === nx && i.y === ny);
  if (!it) return;
  if (!it.ok) {
    SN.items = SN.items.filter(i => i !== it);
    snHurt();
    return;
  }
  SN.idx++;
  SN.grow++;
  SN.score += 10;
  if (SN.idx < SN.w.length) { Sfx.play('pair'); snSpawn(); snHint(); return; }
  // Wort fertig: Bonus, vorlesen, kurz innehalten, dann schneller weiter
  SN.score += 5 * SN.w.length;
  SN.done.push(SN.word);
  SN.items = [];
  SN.hold = 700;
  SN.ms = Math.max(110, SN.ms - 8);
  Sfx.play('combo');
  sayWord(SN.word);
  snHint(true);
}

function snHurt() {
  SN.hearts--;
  Sfx.play('bad');
  const st = $('#sn-stage');
  if (st && !REDUCED) { st.classList.remove('is-hit'); void st.offsetWidth; st.classList.add('is-hit'); }
  if (SN.hearts <= 0) snEnd();
}

function snEnd() {
  if (SN.phase === 'end') return;
  cancelAnimationFrame(SN.raf);
  SN.phase = 'end';
  const prev = S.st.snake || 0, rec = SN.score > prev;
  statMax('snake', SN.score);
  statInc('sng');
  aktLog({ k: 'snake', sc: SN.score });
  commit();
  snDraw();
  snHud();
  Sfx.play(rec && SN.score ? 'win' : 'level');
  const chips = SN.done.slice(-8).map(w => `<span class="wchip"><span lang="en">${esc(w.plain)}</span> <span class="de">· ${esc(deShort(w))}</span></span>`).join('');
  snOver(`<h2>${fmtN(SN.score)} Punkte</h2>
    <p>${SN.left <= 0 ? 'Zeit um!' : SN.hearts <= 0 ? 'Keine Herzen mehr.' : ''} ${plural(SN.done.length, 'Wort', 'Wörter')} geschafft.</p>
    <p class="sn-rec">${rec && SN.score ? (prev ? `Neuer Rekord – vorher ${fmtN(prev)}!` : 'Dein erster Rekord!') : `Rekord: ${fmtN(prev)}`}</p>
    ${chips ? `<div class="wchips">${chips}</div>` : ''}
    <div class="sn-btns">${snStartBtn('Nochmal')}<button class="btn btn-ghost" type="button" data-act="sn-close">Fertig</button></div>`);
}

function snPause(on) {
  if (on && SN.phase === 'play') {
    cancelAnimationFrame(SN.raf);
    SN.phase = 'pause';
    snOver(`<h2>Pause</h2><button class="btn btn-primary" type="button" data-act="sn-go">${icon('play', 'ic-fill')}Weiter</button>`);
  } else if (!on && SN.phase === 'pause') {
    snOver('');
    SN.phase = 'play';
    SN.last = 0;
    SN.raf = requestAnimationFrame(snLoop);
  }
}
ACT['sn-go'] = () => snPause(false);

async function snQuit() {
  if (SN.phase === 'play' || SN.phase === 'pause') {
    snPause(true);
    const yes = await ask({ title: 'Runde beenden?', text: 'Der Taler für diese Runde ist schon ausgegeben.', yes: 'Beenden', no: 'Weiterspielen', art: fox('sad'), stay: true });
    if (!yes) { snPause(false); return; }
    snEnd();
  }
  snClose();
}
ACT['sn-quit'] = () => snQuit();
ACT['sn-close'] = () => snClose();

function snClose() {
  if (!SN.on) return;
  cancelAnimationFrame(SN.raf);
  Object.assign(SN, { on: false, phase: '', cv: null, cx: null, sw: null });
  TTS.stop();
  const root = $('#snake');
  root.hidden = true;
  root.innerHTML = '';
  for (const s of BEHIND) $(s).inert = false;
  if ($('#onboard').hidden) document.body.classList.remove('ses-open');
  refresh();
}

// Knöpfe: sofort beim Antippen; Klick nur noch für die Tastatur (Enter/Leertaste)
ACT['sn-dir'] = (el, e) => { if (!e.detail) snTurn(el.dataset.d); };
$('#snake').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-d]');
  if (b) { e.preventDefault(); snTurn(b.dataset.d); return; }
  if (e.target.closest('#sn-cv')) SN.sw = { x: e.clientX, y: e.clientY };
});
// Wischen übers Spielfeld, auch mehrmals ohne abzusetzen
addEventListener('pointermove', e => {
  if (!SN.sw) return;
  const dx = e.clientX - SN.sw.x, dy = e.clientY - SN.sw.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  snTurn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
  SN.sw = { x: e.clientX, y: e.clientY };
});
for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, () => { SN.sw = null; });
addEventListener('resize', () => { if (SN.on) snFit(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) snPause(true); });

function snKey(e) {
  const k = e.key;
  if (k === 'Tab') { trapFocus(e, $('#snake')); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (k === 'Escape') { e.preventDefault(); snQuit(); return; }
  const d = SN_KEYS[k];
  if (d && SN.phase === 'play') { e.preventDefault(); snTurn(d); return; }
  if (k === ' ' || k === 'p' || k === 'P') {
    if (SN.phase === 'play' || SN.phase === 'pause') { e.preventDefault(); snPause(SN.phase === 'play'); }
  }
}

// ---------- Zeichnen ----------
function snFit() {
  const cv = SN.cv;
  if (!cv) return;
  const w = cv.getBoundingClientRect().width, px = Math.round(w * Math.min(2, devicePixelRatio || 1));
  if (px && cv.width !== px) cv.width = cv.height = px;
  snDraw();
}
function snRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r);
  cx.arcTo(x, y, x + w, y, r);
  cx.closePath();
}
function snDraw() {
  const cx = SN.cx, C = SN.col;
  if (!cx || !C) return;
  const W = SN.cv.width, s = W / SN_N;
  cx.fillStyle = C.a;
  cx.fillRect(0, 0, W, W);
  cx.fillStyle = C.b;
  for (let y = 0; y < SN_N; y++) for (let x = (y & 1); x < SN_N; x += 2) cx.fillRect(x * s, y * s, s, s);
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  // Buchstaben – alle gleich, man muss das Wort kennen
  cx.font = `600 ${Math.round(s * 0.6)}px ${C.font}`;
  for (const it of SN.items) {
    const mx = (it.x + 0.5) * s, my = (it.y + 0.5) * s;
    cx.beginPath();
    cx.arc(mx, my, s * 0.42, 0, Math.PI * 2);
    cx.fillStyle = C.item;
    cx.fill();
    cx.lineWidth = Math.max(1.5, s * 0.07);
    cx.strokeStyle = C.ring;
    cx.stroke();
    cx.fillStyle = C.ink;
    cx.fillText(it.ch, mx, my + s * 0.03);
  }
  // Schlange; die schon gefressenen Buchstaben stehen hinter dem Kopf
  const p = s * 0.08;
  cx.font = `700 ${Math.round(s * 0.5)}px ${C.font}`;
  for (let i = SN.body.length - 1; i >= 0; i--) {
    const [x, y] = SN.body[i];
    snRect(cx, x * s + p, y * s + p, s - 2 * p, s - 2 * p, s * 0.28);
    cx.fillStyle = i === 0 ? C.head : C.body;
    cx.fill();
    if (i > 0 && i <= SN.idx && SN.hold <= 0) {
      cx.fillStyle = '#fff';
      cx.fillText(SN.w[SN.idx - i], (x + 0.5) * s, (y + 0.53) * s);
    }
  }
  // Augen in Laufrichtung
  const [hx, hy] = SN.body[0], [dx, dy] = SN_DIR[SN.dir];
  const ex = (hx + 0.5 + dx * 0.16) * s, ey = (hy + 0.5 + dy * 0.16) * s;
  for (const k of [-1, 1]) {
    const ox = ex + dy * k * s * 0.2, oy = ey + dx * k * s * 0.2;
    cx.beginPath();
    cx.arc(ox, oy, s * 0.11, 0, Math.PI * 2);
    cx.fillStyle = '#fff';
    cx.fill();
    cx.beginPath();
    cx.arc(ox + dx * s * 0.04, oy + dy * s * 0.04, s * 0.055, 0, Math.PI * 2);
    cx.fillStyle = '#131A2E';
    cx.fill();
  }
}
</script>
<script>
/* Wortfuchs – Taler-Minispiele: Wortknacker (englisches Wort in 6 Versuchen erraten) und
   Fuchs-Sprung (Fitz springt über Hindernisse). Eine Runde kostet 1 Taler (talPay).
   Beide laufen im Vollbild #mg wie Wort-Snake. Baut auf kern.js, ui.js, ueben.js und taler.js auf. */
'use strict';

// ======================= Gemeinsam =======================
// on = 'wk' | 'fj' | '', phase = intro | play | pause | end
const MG = { on: '', phase: '', tm: 0 };

function mgOpen(kind, label, hud, body) {
  MG.on = kind;
  MG.phase = 'intro';
  const root = $('#mg');
  root.setAttribute('aria-label', label);
  root.innerHTML = `<div class="sn mg-${kind}">
    <div class="sn-top"><button class="icon-btn" type="button" data-act="mg-quit" aria-label="${label} beenden">${icon('x')}</button>${hud}</div>
    <div class="mg-main"><div class="mg-play" id="mg-play">${body}</div><div class="mg-over" id="mg-over" hidden></div></div></div>`;
  root.hidden = false;
  document.body.classList.add('ses-open');
  for (const s of BEHIND) $(s).inert = true;
}

// Karte über dem Spielfeld (Start, Pause, Ende); dahinter ist alles gesperrt
function mgOver(html) {
  const o = $('#mg-over');
  if (!o) return;
  o.innerHTML = html ? `<div class="sn-card">${html}</div>` : '';
  o.hidden = !html;
  $('#mg-play').inert = !!html;
  const f = $('#mg-over .btn-primary');
  if (f) f.focus({ preventScroll: true });
}
function mgStartBtn(act, label) {
  const why = talPlayWhy();
  return `<button class="btn btn-primary" type="button" data-act="${act}"${why ? ` aria-disabled="true" data-why="${esc(why)}"` : ''}>${icon('play', 'ic-fill')}${label}${talOn() ? ' · 1 Taler' : ''}</button>`;
}
const mgTal = () => talOn() ? `Du hast ${plural(talBalance(), 'Taler', 'Taler')}` : '';
const mgDone = () => '<button class="btn btn-ghost" type="button" data-act="mg-close">Fertig</button>';

async function mgQuit() {
  if (MG.on === 'fj' && (MG.phase === 'play' || MG.phase === 'pause')) {
    fjPause(true);
    const yes = await ask({ title: 'Runde beenden?', text: 'Der Taler für diese Runde ist schon ausgegeben.', yes: 'Beenden', no: 'Weiterspielen', art: fox('sad'), stay: true });
    if (!yes) { fjPause(false); return; }
    fjEnd();
  } else if (MG.on === 'wk' && MG.phase === 'play') {
    const yes = await ask({ title: 'Wort aufgeben?', text: 'Der Taler für dieses Wort ist schon ausgegeben.', yes: 'Aufgeben', no: 'Weiterraten', art: fox('sad'), stay: true });
    if (!yes) return;
    if (MG.on === 'wk' && MG.phase === 'play') { aktLog({ k: 'wk', w: WK.w, ok: 0, n: WK.rows.length }); commit(); }
  }
  mgClose();
}
ACT['mg-quit'] = () => mgQuit();
ACT['mg-close'] = () => mgClose();

function mgClose() {
  if (!MG.on) return;
  cancelAnimationFrame(FJ.raf);
  clearTimeout(MG.tm);
  Object.assign(MG, { on: '', phase: '' });
  Object.assign(FJ, { cv: null, cx: null });
  TTS.stop();
  const root = $('#mg');
  root.hidden = true;
  root.innerHTML = '';
  for (const s of BEHIND) $(s).inert = false;
  if ($('#onboard').hidden) document.body.classList.remove('ses-open');
  refresh();
}

function mgKey(e) {
  const k = e.key;
  if (k === 'Tab') { trapFocus(e, $('#mg-over').hidden ? $('#mg') : $('#mg-over')); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (k === 'Escape') { e.preventDefault(); mgQuit(); return; }
  if (MG.on === 'wk') wkKey(e); else fjKey(e);
}

// ======================= Wortknacker =======================
const WK_TRIES = 6, WK_ROWS = ['qwertzuiop', 'asdfghjkl', 'yxcvbnm'], WK_RANK = { no: 1, near: 2, ok: 3 };
const WK = { word: null, w: '', rows: [], cur: '', keys: {}, seen: [] };

// Kleines Bild für die Karte in der Taler-Ansicht
function wkArt() {
  return `<svg viewBox="0 0 80 40">${[['w', 'ok'], ['o', 'no'], ['r', 'near'], ['d', 'ok']]
    .map(([ch, c], i) => `<rect x="${3 + i * 19}" y="11" width="17" height="17" rx="4" class="wa-${c}"/><text x="${11.5 + i * 19}" y="23.5" class="wa-ch">${ch}</text>`).join('')}</svg>`;
}

// Wörter mit 4–7 Buchstaben, am liebsten schon gelernte; die letzten 30 nicht nochmal
function wkPick() {
  const ok = w => /^[a-z]{4,7}$/.test(w.plain);
  let list = knownWords(sesPool()).filter(ok);
  if (list.length < 6) list = sesPool().filter(ok);
  if (list.length < 6) list = WORDS.filter(ok);
  const open = list.filter(w => !WK.seen.includes(w.id));
  const w = pickOne(open.length ? open : list);
  WK.seen = [...WK.seen, w.id].slice(-30);
  return w;
}

// Bewertung wie bei Wordle: erst die Treffer, dann gelb nur so oft, wie der Buchstabe noch übrig ist
function wkScore(g, w) {
  const res = [...g].map(() => 'no'), left = {};
  for (let i = 0; i < w.length; i++) if (g[i] === w[i]) res[i] = 'ok'; else left[w[i]] = (left[w[i]] || 0) + 1;
  for (let i = 0; i < w.length; i++) if (res[i] !== 'ok' && left[g[i]]) { res[i] = 'near'; left[g[i]]--; }
  return res;
}

ACT['wk-open'] = el => {
  if (whyToast(el)) return;
  Object.assign(WK, { word: null, w: '', rows: [], cur: '', keys: {} });
  const key = (k, inner, lab) => `<button class="wk-key${k.length > 1 ? ' wk-wide' : ''}" type="button" tabindex="-1" data-act="wk-k" data-k="${k}"${lab ? ` aria-label="${lab}"` : ''}>${inner}</button>`;
  const rows = WK_ROWS.map((r, i) => `<div class="wk-krow">${i === 2 ? key('enter', icon('check'), 'Prüfen') : ''}${[...r].map(c => key(c, c)).join('')}${i === 2 ? key('back', icon('delete'), 'Löschen') : ''}</div>`);
  mgOpen('wk', 'Wortknacker', `<div class="mg-tal" id="wk-tal">${talOn() ? `${icon('coin')}<span>${talBalance()}</span>` : ''}</div>`,
    `<div class="wk-hint" id="wk-hint" tabindex="-1"></div>
    <div class="wk-board" id="wk-board" role="group" aria-label="Deine Versuche"></div>
    <p class="wk-msg" id="wk-msg" aria-live="polite"></p>
    <div class="wk-keys" id="wk-keys" lang="en" aria-label="Buchstaben">${rows.join('')}</div>`);
  wkDraw();
  wkIntro();
};

function wkIntro() {
  const tile = (c, ch) => `<span class="wk-t is-${c}">${ch}</span>`;
  mgOver(`<h2>Wortknacker</h2>
    <p>Errate das englische Wort in <b>6 Versuchen</b>.</p>
    <div class="wk-legend"><span>${tile('ok', 'a')} richtig</span><span>${tile('near', 'b')} anderer Platz</span><span>${tile('no', 'c')} kommt nicht vor</span></div>
    ${mgStartBtn('wk-start', 'Start')}
    <small class="muted">${S.st.wk ? `Schon ${fmtN(S.st.wk)} geknackt · ` : ''}${mgTal()}</small>`);
}

ACT['wk-start'] = el => {
  if (whyToast(el)) return;
  talPay();
  statInc('wkg');
  commit();
  const word = wkPick();
  Object.assign(WK, { word, w: word.plain, rows: [], cur: '', keys: {} });
  MG.phase = 'play';
  mgOver('');
  Sfx.play('start');
  wkDraw();
  wkMsg('');
  $('#wk-hint').focus({ preventScroll: true });
};

function wkDraw() {
  const n = WK.w.length || 5, cur = MG.phase === 'play' ? WK.rows.length : -1;
  const tal = $('#wk-tal span');
  if (tal) tal.textContent = talBalance();
  // Hinweis: deutsches Wort, Anzahl der Buchstaben; ab dem 3. Versuch darf man es anhören
  const h = $('#wk-hint');
  h.innerHTML = WK.word ? `<div class="sn-de"><span>${esc(deShort(WK.word))}</span>${TTS.ok && S.set.tts && WK.rows.length >= 3 ? `<button class="icon-btn sn-say" type="button" data-act="wk-say" aria-label="Wort anhören">${icon('volume')}</button>` : ''}</div>
    <small class="muted">${n} Buchstaben${TTS.ok && S.set.tts && WK.rows.length < 3 && MG.phase === 'play' ? ' · ab Versuch 3 zum Anhören' : ''}</small>` : '';
  const board = $('#wk-board');
  board.style.setProperty('--n', n);
  let html = '';
  for (let r = 0; r < WK_TRIES; r++) {
    const g = WK.rows[r];
    let cells = '', lab = '';
    for (let i = 0; i < n; i++) {
      if (g) cells += `<span class="wk-t is-${g.res[i]}${r === WK.rows.length - 1 && !REDUCED ? ' is-flip' : ''}" style="--i:${i}">${g.g[i]}</span>`;
      else if (r === cur) cells += `<span class="wk-t${WK.cur[i] ? ' is-in' : ''}">${WK.cur[i] || ''}</span>`;
      else cells += '<span class="wk-t"></span>';
    }
    if (g) lab = `${g.g}: ${wkSum(g.res)}`;
    else if (r === cur) lab = WK.cur ? `Deine Eingabe: ${[...WK.cur].join(' ')}` : 'Deine Eingabe: noch leer';
    html += `<div class="wk-row${r === cur ? ' is-cur' : ''}" role="img" lang="en" aria-label="${lab || `Versuch ${r + 1}: leer`}">${cells}</div>`;
  }
  board.innerHTML = html;
  for (const b of $$('#wk-keys [data-k]')) {
    const s = WK.keys[b.dataset.k];
    b.classList.remove('is-ok', 'is-near', 'is-no');
    if (s) b.classList.add('is-' + s);
    if (b.dataset.k.length === 1) b.setAttribute('aria-label', b.dataset.k + (s === 'ok' ? ', richtig' : s === 'near' ? ', anderer Platz' : s === 'no' ? ', kommt nicht vor' : ''));
  }
}
const wkSum = res => {
  const ok = res.filter(x => x === 'ok').length, near = res.filter(x => x === 'near').length;
  return `${ok} richtig, ${near} an anderer Stelle`;
};
const wkMsg = t => { const m = $('#wk-msg'); if (m) m.textContent = t; };
ACT['wk-say'] = () => sayWord(WK.word);

function wkType(ch) {
  if (MG.phase !== 'play' || WK.cur.length >= WK.w.length) return;
  WK.cur += ch;
  wkMsg('');
  wkDraw();
}
function wkBack() {
  if (MG.phase !== 'play' || !WK.cur) return;
  WK.cur = WK.cur.slice(0, -1);
  wkDraw();
}

function wkEnter() {
  if (MG.phase !== 'play') return;
  const n = WK.w.length;
  if (WK.cur.length < n) {
    wkMsg(`Noch ${plural(n - WK.cur.length, 'Buchstabe', 'Buchstaben')}`);
    const row = $('#wk-board .is-cur');
    if (row && !REDUCED) { row.classList.remove('is-shake'); void row.offsetWidth; row.classList.add('is-shake'); }
    Sfx.play('tap');
    return;
  }
  const g = WK.cur, res = wkScore(g, WK.w);
  WK.rows.push({ g, res });
  WK.cur = '';
  [...g].forEach((ch, i) => { if ((WK_RANK[res[i]] || 0) > (WK_RANK[WK.keys[ch]] || 0)) WK.keys[ch] = res[i]; });
  const win = res.every(x => x === 'ok');
  if (win || WK.rows.length >= WK_TRIES) MG.phase = 'end';
  wkDraw();
  wkMsg(win ? 'Geknackt!' : wkSum(res));
  if (MG.phase !== 'end') { Sfx.play(res.includes('ok') ? 'near' : 'tap'); return; }
  Sfx.play(win ? 'win' : 'bad');
  MG.tm = setTimeout(() => wkEnd(win), REDUCED ? 400 : 1100);
}

function wkEnd(win) {
  if (MG.on !== 'wk') return;
  if (win) statInc('wk');
  aktLog({ k: 'wk', w: WK.w, ok: win ? 1 : 0, n: WK.rows.length });
  commit();
  if (win) confetti(70);
  sayWord(WK.word);
  const n = WK.rows.length;
  mgOver(`${fox(win ? 'happy' : 'sad')}
    <h2>${win ? 'Geknackt!' : 'Knapp daneben'}</h2>
    <p class="wk-sol"><b lang="en">${esc(WK.w)}</b> = ${esc(deShort(WK.word))}</p>
    <p>${win ? (n === 1 ? 'Beim ersten Versuch – Wahnsinn!' : `in ${n} Versuchen`) : 'Beim nächsten Wort klappt es!'}</p>
    ${win ? `<p class="sn-rec">Schon ${fmtN(S.st.wk)} ${S.st.wk === 1 ? 'Wort' : 'Wörter'} geknackt</p>` : ''}
    <div class="sn-btns">${mgStartBtn('wk-start', 'Nächstes Wort')}${mgDone()}</div>
    <small class="muted">${mgTal()}</small>`);
}

// Bildschirm-Tastatur: tabindex -1, darum landet der Fokus selten dort; Enter prüft trotzdem
ACT['wk-k'] = el => {
  const k = el.dataset.k;
  if (k === 'enter') wkEnter(); else if (k === 'back') wkBack(); else wkType(k);
};
function wkKey(e) {
  if (MG.phase !== 'play') return;
  const k = e.key, onBtn = e.target.closest && e.target.closest('button');
  if (/^[a-zA-Z]$/.test(k)) { e.preventDefault(); wkType(k.toLowerCase()); return; }
  if (k === 'Backspace') { e.preventDefault(); wkBack(); return; }
  if ((k === 'Enter' || k === ' ') && onBtn && !onBtn.classList.contains('wk-key')) return;
  if (k === 'Enter') { e.preventDefault(); if (!e.repeat) wkEnter(); }
  else if (k === ' ') e.preventDefault();
}

// ======================= Fuchs-Sprung =======================
// Welt in Bildhöhen: Höhe 1, Breite 1,6, Boden bei 0,84. h = Höhe von Fitz über dem Boden.
const FJ_TIME = 90, FJ_HEARTS = 3, FJ_WW = 1.6, FJ_GY = 0.84, FJ_X = 0.26, FJ_SIZE = 0.2;
const FJ_GRAV = 3.4, FJ_JUMP = 1.3, FJ_JUMP2 = 1.1;
const FJ_OBS = [
  { id: 'stone', w: 0.11, h: 0.075 },
  { id: 'log', w: 0.17, h: 0.07 },
  { id: 'bush', w: 0.12, h: 0.1 },
  { id: 'stump', w: 0.09, h: 0.19 },
];
const FJ = { raf: 0, cv: null, cx: null, col: null, img: null, last: 0 };

// Kleines Bild für die Karte in der Taler-Ansicht: Fitz im Sprung über einen Stein
function fjArt() {
  return `<svg viewBox="0 0 80 40"><path d="M0 35H80" class="ja-ground"/><path d="M14 33Q30 4 52 22" class="ja-arc"/>
    <path d="M50 35Q50 26 57 26Q64 26 64 35Z" class="ja-stone"/><path d="m24 9 1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z" class="ja-star"/>
    ${fox('', '', {}).replace('<svg ', '<svg x="28" y="2" width="22" height="22" ')}</svg>`;
}

ACT['fj-open'] = el => {
  if (whyToast(el)) return;
  mgOpen('fj', 'Fuchs-Sprung', `<div class="sn-hearts" id="fj-hearts" aria-label="Herzen"></div><div class="sn-score" id="fj-score" aria-label="Punkte">0</div><div class="sn-time" id="fj-time">${fmtTime(FJ_TIME)}</div>`,
    `<div class="fj-stage" id="fj-stage"><canvas id="fj-cv" role="img" aria-label="Spielfeld: Fitz rennt und springt über Hindernisse"></canvas></div>
    <button class="btn btn-primary fj-jump" id="fj-jump" type="button" tabindex="-1">${icon('arrow-up')}Springen</button>`);
  FJ.cv = $('#fj-cv');
  FJ.cx = FJ.cv.getContext('2d');
  fjColors();
  fjFox();
  fjReset();
  fjFit();
  fjIntro();
};

function fjColors() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  FJ.col = { sky: v('--sky-soft'), cloud: v('--card'), hill: v('--good-soft'), grass: v('--good'), bush: v('--good-deep'),
    dirt: v('--near-soft'), peb: v('--near'), stone: v('--ink-3'), star: v('--gold'), star2: v('--near-deep'), sun: v('--gold') };
}

// Fitz als Bild: dieselbe Zeichnung wie fox(), mit eingebauten Farben (CSS gilt in <img> nicht)
function fjFox() {
  const sc = foxWear().sc || ['#2A5BD7', '#E5484D'];
  const css = `.fx-fur{fill:#F47A2E}.fx-ear-in{fill:#4A2417}.fx-mask{fill:#FFF6EE}.fx-dark{fill:#1B1826}.fx-glint{fill:#fff}`
    + `.fx-line{fill:none;stroke:#1B1826;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}.fx-blush{fill:#FF8C9E;opacity:.5}`
    + `.fx-scarf{fill:${sc[0]}}.fx-scarf-2{fill:${sc[1]}}.m-happy,.m-open,.m-sad,.m-o,.m-brows{display:none}`;
  const svg = fox().replace(/ style="[^"]*"/, '').replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" ')
    .replace('focusable="false">', `focusable="false"><style>${css}</style>`);
  FJ.img = new Image();
  FJ.img.onload = () => fjDraw();
  FJ.img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function fjReset() {
  Object.assign(FJ, { t: 0, left: FJ_TIME, dist: 0, h: 0, vy: 0, jumps: 0, buf: 0, inv: 0, hearts: FJ_HEARTS,
    got: 0, score: 0, obs: [], stars: [], next: 1.6, last: 0, hud: '' });
}

function fjIntro() {
  fjHud();
  fjDraw();
  mgOver(`<h2>Fuchs-Sprung</h2>
    <p><b>Spring</b> über Steine und Büsche, sammle Sterne!</p>
    <p class="muted">Tippen oder Leertaste. Zweimal = Doppelsprung.</p>
    ${mgStartBtn('fj-start', 'Start')}
    <small class="muted">${S.st.jump ? `Rekord: ${fmtN(S.st.jump)} · ` : ''}${mgTal()}</small>`);
}

ACT['fj-start'] = el => {
  if (whyToast(el)) return;
  talPay();
  if (MG.phase === 'end') fjReset();
  mgOver('');
  MG.phase = 'play';
  FJ.last = 0;
  Sfx.play('start');
  fjHud();
  FJ.raf = requestAnimationFrame(fjLoop);
};

function fjLoop(t) {
  if (MG.phase !== 'play' || MG.on !== 'fj') return;
  const dt = FJ.last ? Math.min(0.05, (t - FJ.last) / 1000) : 0;
  FJ.last = t;
  fjStep(dt);
  if (MG.phase !== 'play') return;
  fjDraw();
  fjHud();
  FJ.raf = requestAnimationFrame(fjLoop);
}

function fjJump() {
  if (MG.phase !== 'play' || MG.on !== 'fj') return;
  if (FJ.h <= 0 && FJ.vy <= 0) { FJ.vy = FJ_JUMP; FJ.jumps = 1; Sfx.play('tap'); }
  else if (FJ.jumps < 2) { FJ.vy = FJ_JUMP2; FJ.jumps = 2; Sfx.play('tap'); }
  else FJ.buf = 0.12;   // kurz vor der Landung gedrückt: springt gleich wieder
}

function fjStep(dt) {
  FJ.t += dt;
  FJ.left -= dt;
  const dx = (0.75 + 0.55 * Math.min(1, FJ.t / 70)) * dt;
  FJ.dist += dx;
  // Fitz
  FJ.vy -= FJ_GRAV * dt;
  FJ.h += FJ.vy * dt;
  if (FJ.buf > 0) FJ.buf -= dt;
  if (FJ.h <= 0) {
    FJ.h = 0;
    FJ.vy = 0;
    FJ.jumps = 0;
    if (FJ.buf > 0) { FJ.buf = 0; fjJump(); }
  }
  // Welt rückt nach links
  for (const o of FJ.obs) o.x -= dx;
  for (const s of FJ.stars) s.x -= dx;
  FJ.obs = FJ.obs.filter(o => o.x > -0.3);
  FJ.stars = FJ.stars.filter(s => s.x > -0.1 && !s.got);
  FJ.next -= dt;
  if (FJ.next <= 0) fjSpawn();
  // Treffer: Hitbox etwas kleiner als das Bild, damit knappe Sprünge zählen
  const fl = FJ_X - 0.05, fr = FJ_X + 0.05, fb = FJ.h, ft = FJ.h + 0.15;
  if (FJ.inv > 0) FJ.inv -= dt;
  else for (const o of FJ.obs) {
    if (o.hit || o.x + o.w / 2 - 0.012 < fl || o.x - o.w / 2 + 0.012 > fr || fb > o.h - 0.012) continue;
    o.hit = true;
    fjHurt();
    break;
  }
  for (const s of FJ.stars) {
    if (s.got || s.x + 0.035 < fl || s.x - 0.035 > fr || s.y + 0.035 < fb || s.y - 0.035 > ft) continue;
    s.got = true;
    FJ.got++;
    Sfx.play('pair');
  }
  FJ.score = Math.floor(FJ.dist * 10) + FJ.got * 10;
  if (MG.phase === 'play' && FJ.left <= 0) fjEnd();
}

// Hindernis + manchmal Sterne: im Bogen darüber oder als Reihe dahinter
function fjSpawn() {
  const kinds = FJ.t > 25 ? FJ_OBS : FJ_OBS.filter(o => o.id !== 'stump');
  const o = { ...pickOne(kinds), x: FJ_WW + 0.15 };
  FJ.obs.push(o);
  const r = Math.random();
  if (r < 0.45) for (const i of [-1, 0, 1]) FJ.stars.push({ x: o.x + i * 0.11, y: o.h + (i ? 0.1 : 0.16) });
  else if (r < 0.75) for (const i of [0, 1, 2]) FJ.stars.push({ x: o.x + 0.32 + i * 0.1, y: 0.05 });
  FJ.next = FJ.t < 40 ? 1 + Math.random() * 0.9 : 0.9 + Math.random() * 0.6;
}

function fjHurt() {
  FJ.hearts--;
  FJ.inv = 1.2;
  Sfx.play('bad');
  const st = $('#fj-stage');
  if (st && !REDUCED) { st.classList.remove('is-hit'); void st.offsetWidth; st.classList.add('is-hit'); }
  if (FJ.hearts <= 0) fjEnd();
}

function fjHud() {
  const s = `${FJ.hearts}|${FJ.score}|${Math.ceil(FJ.left)}`;
  if (s === FJ.hud || !$('#fj-hearts')) return;
  FJ.hud = s;
  $('#fj-hearts').innerHTML = [0, 1, 2].map(i => `<span class="${i < FJ.hearts ? 'on' : ''}">${icon('heart', 'ic-fill')}</span>`).join('');
  $('#fj-hearts').setAttribute('aria-label', plural(FJ.hearts, 'Herz', 'Herzen'));
  $('#fj-score').textContent = fmtN(FJ.score);
  const sec = Math.max(0, Math.ceil(FJ.left));
  $('#fj-time').textContent = fmtTime(sec);
  $('#fj-time').classList.toggle('is-low', sec <= 10);
}

function fjEnd() {
  if (MG.phase === 'end') return;
  cancelAnimationFrame(FJ.raf);
  MG.phase = 'end';
  const prev = S.st.jump || 0, rec = FJ.score > prev;
  statMax('jump', FJ.score);
  statInc('jpg');
  aktLog({ k: 'jump', sc: FJ.score });
  commit();
  fjDraw();
  fjHud();
  Sfx.play(rec && FJ.score ? 'win' : 'level');
  if (rec && prev) confetti(60);
  mgOver(`<h2>${fmtN(FJ.score)} Punkte</h2>
    <p>${FJ.left <= 0 ? 'Zeit um – geschafft!' : 'Keine Herzen mehr.'} ${plural(FJ.got, 'Stern', 'Sterne')} gesammelt.</p>
    <p class="sn-rec">${rec && FJ.score ? (prev ? `Neuer Rekord – vorher ${fmtN(prev)}!` : 'Dein erster Rekord!') : `Rekord: ${fmtN(prev)}`}</p>
    <div class="sn-btns">${mgStartBtn('fj-start', 'Nochmal')}${mgDone()}</div>
    <small class="muted">${mgTal()}</small>`);
}

function fjPause(on) {
  if (MG.on !== 'fj') return;
  if (on && MG.phase === 'play') {
    cancelAnimationFrame(FJ.raf);
    MG.phase = 'pause';
    mgOver(`<h2>Pause</h2><button class="btn btn-primary" type="button" data-act="fj-go">${icon('play', 'ic-fill')}Weiter</button>`);
  } else if (!on && MG.phase === 'pause') {
    mgOver('');
    MG.phase = 'play';
    FJ.last = 0;
    FJ.raf = requestAnimationFrame(fjLoop);
  }
}
ACT['fj-go'] = () => fjPause(false);

function fjKey(e) {
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (MG.phase !== 'play') return;
    e.preventDefault();
    if (!e.repeat) fjJump();
  } else if ((k === 'p' || k === 'P') && (MG.phase === 'play' || MG.phase === 'pause')) {
    e.preventDefault();
    fjPause(MG.phase === 'play');
  }
}
// Springen sofort beim Antippen (Knopf oder Spielfeld)
$('#mg').addEventListener('pointerdown', e => {
  if (MG.on !== 'fj' || !e.target.closest('#fj-jump, #fj-cv')) return;
  e.preventDefault();
  fjJump();
});
addEventListener('resize', () => { if (MG.on === 'fj') fjFit(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) fjPause(true); });

// ---------- Zeichnen ----------
function fjFit() {
  const cv = FJ.cv;
  if (!cv) return;
  const w = cv.getBoundingClientRect().width, px = Math.round(w * Math.min(2, devicePixelRatio || 1));
  if (px && cv.width !== px) { cv.width = px; cv.height = Math.round(px / FJ_WW); }
  fjDraw();
}

function fjStar(cx, x, y, r) {
  cx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i & 1 ? r * 0.45 : r;
    cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  cx.closePath();
}

function fjDraw() {
  const cx = FJ.cx, C = FJ.col;
  if (!cx || !C) return;
  const k = FJ.cv.height, W = FJ.cv.width, G = FJ_GY * k, d = FJ.dist || 0;
  const wrap = (x, span) => ((x % span) + span) % span;
  cx.fillStyle = C.sky;
  cx.fillRect(0, 0, W, k);
  cx.beginPath();
  cx.arc(1.38 * k, 0.17 * k, 0.07 * k, 0, Math.PI * 2);
  cx.fillStyle = C.sun;
  cx.fill();
  // Wolken und Hügel ziehen langsamer vorbei (Tiefe)
  cx.fillStyle = C.cloud;
  for (const [x0, y, s] of [[0.2, 0.16, 1], [0.95, 0.1, 0.8], [1.5, 0.24, 1.1]]) {
    const x = (wrap(x0 - d * 0.12, FJ_WW + 0.5) - 0.25) * k;
    for (const [ox, oy, r] of [[-0.06, 0.012, 0.035], [0, 0, 0.05], [0.06, 0.012, 0.035]]) {
      cx.beginPath();
      cx.arc(x + ox * s * k, (y + oy * s) * k, r * s * k, 0, Math.PI * 2);
      cx.fill();
    }
  }
  cx.fillStyle = C.hill;
  for (let i = -1; i < 4; i++) {
    const x = (i * 0.7 - wrap(d * 0.35, 0.7)) * k;
    cx.beginPath();
    cx.ellipse(x + 0.35 * k, G + 0.02 * k, 0.42 * k, (i & 1 ? 0.13 : 0.18) * k, 0, Math.PI, 0);
    cx.fill();
  }
  // Boden mit Kieseln
  cx.fillStyle = C.dirt;
  cx.fillRect(0, G, W, k - G);
  cx.fillStyle = C.grass;
  cx.fillRect(0, G, W, 0.025 * k);
  cx.fillStyle = C.peb;
  for (let i = -1; i < 9; i++) {
    const x = (i * 0.23 - wrap(d, 0.23)) * k;
    cx.fillRect(x, G + (i & 1 ? 0.06 : 0.11) * k, 0.03 * k, 0.012 * k);
  }
  // Hindernisse
  for (const o of FJ.obs) {
    const x = (o.x - o.w / 2) * k, w = o.w * k, h = o.h * k, y = G - h + 0.004 * k;
    if (o.id === 'stone') {
      snRect(cx, x, y, w, h + 0.01 * k, h * 0.5);
      cx.fillStyle = C.stone;
      cx.fill();
    } else if (o.id === 'bush') {
      cx.fillStyle = C.bush;
      for (const [ox, oy, r] of [[0.28, 0.6, 0.3], [0.72, 0.6, 0.3], [0.5, 0.42, 0.38]]) {
        cx.beginPath();
        cx.arc(x + ox * w, y + oy * h, r * w, 0, Math.PI * 2);
        cx.fill();
      }
      cx.fillRect(x + 0.1 * w, y + 0.6 * h, 0.8 * w, 0.4 * h);
    } else {
      snRect(cx, x, y, w, h + 0.01 * k, 0.012 * k);
      cx.fillStyle = '#8A5A34';
      cx.fill();
      cx.fillStyle = '#C08A5A';
      cx.beginPath();
      if (o.id === 'log') cx.ellipse(x + w - 0.02 * k, y + h / 2, 0.018 * k, h / 2.4, 0, 0, Math.PI * 2);
      else cx.ellipse(x + w / 2, y + 0.008 * k, w / 2.2, 0.012 * k, 0, 0, Math.PI * 2);
      cx.fill();
    }
  }
  // Sterne
  cx.lineWidth = Math.max(1, 0.006 * k);
  for (const s of FJ.stars) {
    fjStar(cx, s.x * k, G - s.y * k, 0.03 * k);
    cx.fillStyle = C.star;
    cx.fill();
    cx.strokeStyle = C.star2;
    cx.stroke();
  }
  // Fitz: hüpft beim Laufen, kippt im Sprung – nicht bei reduzierter Bewegung
  const run = MG.phase === 'play' && FJ.h <= 0 && !REDUCED;
  const bob = run ? Math.abs(Math.sin(d * 16)) * 0.012 : 0;
  const fy = G - (FJ.h + bob) * k, fx = FJ_X * k, s = FJ_SIZE * k;
  cx.save();
  cx.globalAlpha = FJ.inv > 0 ? (REDUCED ? 0.5 : Math.floor(FJ.inv * 10) % 2 ? 0.3 : 1) : 1;
  cx.fillStyle = '#C9561A';
  const step = run ? Math.sin(d * 16) * 0.012 : 0;
  for (const [ox, st] of [[-0.035, step], [0.035, -step]]) {
    cx.beginPath();
    cx.ellipse(fx + (ox + st) * k, fy - 0.01 * k, 0.024 * k, 0.014 * k, 0, 0, Math.PI * 2);
    cx.fill();
  }
  cx.translate(fx, fy - 0.1 * k);
  if (!REDUCED && FJ.h > 0) cx.rotate(clamp(-FJ.vy * 0.12, -0.2, 0.2));
  if (FJ.img && FJ.img.complete && FJ.img.naturalWidth) cx.drawImage(FJ.img, -s / 2, -s / 2 - 0.01 * k, s, s);
  cx.restore();
}
</script>

  if (!x || bauOwned().has(x.id) || talFree() < x.p) return;
  const bal = talBalance();
  const yes = await ask({ title: `${esc(x.n)} kaufen?`, art: `<div class="bau-prev bau-ask bau-${x.k}">${bauPrev(x)}</div>`,
    text: `Kostet <b>${x.p} Taler</b> – das sind ${x.p} Minuten Bildschirmzeit. Danach hast du noch ${plural(bal - x.p, 'Taler', 'Taler')}.`,
    yes: `Kaufen · ${x.p}`, no: 'Lieber sparen' });
  if (!yes || bauOwned().has(x.id) || talFree() < x.p) return;
  const t = Date.now();
  S.red.push({ id: `b-${x.id}-${t.toString(36)}`, t, n: '', min: x.p, k: 'b', b: x.id });
  if (x.k === 'hat' || x.k === 'scarf') { S.set[x.k] = x.id; S.set.m = t; }
  commit();
  Sfx.play('win');
  confetti(60);
  toast(`${x.k === 'room' ? 'Neu im Fuchsbau' : 'Fitz trägt jetzt'}: <b>${esc(x.n)}</b>`);
  talRedraw();
};

ACT['bau-wear'] = el => {
  const id = el.dataset.id, x = BAU_BY[id];
  if (id === 's-blau') setSet('scarf', '');
  else if (!id) setSet('hat', '');
  else if (x && bauOwned().has(id)) setSet(x.k, id);
  Sfx.play('tap');
  talRedraw();
};

<script>
/* Wortfuchs – Aktivität für die Eltern: Verlauf pro Runde (S.log) und Wochenrückblick im Eltern-Bereich.
   Ist das Gerät mit einem Eltern-Handy gekoppelt (S.pair.k), geht derselbe Bericht verschlüsselt an die Zählstelle
   auf Hostinger (POST /api/eltern); das Eltern-Handy holt ihn dort ab und zeigt ihn oben im Eltern-Bereich.
   Schlüssel und Ablage-ID entstehen per PBKDF2 aus dem Kopplungs-Code – der Server sieht nur Zeichensalat.
   Übertragen wird nur auf GitHub Pages und Hostinger (wie melden.js); Browser-Tests setzen window.WF_AKT. */
'use strict';

const AKT_MAX = 300, AKT_DAYS = 35, AKT_SEND_DAYS = 14;   // Verlauf im Spielstand: höchstens 300 Einträge, 35 Tage
const AKT = {
  url: window.WF_AKT || 'https://srv785719.hstgr.cloud/api/eltern',
  days: 7,                     // so viele Tage zeigt der Verlauf (mehr per „Ältere Tage“)
  tm: 0, sent: '', at: 0,      // Kindergerät: Sende-Timer, zuletzt gesendeter Inhalt und wann
  kk: '', keys: null,          // Schlüssel und Ablage-ID zum Kopplungs-Code kk
  rk: '', rem: null, n: 0,     // Eltern-Handy: Bericht vom Server (zu Code rk), aus n Geräten
  st: '', got: 0,              // Zustand '' | load | none | err, zuletzt abgeholt
};
const aktNet = () => !!(window.crypto && crypto.subtle) && (!!window.WF_AKT || (typeof MELD === 'object' && MELD.hosts.includes(location.hostname) && !navigator.webdriver));   // MELD fehlt in Fassungen ohne melden.js
const aktSendOn = () => aktNet() && !!S.pair.k && !parKey();

// ======================= Aufzeichnen =======================
// Eintrag: id, k Art, t Zeit; Übung: d Sekunden, n Antworten, p % richtig, xp, ln neu gelernt, sn Station, q abgebrochen;
// Probetest: ti Test-id; Spiele: sc Punkte, w Wort, ok geknackt, n Versuche. Der Aufrufer ruft danach commit().
function aktLog(o) {
  const t = o.t || Date.now(), cut = Date.now() - AKT_DAYS * DAY;
  S.log.push({ ...o, id: o.k + t.toString(36) + rnd(1296).toString(36), t });
  S.log = S.log.filter(x => x.t > cut).slice(-AKT_MAX);
  aktSoon();
}
// Übungsrunde am Ende oder beim Abbrechen (q: 1)
function aktSes(d, x = {}) {
  if (!SES) return;
  const n = SES.ok + SES.near + SES.bad, k = learnedNow();
  if (!n) return;
  aktLog({ k: SES.kind, t: SES.t0, d, n, p: Math.round(100 * (SES.ok + SES.near / 2) / n), xp: SES.xp,
    ...(SES.ln0 >= 0 && k > SES.ln0 ? { ln: k - SES.ln0 } : {}), ...(SES.st ? { sn: stationName(SES.st.i) } : {}), ...x });
}
const aktTest = d => aktLog({ k: 'test', t: SES.t0, d, n: SES.items.length, ti: SES.rec.id });

// ======================= Bericht als Daten =======================
// Am Kindergerät aus S, auf dem Eltern-Handy vom Server – beide Ansichten zeichnen daraus.
const AKT_DF = ['xp', 's', 'a', 'ok', 'l', 'sp', 'c'];
function aktSnap(nd) {
  const t = today(), from = t - nd + 1, a = curAsg(), st = streakInfo(), inf = a ? poolInfo(a) : null;
  const days = {};
  for (let k = from; k <= t; k++) {
    const r = S.days[dayKey(k)];
    if (r) days[dayKey(k)] = Object.fromEntries(AKT_DF.filter(f => r[f]).map(f => [f, r[f]]));
  }
  const inRange = x => dayNum(new Date(x.t)) >= from;
  const tests = new Map(S.tests.map(x => [x.id, x]));
  const log = S.log.filter(inRange).map(x => {
    const r = x.k === 'test' && tests.get(x.ti);
    return r ? { ...x, p: r.p, nt: r.g } : x;
  });
  for (const x of S.red.filter(inRange)) {
    log.push(x.k === 'b' ? { id: x.id, k: 'bau', t: x.t, b: (BAU_BY[x.b] || {}).n || '', min: x.min } : { id: x.id, k: x.k ? 'unl' : 'red', t: x.t, min: x.min });
  }
  log.sort((x, y) => x.t - y.t);
  return {
    v: 1, at: Date.now(), name: S.set.name || '', gel: wordsLearned(), serie: st.n, best: st.best,
    tal: talOn() ? talBalance() : -1,
    asg: a ? { f: a.from, t: a.to, test: a.test || '', n: inf.pool.length, ln: inf.counts[2] + inf.counts[3] } : null,
    first: S.log.length ? S.log[0].t : 0,   // seit wann es Einzelheiten gibt
    days, log,
  };
}

// Mehrere Kindergeräte (ohne gemeinsamen Spielstand): Tage addieren, Verlauf vereinen, Rest vom neuesten
function aktMerge(list) {
  list.sort((x, y) => y.at - x.at);
  const r = { ...list[0], days: {}, log: [], tal: -1 };
  const log = new Map();
  for (const d of list) {
    for (const [k, v] of Object.entries(d.days)) {
      const t = r.days[k] || (r.days[k] = {});
      for (const f of AKT_DF) if (v[f]) t[f] = (t[f] || 0) + (+v[f] || 0);
    }
    for (const x of d.log) log.set(x.id, x);
    for (const f of ['gel', 'serie', 'best']) r[f] = Math.max(r[f] || 0, +d[f] || 0);
    if (d.tal >= 0) r.tal = Math.max(0, r.tal) + d.tal;
    if (d.first && (!r.first || d.first < r.first)) r.first = d.first;
  }
  r.log = [...log.values()].sort((x, y) => x.t - y.t);
  return r;
}

// ======================= Ansicht =======================
const AKT_KIND = {
  lesson: ['route', 'Neue Station', 'learn'], replay: ['repeat', 'Station wiederholt', 'learn'], review: ['repeat', 'Wiederholen', 'learn'],
  strengthen: ['target', 'Festigen', 'learn'], oops: ['lightbulb', 'Fehler-Training', 'learn'], blitz: ['zap', 'Blitz-Runde', 'learn'], sent: ['chat', 'Sätze', 'learn'],
  test: ['flag', 'Probetest', 'test'], snake: ['gamepad', 'Wort-Snake', 'game'], wk: ['gamepad', 'Wortknacker', 'game'], jump: ['gamepad', 'Fuchs-Sprung', 'game'],
  red: ['clock', 'Bildschirmzeit eingelöst', 'tal'], unl: ['lock', 'Einstellungen entsperrt', 'tal'], bau: ['coin', 'Fuchsbau', 'tal'],
};
const aktNum = v => Math.max(0, Math.round(+v || 0));
const aktMin = s => `${s && s < 60 ? '<1' : fmtN(aktNum(s) / 60)} min`;
const aktDayName = k => k === today() ? 'Heute' : k === today() - 1 ? 'Gestern' : fmtDay(k, { weekday: 'long', day: 'numeric', month: 'short' });

function aktLine(x) {
  const [ic, name, grp] = AKT_KIND[x.k] || ['star', 'Aktivität', 'learn'];
  let title = name, info = [];
  if (grp === 'learn') {
    if (x.sn) title += ` „${x.sn}“`;
    info = [aktMin(x.d), plural(aktNum(x.n), 'Antwort', 'Antworten'), `${aktNum(x.p)} % richtig`, x.xp ? `+${fmtN(aktNum(x.xp))} XP` : '', x.ln ? `+${aktNum(x.ln)} gelernt` : '', x.q ? 'abgebrochen' : ''];
  } else if (x.k === 'test') {
    if (x.nt) title += ` · Note ${aktNum(x.nt)}`;
    info = [aktMin(x.d), plural(aktNum(x.n), 'Wort', 'Wörter'), x.p != null ? `${aktNum(x.p)} %` : ''];
  } else if (x.k === 'wk') {
    info = [`„${x.w || '?'}“ ${x.ok ? `geknackt (${plural(aktNum(x.n), 'Versuch', 'Versuche')})` : 'nicht geknackt'}`];
  } else if (grp === 'game') {
    info = [plural(aktNum(x.sc), 'Punkt', 'Punkte')];
  } else if (x.k === 'red') {
    info = [`${aktNum(x.min)} min`];
  } else if (x.k === 'bau') {
    title += x.b ? `: ${x.b}` : '';
    info = [plural(aktNum(x.min), 'Taler', 'Taler')];
  }
  return `<li class="akt-row is-${grp}"><time>${clockOf(+x.t || 0)}</time><span class="akt-ic">${icon(ic)}</span>
    <div><b>${esc(title)}</b>${info.filter(Boolean).length ? `<small>${esc(info.filter(Boolean).join(' · '))}</small>` : ''}</div></li>`;
}

// Zwei Wochen nebeneinander: die letzten 7 Tage und die 7 davor
function aktWeekHTML(d) {
  const t = today(), firstDay = d.first ? dayNum(new Date(d.first)) : Infinity;
  const wk = off => {
    const o = { s: 0, xp: 0, a: 0, ok: 0, l: 0, sp: 0, dd: 0, ln: 0, min: 0 }, lo = t - off - 6, hi = t - off;
    for (let k = lo; k <= hi; k++) {
      const r = d.days[dayKey(k)];
      if (!r) continue;
      for (const f of ['s', 'xp', 'a', 'ok', 'l', 'sp']) o[f] += aktNum(r[f]);
      if (r.s || r.xp) o.dd++;
    }
    for (const x of d.log) {
      const k = dayNum(new Date(x.t));
      if (k < lo || k > hi) continue;
      o.ln += aktNum(x.ln);
      if (x.k === 'red') o.min += aktNum(x.min);
    }
    o.det = firstDay <= hi || !o.dd;   // gibt es für diese Woche Einzelheiten (neu gelernt)? Sonst „–“
    return o;
  };
  const a = wk(0), b = wk(7);
  const pct = x => x.a ? Math.round(100 * x.ok / x.a) : null;
  // [Name, Wert, Einheit, wertend?]
  const rows = [
    ['Lernzeit', x => Math.round(x.s / 60), ' min', true],
    ['Lerntage', x => x.dd, '', true],
    ['Runden', x => x.l, '', true],
    ['Antworten', x => x.a, '', true],
    ['Richtig', pct, ' %', true],
    ['Neu gelernt', x => x.det ? x.ln : null, '', true],
    ['XP', x => x.xp, '', true],
  ];
  if (d.tal >= 0 || a.sp + b.sp + a.min + b.min) rows.push(['Spielrunden', x => x.sp, '', false], ['Bildschirmzeit', x => x.min, ' min', false]);
  const cell = (v, u) => v == null ? '–' : fmtN(v) + u;
  const body = rows.map(([n, f, u, judge]) => {
    const v = f(a), w = f(b), dv = v != null && w != null ? v - w : null;
    const chip = dv == null || !(v || w) ? '' : `<em class="akt-d${judge && dv ? (dv > 0 ? ' is-up' : ' is-down') : ''}">${dv > 0 ? '+' : dv < 0 ? '−' : '±'}${fmtN(Math.abs(dv))}</em>`;
    return `<div class="akt-wk-row"><span>${n}</span><b>${cell(v, u)}</b><span>${chip}</span><span class="muted">${cell(w, u)}</span></div>`;
  }).join('');
  const m0 = Math.round(a.s / 60), m1 = Math.round(b.s / 60), dm = m0 - m1;
  const lead = !m0 && !m1 ? 'In den letzten 14 Tagen wurde nicht gelernt.'
    : `<b>${m0} min</b> an ${plural(a.dd, 'Tag', 'Tagen')} gelernt${!m1 ? '.' : dm >= 5 ? ` – ${dm} min mehr als davor.` : dm <= -5 ? ` – ${-dm} min weniger als davor.` : ' – etwa so viel wie davor.'}`;
  return `<div class="card akt-week"><div class="card-h"><h2>Wochenrückblick</h2></div>
    <p class="akt-lead">${lead}</p>
    <div class="akt-wk"><div class="akt-wk-row akt-wk-h"><span></span><span>7 Tage</span><span></span><span>Davor</span></div>${body}</div></div>`;
}

function aktLogHTML(d, range, note) {
  const t = today(), firstDay = d.first ? dayNum(new Date(d.first)) : Infinity, by = new Map();
  for (const x of d.log) {
    const k = dayNum(new Date(x.t));
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(x);
  }
  const act = k => { const r = d.days[dayKey(k)] || {}; return by.has(k) || r.s || r.xp; };
  let out = '', more = false;
  for (let k = t; k > t - range; k--) {
    if (!act(k)) continue;
    if (k <= t - AKT.days) { more = true; break; }
    const r = d.days[dayKey(k)] || {}, list = (by.get(k) || []).slice().reverse();
    const sumTxt = [r.s ? aktMin(r.s) : '', r.xp ? `${fmtN(aktNum(r.xp))} XP` : ''].filter(Boolean).join(' · ');
    out += `<li class="akt-day"><div class="akt-day-h"><b>${aktDayName(k)}</b>${sumTxt ? `<span>${sumTxt}</span>` : ''}</div>
      <ul>${list.map(aktLine).join('') || `<li class="akt-row akt-none">${k < firstDay ? 'Einzelheiten gibt es erst ab ' + fmtDay(firstDay === Infinity ? t : firstDay) : 'Keine Einzelheiten'}</li>`}</ul></li>`;
  }
  return `<div class="card akt-log"><div class="card-h"><h2>Verlauf</h2></div>
    ${out ? `<ul class="akt-days">${out}</ul>` : '<p class="muted">Noch keine Aktivität.</p>'}
    ${more ? '<button class="btn btn-ghost btn-sm akt-more" type="button" data-act="akt-more">Ältere Tage</button>' : ''}
    ${note ? `<p class="store-note akt-note">${note}</p>` : ''}</div>`;
}

// Kindergerät: unter „Lernzeit“
function aktNote() {
  if (!S.pair.k) return `${icon('smartphone')}<span>Mit gekoppeltem Eltern-Handy sehen Sie das auch dort (unten bei „Fuchstaler einrichten“).</span>`;
  return `${icon('smartphone')}<span>Wird verschlüsselt an Ihr Eltern-Handy übertragen${aktNet() ? '' : ' – nur über die Internet-Adresse von Wortfuchs, nicht im claude.ai-Viewer'}.</span>`;
}
const aktLocalInner = () => { const d = aktSnap(AKT_DAYS); return aktWeekHTML(d) + aktLogHTML(d, AKT_DAYS, aktNote()); };
function aktLocalHTML() {
  if (parKey() && !S.log.length) return '';   // Eltern-Handy: eigener Verlauf nur, wenn hier gespielt wurde
  return `<div class="akt" id="akt-local">${aktLocalInner()}</div>`;
}

// Eltern-Handy: ganz oben, darunter „Auf diesem Handy“
function aktRemoteHTML() {
  const K = parKey();
  if (!K) return '';
  if (AKT.rk !== K) Object.assign(AKT, { rk: K, rem: null, n: 0, st: '', got: 0 });
  if (aktNet() && AKT.st !== 'load' && Date.now() - AKT.got > 60e3) aktFetch(K);
  return `<div class="akt akt-remote" id="akt-remote">${aktRemoteInner()}</div><div class="section-title"><h2>Auf diesem Handy</h2></div>`;
}
function aktRemoteInner() {
  const d = AKT.rem, load = AKT.st === 'load';
  const btn = `<button class="btn btn-ghost btn-sm" type="button" data-act="akt-load"${load ? ' aria-busy="true"' : ''}>${icon('repeat')}${load ? 'Lädt …' : 'Aktualisieren'}</button>`;
  const card = (h, body) => `<div class="card akt-kid"><div class="card-h"><h2>${h}</h2><span class="kicker">Ihr Kind</span></div>${body}</div>`;
  if (!aktNet()) return card('Aktivität', '<p class="muted">Die Aktivität Ihres Kindes erscheint hier nur über die Internet-Adresse von Wortfuchs – nicht im claude.ai-Viewer und nicht als Datei.</p>');
  if (!d) {
    const txt = load ? 'Wird geladen …'
      : AKT.st === 'err' ? 'Der Server ist gerade nicht erreichbar. Bitte später noch einmal versuchen.'
      : 'Noch kein Bericht da. Er kommt, sobald das Gerät Ihres Kindes mit diesem Handy gekoppelt ist (dort: Eltern → Fuchstaler einrichten → Kopplungs-Code) und Wortfuchs dort über die Internet-Adresse geöffnet wird.';
    return card('Aktivität', `<p class="muted">${txt}</p>${load ? '' : btn}`);
  }
  const at = +d.at || 0, ak = dayNum(new Date(at)), old = Date.now() - at > 2 * DAY;
  const stand = `${ak === today() ? 'heute' : ak === today() - 1 ? 'gestern' : fmtDay(ak)}, ${clockOf(at)}`;
  const a = isObj(d.asg) ? d.asg : null;
  const kpis = `<div class="kpis akt-kpis">
    ${a ? `<div class="kpi"><span>Aufgabe gelernt</span><b>${aktNum(a.ln)} / ${aktNum(a.n)}</b><em>S. ${aktNum(a.f)}${a.t !== a.f ? '–' + aktNum(a.t) : ''}${/^\d{4}-\d\d-\d\d$/.test(a.test) ? ` · Test ${fmtDay(keyNum(a.test))}` : ''}</em></div>` : ''}
    <div class="kpi"><span>Wörter gelernt</span><b>${fmtN(aktNum(d.gel))}</b><em>insgesamt</em></div>
    <div class="kpi"><span>Serie</span><b>${plural(aktNum(d.serie), 'Tag', 'Tage')}</b><em>Rekord: ${aktNum(d.best)}</em></div>
    ${d.tal >= 0 ? `<div class="kpi"><span>Fuchstaler</span><b>${fmtN(aktNum(d.tal))}</b><em>auf dem Konto</em></div>` : ''}</div>`;
  const status = `<div class="akt-stand${old ? ' is-old' : ''}"><span>${icon('clock')}Stand: ${stand}${AKT.n > 1 ? ` · ${AKT.n} Geräte` : ''}${AKT.st === 'err' ? ' · Server gerade nicht erreichbar' : ''}</span>${btn}</div>`;
  return card(esc(d.name || 'Aktivität'), status + kpis) + aktWeekHTML(d) + aktLogHTML(d, AKT_SEND_DAYS, '');
}

function aktRedraw() {
  const r = $('#akt-remote');
  if (r) r.innerHTML = aktRemoteInner();
  const l = $('#akt-local');
  if (l) l.innerHTML = aktLocalInner();
}
ACT['akt-more'] = () => { AKT.days += 7; aktRedraw(); };
ACT['akt-load'] = () => {
  const K = parKey();
  if (!K || AKT.st === 'load') return;
  aktFetch(K);
  aktRedraw();
};

// ======================= Verschlüsselt übertragen =======================
function aktB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return btoa(s);
}
const aktUnB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// Code → AES-GCM-Schlüssel + Ablage-ID (PBKDF2, damit sich der Code nicht durchprobieren lässt); auch für den Fuchs-Code (sichern.js)
async function codeKeys(K, salt) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(K), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 150000 }, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']);
  const id = [...bits.slice(32)].map(b => b.toString(16).padStart(2, '0')).join('');
  return { key, id };
}
async function aktKeys(K) {
  if (AKT.kk === K && AKT.keys) return AKT.keys;
  AKT.keys = await codeKeys(K, 'wortfuchs-eltern-v1');
  AKT.kk = K;
  return AKT.keys;
}

// Kindergerät: nach jeder Runde (5 s später), alle 5 Minuten und beim Verlassen – nur wenn sich etwas geändert hat
function aktSoon() {
  if (!aktSendOn()) return;
  clearTimeout(AKT.tm);
  AKT.tm = setTimeout(() => aktSend(false), 5000);
}
async function aktSend(leaving) {
  if (!aktSendOn()) return;
  const K = S.pair.k, snap = aktSnap(AKT_SEND_DAYS), now = Date.now();
  const same = K + JSON.stringify({ ...snap, at: 0 });
  if (same === AKT.sent && now - AKT.at < (leaving ? 5 : 30) * 60e3) return;
  AKT.sent = same;
  AKT.at = now;
  try {
    const { key, id } = await aktKeys(K);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(snap))));
    const dev = talHash((typeof meldId === 'function' ? meldId() : '') + '|' + K).toString(36);   // Gerät, damit sich zwei Kindergeräte nicht überschreiben
    const body = JSON.stringify({ id, dev, iv: aktB64(iv), c: aktB64(c) });
    await fetch(AKT.url, { method: 'POST', body, mode: 'no-cors', credentials: 'omit', keepalive: body.length < 60000 });
  } catch (e) { AKT.sent = ''; }   // offline oder gesperrt – beim nächsten Mal wieder
}

// Eltern-Handy: Berichte aller Kindergeräte abholen und entschlüsseln
async function aktFetch(K) {
  AKT.st = 'load';
  try {
    const { key, id } = await aktKeys(K);
    const r = await fetch(`${AKT.url}?id=${id}`, { credentials: 'omit', cache: 'no-store' });
    if (r.status === 404) Object.assign(AKT, { rem: null, n: 0, st: 'none' });
    else {
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(), list = [];
      for (const g of Array.isArray(j.g) ? j.g : []) {
        try {
          const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: aktUnB64(g.iv) }, key, aktUnB64(g.c));
          const d = JSON.parse(new TextDecoder().decode(p));
          if (isObj(d) && d.v === 1 && isObj(d.days) && Array.isArray(d.log)) list.push(d);
        } catch (e) { /* alter Schlüssel oder kaputt – überspringen */ }
      }
      if (!list.length) Object.assign(AKT, { rem: null, n: 0, st: 'none' });
      else Object.assign(AKT, { rem: aktMerge(list), n: list.length, st: '' });
    }
  } catch (e) { AKT.st = 'err'; }
  if (AKT.rk === K) { AKT.got = Date.now(); aktRedraw(); }
}

setTimeout(() => aktSend(false), 6000);
setInterval(() => { if (document.visibilityState === 'visible') aktSend(false); }, 5 * 60e3);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') aktSend(true); });

<script>
/* Wortfuchs – Nutzer-Statistik: meldet Vorname, Gerät und Lernstand an die Zählstelle auf Hostinger.
   Der Admin sieht die Liste unter https://srv785719.hstgr.cloud/admin (PIN). Server: werkstatt/hostinger/api/.
   Gemeldet wird nur auf GitHub Pages und Hostinger – lokal (file://), im claude.ai-Viewer und in Browser-Tests
   (navigator.webdriver, auch bei WF_URL gegen das Live-Spiel) nie. */
'use strict';

const MELD = {
  url: 'https://srv785719.hstgr.cloud/api/ping',
  hosts: ['q202076-ops.github.io', 'srv785719.hstgr.cloud'],
  key: 'wortfuchs.geraet',   // zufällige Geräte-ID, getrennt vom Spielstand (bleibt beim Zurücksetzen)
  sent: '',                  // zuletzt gemeldeter Inhalt
  at: 0,                     // und wann
};

function meldId() {
  try {
    let id = localStorage.getItem(MELD.key);
    if (!/^[a-f0-9]{32}$/.test(id || '')) {
      id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
      localStorage.setItem(MELD.key, id);
    }
    return id;
  } catch (e) { return ''; }   // ohne Speicher keine Meldung – sonst zählte jeder Neustart als neuer Nutzer
}

// „iPad · Safari“
function meldDev() {
  const ua = navigator.userAgent;
  const os = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad'
    : /iPhone/.test(ua) ? 'iPhone'
    : /Android/.test(ua) ? (/Mobile/.test(ua) ? 'Android-Handy' : 'Android-Tablet')
    : /CrOS/.test(ua) ? 'Chromebook' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Gerät';
  const br = /Edg/.test(ua) ? 'Edge' : /Firefox|FxiOS/.test(ua) ? 'Firefox' : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : '';
  return br ? `${os} · ${br}` : os;
}

function meldData() {
  const a = curAsg(), inf = a ? poolInfo(a) : null;
  return {
    name: S.set.name || '', dev: meldDev(),
    xp: totalXP(), heute: todayXP(), lvl: levelInfo().L, serie: streakInfo().n,
    gelernt: inf ? inf.counts[2] + inf.counts[3] : 0, pool: inf ? inf.pool.length : 0, gesamt: wordsLearned(),
    seiten: a ? (a.from === a.to ? `${a.from}` : `${a.from}–${a.to}`) : '', test: (a && a.test) || '',
  };
}

// Unveränderter Stand: höchstens alle 30 Minuten, beim Verlassen alle 5 Minuten (für „zuletzt aktiv“)
function meldSend(leaving) {
  const id = meldId();
  if (!id) return;
  let body;
  try { body = JSON.stringify({ id, ...meldData() }); } catch (e) { return; }
  const now = Date.now();
  if (body === MELD.sent && now - MELD.at < (leaving ? 5 : 30) * 60e3) return;
  MELD.sent = body;
  MELD.at = now;
  try {
    fetch(MELD.url, { method: 'POST', body, mode: 'no-cors', credentials: 'omit', keepalive: true }).catch(() => {});
  } catch (e) { /* offline oder gesperrt – egal */ }
}

if (MELD.hosts.includes(location.hostname) && !navigator.webdriver) {
  setTimeout(() => meldSend(false), 4000);
  setInterval(() => { if (document.visibilityState === 'visible') meldSend(false); }, 5 * 60e3);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') meldSend(true); });
}

<script>
/* Wortfuchs – Fuchs-Code: Der Spielstand wird verschlüsselt auf der Zählstelle auf Hostinger gesichert (/api/stand),
   und alle Geräte mit demselben Code bleiben auf demselben Stand (vereint mit mergeState wie beim claude.ai-Konto).
   Schlüssel und Ablage-ID entstehen per PBKDF2 aus dem Code (codeKeys) – der Server sieht nur Zeichensalat.
   Der Code entsteht nach dem ersten geübten Wort, Fitz zeigt ihn einmal (mit Home-Bildschirm-Tipp auf iPad/iPhone);
   eingeben lässt er sich im Willkommen und im Eltern-Bereich. Er liegt in localStorage['wortfuchs.code'], getrennt
   vom Spielstand, damit „Alles zurücksetzen“ ihn nicht löscht. Nur auf GitHub Pages und Hostinger (wie melden.js);
   Browser-Tests setzen window.WF_STAND. Dazu: den Browser bitten, den Speicher nicht von selbst zu leeren. */
'use strict';

const FC = {
  url: window.WF_STAND || 'https://srv785719.hstgr.cloud/api/stand',
  key: 'wortfuchs.code',
  salt: 'wortfuchs-stand-v1',
  k: '', z: false,             // Code und ob Fitz ihn schon gezeigt hat
  kk: '', keys: null,          // Schlüssel und Ablage-ID zum Code kk
  v: 0,                        // Version auf dem Server, auf der unser Stand aufbaut
  st: '', at: 0,               // '' | ok | err, zuletzt erfolgreich abgeglichen
  dirty: false, pulled: 0, tm: 0, back: 0, busy: false, again: false, join: false,
};
const fcNet = () => !!(window.crypto && crypto.subtle) && (!!window.WF_STAND || (typeof MELD === 'object' && MELD.hosts.includes(location.hostname) && !navigator.webdriver));

function fcLoad() {
  try {
    const o = JSON.parse(localStorage.getItem(FC.key) || 'null');
    if (isObj(o) && typeof o.k === 'string' && pairOk(o.k)) Object.assign(FC, { k: o.k, z: !!o.z });
  } catch (e) { /* kein Speicher */ }
}
function fcStore() {
  try { localStorage.setItem(FC.key, JSON.stringify({ k: FC.k, z: FC.z })); return true; } catch (e) { return false; }
}
async function fcKeys(k) {
  if (FC.kk !== k || !FC.keys) { FC.keys = await codeKeys(k, FC.salt); FC.kk = k; }
  return FC.keys;
}

// ======================= Server =======================
// → {v, s}: Version und Spielstand (null, wenn zu diesem Code noch nichts liegt)
async function fcGet(k) {
  const { key, id } = await fcKeys(k);
  const r = await fetch(`${FC.url}?id=${id}`, { credentials: 'omit', cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  if (!j.v) return { v: 0, s: null };
  const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: aktUnB64(j.iv) }, key, aktUnB64(j.c));
  return { v: j.v, s: unpack(JSON.parse(new TextDecoder().decode(p))) };
}
// → true gesichert, false: ein anderes Gerät war schneller (erst holen und vereinen)
async function fcPut(leaving) {
  const { key, id } = await fcKeys(FC.k);
  FC.dirty = false;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(pack(S)))));
  const body = JSON.stringify({ id, base: FC.v, iv: aktB64(iv), c: aktB64(c) });
  let r;
  try { r = await fetch(FC.url, { method: 'POST', body, credentials: 'omit', keepalive: leaving && body.length < 60000 }); } catch (e) { FC.dirty = true; throw e; }
  if (!r.ok) { FC.dirty = true; throw new Error(r.status); }
  const j = await r.json();
  if (j.alt) { FC.dirty = true; return false; }
  FC.v = j.v;
  return true;
}

// Stand vom Server mit S vereinen; true, wenn der Server danach unseren Stand braucht
function fcTake(remote) {
  const before = stable(pack(S));
  S = mergeState(S, remote);
  const after = stable(pack(S));
  if (after !== before) { saveLocal(); if (Sync.onChange) Sync.onChange(); }
  return after !== stable(pack(remote));
}
async function fcPull() {
  const r = await fcGet(FC.k);
  FC.pulled = Date.now();
  if (r.s ? fcTake(r.s) : hasProgress()) FC.dirty = true;
  FC.v = r.v;
}

// Holen (nie mitten in einer Übung, nie beim Verlassen), dann sichern; bei Konflikt holen, vereinen, noch einmal
async function fcSync(leaving) {
  if (!FC.k || !fcNet()) return;
  if (FC.busy) { FC.again = true; return; }
  FC.busy = true;
  clearTimeout(FC.tm);
  try {
    if (!leaving && !SES && (!FC.pulled || Date.now() - FC.pulled > 60e3)) await fcPull();
    for (let i = 0; i < 3 && FC.dirty; i++) {
      if (await fcPut(leaving)) break;
      if (leaving || SES) break;   // Konflikt: nach der Übung bzw. beim nächsten Öffnen vereinen
      await fcPull();
    }
    Object.assign(FC, { st: 'ok', at: Date.now(), back: 0 });
    if (FC.dirty) fcSoon(60e3);
  } catch (e) {
    FC.st = 'err';
    FC.back = Math.min(10 * 60e3, (FC.back || 15e3) * 2);
    fcSoon(FC.back);
  }
  FC.busy = false;
  if (FC.again) { FC.again = false; fcSoon(); }
  fcRedraw();
}
function fcSoon(ms = 3000) {
  if (!FC.k) return;
  clearTimeout(FC.tm);
  FC.tm = setTimeout(() => fcSync(false), ms);
}

// Aus commit(): nach dem ersten geübten Wort einen Code anlegen (nicht auf dem Eltern-Handy), dann sichern
function fcMark() {
  if (!fcNet()) return;
  if (!FC.k) {
    if (parKey() || !Object.keys(S.w).length) return;
    Object.assign(FC, { k: pairNew(), z: false, v: 0, pulled: Date.now() });
    if (!fcStore()) { FC.k = ''; return; }   // ohne Speicher wäre der Code gleich wieder weg
  }
  FC.dirty = true;
  fcSoon();
}

// Code von einem anderen Gerät übernehmen → true, false (kein Stand zum Code); wirft ohne Verbindung
async function fcJoin(k) {
  const r = await fcGet(k);
  if (!r.s) return false;
  Object.assign(FC, { k, z: true, v: r.v, pulled: Date.now(), st: 'ok', at: Date.now(), dirty: false });
  fcStore();
  if (fcTake(r.s)) { FC.dirty = true; fcSoon(500); }
  return true;
}

// ======================= Oberfläche =======================
const fcHomeTip = () => {
  const ua = navigator.userAgent, ios = /iPad|iPhone/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  let app = navigator.standalone === true;
  try { app = app || matchMedia('(display-mode: standalone)').matches; } catch (e) { /* alt */ }
  return ios && !app;
};
const fcCodeHTML = () => `<div class="fg-code fg-pair fc-code" role="text" aria-label="Fuchs-Code ${[...FC.k].join(' ')}">${pairFmt(FC.k)}</div>`;

// Einmal zeigen, sobald der Code gesichert ist und das Kind auf der Startseite ist
function fcHint() {
  if (!FC.k || FC.z || FC.st !== 'ok' || SES || SN.on || MG.on || Modal.open || VIEW !== 'home' || !$('#onboard').hidden) return;
  FC.z = true;
  fcStore();
  Modal.show(`<div class="fc-pop">${fox('happy')}<h2 id="modal-title">Dein Fuchs-Code</h2>${fcCodeHTML()}
    <p class="fc-tip">${icon('pencil')}Schreib ihn auf!</p>
    ${fcHomeTip() ? `<p class="fc-tip">${icon('share')}„Zum Home-Bildschirm“</p>` : ''}</div>
    <div class="modal-btns"><button class="btn btn-primary" type="button" data-act="modal-close" autofocus>Fertig</button></div>`);
}

// Eltern-Bereich
function fcParentHTML() {
  if (!fcNet()) return '';
  return `<div class="card fc-card" id="fc-card"><div class="card-h"><h2>Fuchs-Code</h2><span class="kicker">Sicherung</span></div>${fcParentInner()}</div>`;
}
function fcParentInner() {
  const join = `<button class="btn btn-ghost btn-sm" type="button" data-act="fc-join">${icon('pencil')}${FC.k ? 'Anderen Code eingeben' : 'Code eingeben'}</button>`;
  const tip = '<li><b>iPad:</b> In Safari auf Teilen → „Zum Home-Bildschirm“, dann ist Wortfuchs mit einem Tipp da. Fehlt dort der Fortschritt, einmal den Fuchs-Code eingeben.</li>';
  if (!FC.k) {
    return `<p class="muted">Der Code entsteht automatisch nach der ersten Übung. Hat Ihr Kind schon einen Fuchs-Code von einem anderen Gerät, tippen Sie ihn hier ein.</p>
      <ul class="explain">${tip}</ul><div class="fc-btns">${join}</div>`;
  }
  const t = FC.at, d = t && dayNum(new Date(t));
  const stand = FC.st === 'err' ? `${icon('cloud-off')}Server gerade nicht erreichbar${t ? '' : ' – noch nicht gesichert'}`
    : t ? `${icon('cloud')}Gesichert: ${d === today() ? 'heute' : d === today() - 1 ? 'gestern' : fmtDay(d)}, ${clockOf(t)}`
    : `${icon('cloud')}Wird gesichert …`;
  return `${fcCodeHTML()}<p class="fc-stand${FC.st === 'err' ? ' is-err' : ''}">${stand}</p>
    <ul class="explain">
      <li><b>Sicherung:</b> Der Lernstand wird automatisch verschlüsselt auf dem Wortfuchs-Server gesichert. Ohne den Code kann ihn niemand lesen.</li>
      <li><b>Anderes Gerät oder Stand weg:</b> Wortfuchs öffnen → „Ich habe einen Fuchs-Code“ (oder hier → „Anderen Code eingeben“). Alle Geräte mit demselben Code bleiben auf demselben Stand.</li>
      <li><b>Bitte notieren</b> – der Code lässt sich nicht wiederherstellen.</li>${tip}</ul>
    <div class="fc-btns">${navigator.clipboard ? `<button class="btn btn-ghost btn-sm" type="button" data-act="fc-copy">${icon('clipboard-check')}Kopieren</button>` : ''}${join}</div>`;
}
function fcRedraw() {
  const el = $('#fc-card');
  if (el) el.innerHTML = `<div class="card-h"><h2>Fuchs-Code</h2><span class="kicker">Sicherung</span></div>${fcParentInner()}`;
}
ACT['fc-copy'] = () => {
  navigator.clipboard.writeText(pairFmt(FC.k)).then(() => toast(`${icon('check')}Kopiert`), () => toast('Kopieren ging nicht.'));
};

// Code eingeben (Willkommen und Eltern-Bereich)
ACT['fc-join'] = () => {
  if (!fcNet()) { toast('Das geht nur über die Internet-Adresse von Wortfuchs.'); return; }
  Modal.show(`<h2 id="modal-title">Fuchs-Code</h2>
    <form class="gate-row" data-form="fc-join" autocomplete="off"><input class="field code-in" id="fc-in" maxlength="9" placeholder="XXXX-XXXX" autocapitalize="characters" spellcheck="false" aria-label="Fuchs-Code" autofocus>
    <button class="btn btn-primary" type="submit">OK</button></form>
    <div class="modal-btns"><button class="btn btn-ghost" type="button" data-act="modal-close">Abbrechen</button></div>`);
};
SUB['fc-join'] = async f => {
  const k = pairNorm($('#fc-in').value);
  if (!pairOk(k)) { toast('Der Code hat 8 Zeichen, z. B. AB3D-7KQ9.'); return; }
  if (k === FC.k) { Modal.close(); toast(`${icon('check')}Schon verbunden`); return; }
  if (FC.join) return;
  FC.join = true;
  const b = f.querySelector('button');
  b.setAttribute('aria-busy', 'true');
  try {
    if (await fcJoin(k)) {
      Modal.close();
      fcRedraw();
      Sfx.play('win');
      toast(`${icon('check')}Willkommen zurück${S.set.name ? ', ' + esc(S.set.name) : ''}!`);
    } else toast('Diesen Code kenne ich nicht.');
  } catch (e) { toast('Keine Verbindung. Versuch es später noch mal.'); }
  b.removeAttribute('aria-busy');
  FC.join = false;
};

// ======================= Start =======================
fcLoad();
if (fcNet()) {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {}); } catch (e) { /* alt */ }
  if (FC.k) setTimeout(() => fcSync(false), 1500);
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    if (FC.k && !SES && Date.now() - FC.pulled > 5 * 60e3) fcSync(false);
    fcHint();
  }, 3000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { if (FC.dirty) fcSync(true); }
    else if (FC.k && Date.now() - FC.pulled > 30e3) fcSync(false);
  });
}

<script>
/* Wortfuchs – Start: Spielstand laden, Tastatur, Speichern im Konto. */
'use strict';

// ---------- Tastatur ----------
const TYPE_INPUTS = '.type-in, .gap-in, #t-in';
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.isComposing) return;
  const k = e.key, t = e.target;
  if (Modal.open) {
    if (k === 'Tab') trapFocus(e, $('#modal-card'));
    else if (k === 'Escape' && Modal.cur && !Modal.cur.opts.sticky) { e.preventDefault(); Modal.close(); }
    return;
  }
  if (!$('#onboard').hidden) {
    if (k === 'Tab') trapFocus(e, $('#onboard'));
    else if (k === 'Enter' && t.id === 'ob-name') { e.preventDefault(); const b = $('#onboard .ob-foot .btn-primary'); if (b) b.click(); }
    return;
  }
  if (SN.on) { snKey(e); return; }
  if (MG.on) { mgKey(e); return; }
  if (!SES) return;
  if (k === 'Tab') { trapFocus(e, $('#session')); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (k === 'Escape') { e.preventDefault(); sesQuit(); return; }
  if (e.repeat) { if (k === 'Enter') e.preventDefault(); return; }
  if (k === 'Enter') {
    if (t.matches && t.matches(TYPE_INPUTS)) { e.preventDefault(); sesGo(); return; }
    if (t.closest && t.closest('button, a, select, input, textarea')) return;   // Knöpfe reagieren selbst
    e.preventDefault();
    sesGo();
    return;
  }
  if (t.matches && t.matches('input, textarea, select')) return;
  if (/^[1-4]$/.test(k) && optKey(+k)) { e.preventDefault(); return; }
  if ((k === 'Backspace' || k.length === 1) && tileKey(k)) e.preventDefault();
});

// ---------- Start ----------
function boot() {
  S = loadLocal() || fresh();
  TTS.init();
  renderTop();
  go('home');
  if (!S.onb) openOnboarding();

  // Neuer Stand aus dem Konto (z. B. vom Tablet): neu zeichnen – aber nie mitten in einer Übung
  Sync.onChange = () => {
    TTS.pick();
    if (S.onb && !$('#onboard').hidden) { closeOnboarding(); go('home'); return; }
    if (!SES && $('#onboard').hidden) refresh();
  };
  Sync.onStatus = () => { if (!SES && VIEW === 'awards') VIEWS.awards(false); };
  Sync.start();

  // Beim Verlassen sofort speichern
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveLocal(); Sync.flush(); } });
  addEventListener('pagehide', () => { saveLocal(); Sync.flush(); });
}
boot();
</script>
